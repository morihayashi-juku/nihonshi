<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>生物タイピング暗記帳｜高校生物ゼロから講座</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* レイアウト：上に回と練習モードの切りかえ、下に作業カード1枚。思い出し練習だけ左に章リストを置く */
:root {
  --bg: #eef3f0;
  --surface: #ffffff;
  --surface-2: #f5f8f6;
  --ink: #17251d;
  --muted: #5a6b62;
  --line: #d3ddd7;
  --accent: #1e6f47;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe4;
  --ok: #217a4b;
  --ok-soft: #dff2e6;
  --miss: #b8461b;
  --miss-soft: #fbe6dc;
  --warn: #9a6a00;
  --base-a: #e57373; --base-t: #64a8e0; --base-g: #5fb36a; --base-c: #e8a33d;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111915; --surface: #18231d; --surface-2: #1e2b24; --ink: #e4ede7; --muted: #9fb2a7; --line: #2f3f36;
    --accent: #5fc48f; --accent-ink: #0d1a13; --accent-soft: #1f3b2c;
    --ok: #6fd39e; --ok-soft: #1d3a2a; --miss: #f08a5d; --miss-soft: #3e2318; --warn: #e2b54d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111915; --surface: #18231d; --surface-2: #1e2b24; --ink: #e4ede7; --muted: #9fb2a7; --line: #2f3f36;
  --accent: #5fc48f; --accent-ink: #0d1a13; --accent-soft: #1f3b2c;
  --ok: #6fd39e; --ok-soft: #1d3a2a; --miss: #f08a5d; --miss-soft: #3e2318; --warn: #e2b54d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.brand .eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--accent); font-weight: 700; }
.brand h1 { margin: 2px 0 0; font-size: clamp(22px, 4vw, 28px); font-weight: 900; text-wrap: balance; line-height: 1.3; }
.brand .pair { font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: 0.08em; margin-top: 2px; }
.brand .pair b { font-weight: 600; }
.pa { color: var(--base-a); } .pt { color: var(--base-t); } .pg { color: var(--base-g); } .pc { color: var(--base-c); }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.lessons { border-radius: 12px; max-width: 620px; justify-content: flex-end; }
.seg.lessons button { border-radius: 9px; padding: 5px 11px; font-size: 13.5px; }
.seg.lessons button .no { font-family: var(--font-mono); font-size: 12px; margin-right: 4px; opacity: 0.75; }
.seg button:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

nav.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
nav.modes button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font: inherit; cursor: pointer; display: grid; gap: 1px; }
nav.modes button .mt { font-weight: 700; font-size: 15px; }
nav.modes button .md { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
nav.modes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
@media (max-width: 720px) { nav.modes { grid-template-columns: 1fr 1fr; } nav.modes button .md { display: none; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.recall-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .recall-layout { grid-template-columns: 1fr; } }
.sections { display: grid; gap: 6px; }
.sections button { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }
.sections button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.sections .sn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 4px; }
.chip-score { font-family: var(--font-mono); font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip-score.good { background: var(--ok-soft); color: var(--ok); }
.chip-score.mid { background: var(--surface-2); color: var(--warn); }
.chip-score.low { background: var(--miss-soft); color: var(--miss); }

h2.ttl { margin: 0; font-size: 20px; font-weight: 900; text-wrap: balance; }
.lead { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
textarea { width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.75; padding: 12px 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.result { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 12px; }
.meter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meter .big { font-family: var(--font-mono); font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.meter .big small { font-size: 16px; color: var(--muted); }
.bar { flex: 1 1 200px; height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13.5px; padding: 2px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.misslist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.misslist li { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--miss-soft); font-size: 14.5px; }
.misslist li b { color: var(--miss); }
@media (max-width: 520px) { .misslist li { grid-template-columns: 1fr; gap: 0; } }
.sub-h { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }

/* 穴埋め */
.strand { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 14px; }
.strand i { width: 18px; height: 22px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2); font-style: normal; font-family: var(--font-mono); font-size: 11px; font-weight: 600; display: grid; place-items: center; color: transparent; }
.strand i.done { color: #fff; border-color: transparent; }
.strand i.b0 { background: var(--base-a); } .strand i.b1 { background: var(--base-t); } .strand i.b2 { background: var(--base-g); } .strand i.b3 { background: var(--base-c); }
.strand i.now { border: 2px solid var(--ink); }
.qtext { font-size: 19px; line-height: 1.8; margin: 4px 0 14px; font-weight: 500; }
.qtext .hole, .qbody .hole { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); margin: 0 4px; text-align: center; color: var(--accent); font-weight: 700; }
.ans-in { width: 100%; font: inherit; font-size: 18px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.fb { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 15px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.ng { background: var(--miss-soft); color: var(--miss); }
.fb b { font-size: 17px; }
.settings { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
select { font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* 説明 */
.plist { display: grid; gap: 6px; margin-bottom: 14px; }
.plist button { text-align: left; font: inherit; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.plist button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.model { background: var(--surface-2); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 15px; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; }

/* 講義ノート */
.notebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
.notebar .lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-right: 4px; letter-spacing: 0.04em; }
.notebar button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.notebar button:hover { border-color: var(--accent); }
.notebar button.map { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.panel.note-panel { background: var(--surface-2); padding: 14px; }
.note-next { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
/* 問題演習 */
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.tag { font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface-2); }
.tag.kind { color: var(--accent); border-color: var(--accent); background: transparent; }
.qbody { font-size: 18px; line-height: 1.8; margin: 4px 0 14px; font-weight: 500; }
.choices { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 2em minmax(0, 1fr); align-items: center; gap: 8px; text-align: left; font: inherit; font-size: 16px; line-height: 1.55; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.choice .k { font-family: var(--font-mono); font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; text-align: center; line-height: 1.6; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.choice.wrong { border-color: var(--miss); background: var(--miss-soft); color: var(--miss); }
.choice:disabled { cursor: default; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow .choice { grid-template-columns: 1fr; text-align: center; font-size: 24px; font-weight: 700; padding: 14px; }
.ordpick { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; margin-bottom: 8px; }
.ordpick .chipbtn { font: inherit; font-size: 15px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.ordpick.done .chipbtn { background: var(--accent-soft); border-color: var(--accent); cursor: default; }
.ordpick .chipbtn .n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-right: 6px; font-weight: 600; }
.ordpick .empty { color: var(--muted); font-size: 14px; align-self: center; }
.mastery { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.mastery .bar { flex: 1 1 160px; max-width: 320px; }
.howto { font-size: 13.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.howto b { color: var(--ink); }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .5s ease; } }
/* スマホ：回の切りかえは横にスクロール、設定は2列、選択肢は押しやすく */
@media (max-width: 600px) {
  .wrap > *, header.top > * { min-width: 0; max-width: 100%; }
  .seg.lessons { display: flex; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; max-width: 100%; width: 100%; min-width: 0; flex: 1 1 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .seg.lessons::-webkit-scrollbar { display: none; }
  .seg.lessons button { flex: 0 0 auto; white-space: nowrap; }
  .settings { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; }
  .settings select { width: 100%; min-height: 40px; }
  .settings #quiz-restart { grid-column: 1 / -1; }
  .choice { min-height: 52px; padding: 12px 14px; }
}
</style>
<style>
.sitenav { max-width: 980px; margin: 0 auto 6px; font-size: 13px; }
.sitenav a { color: var(--accent); text-decoration: none; font-weight: 700; }
.sitenav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav class="sitenav"><a href="../">← 日本史 文化史 暗記帳</a></nav>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">高校生物 ゼロから講座</div>
      <h1>生物タイピング暗記帳</h1>
      <div class="pair"><b class="pa">A</b>–<b class="pt">T</b>　<b class="pg">G</b>–<b class="pc">C</b>　思い出して打つ練習</div>
    </div>
    <div class="seg lessons" role="group" aria-label="講義の回" id="lessons"></div>
  </header>

  <nav class="modes" aria-label="練習モード">
    <button type="button" id="mode-note" data-mode="note"><span class="mt">講義ノート</span><span class="md">印刷用PDFと同じ内容を画面で読む</span></button>
    <button type="button" id="mode-quiz" data-mode="quiz"><span class="mt">問題演習</span><span class="md">選択・○×・穴埋めなどで解いて覚える</span></button>
    <button type="button" id="mode-recall" data-mode="recall"><span class="mt">思い出して打ち出す</span><span class="md">章を読んだら閉じて、覚えていることを全部打つ</span></button>
    <button type="button" id="mode-explain" data-mode="explain"><span class="mt">説明を打つ</span><span class="md">生徒に説明するつもりで2〜3文</span></button>
  </nav>

  <main id="view" class="panel" aria-live="polite"></main>

  <div class="howto" id="howto"></div>
</div>

<script>
/*NOTES_START*/
const NOTE_CSS = "\n/* ルーズリーフ用：穴を開ける側（とじ側）を25mm。両面印刷で表裏が反転する */\n\n\n\n* { box-sizing: border-box; }\n.paper { font-family: \"Noto Sans CJK JP\", sans-serif; font-size: 10.3pt; line-height: 1.7; color: #222; margin: 0; }\n.cover { border-bottom: 3px solid #2e7d4f; padding-bottom: 2mm; margin-bottom: 4mm; }\n.series { font-size: 9.5pt; color: #2e7d4f; font-weight: bold; letter-spacing: 0.08em; }\nh1 { font-size: 19pt; margin: 0.5mm 0 0; }\nh2 { font-size: 13.5pt; margin: 6mm 0 2mm; padding: 1mm 0 1mm 3mm; border-left: 6px solid #2e7d4f; background: #f2f6f3; break-after: avoid; }\nh3 { font-size: 11.2pt; margin: 4mm 0 1mm; color: #1b5e37; break-after: avoid; }\np { margin: 1mm 0 2mm; }\nul, ol { margin: 1mm 0 2mm; padding-left: 6mm; }\nli { margin-bottom: 0.6mm; }\ntable.t { width: 100%; border-collapse: collapse; margin: 2mm 0 3mm; font-size: 9.8pt; break-inside: avoid; }\ntable.t th, table.t td { border: 1px solid #999; padding: 1.3mm 2mm; vertical-align: top; }\ntable.t th { background: #e3efe7; text-align: left; }\n.goal { border: 2px solid #2e7d4f; border-radius: 3mm; padding: 2.5mm 4mm; background: #f1f8f3; margin: 2mm 0 4mm; }\n.goal ul { margin: 0.5mm 0 0; }\n.box { border-radius: 2mm; padding: 2.2mm 3.5mm; margin: 2.5mm 0 3mm; break-inside: avoid; font-size: 9.9pt; }\n.box .bt { font-weight: bold; margin-bottom: 0.5mm; }\n.teach { border: 1.5px solid #c77700; background: #fff8ec; }\n.teach .bt { color: #a05f00; }\n.exam { border: 1.5px solid #3a6ea5; background: #f0f5fb; }\n.exam .bt { color: #2c5885; }\n.column { border: 1px dashed #888; background: #fafafa; }\n.fig { text-align: center; margin: 2mm 0 0.5mm; break-inside: avoid; }\n.cap { text-align: center; font-size: 9pt; color: #444; margin-bottom: 3mm; }\n.key { font-weight: bold; color: #1b5e37; }\n.em { background: linear-gradient(transparent 62%, #ffe58a 62%); font-weight: bold; }\n.pb { display: none; }\n.qlist > li { margin-bottom: 3mm; break-inside: avoid; }\n.blank { display: inline-block; border-bottom: 1px solid #222; min-width: 32mm; }\n.wline { border-bottom: 1px solid #aaa; height: 7.5mm; }\n.small { font-size: 9pt; color: #555; }\n.check li { list-style: none; margin-left: -5mm; }\n.check li::before { content: \"□ \"; }\n\n:host { display: block; }\n.paper { color-scheme: light; background: #ffffff; color: #222; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 28px 30px 36px; zoom: 1.12; }\n.paper * { box-sizing: border-box; }\n.paper svg { max-width: 100%; height: auto; }\n.paper .fig, .paper .two, .paper .side .g { max-width: 100%; overflow-x: auto; }\n.paper table { max-width: 100%; color: #222; font-size: inherit; line-height: inherit; }\n.paper th, .paper td { color: inherit; }\n.paper .wline, .paper .blank { display: none; }\n.paper .qlist li { margin-bottom: 8px; }\n.paper details.answers { margin-top: 18px; border: 2px solid #2e7d4f; border-radius: 10px; padding: 0 16px; background: #f6fbf7; }\n.paper details.answers > summary { cursor: pointer; font-weight: bold; color: #1b5e37; padding: 12px 0; font-size: 11pt; }\n.paper details.answers[open] > summary { border-bottom: 1px dashed #9fc5a8; margin-bottom: 8px; }\n.paper h2 { scroll-margin-top: 16px; }\n@media (max-width: 680px) {\n  .paper { zoom: 1; padding: 18px 16px 24px; border-radius: 10px; }\n  .paper .side, .paper .two, .paper .pillars, .paper .steps { flex-direction: column; display: flex; }\n  .paper .side .g { align-self: center; }\n  .paper .track { flex-wrap: wrap; }\n  .paper .track .name { width: 100%; }\n}\n";
const NOTES = {"0": {"html": "\n<style>\n.track { display: flex; align-items: center; gap: 1.5mm; margin: 1.5mm 0; break-inside: avoid; }\n.track .name { width: 27mm; flex-shrink: 0; white-space: nowrap; font-weight: bold; font-size: 9.6pt; }\n.chip { border: 1.5px solid #2e7d4f; border-radius: 2mm; padding: 0.6mm 1.6mm; font-size: 8.8pt; background: #fff; white-space: nowrap; }\n.chip.base { border-color: #888; background: #f4f4f4; }\n.arr { color: #2e7d4f; font-weight: bold; font-size: 9pt; }\n.lt td, .lt th { padding: 0.8mm 2mm !important; font-size: 9.4pt; line-height: 1.5; }\n.star { color: #c77700; white-space: nowrap; }\n.kiso { display:inline-block; font-size: 8.3pt; border: 1px solid #888; border-radius: 1mm; padding: 0 1.2mm; color:#555; }\n.sei  { display:inline-block; font-size: 8.3pt; border: 1px solid #2e7d4f; border-radius: 1mm; padding: 0 1.2mm; color:#1b5e37; }\n.pillars { display: flex; gap: 4mm; margin: 2mm 0 3mm; }\n.pillar { flex: 1; border: 1.5px solid #2e7d4f; border-radius: 2.5mm; padding: 2mm 3mm; }\n.pillar .pt { font-weight: bold; font-size: 11pt; color: #1b5e37; }\n.pillar p { margin: 0.5mm 0 0; font-size: 9.8pt; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>全体の地図</h1></div>\n\n<p>高校の生物には<b>「生物基礎」</b>と<b>「生物」</b>の2つの科目があります。生物基礎で土台を学び、生物でそれを深めるという順番です。共通テストの「生物」は「生物」の内容から出題されますが、生物基礎の内容は知っているものとして問題が作られています。そのため、この講座は生物基礎の土台から始めます。</p>\n\n<h2>生物は2本の柱でできている</h2>\n<p>細かい用語がたくさん出てきますが、高校生物の大部分は次の2つの話に整理できます。</p>\n<div class=\"pillars\">\n<div class=\"pillar\"><div class=\"pt\">柱1　情報（DNA）</div><p>生物はDNAという設計図をもち、それをもとにタンパク質をつくって生きている。設計図をどう読むか、どう子に伝えるか、どう変わっていくか（進化）の話。</p></div>\n<div class=\"pillar\"><div class=\"pt\">柱2　エネルギー（ATP）</div><p>生物は食べ物や光からエネルギーを取り出し、ATPという形にして使っている。そのための化学反応（代謝）と、それを進める酵素の話。</p></div>\n</div>\n<p>新しい単元に入ったら、「これは情報の話か、エネルギーの話か」と考えると、知識がばらばらにならずにつながっていきます。</p>\n\n<h2>学ぶ順番</h2>\n<p>単元どうしのつながりを4つの流れにまとめました。灰色は生物基礎の土台、緑は「生物」の単元です。</p>\n<div class=\"track\"><div class=\"name\">遺伝子の話</div><span class=\"chip base\">第1回 細胞とDNA</span><span class=\"arr\">→</span><span class=\"chip\">第2回 遺伝情報の発現</span><span class=\"arr\">→</span><span class=\"chip\">第3回 発現調節</span><span class=\"arr\">→</span><span class=\"chip\">第6回 遺伝</span><span class=\"arr\">→</span><span class=\"chip\">第7回 発生・技術</span></div><div class=\"track\"><div class=\"name\">エネルギーの話</div><span class=\"chip base\">第1回 細胞とDNA</span><span class=\"arr\">→</span><span class=\"chip\">第4回 酵素とATP</span><span class=\"arr\">→</span><span class=\"chip\">第5回 呼吸と光合成</span></div><div class=\"track\"><div class=\"name\">からだの反応</div><span class=\"chip base\">第10回 体内環境</span><span class=\"arr\">→</span><span class=\"chip\">第8回 動物の反応</span><span class=\"arr\">→</span><span class=\"chip\">第9回 植物の反応</span></div><div class=\"track\"><div class=\"name\">集団と歴史</div><span class=\"chip\">第11回 生態と環境</span><span class=\"arr\">→</span><span class=\"chip\">第12回 進化と系統</span></div>\n<p class=\"small\">講座は第1回から順に進めますが、第8〜12回は第1〜5回が終わっていればどこから読んでも大丈夫です。</p>\n\n<h2>全12回の内容</h2>\n<table class=\"t lt\">\n<tr><th style=\"width:9%\">回</th><th style=\"width:21%\">テーマ</th><th style=\"width:16%\">科目</th><th>ひとことで言うと</th><th style=\"width:13%\">共通テスト</th></tr>\n<tr><td>第1回</td><td><b>細胞とDNAの基本</b></td><td><span class=\"kiso\">生物基礎</span></td><td>すべての生物は細胞でできていて、DNAを設計図にしている</td><td class='star'>（土台）</td></tr><tr><td>第2回</td><td><b>遺伝情報の発現</b></td><td><span class=\"kiso\">生物基礎</span> <span class=\"sei\">生物</span></td><td>DNAの情報がmRNAに写され、タンパク質がつくられるしくみ</td><td class='star'>★★★</td></tr><tr><td>第3回</td><td><b>遺伝子の発現調節</b></td><td><span class=\"sei\">生物</span></td><td>必要なときに必要な遺伝子だけを使うしくみ</td><td class='star'>★★★</td></tr><tr><td>第4回</td><td><b>酵素とATP</b></td><td><span class=\"kiso\">生物基礎</span> <span class=\"sei\">生物</span></td><td>体の中の化学反応を進める酵素と、エネルギーの通貨ATP</td><td class='star'>★★★</td></tr><tr><td>第5回</td><td><b>呼吸と光合成</b></td><td><span class=\"sei\">生物</span></td><td>糖からATPを取り出す呼吸と、光で糖をつくる光合成</td><td class='star'>★★★</td></tr><tr><td>第6回</td><td><b>遺伝のしくみ</b></td><td><span class=\"sei\">生物</span></td><td>減数分裂、遺伝の法則、組換えと分離比の計算</td><td class='star'>★★</td></tr><tr><td>第7回</td><td><b>発生とバイオテクノロジー</b></td><td><span class=\"sei\">生物</span></td><td>受精卵から体ができるしくみと、遺伝子を扱う技術</td><td class='star'>★★</td></tr><tr><td>第8回</td><td><b>動物の反応</b></td><td><span class=\"sei\">生物</span></td><td>ニューロンの興奮、シナプス、筋肉が縮むしくみ</td><td class='star'>★★</td></tr><tr><td>第9回</td><td><b>植物の環境応答</b></td><td><span class=\"sei\">生物</span></td><td>植物ホルモンと、光や重力への反応</td><td class='star'>★★</td></tr><tr><td>第10回</td><td><b>体内環境</b></td><td><span class=\"kiso\">生物基礎</span></td><td>ホルモン・自律神経・免疫で体の状態を保つしくみ</td><td class='star'>（土台）</td></tr><tr><td>第11回</td><td><b>生態と環境</b></td><td><span class=\"kiso\">生物基礎</span> <span class=\"sei\">生物</span></td><td>個体群・生物群集・物質循環と生態系</td><td class='star'>★★</td></tr><tr><td>第12回</td><td><b>進化と系統</b></td><td><span class=\"sei\">生物</span></td><td>進化のしくみ（自然選択・遺伝的浮動）と系統樹</td><td class='star'>★★</td></tr>\n</table>\n<p class=\"small\">★は共通テスト「生物」での重要度の目安です。生徒さん向けの勉強法PDFの優先順位と同じです。</p>\n\n<h2>この講座の使い方</h2>\n<ol>\n<li><b>講義ノートを読む</b>（1回あたり40〜60分）：図を見ながら、太字の用語を確認していきます。</li>\n<li><b>確認問題を解く</b>（15分）：最後のページに答えと解説があります。</li>\n<li><b>「生徒に説明する練習」をする</b>：各回にある <span style=\"color:#a05f00; font-weight:bold;\">「生徒に説明するときは」</span> の囲みを使って、声に出して30秒で説明してみます。説明できれば理解できています。</li>\n<li><b>考察問題を解いてみる</b>：第2〜5回が終わったら、作成済みの「分野別考察問題」の対応する大問を解いてみましょう。</li>\n</ol>\n<table class=\"t\" style=\"width:70%\">\n<tr><th>講座</th><th>対応する考察問題</th></tr>\n<tr><td>第2回 遺伝情報の発現</td><td>第1問（翻訳とコドン）</td></tr>\n<tr><td>第3回 遺伝子の発現調節</td><td>第2問（ラクトースと酵素）</td></tr>\n<tr><td>第4回 酵素とATP</td><td>第3問（酵素と温度）</td></tr>\n<tr><td>第5回 呼吸と光合成</td><td>第4問（光の強さと光合成）</td></tr>\n</table>\n", "heads": ["生物は2本の柱でできている", "学ぶ順番", "全12回の内容", "この講座の使い方"]}, "1": {"html": "\n<style>\n.legend { font-size: 9.6pt; text-align: center; margin: 0 0 3mm; }\n.legend span { margin: 0 1.6mm; white-space: nowrap; }\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 11pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\nul.check li { margin-bottom: 0; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第1回　細胞とDNAの基本</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>細胞のつくりと、主な部品（細胞小器官）の役割を言える</li>\n<li>DNAのつくりと、塩基の組み合わせのルールを説明できる</li>\n<li>「遺伝子・DNA・染色体・ゲノム」のちがいを言える</li>\n<li>DNA → RNA → タンパク質 という大きな流れをつかむ</li>\n</ul></div>\n\n<h2>1. すべての生物に共通する特徴</h2>\n<p>大腸菌もサクラもヒトも、見た目はまったく違いますが、次の5つの特徴はすべての生物に共通しています。高校生物の話はすべてこの5つのどれかにつながっています。</p>\n<table class=\"t\">\n<tr><th style=\"width:36%\">共通する特徴</th><th>説明</th><th style=\"width:15%\">詳しくは</th></tr>\n<tr><td>① 体が<b>細胞</b>でできている</td><td>細胞は膜で包まれた小さな部屋。生物の体をつくる最小の単位。</td><td>この回</td></tr>\n<tr><td>② <b>DNA</b>を遺伝情報としてもつ</td><td>体のつくり方やはたらき方の情報がDNAに書かれている。</td><td>この回・第2回</td></tr>\n<tr><td>③ <b>ATP</b>を使ってエネルギーをやりとりする</td><td>食べ物などから取り出したエネルギーを、ATPという物質にためて使う。</td><td>第4・5回</td></tr>\n<tr><td>④ 自分と同じ仲間をふやす</td><td>細胞分裂や生殖で、DNAを子に伝える。</td><td>この回・第6回</td></tr>\n<tr><td>⑤ 体の中の状態を一定に保つ</td><td>外の環境が変わっても、体温や体液の濃さなどを保とうとする。</td><td>第10回</td></tr>\n</table>\n\n<h2>2. 細胞のつくり</h2>\n<h3>2-1　原核細胞と真核細胞</h3>\n<p>細胞は大きく2種類に分けられます。分け方のポイントはただ1つ、<span class=\"em\">DNAが「核」という膜の袋に包まれているかどうか</span>です。</p>\n<ul>\n<li><b class=\"key\">原核細胞</b>：核がない。DNAは細胞の中にそのまま置かれている。大腸菌などの細菌がこのタイプ（<b>原核生物</b>）。</li>\n<li><b class=\"key\">真核細胞</b>：<b>核膜</b>に包まれた核があり、DNAはその中にある。動物・植物・菌類（カビやキノコ）がこのタイプ（<b>真核生物</b>）。</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 700 250\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto S 1.4\"/><circle cx=\"500\" cy=\"115\" r=\"2\" fill=\"#333\"/><circle cx=\"535\" cy=\"158\" r=\"2\" fill=\"#333\"/><circle cx=\"540\" cy=\"112\" r=\"2\" fill=\"#333\"/><circle cx=\"585\" cy=\"195\" r=\"2\" fill=\"#333\"/><circle cx=\"640\" cy=\"196\" r=\"2\" fill=\"#333\"/><circle cx=\"515\" cy=\"88\" r=\"8\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"1.3\"/><text x=\"515\" y=\"91.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">①</text><circle cx=\"515\" cy=\"157\" r=\"8\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"1.3\"/><text x=\"515\" y=\"160.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">⑥</text><circle cx=\"594\" cy=\"127\" r=\"8\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"1.3\"/><text x=\"594\" y=\"130.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">⑦</text><line x1=\"680\" y1=\"36\" x2=\"662\" y2=\"50\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"680\" cy=\"36\" r=\"8\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"1.3\"/><text x=\"680\" y=\"39.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">⑤</text><line x1=\"680\" y1=\"222\" x2=\"652\" y2=\"200\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"680\" cy=\"222\" r=\"8\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"1.3\"/><text x=\"680\" y=\"225.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">④</text></svg></div>\n<div class=\"legend\"><span>① 核</span><span>② ミトコンドリア</span><span>③ リボソーム</span><span>④ 細胞膜</span><span>⑤ 細胞壁</span><span>⑥ 葉緑体</span><span>⑦ 液胞</span><span>⑧ DNA（原核細胞）</span></div>\n<div class=\"cap\">図1　細胞のつくり（植物細胞にもミトコンドリアやリボソームはあります）</div>\n\n<h3>2-2　細胞の中の部品（細胞小器官）</h3>\n<p>細胞の中には、決まった仕事をする部品があります。細胞をひとつの工場にたとえると覚えやすくなります。</p>\n<table class=\"t\">\n<tr><th style=\"width:19%\">部品</th><th style=\"width:22%\">工場にたとえると</th><th>はたらき</th><th style=\"width:19%\">もっている細胞</th></tr>\n<tr><td>① <b>核</b></td><td>設計図の保管庫</td><td>DNAをしまっている。細胞のはたらきの司令塔。</td><td>真核細胞</td></tr>\n<tr><td>② <b>ミトコンドリア</b></td><td>発電所</td><td><b>呼吸</b>を行い、糖などからエネルギーを取り出してATPをつくる。</td><td>真核細胞</td></tr>\n<tr><td>③ <b>リボソーム</b></td><td>組み立てライン</td><td>タンパク質を組み立てる。</td><td>すべての細胞</td></tr>\n<tr><td>④ <b>細胞膜</b></td><td>門と塀</td><td>細胞の内と外を仕切り、物質の出入りを調節する。</td><td>すべての細胞</td></tr>\n<tr><td>⑤ <b>細胞壁</b></td><td>外側の丈夫な壁</td><td>細胞を外から支え、形を保つ。</td><td>植物・細菌など</td></tr>\n<tr><td>⑥ <b>葉緑体</b></td><td>太陽光発電所</td><td><b>光合成</b>を行い、光のエネルギーを使って糖をつくる。</td><td>植物など</td></tr>\n<tr><td>⑦ <b>液胞</b></td><td>倉庫</td><td>水や物質をためる。植物細胞では大きく発達している。</td><td>植物で発達</td></tr>\n</table>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「原核と真核のちがいは<b>核があるかないか</b>だけ覚えればいい」と、まず1つに絞って伝えます。そのうえで「植物にだけあるのは<b>細胞壁・葉緑体・発達した液胞</b>の3つ」と言うと、表を丸暗記しなくても大部分の問題に答えられます。</div>\n<div class=\"box column\"><div class=\"bt\">コラム：ミトコンドリアと葉緑体は、もとは別の生物だった</div>\nミトコンドリアと葉緑体は、核とは別に自分専用のDNAをもち、細胞の中で分裂してふえます。そのため、大昔に別の原核生物が細胞の中に取りこまれ、共生するようになったものだと考えられています（<b>細胞内共生説</b>）。</div>\n\n<h2>3. DNAのつくり</h2>\n<h3>3-1　DNAは「ヌクレオチド」がつながった鎖</h3>\n<p>DNAは、<b class=\"key\">ヌクレオチド</b>という単位がたくさんつながってできた長い鎖です。ヌクレオチド1個は、<b>リン酸・糖・塩基</b>の3つの部品でできています。DNAの糖は<b>デオキシリボース</b>という種類です。</p>\n<p>塩基には <b>A（アデニン）・T（チミン）・G（グアニン）・C（シトシン）</b> の4種類があります。DNAの情報は、この<span class=\"em\">4種類の塩基がどんな順番で並んでいるか（塩基配列）</span>で書かれています。アルファベット4文字だけで書かれた長い文章をイメージしてください。</p>\n\n<h3>3-2　2本の鎖は決まった相手とペアになる</h3>\n<p>DNAは2本の鎖が向かい合い、塩基どうしがペアをつくってつながっています。ペアの相手は決まっていて、<span class=\"em\">AはTと、GはCとだけ</span>結びつきます。このルールを<b class=\"key\">相補性</b>といい、ペアになった塩基を<b>塩基対</b>といいます。2本の鎖は全体がねじれて、らせん階段のような<b class=\"key\">二重らせん構造</b>になっています。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 245\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><line x1=\"45\" y1=\"50\" x2=\"580\" y2=\"50\" stroke=\"#555\" stroke-width=\"2\"/><line x1=\"60\" y1=\"185\" x2=\"595\" y2=\"185\" stroke=\"#555\" stroke-width=\"2\"/><circle cx=\"48\" cy=\"50\" r=\"7\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"1.3\"/><rect x=\"70\" y=\"40\" width=\"20\" height=\"20\" fill=\" 2\" y1=\"213\" x2=\"402\" y2=\"227\" stroke=\"#333\" stroke-width=\"1.4\" stroke-dasharray=\"2,1.5\"/><text x=\"412\" y=\"225\">水素結合（A–Tは2本、G–Cは3本）</text></svg></div>\n<div class=\"cap\">図2　DNAのつくり（ねじれをほどいて平らにした図）</div>\n<p>相補性があるので、<b>片方の鎖の塩基配列がわかれば、もう片方も自動的に決まります</b>。たとえば片方が A G C T T A G なら、もう片方は T C G A A T C です。この性質は、DNAを複製するとき（6章）や、mRNAをつくるとき（第2回）に使われます。</p>\n\n<h3>3-3　AとT、GとCは同じ量だけある</h3>\n<p>AとTは必ずペアなので、DNAに含まれるAとTの数は等しくなります。GとCも同じです。これを使った計算問題がよく出ます。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：塩基の割合の計算</div>\n<b>例題</b>　ある生物のDNAで、Aが全塩基の30%だった。T・G・Cはそれぞれ何%か。<br>\n<b>考え方</b>　AとTは同じ量なので、T＝30%。残りは 100−30−30＝40% で、これをGとCで半分ずつ分ける。<br>\n<b>答え</b>　T 30%、G 20%、C 20%</div>\n\n<h2>4. 遺伝子・DNA・染色体・ゲノムのちがい</h2>\n<p>この4つの言葉は混ざりやすいので、入れ物の大きい順に整理しておきます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">細胞</div><div class=\"fbs\">体をつくる<br>単位</div></div><div class=\"farr\">中に<br>→</div><div class=\"fb\"><div class=\"fbt\">核</div><div class=\"fbs\">細胞の中の<br>部屋</div></div><div class=\"farr\">中に<br>→</div><div class=\"fb\"><div class=\"fbt\">染色体</div><div class=\"fbs\">ヒトは<br>46本</div></div><div class=\"farr\">ほどくと<br>→</div><div class=\"fb\"><div class=\"fbt\">DNA</div><div class=\"fbs\">染色体をほどくと<br>長い糸</div></div><div class=\"farr\">一部が<br>→</div><div class=\"fb\"><div class=\"fbt\">遺伝子</div><div class=\"fbs\">DNAのうち<br>情報がある部分</div></div></div>\n<div class=\"cap\">図3　細胞からDNA・遺伝子へ</div>\n<ul>\n<li><b class=\"key\">DNA</b>：物質の名前。塩基が並んだ長い鎖そのもの。</li>\n<li><b class=\"key\">染色体</b>：DNAがタンパク質に巻きついて、折りたたまれたもの。細胞分裂のときに太く縮んで、顕微鏡で見えるようになる。ヒトの体の細胞には<b>46本</b>（同じ形のものが2本ずつ、23組）ある。</li>\n<li><b class=\"key\">遺伝子</b>：DNAのうち、タンパク質などをつくるための情報がある部分。<b>DNA全体のごく一部</b>にすぎず、その間には遺伝子でない部分がたくさんある。</li>\n<li><b class=\"key\">ゲノム</b>：その生物が生きるのに必要な、ひとそろいの遺伝情報のすべて。ヒトのゲノムは約30億塩基対で、遺伝子は約2万個ある。</li>\n</ul>\n<table class=\"t\">\n<tr><th style=\"width:22%\">言葉</th><th>本にたとえると</th></tr>\n<tr><td>ゲノム</td><td>料理の本の<b>全集</b>（ひとそろい全部）</td></tr>\n<tr><td>染色体</td><td>全集の<b>1冊1冊</b></td></tr>\n<tr><td>DNA</td><td>本に書かれている<b>文字の並び</b>そのもの（紙とインク）</td></tr>\n<tr><td>遺伝子</td><td>本の中の<b>1つ1つのレシピ</b>（レシピ以外のページもたくさんある）</td></tr>\n</table>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「DNAは<b>物質の名前</b>、遺伝子は<b>情報の単位</b>」と区別させるのがポイントです。「遺伝子はDNAの中のレシピの部分。DNAのすべてが遺伝子ではない」と、本のたとえで説明すると伝わりやすいです。</div>\n\n<h2>5. DNAからタンパク質へ（第2回の予告）</h2>\n<p>DNAに書かれた情報は、そのままでは使われません。まず必要な部分だけが<b class=\"key\">mRNA</b>（伝令RNA）という別の鎖に写し取られ（<b class=\"key\">転写</b>）、そのmRNAの情報をもとにリボソームでタンパク質が組み立てられます（<b class=\"key\">翻訳</b>）。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">DNA</div><div class=\"fbs\">設計図の原本<br>（核の中）</div></div><div class=\"farr\">転写<br>→</div><div class=\"fb\"><div class=\"fbt\">mRNA</div><div class=\"fbs\">必要な部分の<br>コピー</div></div><div class=\"farr\">翻訳<br>→</div><div class=\"fb\"><div class=\"fbt\">タンパク質</div><div class=\"fbs\">体をつくり<br>はたらく</div></div></div>\n<div class=\"cap\">図4　遺伝情報の流れ</div>\n<p>タンパク質は<b>20種類のアミノ酸</b>がつながったもので、つながる順番によって形とはたらきが決まります。生物の体の中で、実際に仕事をしているのはほとんどがタンパク質です。</p>\n<table class=\"t\">\n<tr><th style=\"width:30%\">タンパク質の役割</th><th>例</th></tr>\n<tr><td>化学反応を進める（<b>酵素</b>）</td><td>だ液に含まれ、デンプンを分解するアミラーゼ</td></tr>\n<tr><td>物質を運ぶ</td><td>赤血球に含まれ、酸素を運ぶヘモグロビン</td></tr>\n<tr><td>体の形をつくる</td><td>皮膚や骨に含まれるコラーゲン</td></tr>\n<tr><td>体を守る</td><td>病原体にくっつく抗体</td></tr>\n<tr><td>情報を伝える</td><td>血糖値を下げるホルモンであるインスリン</td></tr>\n</table>\n<p><b>RNA</b>はDNAとよく似ていますが、①糖が<b>リボース</b>、②塩基にTがなく、かわりに<b>U（ウラシル）</b>を使う、③ふつう<b>1本鎖</b>、という3点がちがいます。詳しくは第2回で扱います。</p>\n\n<h2>6. 細胞がふえるとき：DNAの複製</h2>\n<h3>6-1　DNAの複製と半保存的複製</h3>\n<p>1個の細胞が分裂して2個になるとき、2つの細胞はどちらも同じDNAを受け取る必要があります。そこで細胞は、分裂する前にDNAを正確にコピーして2倍にしておきます。これを<b class=\"key\">DNAの複製</b>といいます。</p>\n<p>複製では、2本鎖がほどけて、それぞれの鎖を型にして相補性のルールで新しい鎖がつくられます。できた2つのDNAは、どちらも「もとの鎖1本＋新しい鎖1本」の組み合わせになります。これを<b class=\"key\">半保存的複製</b>といいます。</p>\n\n<h3>6-2　半保存的複製を確かめた実験（メセルソンとスタール）</h3>\n<p>DNAの塩基には窒素（N）が含まれています。窒素には、ふつうの窒素 <b>¹⁴N</b> と、それより少し重い <b>¹⁵N</b> があります。メセルソンとスタールは、この重さのちがいを目印にして、DNAがどのように複製されるかを調べました。</p>\n<ol>\n<li>¹⁵Nだけを含む培地で大腸菌を何世代も育て、DNAの2本の鎖を<b>どちらも¹⁵N</b>にする。</li>\n<li>この大腸菌を<b>¹⁴Nだけを含む培地</b>に移して分裂させる。これから新しくつくられる鎖は、すべて¹⁴Nになる。</li>\n<li>分裂のたびにDNAを取り出し、遠心分離で重さごとに分ける（重いDNAほど管の下にしずむ）。</li>\n</ol>\n<table class=\"t\">\n<tr><th style=\"width:22%\">DNAの種類</th><th>2本の鎖の組み合わせ</th></tr>\n<tr><td><b>重いDNA</b></td><td>¹⁵Nの鎖 ＋ ¹⁵Nの鎖（実験のはじめのDNA）</td></tr>\n<tr><td><b>中間の重さのDNA</b></td><td>¹⁵Nの鎖 ＋ ¹⁴Nの鎖（もとの鎖1本と、新しい鎖1本）</td></tr>\n<tr><td><b>軽いDNA</b></td><td>¹⁴Nの鎖 ＋ ¹⁴Nの鎖（どちらも新しい鎖）</td></tr>\n</table>\n<div class=\"fig\"><svg viewBox=\"0 0 660 270\" width=\"610\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><text x=\"48.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"12\">はじめ</text><rect x=\"37\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"40\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"48\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"33.0\" y=\"96\" width=\"30\" height=\"96\" rx=\"12\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.3\"/><rect x=\"36.0\" y=\"169\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#c62828\"/><text x=\"48.0\" y=\"212\" text-anchor=\"middle\" font-size=\"10.5\">重い 1</text><text x=\"140.5\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"12\">1回分裂後</text><rect x=\"117\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"120\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"128\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"142\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"145\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"153\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"125.5\" y=\"96\" width=\"30\" height=\"96\" rx=\"12\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.3\"/><rect x=\"128.5\" y=\"143\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#8e24aa\"/><text x=\"140.5\" y=\"212\" text-anchor=\"middle\" font-size=\"10.5\">中間 2</text><text x=\"275.5\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"12\">2回分裂後</text><rect x=\"227\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"230\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"238\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"252\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"255\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"263\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"277\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"280\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"288\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"302\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"305\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"313\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"260.5\" y=\"96\" width=\"30\" height=\"96\" rx=\"12\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.3\"/><rect x=\"263.5\" y=\"117\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"263.5\" y=\"143\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#8e24aa\"/><text x=\"275.5\" y=\"212\" text-anchor=\"middle\" font-size=\"10.5\">中間 2・軽い 2</text><text x=\"505.5\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"12\">3回分裂後</text><rect x=\"407\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"410\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"418\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"432\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"435\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"443\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"457\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"460\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"468\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"482\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"485\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"493\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"507\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"510\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"518\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"532\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"535\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"543\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"557\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"560\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"568\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"582\" y=\"29\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#f5f5f5\" stroke=\"#9e9e9e\" stroke-width=\"1\"/><rect x=\"585\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"593\" y=\"32\" width=\"6\" height=\"38\" rx=\"2\" fill=\"#c62828\"/><rect x=\"490.5\" y=\"96\" width=\"30\" height=\"96\" rx=\"12\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.3\"/><rect x=\"493.5\" y=\"117\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#1e88e5\"/><rect x=\"493.5\" y=\"143\" width=\"24\" height=\"6\" rx=\"2\" fill=\"#8e24aa\"/><text x=\"505.5\" y=\"212\" text-anchor=\"middle\" font-size=\"10.5\">中間 2・軽い 6</text><text x=\"18\" y=\"124\" font-size=\"10\" fill=\"#555\">上</text><text x=\"18\" y=\"178\" font-size=\"10\" fill=\"#555\">下</text><rect x=\"40\" y=\"232\" width=\"12\" height=\"12\" fill=\"#c62828\"/><text x=\"58\" y=\"242\" font-size=\"10.5\">¹⁵Nの鎖（重い）</text><rect x=\"170\" y=\"232\" width=\"12\" height=\"12\" fill=\"#1e88e5\"/><text x=\"188\" y=\"242\" font-size=\"10.5\">¹⁴Nの鎖（軽い）</text><text x=\"300\" y=\"242\" font-size=\"10.5\" fill=\"#555\">管：遠心分離すると、重いDNAほど下にしずむ</text><text x=\"40\" y=\"262\" font-size=\"10.5\" fill=\"#555\">（中間＝¹⁵Nの鎖1本＋¹⁴Nの鎖1本）</text></svg></div>\n<div class=\"cap\">図5　メセルソンとスタールの実験の結果</div>\n<p>結果は、<b>1回分裂後は中間のDNAだけ</b>、<b>2回分裂後は 中間：軽い＝1：1</b>になりました。もし「もとの2本鎖はそのまま残り、新しい2本鎖が丸ごとつくられる」しくみ（保存的複製）なら、1回分裂後に重いDNAと軽いDNAが1：1でできて、中間のDNAはできないはずです。実際には中間のDNAができたので、<span class=\"em\">DNAは半保存的に複製される</span>ことが確かめられました。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：n回分裂したあとの比</div>\n<b>例題</b>　¹⁵NだけのDNAをもつ大腸菌を¹⁴Nの培地で3回分裂させた。中間のDNA：軽いDNA は？<br>\n<b>考え方</b>　① DNAは1回の分裂で2倍になるので、3回で全部 2³＝<b>8個</b>。<br>\n② 最初の¹⁵Nの鎖は<b>2本しかなく</b>、こわれずに1本ずつ別のDNAに入っていくので、<b>中間のDNAは何回分裂しても2個</b>。<br>\n③ 残りの 8−2＝<b>6個が軽いDNA</b>。よって 中間：軽い＝2：6＝<b>1：3</b>。<br>\n<b>まとめ</b>　n回分裂後は、全部で 2ⁿ 個のうち中間が2個、軽いのが 2ⁿ−2 個。重いDNAは1回目の分裂以降はなくなる。</div>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n最初の¹⁵Nの鎖2本を「<b>赤い糸2本</b>」にたとえます。コピーのたびに赤い糸は1本ずつ別々のDNAに分かれていき、相手にはいつも新しい青い糸がつく。赤い糸は2本しかないので、何回コピーしても「赤が入ったDNA（中間）」は2個だけ。あとは全部「青だけのDNA（軽い）」になる、と説明すると計算の意味が伝わります。</div>\n\n<h3>6-3　細胞周期とDNA量</h3>\n<p>細胞が分裂してから次に分裂するまでの1周を<b class=\"key\">細胞周期</b>といいます。細胞周期は、分裂の準備をする<b>間期</b>（G₁期・S期・G₂期）と、実際に分かれる<b>分裂期</b>（M期）からなります。DNAが複製されるのは<span class=\"em\">S期</span>です。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 670 230\" width=\"545\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><rect x=\"70.0\" y=\"40\" width=\"99.0\" height=\"125\" fill=\"#f4f4f4\"/><text x=\"119.5\" y=\"182\" text-anchor=\"middle\">G₁期</text><rect x=\"169.0\" y=\"40\" width=\"82.5\" height=\"125\" fill=\"#fff3cd\"/><text x=\"210.25\" y=\"182\" text-anchor=\"middle\">S期</text><rect x=\"251.5\" y=\"40\" width=\"66.0\" height=\"125\" fill=\"#f4f4f4\"/><text x=\"284.5\" y=\"182\" text-anchor=\"middle\">G₂期</text><rect x=\"317.5\" y=\"40\" width=\"49.5\" height=\"125\" fill=\"#e3efe7\"/><text x=\"342.25\" y=\"182\" text-anchor=\"middle\">分裂期</text><rect x=\"367.0\" y=\"40\" width=\"99.0\" height=\"125\" fill=\"#f4f4f4\"/><text x=\"416.5\" y=\"182\" text-anchor=\"middle\">G₁期</text><rect x=\"466.0\" y=\"40\" width=\"82.5\" height=\"125\" fill=\"#fff3cd\"/><text x=\"507.25\" y=\"182\" text-anchor=\"middle\">S期</text><rect x=\"548.5\" y=\"40\" width=\"66.0\" height=\"125\" fill=\"#f4f4f4\"/><text x=\"581.5\" y=\"182\" text-anchor=\"middle\">G₂期</text><line x1=\"70.0\" y1=\"165\" x2=\"624.5\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.3\"/><line x1=\"70.0\" y1=\"35\" x2=\"70.0\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"62.0\" y=\"154\" text-anchor=\"end\">1</text><text x=\"62.0\" y=\"74\" text-anchor=\"end\">2</text><text transform=\"translate(22,105) rotate(-90)\" text-anchor=\"middle\" font-size=\"11\">細胞1個あたりのDNA量</text><polyline points=\"70.0,150 169.0,150 251.5,70 367.0,70 367.0,150 466.0,150 548.5,70 614.5,70\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.6\"/><text x=\"193.75\" y=\"207\" text-anchor=\"middle\" font-weight=\"bold\">間期</text><line x1=\"70.0\" y1=\"194\" x2=\"317.5\" y2=\"194\" stroke=\"#555\"/><text x=\"210.25\" y=\"62\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a6d00\">DNAを複製</text><text x=\"373.0\" y=\"114.0\" font-size=\"10.5\" fill=\"#2e7d4f\">2つの細胞に分かれて半分に</text><text x=\"626.5\" y=\"169\">時間</text></svg></div>\n<div class=\"cap\">図6　細胞周期と、細胞1個あたりのDNA量の変化</div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：DNA量のグラフ</div>\n「G₁期の細胞のDNA量を1とすると、G₂期の細胞のDNA量はいくつか」→ <b>2</b>。S期で2倍になり、分裂期が終わると2つの細胞に分かれて1に戻る、という形を覚えておけば、グラフの問題に対応できます。</div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>原核細胞と真核細胞のちがいは「核があるかどうか」</li>\n<li>植物細胞にだけあるのは、細胞壁・葉緑体・発達した液胞</li>\n<li>ミトコンドリアは呼吸、葉緑体は光合成、リボソームはタンパク質の合成</li>\n<li>DNAはヌクレオチド（リン酸・糖・塩基）がつながった鎖。塩基はA・T・G・Cの4種類</li>\n<li>AはT、GはCとペアになる（相補性）。だからAとT、GとCは同じ量</li>\n<li>DNAは物質、遺伝子はその中の情報の部分、ゲノムはひとそろいの遺伝情報</li>\n<li>DNA →（転写）→ mRNA →（翻訳）→ タンパク質</li>\n<li>メセルソンとスタールの実験：¹⁵N→¹⁴Nで、1回分裂後は中間だけ。n回分裂後は中間2個・軽い 2ⁿ−2 個</li>\n<li>DNAは間期のS期に複製されて2倍になり、分裂で半分ずつ分けられる</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<ol class=\"qlist\">\n<li>原核細胞にないものを、次から1つ選べ。<br>　ア　細胞膜　　イ　リボソーム　　ウ　DNA　　エ　核膜</li>\n<li>植物細胞にはあるが、動物細胞にはふつうないものを、次から<b>2つ</b>選べ。<br>　ア　核　　イ　ミトコンドリア　　ウ　細胞壁　　エ　葉緑体　　オ　細胞膜</li>\n<li>呼吸を行い、生命活動に必要なエネルギー（ATP）をつくる細胞小器官の名前を答えよ。<br><span class=\"blank\"></span></li>\n<li>DNAを構成するヌクレオチドの3つの成分を答えよ。<br><span class=\"blank\"></span>・<span class=\"blank\"></span>・<span class=\"blank\"></span></li>\n<li>DNAの片方の鎖の塩基配列が ATGGCA のとき、もう片方の鎖の塩基配列を答えよ。<br><span class=\"blank\"></span></li>\n<li>ある生物のDNAで、Aが全塩基の28%だった。T・G・Cはそれぞれ何%か。<br>T <span class=\"blank\" style=\"min-width:16mm\"></span>%　G <span class=\"blank\" style=\"min-width:16mm\"></span>%　C <span class=\"blank\" style=\"min-width:16mm\"></span>%</li>\n<li>次の文が正しければ○、誤っていれば×をつけよ。<br>\n　(a) ヒトの体の細胞の核には、46本の染色体がある。　（　　）<br>\n　(b) DNAの塩基配列は、すべてが遺伝子としてはたらいている。　（　　）<br>\n　(c) RNAには、Tのかわりに U（ウラシル）が含まれる。　（　　）</li>\n<li>DNAの情報をmRNAに写し取る過程と、mRNAの情報をもとにタンパク質をつくる過程を、それぞれ何というか。<br>DNA→mRNA <span class=\"blank\"></span>　　mRNA→タンパク質 <span class=\"blank\"></span></li>\n<li>細胞周期について答えよ。<br>(1) DNAが複製される時期を答えよ。 <span class=\"blank\"></span><br>(2) G₁期の細胞のDNA量を1とすると、G₂期の細胞のDNA量はいくつか。 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li><b>説明の練習</b>　「DNA」「遺伝子」「ゲノム」のちがいを、生徒にわかるように2〜3文で説明せよ。\n<div class=\"wline\"></div><div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　エ</b>　原核細胞と真核細胞のちがいは核（核膜）があるかどうか。細胞膜・リボソーム・DNAはすべての細胞がもっている。</p>\n<p><b>2.　ウ・エ</b>　植物細胞に特有なのは、細胞壁・葉緑体・発達した液胞。ミトコンドリアは動物にも植物にもある。</p>\n<p><b>3.　ミトコンドリア</b>　葉緑体（光合成）とまちがえやすいので注意。植物はミトコンドリアと葉緑体の両方をもっている。</p>\n<p><b>4.　リン酸・糖（デオキシリボース）・塩基</b>（順不同）</p>\n<p><b>5.　TACCGT</b>　A↔T、G↔Cの組み合わせで1つずつ置きかえる。</p>\n<p><b>6.　T 28%、G 22%、C 22%</b>　AとTは同じ量なので T＝28%。残りは 100−28−28＝44% で、GとCで半分ずつ。</p>\n<p><b>7.　(a) ○　(b) ×　(c) ○</b>　(b) 遺伝子はDNAのごく一部で、遺伝子でない部分がたくさんある。</p>\n<p><b>8.　DNA→mRNA：転写　mRNA→タンパク質：翻訳</b>　「写す」から転写、「別の言葉（アミノ酸の並び）に置きかえる」から翻訳、と覚える。</p>\n<p><b>9.　(1) S期（間期）　(2) 2</b>　S期にDNAが複製されて2倍になり、そのまま分裂期まで2のまま。分裂が終わると1に戻る。</p>\n<p><b>10.　解答例</b>　DNAは、A・T・G・Cの4種類の塩基が並んだ長い鎖でできた物質です。遺伝子は、そのDNAのうち、タンパク質をつくるための情報（レシピ）が書かれている部分で、DNA全体のごく一部です。ゲノムは、その生物が生きるのに必要な遺伝情報のひとそろい全部のことです。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第2回 遺伝情報の発現）に向けて</div>\n第2回では、図4の「転写」と「翻訳」をくわしく見ていきます。この回の<b>相補性（AとT、GとC）</b>と<b>RNAではTのかわりにUを使う</b>ことが、そのまま土台になります。この2つだけはしっかり確認しておいてください。</div>\n</details>", "heads": ["1. すべての生物に共通する特徴", "2. 細胞のつくり", "3. DNAのつくり", "4. 遺伝子・DNA・染色体・ゲノムのちがい", "5. DNAからタンパク質へ（第2回の予告）", "6. 細胞がふえるとき：DNAの複製", "この回のまとめ", "確認問題"]}, "2": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.frow { display: flex; align-items: center; gap: 3mm; margin: 1.5mm 0; break-inside: avoid; }\n.frow .lab { width: 22mm; font-weight: bold; flex: 0 0 auto; }\ntable.ct { border-collapse: collapse; width: 100%; font-size: 8.4pt; line-height: 1.45; break-inside: avoid; margin: 1mm 0 1mm; }\ntable.ct th, table.ct td { border: 1px solid #555; padding: 0.8mm 1.4mm; vertical-align: middle; }\ntable.ct th { background: #e3efe7; text-align: center; }\ntable.ct th.big { font-size: 13pt; }\ntable.ct td.third { text-align: center; font-weight: bold; background: #f4f4f4; }\ntable.ct .c1 { width: 7%; }\ntable.ct .cd { font-family: \"Noto Sans Mono CJK JP\", monospace; font-weight: bold; }\ntable.ct .stop { color: #c62828; font-weight: bold; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; font-size: 11.5pt; letter-spacing: 0.05em; }\n.cdn { border-bottom: 2px solid #7b1fa2; padding: 0 0.6mm; }\n.hl { background: #ffe082; color: #c62828; font-weight: bold; }\ntable.t td.mono { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第2回　遺伝情報の発現</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>RNAとDNAのちがいを3つ言える</li>\n<li>転写のしくみを説明でき、DNAの塩基配列からmRNAの塩基配列を書ける</li>\n<li>翻訳のしくみ（コドン・tRNA・リボソーム）を説明でき、遺伝暗号表を使ってアミノ酸の並びを求められる</li>\n<li>塩基の置換・欠失が、タンパク質にどう影響するかを説明できる</li>\n</ul></div>\n\n<h2>0. 前回のふり返り</h2>\n<p>DNAには、A・T・G・Cの4種類の塩基の並びとして情報が書かれていました。AはT、GはCとペアになる（相補性）のでした。そして、DNAの情報は次の流れで使われます。この回は、この2本の矢印の中身をくわしく見ていきます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">DNA</div><div class=\"fbs\">設計図の原本<br>（核の中）</div></div><div class=\"farr\">転写<br>→</div><div class=\"fb\"><div class=\"fbt\">mRNA</div><div class=\"fbs\">必要な部分の<br>コピー</div></div><div class=\"farr\">翻訳<br>→</div><div class=\"fb\"><div class=\"fbt\">タンパク質</div><div class=\"fbs\">体をつくり<br>はたらく</div></div></div>\n<p class=\"small\" style=\"text-align:center\">DNAの情報をもとにタンパク質がつくられることを<b>遺伝子の発現</b>といいます。</p>\n\n<h2>1. RNAとは</h2>\n<p>RNAもDNAと同じく、ヌクレオチドがつながった鎖です。よく似ていますが、次の3点がちがいます。</p>\n<table class=\"t\">\n<tr><th style=\"width:20%\"></th><th style=\"width:40%\">DNA</th><th>RNA</th></tr>\n<tr><td><b>糖</b></td><td>デオキシリボース</td><td><b>リボース</b></td></tr>\n<tr><td><b>塩基</b></td><td>A・T・G・C</td><td>A・<b>U（ウラシル）</b>・G・C　<span class=\"small\">（Tのかわりに U）</span></td></tr>\n<tr><td><b>鎖の数</b></td><td>2本鎖（二重らせん）</td><td>ふつう<b>1本鎖</b></td></tr>\n</table>\n<p>RNAには、はたらきのちがう3つの種類があり、どれも翻訳で活躍します。</p>\n<table class=\"t\">\n<tr><th style=\"width:28%\">種類</th><th>はたらき</th></tr>\n<tr><td><b>mRNA</b>（伝令RNA）</td><td>DNAの情報を写し取り、リボソームまで運ぶ。</td></tr>\n<tr><td><b>tRNA</b>（運搬RNA）</td><td>アミノ酸をリボソームまで運んでくる。</td></tr>\n<tr><td><b>rRNA</b>（リボソームRNA）</td><td>タンパク質と一緒にリボソームをつくっている。</td></tr>\n</table>\n\n<h2>2. 転写：DNAの情報をmRNAに写す</h2>\n<p><b class=\"key\">転写</b>では、まずDNAの2本鎖のうち、遺伝子の部分がほどけます。そして2本のうち片方の鎖だけを型にして、<b class=\"key\">RNAポリメラーゼ</b>という酵素がRNAを1塩基ずつつないでいきます。型になる鎖を<b class=\"key\">鋳型鎖</b>といいます。RNAポリメラーゼは、遺伝子の手前にある<b class=\"key\">プロモーター</b>という領域に結合して転写を始めます。</p>\n<p>塩基は相補性のルールでつながりますが、<span class=\"em\">RNAにはTがないので、鋳型鎖のAに対してはUが入ります</span>。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 250\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><text x=\"140\" y=\"44\" text-anchor=\"end\" font-weight=\"bold\">DNA</text><text x=\"140\" y=\"60\" text-anchor=\"end\" font-size=\"10.5\">（使わない鎖）</text><rect x=\"150\" y=\"30\" width=\"30\" heigh
