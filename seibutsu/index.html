ontent: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第5回　呼吸と光合成</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>呼吸の3つの段階（解糖系・クエン酸回路・電子伝達系）の場所とはたらきを言える</li>\n<li>発酵と呼吸のちがいを説明でき、酵母の気体の出入りから計算できる</li>\n<li>光合成の2つの段階（チラコイド・ストロマ）の流れを説明できる</li>\n<li>光の強さと光合成のグラフ（補償点・光飽和点・見かけの光合成）を読める</li>\n</ul></div>\n\n<h2>0. 前回のふり返り</h2>\n<p>前回、生物はエネルギーを<b>ATP</b>という形でやりとりし、ADPに戻ったものは呼吸や光合成で再びATPにすることを学びました。この回は、その「ATPをつくる2大イベント」である<b>呼吸</b>と<b>光合成</b>の中身を見ていきます。どちらも、たくさんの<b>酵素</b>が順番にはたらく反応で、前回の<b>補酵素</b>（NAD⁺など）が電子や水素の運び役として活躍します。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">光合成</div><div class=\"fbs\">光 → 糖<br>（同化）</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">糖（グルコース）</div><div class=\"fbs\">エネルギーを<br>たくわえる</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">呼吸</div><div class=\"fbs\">糖 → ATP<br>（異化）</div></div></div>\n\n<h2>1. 呼吸</h2>\n<h3>1-1　呼吸の全体像</h3>\n<p><b class=\"key\">呼吸</b>は、酸素を使ってグルコースなどの有機物を二酸化炭素と水に分解し、取り出したエネルギーでATPをつくるはたらきです。全体をまとめると次の式になります。</p>\n<p style=\"text-align:center; font-weight:bold\">C₆H₁₂O₆ ＋ 6O₂ ＋ 6H₂O → 6CO₂ ＋ 12H₂O ＋ エネルギー（ATP 最大38分子）</p>\n<p>呼吸は一度に起こるのではなく、<b>3つの段階</b>に分かれて進みます。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 300\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"r1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><defs><marker id=\"r2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#c62828\"/></marker></defs><rect x=\"6\" y=\"6\" width=\"628\" height=\"288\" rx=\"26\" fill=\"#fdf8f0\" stroke=\"#8d6e63\" stroke-width=\"2\"/><text x=\"24\" y=\"30\" font-size=\"11.5\" fill=\"#6d4c41\" font-weight=\"bold\">細胞質基質</text><rect x=\"28\" y=\"56\" width=\"150\" height=\"120\" rx=\"10\" fill=\"#fff\" stroke=\"#e65100\" stroke-width=\"2\"/><text x=\"103\" y=\"78\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\" fill=\"#e65100\">① 解糖系</text><text x=\"103\" y=\"102\" text-anchor=\"middle\">グルコース（C₆）</text><path d=\"M103 108 L103 128\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#r1)\"/><text x=\"103\" y=\"146\" text-anchor=\"middle\">ピルビン酸（C₃）×2</text><text x=\"103\" y=\"166\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">ATP 2分子</text><text x=\"103\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#555\">酸素がなくても進む</text><ellipse cx=\"420\" cy=\"160\" rx=\"200\" ry=\"118\" fill=\"#ffe9d6\" stroke=\"#d2691e\" stroke-width=\"3\"/><path d=\"M250 160 q20 -60 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0\" fill=\"none\" stroke=\"#d2691e\" stroke-width=\"2.2\"/><text x=\"420\" y=\"58\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#a0522d\" font-weight=\"bold\">ミトコンドリア</text><path d=\"M178 120 L256 120\" stroke=\"#555\" stroke-width=\"1.8\" marker-end=\"url(#r1)\"/><text x=\"216\" y=\"112\" text-anchor=\"middle\" font-size=\"10.5\">ピルビン酸</text><rect x=\"290\" y=\"76\" width=\"160\" height=\"62\" rx=\"10\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"370\" y=\"96\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13.5\" fill=\"#1b5e37\">② クエン酸回路</text><text x=\"370\" y=\"114\" text-anchor=\"middle\" font-size=\"10.5\">マトリックス／CO₂を放出</text><text x=\"370\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">ATP 2分子</text><text x=\"512\" y=\"104\" font-size=\"11\" fill=\"#555\">→ CO₂</text><rect x=\"320\" y=\"186\" width=\"200\" height=\"62\" rx=\"10\" fill=\"#fff\" stroke=\"#1565c0\" stroke-width=\"2\"/><text x=\"420\" y=\"206\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13.5\" fill=\"#0d47a1\">③ 電子伝達系</text><text x=\"420\" y=\"224\" text-anchor=\"middle\" font-size=\"10.5\">内膜／O₂を使い H₂O ができる</text><text x=\"420\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">ATP 最大34分子</text><path d=\"M370 140 L400 184\" stroke=\"#7b1fa2\" stroke-width=\"1.8\" stroke-dasharray=\"4,3\" marker-end=\"url(#r1)\"/><text x=\"300\" y=\"170\" font-size=\"10.5\" fill=\"#7b1fa2\">NADH・FADH₂</text><path d=\"M140 176 Q190 250 318 222\" fill=\"none\" stroke=\"#7b1fa2\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\" marker-end=\"url(#r1)\"/><text x=\"150\" y=\"236\" font-size=\"10.5\" fill=\"#7b1fa2\">NADH</text><text x=\"560\" y=\"214\" font-size=\"11\" fill=\"#555\">O₂ →</text><text x=\"560\" y=\"232\" font-size=\"11\" fill=\"#555\">→ H₂O</text><text x=\"24\" y=\"282\" font-size=\"11\" fill=\"#333\">合計：グルコース1分子あたり ATP 最大38分子</text></svg></div>\n<div class=\"cap\">図1　呼吸の3つの段階</div>\n<table class=\"t\">\n<tr><th style=\"width:17%\">段階</th><th style=\"width:22%\">場所</th><th>何が起こるか</th><th style=\"width:13%\">ATP</th></tr>\n<tr><td><b>① 解糖系</b></td><td>細胞質基質</td><td>グルコース（炭素6個）を、ピルビン酸（炭素3個）2分子に分解。<b>酸素がなくても進む</b>。</td><td>2分子</td></tr>\n<tr><td><b>② クエン酸回路</b></td><td>ミトコンドリアの<b>マトリックス</b></td><td>ピルビン酸を段階的に分解し、<b>二酸化炭素を放出</b>する。電子と水素をNADHやFADH₂に渡す。</td><td>2分子</td></tr>\n<tr><td><b>③ 電子伝達系</b></td><td>ミトコンドリアの<b>内膜</b></td><td>NADHなどが運んできた電子が内膜を流れ、最後に<b>酸素が受け取って水ができる</b>。このとき大量のATPができる。</td><td>最大34分子</td></tr>\n</table>\n<p class=\"small\">ATPの数は、グルコース1分子あたりの最大値です。数え方によって約30〜32分子とする教科書もあります。</p>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「グルコースは大きな札束。<b>解糖系</b>で少し両替（ATP 2）し、<b>クエン酸回路</b>でばらばらにして二酸化炭素として捨てながら、電子をNADHという<b>財布</b>に集める。最後に<b>電子伝達系</b>でその財布の中身を一気にATPに替える（最大34）。酸素は最後に電子を受け取る役」と、お金のたとえ（前回のATPの通貨）につなげると流れが伝わります。</div>\n\n<h3>1-2　発酵：酸素を使わないATPのつくり方</h3>\n<p>酸素がないときは、解糖系だけでATPをつくります。これを<b class=\"key\">発酵</b>といいます。解糖系でできたピルビン酸を別の物質に変えることで、NAD⁺を取り戻して解糖系を回し続けます。</p>\n<table class=\"t\">\n<tr><th style=\"width:20%\">種類</th><th style=\"width:22%\">行う生物</th><th>反応式</th><th style=\"width:10%\">ATP</th></tr>\n<tr><td><b>アルコール発酵</b></td><td>酵母</td><td>C₆H₁₂O₆ → 2C₂H₅OH（エタノール）＋ 2CO₂</td><td>2分子</td></tr>\n<tr><td><b>乳酸発酵</b></td><td>乳酸菌</td><td>C₆H₁₂O₆ → 2C₃H₆O₃（乳酸）</td><td>2分子</td></tr>\n</table>\n<p>激しい運動で酸素が足りなくなった筋肉でも、乳酸発酵と同じ反応（<b>解糖</b>）が起こります。発酵のATPが2分子しかないのは、<span class=\"em\">解糖系しか使わず、クエン酸回路と電子伝達系が動かない</span>からです。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：酵母の気体の出入りの計算</div>\n酵母は酸素があると呼吸、少ないと発酵もします。<b>酸素を吸収するのは呼吸だけ</b>なので、ここから順に考えます。<br>\n<b>例題</b>　酵母が酸素12、二酸化炭素20（分子数の相対値）を出し入れした。呼吸と発酵で使ったグルコースはそれぞれいくつか。<br>\n<b>考え方</b>　呼吸はグルコース1につき O₂ 6・CO₂ 6。O₂ 12 → 呼吸のグルコースは <b>2</b>、呼吸のCO₂も12。残りのCO₂ 20−12＝8 が発酵の分。アルコール発酵はグルコース1につき CO₂ 2 → 発酵のグルコースは <b>4</b>。</div>\n<h3>1-3　呼吸商</h3>\n<p>呼吸で放出したCO₂の量を、吸収したO₂の量で割った値を<b class=\"key\">呼吸商</b>（RQ）といいます。何を分解しているかで値がちがうので、呼吸に使われている物質を推定できます。<b>炭水化物は約1.0、タンパク質は約0.8、脂肪は約0.7</b>です。炭水化物は式から 6CO₂÷6O₂＝1.0 と確かめられます。</p>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">2. 光合成</h2>\n<h3>2-1　光合成の全体像と葉緑体</h3>\n<p><b class=\"key\">光合成</b>は、光のエネルギーを使って、二酸化炭素と水から有機物（糖）をつくるはたらきです。</p>\n<p style=\"text-align:center; font-weight:bold\">6CO₂ ＋ 12H₂O ＋ 光エネルギー → C₆H₁₂O₆ ＋ 6O₂ ＋ 6H₂O</p>\n<p>光合成は<b>葉緑体</b>で行われます。葉緑体の中には、扁平な袋状の膜<b class=\"key\">チラコイド</b>が積み重なっていて、そのまわりを<b class=\"key\">ストロマ</b>という液体が満たしています。光合成も2つの段階に分かれます。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 270\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"c1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><defs><marker id=\"c2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#2e7d4f\"/></marker></defs><ellipse cx=\"320\" cy=\"135\" rx=\"300\" ry=\"122\" fill=\"#eef7e4\" stroke=\"#4f7a28\" stroke-width=\"3\"/><text x=\"320\" y=\"30\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#4f7a28\" font-weight=\"bold\">葉緑体</text><rect x=\"84\" y=\"96\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"84\" y=\"110\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"84\" y=\"124\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"84\" y=\"138\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"84\" y=\"152\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"134\" y=\"96\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"134\" y=\"110\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"134\" y=\"124\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"134\" y=\"138\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><rect x=\"134\" y=\"152\" width=\"52\" height=\"11\" rx=\"5\" fill=\"#9ccc65\" stroke=\"#33691e\" stroke-width=\"1.2\"/><text x=\"135\" y=\"88\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"12.5\" fill=\"#33691e\">チラコイド</text><rect x=\"40\" y=\"178\" width=\"200\" height=\"66\" rx=\"8\" fill=\"#fff\" stroke=\"#33691e\" stroke-width=\"1.6\"/><text x=\"140\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\">光エネルギーを吸収</text><text x=\"140\" y=\"213\" text-anchor=\"middle\" font-size=\"10.5\">水を分解 → <tspan font-weight=\"bold\" fill=\"#1565c0\">O₂を放出</tspan></text><text x=\"140\" y=\"230\" text-anchor=\"middle\" font-size=\"10.5\"><tspan font-weight=\"bold\" fill=\"#c62828\">ATP</tspan> と <tspan font-weight=\"bold\" fill=\"#7b1fa2\">NADPH</tspan> をつくる</text><path d=\"M196 130 L330 130\" stroke=\"#555\" stroke-width=\"2\" marker-end=\"url(#c1)\"/><text x=\"262\" y=\"122\" text-anchor=\"middle\" font-size=\"10.5\">ATP・NADPH</text><circle cx=\"430\" cy=\"130\" r=\"72\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2.4\" stroke-dasharray=\"8,5\"/><text x=\"430\" y=\"118\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13.5\" fill=\"#1b5e37\">カルビン回路</text><text x=\"430\" y=\"138\" text-anchor=\"middle\" font-size=\"10.5\">CO₂を取りこんで</text><text x=\"430\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\">有機物（糖）をつくる</text><text x=\"470\" y=\"236\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"12\" fill=\"#33691e\">ストロマ</text><path d=\"M560 70 L508 100\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#c1)\"/><text x=\"566\" y=\"66\" font-size=\"11\">CO₂</text><path d=\"M500 168 L560 200\" stroke=\"#2e7d4f\" stroke-width=\"1.8\" marker-end=\"url(#c2)\"/><text x=\"566\" y=\"210\" font-size=\"11\" font-weight=\"bold\" fill=\"#1b5e37\">糖</text><path d=\"M196 158 Q260 190 360 172\" fill=\"none\" stroke=\"#9e9e9e\" stroke-width=\"1.4\" stroke-dasharray=\"4,3\" marker-end=\"url(#c1)\"/><text x=\"300\" y=\"196\" font-size=\"10\" fill=\"#757575\">ADP・NADP⁺ が戻る</text></svg></div>\n<div class=\"cap\">図2　葉緑体での光合成の流れ</div>\n<table class=\"t\">\n<tr><th style=\"width:18%\">場所</th><th>何が起こるか</th></tr>\n<tr><td><b>チラコイド</b>（膜）</td><td>光合成色素が<b>光エネルギーを吸収</b>する。<b>水が分解されて酸素が発生</b>する。電子の流れを使って<b>ATP</b>と<b>NADPH</b>をつくる。</td></tr>\n<tr><td><b>ストロマ</b></td><td><b class=\"key\">カルビン回路</b>で、チラコイドでできたATPとNADPHを使い、<b>二酸化炭素を取りこんで有機物（糖）をつくる</b>。CO₂を取りこむ酵素は<b>ルビスコ</b>（RuBisCO）。</td></tr>\n</table>\n<div class=\"box column\"><div class=\"bt\">光合成で出る酸素は、水から来る</div>\n酸素の目印（¹⁸O）を含む水を植物に与えると、発生した酸素に¹⁸Oが含まれます。一方、¹⁸Oを含む二酸化炭素を与えても、発生した酸素には含まれません。このことから、<b>光合成で発生する酸素は水に由来する</b>ことがわかりました（ルーベンの実験）。</div>\n\n<h3>2-2　光合成色素と光の色</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>チラコイドには、光を吸収する<b class=\"key\">光合成色素</b>があります。中心となるのは<b>クロロフィルa</b>で、ほかにクロロフィルb、カロテノイドなどがあります。</p>\n<p>クロロフィルは<span class=\"em\">青紫色と赤色の光をよく吸収し、緑色の光はあまり吸収しません</span>。吸収されなかった緑色の光が反射したり通りぬけたりして目に届くので、葉は緑色に見えます。光合成の速さも、青紫色と赤色の光で大きくなります。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 330 220\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"180.0\" x2=\"260\" y2=\"180.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"103.6\" x2=\"260\" y2=\"103.6\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"27.3\" x2=\"260\" y2=\"27.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"260\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"195\" text-anchor=\"middle\">400</text><text x=\"81.7\" y=\"195\" text-anchor=\"middle\">450</text><text x=\"117.3\" y=\"195\" text-anchor=\"middle\">500</text><text x=\"153.0\" y=\"195\" text-anchor=\"middle\">550</text><text x=\"188.7\" y=\"195\" text-anchor=\"middle\">600</text><text x=\"224.3\" y=\"195\" text-anchor=\"middle\">650</text><text x=\"260.0\" y=\"195\" text-anchor=\"middle\">700</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"180\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"180\" x2=\"260\" y2=\"180\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"153.0\" y=\"214\" text-anchor=\"middle\">光の波長（nm）</text><text transform=\"translate(12,96.0) rotate(-90)\" text-anchor=\"middle\">吸収・光合成の速さ</text><polyline points=\"46.0,159.3 49.6,148.2 53.1,130.9 56.7,107.3 60.3,79.7 63.8,52.8 67.4,33.0 71.0,25.7 74.5,33.0 78.1,52.8 81.7,79.7 85.2,107.3 88.8,130.9 92.4,148.2 95.9,159.3 99.5,165.5 103.1,168.6 106.6,170.0 110.2,170.6 113.8,170.8 117.3,170.8 120.9,170.8 124.5,170.8 128.0,170.8 131.6,170.8 135.2,170.8 138.7,170.8 142.3,170.8 145.9,170.8 149.4,170.8 153.0,170.8 156.6,170.8 160.1,170.8 163.7,170.8 167.3,170.8 170.8,170.8 174.4,170.8 178.0,170.8 181.5,170.8 185.1,170.8 188.7,170.8 192.2,170.8 195.8,170.8 199.4,170.8 202.9,170.8 206.5,170.7 210.1,170.3 213.6,168.5 217.2,162.8 220.8,149.2 224.3,125.4 227.9,97.1 231.5,78.1 235.0,80.4 238.6,102.5 242.2,130.9 245.7,152.7 249.3,164.5 252.9,169.1 256.4,170.5 260.0,170.8\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"93.1\" y=\"27.3\" font-weight=\"bold\" fill=\"#2e7d4f\">クロロフィルaの吸収</text><polyline points=\"46.0,121.7 49.6,109.5 53.1,96.4 56.7,83.0 60.3,70.2 63.8,59.0 67.4,50.1 71.0,44.5 74.5,42.5 78.1,44.4 81.7,50.1 85.2,58.9 88.8,70.1 92.4,82.7 95.9,95.9 99.5,108.8 103.1,120.5 106.6,130.7 110.2,139.1 113.8,145.5 117.3,149.9 120.9,152.7 124.5,153.9 128.0,153.9 131.6,153.0 135.2,151.4 138.7,149.4 142.3,147.1 145.9,145.0 149.4,143.1 153.0,141.6 156.6,140.6 160.1,140.3 163.7,140.6 167.3,141.6 170.8,143.2 174.4,145.2 178.0,147.6 181.5,150.1 185.1,152.7 188.7,155.2 192.2,157.4 195.8,159.2 199.4,160.3 202.9,160.3 206.5,158.6 210.1,154.6 213.6,147.4 217.2,136.4 220.8,121.6 224.3,103.9 227.9,85.3 231.5,68.8 235.0,57.3 238.6,53.2 242.2,57.4 245.7,69.0 249.3,85.7 252.9,104.4 256.4,122.3 260.0,137.5\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"160.1\" y=\"85.3\" font-weight=\"bold\" fill=\"#c62828\">光合成の速さ</text></svg><div style=\"display:flex; width:220px; height:8px; margin:-56px auto 44px 46px; border-radius:2px; overflow:hidden\"><div style=\"flex:1; background:#6a1b9a\"></div><div style=\"flex:1; background:#1e88e5\"></div><div style=\"flex:1; background:#43a047\"></div><div style=\"flex:1; background:#fdd835\"></div><div style=\"flex:1; background:#fb8c00\"></div><div style=\"flex:1; background:#e53935\"></div></div><div class=\"cap\">図3　光の波長と吸収・光合成</div></div></div>\n\n<h3>2-3　光合成の速さを決めるもの</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>光合成の速さは、<b>光の強さ・二酸化炭素の濃度・温度</b>に影響されます。このうち<span class=\"em\">いちばん足りないものが速さを決めてしまう</span>ので、それを<b class=\"key\">限定要因</b>といいます。</p>\n<p>光が当たっているときに測ったCO₂吸収速度は<b>見かけの光合成速度</b>で、実際の光合成速度は次の式で求めます（第4回の考察問題第4問と同じ考え方）。</p>\n<p style=\"text-align:center; font-weight:bold\">光合成速度 ＝ 見かけの光合成速度 ＋ 呼吸速度</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 330 230\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"190.0\" x2=\"260\" y2=\"190.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"194.0\" text-anchor=\"end\">-6</text><line x1=\"46\" y1=\"175.2\" x2=\"260\" y2=\"175.2\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"179.2\" text-anchor=\"end\">-4</text><line x1=\"46\" y1=\"160.3\" x2=\"260\" y2=\"160.3\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"164.3\" text-anchor=\"end\">-2</text><line x1=\"46\" y1=\"145.5\" x2=\"260\" y2=\"145.5\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"149.5\" text-anchor=\"end\">0</text><line x1=\"46\" y1=\"130.7\" x2=\"260\" y2=\"130.7\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"134.7\" text-anchor=\"end\">2</text><line x1=\"46\" y1=\"115.8\" x2=\"260\" y2=\"115.8\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"119.8\" text-anchor=\"end\">4</text><line x1=\"46\" y1=\"101.0\" x2=\"260\" y2=\"101.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"105.0\" text-anchor=\"end\">6</text><line x1=\"46\" y1=\"86.2\" x2=\"260\" y2=\"86.2\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"90.2\" text-anchor=\"end\">8</text><line x1=\"46\" y1=\"71.3\" x2=\"260\" y2=\"71.3\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"75.3\" text-anchor=\"end\">10</text><line x1=\"46\" y1=\"56.5\" x2=\"260\" y2=\"56.5\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"60.5\" text-anchor=\"end\">12</text><line x1=\"46\" y1=\"41.7\" x2=\"260\" y2=\"41.7\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"45.7\" text-anchor=\"end\">14</text><line x1=\"46\" y1=\"26.8\" x2=\"260\" y2=\"26.8\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"30.8\" text-anchor=\"end\">16</text><line x1=\"46\" y1=\"12.0\" x2=\"260\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"16.0\" text-anchor=\"end\">18</text><text x=\"46.0\" y=\"205\" text-anchor=\"middle\">0</text><text x=\"117.3\" y=\"205\" text-anchor=\"middle\">10</text><text x=\"188.7\" y=\"205\" text-anchor=\"middle\">20</text><text x=\"260.0\" y=\"205\" text-anchor=\"middle\">30</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"190\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"190\" x2=\"260\" y2=\"190\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"153.0\" y=\"224\" text-anchor=\"middle\">光の強さ（キロルクス）</text><text transform=\"translate(12,101.0) rotate(-90)\" text-anchor=\"middle\">CO₂吸収速度</text><polyline points=\"46.0,175.2 81.7,123.2 117.3,78.8 153.0,49.1 188.7,34.2 224.3,26.8 260.0,26.8\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"188.7\" y=\"19.4\" font-weight=\"bold\" fill=\"#c62828\">陽生植物</text><polyline points=\"46.0,152.9 81.7,123.2 117.3,108.4 153.0,101.0 188.7,101.0 224.3,101.0 260.0,101.0\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"188.7\" y=\"92.1\" font-weight=\"bold\" fill=\"#1565c0\">陰生植物</text></svg><div class=\"cap\">図4　光の強さとCO₂吸収速度</div></div></div>\n<ul>\n<li><b class=\"key\">補償点</b>：光合成速度と呼吸速度が等しく、見かけの光合成速度が0になる光の強さ。これより弱い光では、植物は成長できない。</li>\n<li><b class=\"key\">光飽和点</b>：それ以上光を強くしても光合成速度が上がらなくなる光の強さ。ここから先は、光以外（CO₂濃度や温度）が限定要因。</li>\n<li><b class=\"key\">陽生植物</b>（日なたの植物）は、呼吸速度が大きく、補償点・光飽和点が高い。<b class=\"key\">陰生植物</b>（日かげの植物）は、呼吸速度が小さく、補償点・光飽和点が低いので、弱い光でも成長できる。</li>\n</ul>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：グラフから光合成速度を求める</div>\n図4の陽生植物で、光の強さ10キロルクスのとき、見かけの光合成速度は9、呼吸速度は光の強さ0の値から4。光合成速度＝9＋4＝<b>13</b>。<b>「呼吸速度は光の強さ0のときの値（の絶対値）」</b>を読むのがポイントです。</div>\n\n<h2>3. 呼吸と光合成をくらべる</h2>\n<table class=\"t\">\n<tr><th style=\"width:18%\"></th><th>呼吸</th><th>光合成</th></tr>\n<tr><td>場所</td><td>細胞質基質・ミトコンドリア</td><td>葉緑体</td></tr>\n<tr><td>代謝の種類</td><td>異化（分解・エネルギーを取り出す）</td><td>同化（合成・エネルギーをたくわえる）</td></tr>\n<tr><td>使うもの</td><td>有機物・酸素</td><td>二酸化炭素・水・光エネルギー</td></tr>\n<tr><td>できるもの</td><td>二酸化炭素・水・ATP</td><td>有機物・酸素</td></tr>\n<tr><td>電子の運び役</td><td>NADH・FADH₂</td><td>NADPH</td></tr>\n<tr><td>行う生物</td><td>ほぼすべての生物</td><td>植物・藻類・シアノバクテリアなど</td></tr>\n</table>\n<p>どちらも<b>膜の上で電子が流れ、それを使ってATP合成酵素がATPをつくる</b>点はよく似ています。植物は光合成と呼吸の両方を行っています。</p>\n<div class=\"box column\"><div class=\"bt\">コラム：光を使わずに有機物をつくる細菌</div>\n亜硝酸菌や硝酸菌などは、アンモニウムイオンや亜硝酸イオンなどの無機物を酸化するときに出るエネルギーを使って、二酸化炭素から有機物をつくります。これを<b>化学合成</b>といいます。</div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>呼吸：C₆H₁₂O₆＋6O₂＋6H₂O → 6CO₂＋12H₂O。ATP 最大38分子</li>\n<li>解糖系（細胞質基質、ATP 2、酸素なしでも進む）→ クエン酸回路（マトリックス、CO₂放出、ATP 2）→ 電子伝達系（内膜、O₂→H₂O、ATP 最大34）</li>\n<li>NAD⁺・FAD（補酵素）が電子と水素を電子伝達系へ運ぶ</li>\n<li>発酵は解糖系だけ（ATP 2）。アルコール発酵（酵母、エタノール＋CO₂）、乳酸発酵（乳酸菌、乳酸）</li>\n<li>酵母の計算は「O₂を吸収するのは呼吸だけ」から始める</li>\n<li>呼吸商＝放出CO₂÷吸収O₂。炭水化物1.0、タンパク質0.8、脂肪0.7</li>\n<li>光合成：6CO₂＋12H₂O → C₆H₁₂O₆＋6O₂＋6H₂O。葉緑体で行う</li>\n<li>チラコイド：光を吸収、水を分解してO₂発生、ATPとNADPHをつくる</li>\n<li>ストロマ：カルビン回路でCO₂を取りこみ糖をつくる（ルビスコ）</li>\n<li>クロロフィルは青紫と赤をよく吸収、緑はあまり吸収しない</li>\n<li>光合成速度＝見かけの光合成速度＋呼吸速度。補償点・光飽和点。陰生植物は補償点が低い</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>呼吸の3つの段階について、行われる場所と、グルコース1分子あたりにできるATPの数（最大）を答えよ。<br>\n解糖系：場所 <span class=\"blank\" style=\"min-width:28mm\"></span> ATP <span class=\"blank\" style=\"min-width:12mm\"></span><br>\nクエン酸回路：場所 <span class=\"blank\" style=\"min-width:28mm\"></span> ATP <span class=\"blank\" style=\"min-width:12mm\"></span><br>\n電子伝達系：場所 <span class=\"blank\" style=\"min-width:28mm\"></span> ATP <span class=\"blank\" style=\"min-width:12mm\"></span></li>\n<li>呼吸で、二酸化炭素が発生する段階と、酸素が使われる段階をそれぞれ答えよ。<br>CO₂が発生 <span class=\"blank\"></span>　O₂が使われる <span class=\"blank\"></span></li>\n<li>発酵で得られるATPが、呼吸よりずっと少ない理由を答えよ。<div class=\"wline\"></div></li>\n<li>酵母が、酸素を18、二酸化炭素を30（分子数の相対値）出し入れした。呼吸と発酵（アルコール発酵）で使ったグルコースはそれぞれいくつか。<br>呼吸 <span class=\"blank\" style=\"min-width:14mm\"></span>　発酵 <span class=\"blank\" style=\"min-width:14mm\"></span></li>\n<li>呼吸商が約0.7のとき、呼吸に主に使われている物質は何か。 <span class=\"blank\"></span></li>\n<li>光合成について、次の場所で行われることを1つずつ答えよ。<br>チラコイド <span class=\"blank\" style=\"min-width:60mm\"></span><br>ストロマ <span class=\"blank\" style=\"min-width:60mm\"></span></li>\n<li>光合成で発生する酸素は、二酸化炭素と水のどちらに由来するか。 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li>葉が緑色に見える理由を、クロロフィルの性質から説明せよ。<div class=\"wline\"></div></li>\n<li>ある植物で、光の強さ0のときCO₂吸収速度が−3、光の強さ20キロルクスのとき＋11だった。20キロルクスでの光合成速度はいくつか。また、補償点とは何か。<br>光合成速度 <span class=\"blank\" style=\"min-width:14mm\"></span>　補償点：<div class=\"wline\"></div></li>\n<li><b>説明の練習</b>　呼吸と光合成のちがいを、「使うもの」「できるもの」に注目して、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　解糖系：細胞質基質・2　クエン酸回路：ミトコンドリアのマトリックス・2　電子伝達系：ミトコンドリアの内膜・最大34</b></p>\n<p><b>2.　CO₂が発生：クエン酸回路（ピルビン酸の分解を含む）　O₂が使われる：電子伝達系</b>　酸素は電子伝達系の最後で電子を受け取り、水になる。</p>\n<p><b>3.　解答例</b>　発酵は解糖系だけでATPをつくり、クエン酸回路と電子伝達系がはたらかないから。</p>\n<p><b>4.　呼吸 3、発酵 6</b>　O₂を吸収するのは呼吸だけ。O₂ 18 ÷ 6 ＝ 3（呼吸のグルコース）。呼吸のCO₂も18なので、発酵のCO₂は 30−18＝12。12 ÷ 2 ＝ 6（発酵のグルコース）。</p>\n<p><b>5.　脂肪</b>　炭水化物は約1.0、タンパク質は約0.8。</p>\n<p><b>6.　チラコイド：光エネルギーの吸収／水の分解と酸素の発生／ATPとNADPHの合成 などから1つ　ストロマ：カルビン回路でCO₂を取りこみ有機物（糖）をつくる</b></p>\n<p><b>7.　水</b>　¹⁸Oを含む水を与えると、発生する酸素に¹⁸Oが含まれる。</p>\n<p><b>8.　解答例</b>　クロロフィルは青紫色と赤色の光をよく吸収するが、緑色の光はあまり吸収せず、反射したり通りぬけたりするので、その緑色の光が目に届くから。</p>\n<p><b>9.　光合成速度：14</b>（見かけ11＋呼吸3）　<b>補償点：</b>光合成速度と呼吸速度が等しく、見かけの光合成速度が0になる光の強さ。</p>\n<p><b>10.　解答例</b>　呼吸は、有機物（糖）と酸素を使って、二酸化炭素と水に分解し、そのとき出るエネルギーでATPをつくるはたらきです。光合成は、光のエネルギーを使って、二酸化炭素と水から有機物をつくり、酸素を出すはたらきです。使うものとできるものが、ちょうど逆の関係になっています。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第6回 遺伝のしくみ）に向けて</div>\n第6回からは「情報の話」に戻り、親から子へ遺伝子がどう伝わるかを学びます。第1回の<b>染色体</b>と<b>DNAの複製・細胞周期</b>が土台です。考察問題の第4問（光の強さと光合成）は、この回の2-3を読めば解説できます。</div>\n</details>", "heads": ["0. 前回のふり返り", "1. 呼吸", "2. 光合成", "3. 呼吸と光合成をくらべる", "この回のまとめ", "確認問題"]}, "6": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第6回　遺伝のしくみ</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>相同染色体と減数分裂の流れを説明でき、DNA量の変化のグラフを読める</li>\n<li>遺伝子型・表現型・顕性・潜性などの用語を正しく使える</li>\n<li>分離の法則・独立の法則から、子の分離比（3：1、9：3：3：1）を求められる</li>\n<li>連鎖と組換えを説明でき、組換え価を計算して染色体地図をかける</li>\n</ul></div>\n\n<h2>0. ここから再び「情報の話」</h2>\n<p>第1回で、ヒトの体の細胞には<b>46本の染色体</b>があり、細胞分裂の前に<b>DNAを複製</b>することを学びました。この回は、親の遺伝子が子にどう伝わるかを学びます。カギは、精子や卵（<b>配偶子</b>）をつくるときの特別な細胞分裂、<b>減数分裂</b>です。</p>\n\n<h2>1. 相同染色体と減数分裂</h2>\n<h3>1-1　相同染色体</h3>\n<p>ヒトの46本の染色体は、形と大きさが同じものが2本ずつ、23組あります。この対になる染色体を<b class=\"key\">相同染色体</b>といい、1本は父親から、もう1本は母親から受けついだものです。相同染色体の同じ位置には、同じ形質にかかわる遺伝子があります。染色体の組の数を n で表すと、体の細胞は <b>2n</b>（ヒトは 2n＝46）、配偶子は <b>n</b>（ヒトは n＝23）です。</p>\n\n<h3>1-2　減数分裂</h3>\n<p>配偶子をつくるときは、<b class=\"key\">減数分裂</b>という、2回続けて起こる分裂で、染色体の数を半分（2n → n）にします。こうしておけば、受精して2つの配偶子が合体したときに、もとの 2n に戻ります。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 660 250\" width=\"610\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"m1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><circle cx=\"60\" cy=\"110\" r=\"46\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"37.5\" y=\"78\" width=\"9\" height=\"50\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"53.5\" y=\"82\" width=\"9\" height=\"50\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"71.5\" y=\"106\" width=\"9\" height=\"28\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"85.5\" y=\"104\" width=\"9\" height=\"28\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"60\" y=\"180\" text-anchor=\"middle\" font-weight=\"bold\">母細胞</text><text x=\"60\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\">2n＝4</text><path d=\"M110 110 L134 110\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/><text x=\"122\" y=\"100\" text-anchor=\"middle\" font-size=\"9.5\">複製</text><circle cx=\"196\" cy=\"110\" r=\"52\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"168.0\" y=\"74\" width=\"9\" height=\"54\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"179.0\" y=\"74\" width=\"9\" height=\"54\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"178\" cy=\"95.6\" r=\"3.2\" fill=\"#333\"/><rect x=\"190.0\" y=\"74\" width=\"9\" height=\"54\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"201.0\" y=\"74\" width=\"9\" height=\"54\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"200\" cy=\"95.6\" r=\"3.2\" fill=\"#333\"/><rect x=\"168.0\" y=\"136\" width=\"9\" height=\"30\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"179.0\" y=\"136\" width=\"9\" height=\"30\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"178\" cy=\"148.0\" r=\"3.2\" fill=\"#333\"/><rect x=\"190.0\" y=\"136\" width=\"9\" height=\"30\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"201.0\" y=\"136\" width=\"9\" height=\"30\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"200\" cy=\"148.0\" r=\"3.2\" fill=\"#333\"/><text x=\"196\" y=\"182\" text-anchor=\"middle\" font-weight=\"bold\">対合</text><text x=\"196\" y=\"198\" text-anchor=\"middle\" font-size=\"10.5\">二価染色体</text><text x=\"196\" y=\"214\" text-anchor=\"middle\" font-size=\"10.5\">（ここで乗換え）</text><path d=\"M252 110 L276 110\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/><text x=\"264\" y=\"100\" text-anchor=\"middle\" font-size=\"9.5\">第一</text><circle cx=\"326\" cy=\"70\" r=\"36\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"306.0\" y=\"44\" width=\"9\" height=\"40\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"317.0\" y=\"44\" width=\"9\" height=\"40\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"316\" cy=\"60.0\" r=\"3.2\" fill=\"#333\"/><rect x=\"328.0\" y=\"58\" width=\"9\" height=\"22\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"339.0\" y=\"58\" width=\"9\" height=\"22\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"338\" cy=\"66.8\" r=\"3.2\" fill=\"#333\"/><circle cx=\"326\" cy=\"150\" r=\"36\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"306.0\" y=\"124\" width=\"9\" height=\"40\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"317.0\" y=\"124\" width=\"9\" height=\"40\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"316\" cy=\"140.0\" r=\"3.2\" fill=\"#333\"/><rect x=\"328.0\" y=\"138\" width=\"9\" height=\"22\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"339.0\" y=\"138\" width=\"9\" height=\"22\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"338\" cy=\"146.8\" r=\"3.2\" fill=\"#333\"/><text x=\"326\" y=\"210\" text-anchor=\"middle\" font-weight=\"bold\">第一分裂</text><text x=\"326\" y=\"226\" text-anchor=\"middle\" font-size=\"10.5\">相同染色体が分かれる（n＝2）</text><path d=\"M366 110 L390 110\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/><text x=\"378\" y=\"100\" text-anchor=\"middle\" font-size=\"9.5\">第二</text><circle cx=\"440\" cy=\"66\" r=\"28\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"428.5\" y=\"48\" width=\"9\" height=\"36\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"443.5\" y=\"62\" width=\"9\" height=\"20\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"440\" cy=\"132\" r=\"28\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"428.5\" y=\"114\" width=\"9\" height=\"36\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"443.5\" y=\"128\" width=\"9\" height=\"20\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"520\" cy=\"66\" r=\"28\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"508.5\" y=\"48\" width=\"9\" height=\"36\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"523.5\" y=\"62\" width=\"9\" height=\"20\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><circle cx=\"520\" cy=\"132\" r=\"28\" fill=\"#fafafa\" stroke=\"#888\" stroke-width=\"1.4\"/><rect x=\"508.5\" y=\"114\" width=\"9\" height=\"36\" rx=\"4.5\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1\"/><rect x=\"523.5\" y=\"128\" width=\"9\" height=\"20\" rx=\"4.5\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"480\" y=\"186\" text-anchor=\"middle\" font-weight=\"bold\">第二分裂</text><text x=\"480\" y=\"202\" text-anchor=\"middle\" font-size=\"10.5\">染色体が縦に分かれる</text><text x=\"480\" y=\"218\" text-anchor=\"middle\" font-size=\"10.5\">→ 4個の細胞（n＝2）</text><text x=\"572\" y=\"60\" font-size=\"10.5\" fill=\"#c62828\">赤：父親由来</text><text x=\"572\" y=\"76\" font-size=\"10.5\" fill=\"#1565c0\">青：母親由来</text></svg></div>\n<div class=\"cap\">図1　減数分裂の流れ（2n＝4 の例）</div>\n<ol>\n<li><b>第一分裂</b>：相同染色体どうしが並んでくっつく（<b class=\"key\">対合</b>）。対合した2本を<b>二価染色体</b>という。このとき染色体の一部が入れかわる<b class=\"key\">乗換え</b>が起こることがある。その後、<span class=\"em\">相同染色体が別々の細胞に分かれる</span>ので、染色体の数が半分（n）になる。</li>\n<li><b>第二分裂</b>：体細胞分裂と同じように、複製された染色体が縦に分かれる。結果として、<b>1個の母細胞から4個の細胞（n）</b>ができる。</li>\n</ol>\n<div class=\"side\"><div class=\"txt\">\n<p>DNA量で見ると、S期で2倍になったあと、第一分裂と第二分裂で2回半分になるので、<b>配偶子のDNA量は母細胞（G₁期）の半分</b>になります。</p>\n<table class=\"t\">\n<tr><th></th><th>体細胞分裂</th><th>減数分裂</th></tr>\n<tr><td>分裂の回数</td><td>1回</td><td>2回</td></tr>\n<tr><td>できる細胞</td><td>2個（2n）</td><td>4個（n）</td></tr>\n<tr><td>対合</td><td>起こらない</td><td>起こる</td></tr>\n<tr><td>目的</td><td>体をつくる・ふやす</td><td>配偶子をつくる</td></tr>\n</table>\n</div><div class=\"g\"><svg viewBox=\"0 0 520 230\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><rect x=\"64.0\" y=\"30\" width=\"70.0\" height=\"140\" fill=\"#f4f4f4\"/><text x=\"99.0\" y=\"188\" text-anchor=\"middle\" font-size=\"10.5\">G₁期</text><rect x=\"134.0\" y=\"30\" width=\"70.0\" height=\"140\" fill=\"#fff3cd\"/><text x=\"169.0\" y=\"188\" text-anchor=\"middle\" font-size=\"10.5\">S期</text><rect x=\"204.0\" y=\"30\" width=\"35.0\" height=\"140\" fill=\"#f4f4f4\"/><text x=\"221.5\" y=\"188\" text-anchor=\"middle\" font-size=\"10.5\">G₂期</text><rect x=\"239.0\" y=\"30\" width=\"52.5\" height=\"140\" fill=\"#e3efe7\"/><text x=\"265.25\" y=\"188\" text-anchor=\"middle\" font-size=\"10.5\">第一分裂</text><rect x=\"291.5\" y=\"30\" width=\"78.75\" height=\"140\" fill=\"#e3f0fb\"/><text x=\"330.875\" y=\"188\" text-anchor=\"middle\" font-size=\"10.5\">第二分裂</text><line x1=\"64.0\" y1=\"170\" x2=\"466.5\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.3\"/><line x1=\"64.0\" y1=\"22\" x2=\"64.0\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"56.0\" y=\"142\" text-anchor=\"end\">1</text><text x=\"56.0\" y=\"110\" text-anchor=\"end\">2</text><text x=\"56.0\" y=\"46\" text-anchor=\"end\">4</text><text transform=\"translate(20,100) rotate(-90)\" text-anchor=\"middle\" font-size=\"10.5\">細胞1個あたりのDNA量</text><polyline points=\"64.0,106 134.0,106 204.0,42 291.5,42 291.5,106 370.2,106 370.2,138 466.5,138\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.6\"/><text x=\"462.5\" y=\"130\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#c62828\">配偶子（n）</text><text x=\"466.5\" y=\"208\" text-anchor=\"end\" font-size=\"10.5\">時間 →</text></svg><div class=\"cap\">図2　減数分裂でのDNA量の変化</div></div></div>\n<div class=\"box column\"><div class=\"bt\">兄弟姉妹がそれぞれちがう理由</div>\n第一分裂で、相同染色体のどちらがどの細胞に行くかは組ごとにばらばらです。n組あれば配偶子の組み合わせは 2ⁿ 通りで、ヒトでは 2²³＝約840万通りになります。さらに乗換えや受精の組み合わせも加わるので、同じ両親から生まれても、兄弟姉妹の遺伝子の組み合わせはそれぞれちがいます。</div>\n\n<h2>2. 遺伝の法則</h2>\n<h3>2-1　遺伝の用語</h3>\n<table class=\"t\">\n<tr><th style=\"width:22%\">用語</th><th>意味（エンドウの種子の形の例）</th></tr>\n<tr><td><b>対立遺伝子</b></td><td>相同染色体の同じ位置にある、形質を決める遺伝子どうし。丸にする遺伝子 A と、しわにする遺伝子 a。</td></tr>\n<tr><td><b>遺伝子型</b></td><td>遺伝子の組み合わせを記号で表したもの。AA、Aa、aa。</td></tr>\n<tr><td><b>表現型</b></td><td>実際に現れる形質。［丸］、［しわ］。表現型は［ ］で書くことが多い。</td></tr>\n<tr><td><b>ホモ接合体／ヘテロ接合体</b></td><td>同じ遺伝子の組み合わせ（AA、aa）がホモ、ちがう組み合わせ（Aa）がヘテロ。</td></tr>\n<tr><td><b>顕性／潜性</b></td><td>ヘテロ接合体（Aa）で現れる形質が<b>顕性</b>（A：丸）、現れない形質が<b>潜性</b>（a：しわ）。以前は優性・劣性とよばれていた。顕性の遺伝子を大文字で書く。</td></tr>\n</table>\n\n<h3>2-2　分離の法則（一遺伝子雑種）</h3>\n<p>メンデルは、純系の丸（AA）としわ（aa）をかけ合わせました。子（F₁）はすべて Aa で［丸］になります。F₁どうしをかけ合わせると、孫（F₂）は次のようになります。</p>\n<div class=\"side\"><div class=\"txt\">\n<p>Aa の親は、減数分裂で <b>A と a を1：1</b> の割合で配偶子に分けます。これを<b class=\"key\">分離の法則</b>といいます。</p>\n<p>右の表から、F₂の遺伝子型は <b>AA：Aa：aa＝1：2：1</b>、表現型は <span class=\"em\">［丸］：［しわ］＝3：1</span> になります。</p>\n</div><div class=\"g\"><table class='t' style='width:auto; margin:2mm auto'><tr><th class='c'>♂＼♀</th><th class='c'>A</th><th class='c'>a</th></tr><tr><th class='c'>A</th><td class='c'>AA</td><td class='c'>Aa</td></tr><tr><th class='c'>a</th><td class='c'>Aa</td><td class='c'>aa</td></tr></table><div class=\"cap\">表1　Aa × Aa</div></div></div>\n\n<h3>2-3　独立の法則（二遺伝子雑種）</h3>\n<p>種子の形（A：丸、a：しわ）と子葉の色（B：黄、b：緑）のように、<b>別々の染色体</b>にある2組の遺伝子は、たがいに関係なく配偶子に入ります。これを<b class=\"key\">独立の法則</b>といいます。AaBb がつくる配偶子は <b>AB：Ab：aB：ab＝1：1：1：1</b> です。</p>\n<table class='t' style='width:auto; margin:2mm auto'><tr><th class='c'>♂＼♀</th><th class='c'>AB</th><th class='c'>Ab</th><th class='c'>aB</th><th class='c'>ab</th></tr><tr><th class='c'>AB</th><td class='c'>AABB</td><td class='c'>AABb</td><td class='c'>AaBB</td><td class='c'>AaBb</td></tr><tr><th class='c'>Ab</th><td class='c'>AABb</td><td class='c'>AAbb</td><td class='c'>AaBb</td><td class='c'>Aabb</td></tr><tr><th class='c'>aB</th><td class='c'>AaBB</td><td class='c'>AaBb</td><td class='c'>aaBB</td><td class='c'>aaBb</td></tr><tr><th class='c'>ab</th><td class='c'>AaBb</td><td class='c'>Aabb</td><td class='c'>aaBb</td><td class='c'>aabb</td></tr></table>\n<div class=\"cap\">表2　AaBb × AaBb（F₂）</div>\n<p>表を数えると、表現型は <span class=\"em\">［AB］：［Ab］：［aB］：［ab］＝9：3：3：1</span> です。2組の遺伝子をそれぞれ 3：1 として、(3：1)×(3：1) と掛け算しても求められます。</p>\n\n<h3>2-4　検定交雑</h3>\n<p>ある個体の遺伝子型を調べるために、<b>潜性ホモ接合体（aa や aabb）とかけ合わせる</b>ことを<b class=\"key\">検定交雑</b>といいます。潜性ホモ接合体の配偶子は ab だけで、子の表現型に影響しないので、<span class=\"em\">子の表現型の比が、そのまま調べたい個体の配偶子の比になります</span>。</p>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n遺伝の計算は「<b>まず配偶子の比を書く → 表をつくる（または掛け算）</b>」の2ステップだけ、と伝えます。いきなり子の比を出そうとするとまちがえます。検定交雑は「相手が何も色をつけない白い紙（aabb）なので、配偶子の比がそのまま子に写る」とたとえると覚えやすいです。</div>\n\n<h2>3. 連鎖と組換え</h2>\n<h3>3-1　連鎖</h3>\n<p>同じ染色体にある遺伝子どうしは、いっしょに配偶子に入ります。これを<b class=\"key\">連鎖</b>といいます。たとえば A と B、a と b がそれぞれ同じ染色体にある AaBb は、組換えが起こらなければ配偶子は <b>AB と ab だけ（1：1）</b>になり、独立の法則は成り立ちません。</p>\n<h3>3-2　組換えと組換え価</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 200\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"l1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><rect x=\"60\" y=\"40\" width=\"22\" height=\"120\" rx=\"11\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"71\" y=\"74\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">A</text><text x=\"71\" y=\"136\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">B</text><rect x=\"100\" y=\"40\" width=\"22\" height=\"120\" rx=\"11\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"111\" y=\"74\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">a</text><text x=\"111\" y=\"136\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">b</text><path d=\"M82 92 L100 76 M82 76 L100 92\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"91\" y=\"186\" text-anchor=\"middle\" font-size=\"11\">乗換えが起こる</text><text x=\"91\" y=\"26\" text-anchor=\"middle\" font-size=\"11\">AとB、aとbが同じ染色体上</text><path d=\"M150 100 L200 100\" stroke=\"#555\" stroke-width=\"2\" marker-end=\"url(#l1)\"/><rect x=\"230\" y=\"40\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1.2\"/><rect x=\"230\" y=\"100\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"241\" y=\"74\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">A</text><text x=\"241\" y=\"136\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">B</text><text x=\"241\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\" font-weight=\"normal\">もとのまま</text><rect x=\"330\" y=\"40\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1.2\"/><rect x=\"330\" y=\"100\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"341\" y=\"74\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">a</text><text x=\"341\" y=\"136\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">b</text><text x=\"341\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\" font-weight=\"normal\">もとのまま</text><rect x=\"430\" y=\"40\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1.2\"/><rect x=\"430\" y=\"100\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"441\" y=\"74\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">A</text><text x=\"441\" y=\"136\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">b</text><text x=\"441\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">組換え</text><rect x=\"530\" y=\"40\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#90caf9\" stroke=\"#333\" stroke-width=\"1.2\"/><rect x=\"530\" y=\"100\" width=\"22\" height=\"60\" rx=\"11\" fill=\"#ef9a9a\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"541\" y=\"74\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">a</text><text x=\"541\" y=\"136\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">B</text><text x=\"541\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">組換え</text><text x=\"430\" y=\"26\" text-anchor=\"middle\" font-size=\"11\">できる配偶子</text></svg></div>\n<div class=\"cap\">図3　連鎖と組換え</div>\n<p>減数分裂で<b>乗換え</b>が起こると、Ab や aB という新しい組み合わせの配偶子もできます。これを<b class=\"key\">組換え</b>といい、全配偶子のうち組換えでできた配偶子の割合を<b class=\"key\">組換え価</b>といいます。</p>\n<p style=\"text-align:center; font-weight:bold\">組換え価（%）＝ 組換えでできた配偶子の数 ÷ 全配偶子の数 × 100</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：検定交雑から組換え価を求める</div>\n<b>例題</b>　AaBb（AとBが連鎖）を aabb と検定交雑すると、子の表現型が［AB］40、［Ab］10、［aB］10、［ab］40 だった。組換え価は何%か。<br>\n<b>考え方</b>　検定交雑なので子の比＝配偶子の比。数の多い AB・ab がもとの組み合わせ、少ない Ab・aB が組換え。(10＋10) ÷ (40＋10＋10＋40) × 100 ＝ <b>20%</b>。<br>\n<b>ポイント</b>　<b>少ないほうの2つが組換え</b>。組換え価は50%をこえない。</div>\n<h3>3-3　染色体地図</h3>\n<p>2つの遺伝子が染色体上で<b>離れているほど、その間で乗換えが起こりやすく、組換え価が大きく</b>なります。そこで組換え価を遺伝子間の距離とみなして、遺伝子の並び順を決めたものを<b class=\"key\">染色体地図</b>（遺伝子地図）といいます。モーガンはショウジョウバエでこの方法を確立しました。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 520 90\" width=\"440\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><rect x=\"30\" y=\"38\" width=\"460\" height=\"16\" rx=\"8\" fill=\"#e3efe7\" stroke=\"#2e7d4f\" stroke-width=\"1.4\"/><line x1=\"80\" y1=\"32\" x2=\"80\" y2=\"60\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"80\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">A</text><line x1=\"380\" y1=\"32\" x2=\"380\" y2=\"60\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"380\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">B</text><line x1=\"460\" y1=\"32\" x2=\"460\" y2=\"60\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"460\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">C</text><text x=\"230\" y=\"78\" text-anchor=\"middle\" font-size=\"11\">10%（距離10）</text><text x=\"420\" y=\"78\" text-anchor=\"middle\" font-size=\"11\">3%</text></svg></div>\n<div class=\"cap\">図4　A–B 10%、B–C 3%、A–C 13% のときの並び順（A–B–C）</div>\n<p>3つの遺伝子の組換え価が A–B 10%、B–C 3%、A–C 13% なら、いちばん大きい A–C が両はしで、<b>A–B–C</b> の順に並んでいるとわかります（10＋3＝13）。</p>\n\n<h2>4. 性染色体と伴性遺伝</h2>\n<p>ヒトの23組の染色体のうち、男女で組み合わせがちがう1組を<b class=\"key\">性染色体</b>といい、女性は <b>XX</b>、男性は <b>XY</b> です。ショウジョウバエも同じ XY 型です。X染色体にある遺伝子による遺伝を<b class=\"key\">伴性遺伝</b>といいます。</p>\n<p>ショウジョウバエの眼の色は、X染色体上の遺伝子で決まり、赤眼（W）が顕性、白眼（w）が潜性です。白眼の雌（X<sup>w</sup>X<sup>w</sup>）と赤眼の雄（X<sup>W</sup>Y）をかけ合わせると、子は<b>雌がすべて赤眼（X<sup>W</sup>X<sup>w</sup>）、雄がすべて白眼（X<sup>w</sup>Y）</b>になります。<span class=\"em\">雄はX染色体を1本しかもたないので、潜性の形質が現れやすい</span>のが伴性遺伝の特徴です。</p>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>相同染色体：形と大きさが同じ1対（父親由来と母親由来）。体細胞 2n、配偶子 n</li>\n<li>減数分裂：第一分裂で対合（二価染色体・乗換え）し相同染色体が分かれる。第二分裂で縦に分かれる。4個の細胞（n）</li>\n<li>DNA量：2 →（S期）4 →（第一分裂）2 →（第二分裂）1</li>\n<li>配偶子の組み合わせは 2ⁿ 通り（ヒト 2²³＝約840万）</li>\n<li>対立遺伝子・遺伝子型・表現型・ホモ／ヘテロ・顕性／潜性</li>\n<li>分離の法則：Aa は A と a を1：1で配偶子に。Aa×Aa → 3：1（遺伝子型 1：2：1）</li>\n<li>独立の法則：別の染色体の遺伝子は独立に配偶子へ。AaBb×AaBb → 9：3：3：1</li>\n<li>検定交雑：潜性ホモ接合体とかけ合わせ、子の比＝配偶子の比</li>\n<li>連鎖：同じ染色体上の遺伝子はいっしょに配偶子へ。乗換えで組換えが起こる</li>\n<li>組換え価＝組換えた配偶子÷全配偶子×100（少ないほうの2つが組換え）</li>\n<li>組換え価が大きいほど遺伝子間の距離が遠い → 染色体地図</li>\n<li>伴性遺伝：X染色体上の遺伝子。雄（XY）は潜性の形質が現れやすい</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>ヒトの体の細胞（2n＝46）が減数分裂してできる細胞について答えよ。<br>(1) 染色体の数 <span class=\"blank\" style=\"min-width:14mm\"></span>本　(2) 1個の母細胞からできる細胞の数 <span class=\"blank\" style=\"min-width:14mm\"></span>個</li>\n<li>減数分裂の第一分裂で、相同染色体どうしが並んでくっつくことを何というか。また、そのとき染色体の一部が入れかわることを何というか。<br><span class=\"blank\"></span>・<span class=\"blank\"></span></li>\n<li>G₁期の母細胞のDNA量を2とすると、減数分裂の第二分裂が終わった細胞のDNA量はいくつか。 <span class=\"blank\" style=\"min-width:14mm\"></span></li>\n<li>2n＝6 の生物がつくる配偶子の染色体の組み合わせは、乗換えを考えなければ何通りか。 <span class=\"blank\" style=\"min-width:14mm\"></span>通り</li>\n<li>エンドウの丸（A）はしわ（a）に対して顕性である。Aa どうしをかけ合わせたとき、子の遺伝子型の比と表現型の比を答えよ。<br>遺伝子型 AA：Aa：aa＝<span class=\"blank\" style=\"min-width:24mm\"></span>　表現型［丸］：［しわ］＝<span class=\"blank\" style=\"min-width:18mm\"></span></li>\n<li>AaBb（2組の遺伝子は別々の染色体にある）を aabb とかけ合わせた。子の表現型［AB］：［Ab］：［aB］：［ab］の比を答えよ。 <span class=\"blank\" style=\"min-width:30mm\"></span></li>\n<li>AaBb（AとBが連鎖）を aabb と検定交雑したところ、子が［AB］92、［Ab］8、［aB］12、［ab］88 だった。組換え価は何%か。 <span class=\"blank\" style=\"min-width:14mm\"></span>%</li>\n<li>遺伝子X–Y間の組換え価が8%、Y–Z間が5%、X–Z間が3%だった。3つの遺伝子の並び順を答えよ。 <span class=\"blank\" style=\"min-width:30mm\"></span></li>\n<li>ショウジョウバエの白眼の雌（X<sup>w</sup>X<sup>w</sup>）と赤眼の雄（X<sup>W</sup>Y）をかけ合わせた。子の雌と雄の眼の色をそれぞれ答えよ。<br>雌 <span class=\"blank\" style=\"min-width:20mm\"></span>　雄 <span class=\"blank\" style=\"min-width:20mm\"></span></li>\n<li><b>説明の練習</b>　「検定交雑」とは何をすることで、何がわかるのかを、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　(1) 23本　(2) 4個</b>　2n＝46 が n＝23 になる。分裂を2回するので4個。</p>\n<p><b>2.　対合・乗換え</b>　対合した2本の相同染色体を二価染色体という。</p>\n<p><b>3.　1</b>　2 →（S期）4 →（第一分裂）2 →（第二分裂）1。</p>\n<p><b>4.　8通り</b>　n＝3 なので 2³＝8。</p>\n<p><b>5.　遺伝子型 1：2：1　表現型 3：1</b>　AA と Aa はどちらも［丸］。</p>\n<p><b>6.　1：1：1：1</b>　検定交雑なので、AaBb の配偶子の比（AB：Ab：aB：ab＝1：1：1：1）がそのまま子の比になる。</p>\n<p><b>7.　10%</b>　少ない［Ab］8と［aB］12が組換え。(8＋12) ÷ (92＋8＋12＋88) × 100 ＝ 20 ÷ 200 × 100 ＝ 10。</p>\n<p><b>8.　X–Z–Y（Y–Z–X でもよい）</b>　いちばん大きいX–Y（8%）が両はし。X–Z（3%）＋ Z–Y（5%）＝ 8% なので、Zがまん中。</p>\n<p><b>9.　雌：赤眼　雄：白眼</b>　雌は父から X<sup>W</sup>、母から X<sup>w</sup> を受けついで X<sup>W</sup>X<sup>w</sup>（赤眼）。雄は母から X<sup>w</sup>、父から Y を受けついで X<sup>w</sup>Y（白眼）。</p>\n<p><b>10.　解答例</b>　調べたい個体を、潜性ホモ接合体（aa や aabb）とかけ合わせることです。潜性ホモ接合体の配偶子は子の表現型に影響しないので、生まれた子の表現型の比が、そのまま調べたい個体がつくった配偶子の比になります。そこから、その個体の遺伝子型や組換え価がわかります。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第7回 発生とバイオテクノロジー）に向けて</div>\n第7回では、受精卵から体ができていくしくみと、遺伝子を扱う技術を学びます。第3回の<b>遺伝子の発現調節</b>と、この回の<b>減数分裂・受精</b>が土台になります。</div>\n</details>", "heads": ["0. ここから再び「情報の話」", "1. 相同染色体と減数分裂", "2. 遺伝の法則", "3. 連鎖と組換え", "4. 性染色体と伴性遺伝", "この回のまとめ", "確認問題"]}, "7": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第7回　発生とバイオテクノロジー</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>受精卵から幼生になるまでの流れ（卵割・胞胚・原腸胚・神経胚）と、三胚葉からできる器官を言える</li>\n<li>誘導と形成体のはたらきを、移植実験とあわせて説明できる</li>\n<li>核移植やiPS細胞から「分化した細胞も全部の遺伝子をもつ」ことを説明できる</li>\n<li>遺伝子組換え・PCR法・電気泳動のしくみを説明でき、計算ができる</li>\n</ul></div>\n\n<h2>0. これまでとのつながり</h2>\n<p>第6回で、減数分裂でできた配偶子が受精すると、もとの 2n に戻ることを学びました。この回は、その<b>受精卵が分裂をくり返して、体ができあがっていくしくみ</b>（発生）を学びます。カギになるのは、第3回の<b>遺伝子の発現調節</b>です。体のどの場所の細胞も同じ遺伝子をもっていて、<span class=\"em\">場所と時期によって発現する遺伝子が変わる</span>ことで、ちがう細胞に分化していきます。後半では、遺伝子を人の手で扱う技術（バイオテクノロジー）を学びます。</p>\n\n<h2>1. 受精と初期発生</h2>\n<h3>1-1　受精</h3>\n<p>精子が卵に到達すると、精子と卵の細胞膜が融合し、精子の核が卵に入ります。このとき卵の表面には<b class=\"key\">受精膜</b>ができ、ほかの精子が入れなくなります（<b>多精拒否</b>）。精子の核と卵の核が合体して、<b>受精卵（2n）</b>になります。</p>\n<h3>1-2　卵割から幼生まで（カエルの例）</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 660 300\" width=\"610\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><defs><marker id=\"e1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><circle cx=\"50\" cy=\"70\" r=\"30\" fill=\"#fff3e0\" stroke=\"#555\" stroke-width=\"1.4\"/><path d=\"M20 70 A30 30 0 0 1 80 70 Z\" fill=\"#a1887f\" opacity=\"0.55\"/><text x=\"50\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">受精卵</text><circle cx=\"150\" cy=\"70\" r=\"30\" fill=\"#fff3e0\" stroke=\"#555\" stroke-width=\"1.4\"/><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"100\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"150\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">2細胞期</text><circle cx=\"250\" cy=\"70\" r=\"30\" fill=\"#fff3e0\" stroke=\"#555\" stroke-width=\"1.4\"/><line x1=\"250\" y1=\"40\" x2=\"250\" y2=\"100\" stroke=\"#555\" stroke-width=\"1.4\"/><line x1=\"220\" y1=\"62\" x2=\"280\" y2=\"62\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"250\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">4細胞期</text><text x=\"250\" y=\"136\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">卵割（細胞は大きくならない）</text><circle cx=\"350\" cy=\"70\" r=\"30\" fill=\"#fff3e0\" stroke=\"#555\" stroke-width=\"1.4\"/><circle cx=\"335\" cy=\"55\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"335\" cy=\"70\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"335\" cy=\"85\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"350\" cy=\"55\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"350\" cy=\"70\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"350\" cy=\"85\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"365\" cy=\"55\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"365\" cy=\"70\" r=\"7\" fill=\"none\" stroke=\"#999\"/><circle cx=\"365\" cy=\"85\" r=\"7\" fill=\"none\" stroke=\"#999\"/><text x=\"350\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">桑実胚</text><circle cx=\"460\" cy=\"70\" r=\"32\" fill=\"#fff3e0\" stroke=\"#555\" stroke-width=\"1.4\"/><ellipse cx=\"460\" cy=\"58\" rx=\"18\" ry=\"12\" fill=\"#fff\" stroke=\"#888\"/><text x=\"460\" y=\"62\" text-anchor=\"middle\" font-size=\"9\">胞胚腔</text><text x=\"460\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">胞胚</text><circle cx=\"580\" cy=\"70\" r=\"34\" fill=\"#bbdefb\" stroke=\"#555\" stroke-width=\"1.4\"/><path d=\"M554 82 Q580 50 606 82 Q580 100 554 82\" fill=\"#ffcdd2\" stroke=\"#c62828\" stroke-width=\"1\"/><path d=\"M608 86 Q580 72 566 88\" fill=\"none\" stroke=\"#f9a825\" stroke-width=\"5\"/><text x=\"580\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">原腸胚</text><text x=\"580\" y=\"136\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">三胚葉ができる</text><path d=\"M86 70 L112 70\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><path d=\"M186 70 L212 70\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><path d=\"M286 70 L312 70\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><path d=\"M386 70 L422 70\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><path d=\"M496 70 L542 70\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><path d=\"M580 150 Q580 170 520 180 L170 180 Q110 182 110 196\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><ellipse cx=\"110\" cy=\"234\" rx=\"44\" ry=\"26\" fill=\"#bbdefb\" stroke=\"#555\" stroke-width=\"1.4\"/><circle cx=\"110\" cy=\"220\" r=\"8\" fill=\"#fff\" stroke=\"#1565c0\" stroke-width=\"2\"/><text x=\"110\" y=\"222\" text-anchor=\"middle\" font-size=\"7.5\">管</text><text x=\"110\" y=\"278\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">神経胚</text><text x=\"110\" y=\"292\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">神経管ができる</text><path d=\"M160 234 L230 234\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><path d=\"M250 234 Q260 210 320 218 Q380 222 390 234 Q380 252 320 252 Q262 256 250 234\" fill=\"#c8e6c9\" stroke=\"#555\" stroke-width=\"1.4\"/><circle cx=\"268\" cy=\"230\" r=\"3\" fill=\"#333\"/><text x=\"320\" y=\"278\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">尾芽胚</text><text x=\"320\" y=\"292\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">器官のもとができる</text><path d=\"M400 234 L460 234\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#e1)\"/><ellipse cx=\"510\" cy=\"234\" rx=\"30\" ry=\"20\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.4\"/><path d=\"M538 234 Q580 216 610 238 Q580 240 538 240\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.4\"/><circle cx=\"496\" cy=\"228\" r=\"3\" fill=\"#333\"/><text x=\"540\" y=\"278\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">幼生（オタマジャクシ）</text></svg></div>\n<div class=\"cap\">図1　カエルの初期発生</div>\n<ul>\n<li><b class=\"key\">卵割</b>：受精卵がはじめに行う体細胞分裂。分裂のあいだに細胞が成長しないので、<b>分裂するたびに1つ1つの細胞（割球）が小さくなる</b>。</li>\n<li><b class=\"key\">胞胚</b>：内部に<b>胞胚腔</b>という空所ができた時期。</li>\n<li><b class=\"key\">原腸胚</b>：表面の細胞が<b>原口</b>から内側にもぐりこみ、<b>原腸</b>ができる。このとき<b>外胚葉・中胚葉・内胚葉</b>の3つの層（<b class=\"key\">三胚葉</b>）ができる。</li>\n<li><b class=\"key\">神経胚</b>：背中側の外胚葉が<b>神経管</b>になる。中胚葉からは<b>脊索</b>ができる。</li>\n<li><b>尾芽胚</b> → <b>幼生</b>（オタマジャクシ）：各胚葉から器官のもとがつくられ、形が整っていく。</li>\n</ul>\n<table class=\"t\">\n<tr><th style=\"width:15%\">胚葉</th><th>主にできるもの</th></tr>\n<tr><td><b>外胚葉</b></td><td>表皮、<b>神経（脳・脊髄）</b>、目の水晶体・網膜</td></tr>\n<tr><td><b>中胚葉</b></td><td>脊索、<b>筋肉、骨</b>、心臓、血管・血球、腎臓</td></tr>\n<tr><td><b>内胚葉</b></td><td><b>消化管の内側</b>（胃・腸の上皮）、肝臓、すい臓、肺</td></tr>\n</table>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「<b>外</b>胚葉は体の外と神経、<b>中</b>胚葉は筋肉・骨・血液など体の中身、<b>内</b>胚葉は消化管の内側」とまとめると覚えやすいです。神経が外胚葉からできるのは意外なので、「神経管は背中の表面がくるっと丸まってできる」と図1の神経胚で見せると納得しやすくなります。</div>\n\n<h2>2. 発生のしくみ</h2>\n<h3>2-1　誘導と形成体</h3>\n<p>胚のある部分が、となりの部分にはたらきかけて、その分化の方向を決めることを<b class=\"key\">誘導</b>といいます。シュペーマンらは、イモリの原腸胚の<b>原口背唇部</b>を、別の胚の腹側に移植しました。すると、移植した場所にもう1つの胚（<b>二次胚</b>）ができました。二次胚の神経管などは、移植された側（胚B）の細胞でできていました。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 190\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"o1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><circle cx=\"70\" cy=\"80\" r=\"34\" fill=\"#e1bee7\" stroke=\"#555\" stroke-width=\"1.4\"/><path d=\"M58 110 Q70 98 82 110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"104\" r=\"9\" fill=\"#c62828\" opacity=\"0.8\"/><text x=\"70\" y=\"140\" text-anchor=\"middle\" font-weight=\"bold\">原腸胚A</text><text x=\"70\" y=\"156\" text-anchor=\"middle\" font-size=\"10.5\">原口背唇部（赤）を切りとる</text><path d=\"M112 90 Q170 40 222 86\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\" marker-end=\"url(#o1)\"/><text x=\"168\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c62828\">移植</text><circle cx=\"270\" cy=\"80\" r=\"34\" fill=\"#fff9c4\" stroke=\"#555\" stroke-width=\"1.4\"/><path d=\"M258 110 Q270 98 282 110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"270\" cy=\"50\" r=\"9\" fill=\"#c62828\" opacity=\"0.8\"/><text x=\"270\" y=\"140\" text-anchor=\"middle\" font-weight=\"bold\">原腸胚B</text><text x=\"270\" y=\"156\" text-anchor=\"middle\" font-size=\"10.5\">腹側（ふつうは表皮になる所）へ</text><path d=\"M320 80 L380 80\" stroke=\"#555\" stroke-width=\"1.8\" marker-end=\"url(#o1)\"/><ellipse cx=\"490\" cy=\"70\" rx=\"70\" ry=\"22\" fill=\"#fff9c4\" stroke=\"#555\" stroke-width=\"1.4\"/><circle cx=\"436\" cy=\"64\" r=\"3\" fill=\"#333\"/><text x=\"490\" y=\"74\" text-anchor=\"middle\" font-size=\"10\">もとの胚</text><ellipse cx=\"490\" cy=\"112\" rx=\"56\" ry=\"16\" fill=\"#fff9c4\" stroke=\"#c62828\" stroke-width=\"1.8\"/><circle cx=\"446\" cy=\"108\" r=\"3\" fill=\"#333\"/><text x=\"490\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" fill=\"#c62828\">二次胚</text><text x=\"490\" y=\"150\" text-anchor=\"middle\" font-weight=\"bold\">腹側にもう1つの胚ができる</text><text x=\"490\" y=\"166\" text-anchor=\"middle\" font-size=\"10.5\">二次胚の大部分は胚B自身の細胞</text></svg></div>\n<div class=\"cap\">図2　原口背唇部の移植実験（シュペーマンらの実験）</div>\n<p>原口背唇部のように、まわりにはたらきかけて胚の形づくりを導く部分を<b class=\"key\">形成体</b>（オーガナイザー）といいます。原口背唇部は、自身は脊索などになりながら、接している外胚葉を<b>神経に誘導</b>します（神経誘導）。また、胞胚期には内胚葉が予定外胚葉にはたらきかけて<b>中胚葉を誘導</b>します（中胚葉誘導）。</p>\n<div class=\"box column\"><div class=\"bt\">誘導の連鎖：目ができるまで</div>\n脳からのびた<b>眼杯</b>が表皮にはたらきかけて<b>水晶体</b>を誘導し、水晶体がさらに表皮にはたらきかけて<b>角膜</b>を誘導します。誘導が次々と起こることで、複雑な器官が順番にできあがります。</div>\n<h3>2-2　体のつくりを決める遺伝子</h3>\n<ul>\n<li><b class=\"key\">母性因子</b>：卵の中にもとからある mRNA やタンパク質。卵の中でかたよって分布していて、体の前後や背腹の向きを決める手がかりになる（例：ショウジョウバエのビコイド）。</li>\n<li><b class=\"key\">ホメオティック遺伝子</b>：体の各部分（体節）にどんな構造をつくるかを決める調節遺伝子。突然変異すると、触角のあるべき場所に脚ができる（アンテナペディア）など、体の一部が別の部分に置きかわる。</li>\n<li><b class=\"key\">アポトーシス</b>：あらかじめ決められた細胞の死。手の指の間の細胞が死ぬことで、指が分かれる。</li>\n</ul>\n<h3>2-3　分化した細胞も全部の遺伝子をもっている</h3>\n<p>ガードンは、アフリカツメガエルの<b>オタマジャクシの腸の細胞の核</b>を、核を取り除いた未受精卵に移植しました。すると、一部の卵が正常なオタマジャクシに育ちました（<b class=\"key\">核移植</b>）。このことから、<span class=\"em\">分化した細胞の核にも、体をつくるのに必要な遺伝子がすべて残っている</span>ことがわかりました（第3回の「遺伝子は失われない」の証拠）。</p>\n<p>山中伸弥らは、皮膚などの分化した細胞に<b>4つの遺伝子</b>を導入して、さまざまな細胞に分化できる<b class=\"key\">iPS細胞</b>（人工多能性幹細胞）をつくりました。受精卵からできた初期胚の細胞からつくる<b class=\"key\">ES細胞</b>（胚性幹細胞）とちがい、胚をこわさずにつくれ、本人の細胞からつくれるので拒絶反応が起こりにくいという利点があります。</p>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">3. バイオテクノロジー</h2>\n<h3>3-1　遺伝子組換え</h3>\n<p>ある生物の遺伝子を別の生物に入れてはたらかせる技術を<b class=\"key\">遺伝子組換え</b>といいます。使う道具は次の3つです。</p>\n<table class=\"t\">\n<tr><th style=\"width:24%\">道具</th><th>はたらき</th></tr>\n<tr><td><b>制限酵素</b></td><td>DNAの<b>特定の塩基配列</b>を見分けて切断する「はさみ」。例：EcoRI は GAATTC の部分を切る。</td></tr>\n<tr><td><b>DNAリガーゼ</b></td><td>DNAの切れ目をつなぐ「のり」。</td></tr>\n<tr><td><b>ベクター</b>（プラスミドなど）</td><td>遺伝子を細胞に運びこむ「運び屋」。<b>プラスミド</b>は大腸菌などがもつ小さな環状のDNA。</td></tr>\n</table>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">目的の遺伝子</div><div class=\"fbs\">制限酵素で<br>切り出す</div></div><div class=\"farr\">＋</div><div class=\"fb\"><div class=\"fbt\">プラスミド</div><div class=\"fbs\">同じ制限酵素で<br>切る</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">つなぐ</div><div class=\"fbs\">DNA<br>リガーゼ</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">大腸菌に入れる</div><div class=\"fbs\">タンパク質を<br>つくらせる</div></div></div>\n<div class=\"cap\">図3　遺伝子組換えの流れ（例：ヒトのインスリンを大腸菌につくらせる）</div>\n<p>同じ制限酵素で切ると、切り口の形がぴったり合うので、DNAリガーゼでつなげます。糖尿病の治療に使うインスリンは、この方法で大腸菌につくらせています。</p>\n\n<h3>3-2　PCR法：DNAを増やす</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 170\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"p1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><rect x=\"20\" y=\"30\" width=\"140\" height=\"68\" rx=\"10\" fill=\"#ffcdd2\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"90\" y=\"56\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\">① 約95℃</text><text x=\"90\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\">2本鎖をほどく</text><path d=\"M162 64 L183 64\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#p1)\"/><rect x=\"185\" y=\"30\" width=\"140\" height=\"68\" rx=\"10\" fill=\"#bbdefb\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"255\" y=\"56\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\">② 約55℃</text><text x=\"255\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\">プライマーが結合</text><path d=\"M327 64 L348 64\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#p1)\"/><rect x=\"350\" y=\"30\" width=\"140\" height=\"68\" rx=\"10\" fill=\"#c8e6c9\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"420\" y=\"56\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\">③ 約72℃</text><text x=\"420\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\">DNAポリメラーゼが</text><text x=\"420\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\">鎖をのばす</text><path d=\"M370 100 Q240 150 90 102\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.6\" stroke-dasharray=\"5,3\" marker-end=\"url(#p1)\"/><text x=\"230\" y=\"146\" text-anchor=\"middle\" font-size=\"10.5\">くり返す（1回で2倍）</text><text x=\"520\" y=\"50\" font-size=\"12\" font-weight=\"bold\" fill=\"#1b5e37\">1回 → 2倍</text><text x=\"520\" y=\"72\" font-size=\"12\" font-weight=\"bold\" fill=\"#1b5e37\">n回 → 2ⁿ倍</text><text x=\"520\" y=\"94\" font-size=\"10.5\">30回で約10億倍</text></svg></div>\n<div class=\"cap\">図4　PCR法の1サイクル</div>\n<p><b class=\"key\">PCR法</b>は、試験管の中でDNAの特定の部分を大量に増やす方法です。温度を変える3つのステップをくり返し、<span class=\"em\">1サイクルでDNAが2倍、nサイクルで 2ⁿ 倍</span>になります。増やしたい部分の両はしに結合する短いDNA（<b class=\"key\">プライマー</b>）と、高温でもこわれない<b>耐熱性のDNAポリメラーゼ</b>を使います（第4回の「酵素は高温で失活する」の例外）。</p>\n\n<h3>3-3　電気泳動：DNAの長さで分ける</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>DNAは<b>マイナスの電気</b>を帯びているので、寒天のゲルに入れて電圧をかけると<b>＋極のほうへ移動</b>します。ゲルの網目を通りぬけるので、<span class=\"em\">短いDNAほど速く、遠くまで移動</span>します。長さがわかっている目印のDNAと比べると、DNAの長さがわかります。</p>\n<p>右の図で、試料1は3つ（1200・1000・800塩基対）、試料2は2つ（2000・1000塩基対）の断片に分かれています。DNA鑑定や、遺伝子組換えがうまくいったかの確認に使われます。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 360 250\" width=\"320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><rect x=\"60\" y=\"30\" width=\"230\" height=\"190\" rx=\"4\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\"1.4\"/><text x=\"14\" y=\"40\" font-size=\"16\" font-weight=\"bold\" fill=\"#c62828\">−</text><text x=\"14\" y=\"222\" font-size=\"16\" font-weight=\"bold\" fill=\"#1565c0\">＋</text><rect x=\"38\" y=\"30\" width=\"22\" height=\"190\" fill=\"#fff\"/><rect x=\"80\" y=\"36\" width=\"50\" height=\"8\" fill=\"#fff\" stroke=\"#90a4ae\"/><text x=\"105\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\">目印</text><rect x=\"80\" y=\"73.7\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><text x=\"76\" y=\"80.7\" font-size=\"9\" fill=\"#455a64\" text-anchor=\"end\">3000</text><rect x=\"80\" y=\"97.1\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><text x=\"76\" y=\"104.1\" font-size=\"9\" fill=\"#455a64\" text-anchor=\"end\">2000</text><rect x=\"80\" y=\"113.8\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><text x=\"76\" y=\"120.8\" font-size=\"9\" fill=\"#455a64\" text-anchor=\"end\">1500</text><rect x=\"80\" y=\"137.3\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><text x=\"76\" y=\"144.3\" font-size=\"9\" fill=\"#455a64\" text-anchor=\"end\">1000</text><rect x=\"80\" y=\"177.4\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><text x=\"76\" y=\"184.4\" font-size=\"9\" fill=\"#455a64\" text-anchor=\"end\">500</text><rect x=\"150\" y=\"36\" width=\"50\" height=\"8\" fill=\"#fff\" stroke=\"#90a4ae\"/><text x=\"175\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\">試料1</text><rect x=\"150\" y=\"126.7\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><rect x=\"150\" y=\"137.3\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><rect x=\"150\" y=\"150.2\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><rect x=\"220\" y=\"36\" width=\"50\" height=\"8\" fill=\"#fff\" stroke=\"#90a4ae\"/><text x=\"245\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\">試料2</text><rect x=\"220\" y=\"97.1\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><rect x=\"220\" y=\"137.3\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#37474f\"/><text x=\"320\" y=\"130\" font-size=\"10.5\" fill=\"#555\" transform=\"rotate(90 320 130)\" text-anchor=\"middle\">短いほど遠くへ移動 →</text></svg><div class=\"cap\">図5　電気泳動の結果の例（数字は塩基対）</div></div></div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：制限酵素で切った断片</div>\n<b>例題</b>　3000塩基対の直鎖状のDNAを、800番目と2000番目の位置で切った。できる断片の長さは？<br>\n<b>考え方</b>　0〜800、800〜2000、2000〜3000 → <b>800・1200・1000塩基対</b>。電気泳動では、いちばん短い800塩基対がいちばん遠くまで移動する。<br>\n<b>参考</b>　6塩基を見分ける制限酵素の切断部位は、塩基がでたらめに並んでいれば 4⁶＝4096 塩基に1回くらいの割合で現れる。</div>\n\n<h3>3-4　そのほかの技術</h3>\n<ul>\n<li><b class=\"key\">GFP</b>（緑色蛍光タンパク質）：オワンクラゲから見つかった、光を当てると緑色に光るタンパク質（下村脩が発見）。調べたい遺伝子とつないで入れると、その遺伝子が発現した場所が光って見える。</li>\n<li><b class=\"key\">ゲノム編集</b>：CRISPR-Cas9 などを使い、ゲノムのねらった場所の塩基配列を切って書きかえる技術。</li>\n<li><b>遺伝子組換え作物</b>（害虫に強い作物など）や、<b>遺伝子治療</b>にも利用されている。</li>\n</ul>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>受精で受精膜ができ、ほかの精子が入れなくなる（多精拒否）</li>\n<li>卵割は細胞が成長しない分裂。分裂するたびに割球は小さくなる</li>\n<li>受精卵 → 卵割 → 桑実胚 → 胞胚（胞胚腔）→ 原腸胚（原口・原腸・三胚葉）→ 神経胚（神経管）→ 尾芽胚 → 幼生</li>\n<li>外胚葉：表皮・神経　中胚葉：脊索・筋肉・骨・血管・心臓・腎臓　内胚葉：消化管の内側・肝臓・すい臓・肺</li>\n<li>誘導：となりの部分の分化の方向を決める。形成体＝原口背唇部（移植すると二次胚）</li>\n<li>神経誘導・中胚葉誘導、目の誘導の連鎖（眼杯 → 水晶体 → 角膜）</li>\n<li>母性因子・ホメオティック遺伝子・アポトーシス</li>\n<li>核移植（ガードン）：分化した細胞の核にも全部の遺伝子がある。iPS細胞（山中伸弥、4つの遺伝子）とES細胞</li>\n<li>遺伝子組換え：制限酵素（切る）・DNAリガーゼ（つなぐ）・プラスミド（運ぶ）</li>\n<li>PCR法：95℃→55℃→72℃ をくり返す。nサイクルで 2ⁿ 倍。耐熱性DNAポリメラーゼとプライマー</li>\n<li>電気泳動：DNAは＋極へ。短いほど遠くまで移動</li>\n<li>GFP（下村脩）、ゲノム編集（CRISPR-Cas9）</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>卵割が、ふつうの体細胞分裂とちがう点を答えよ。<div class=\"wline\"></div></li>\n<li>次の胚の時期を、発生の順に並べよ。<br>　ア　神経胚　　イ　胞胚　　ウ　原腸胚　　エ　桑実胚　　<span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li>次のものは、外胚葉・中胚葉・内胚葉のどれからできるか。<br>(a) 脊髄 <span class=\"blank\" style=\"min-width:16mm\"></span>　(b) 骨格筋 <span class=\"blank\" style=\"min-width:16mm\"></span>　(c) 肝臓 <span class=\"blank\" style=\"min-width:16mm\"></span>　(d) 表皮 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li>イモリの原腸胚の原口背唇部を、別の胚の腹側に移植するとどうなるか。また、原口背唇部のようなはたらきをもつ部分を何というか。<div class=\"wline\"></div></li>\n<li>オタマジャクシの腸の細胞の核を、核を除いた未受精卵に移植すると、正常なオタマジャクシが育つことがある。このことから何がわかるか。<div class=\"wline\"></div></li>\n<li>遺伝子組換えで使う次の道具のはたらきを答えよ。<br>制限酵素 <span class=\"blank\" style=\"min-width:40mm\"></span>　DNAリガーゼ <span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li>PCR法について答えよ。<br>(1) 3つの温度のステップで、それぞれ何が起こるか。<div class=\"wline\"></div>(2) 1分子のDNAを5サイクル増やすと、何分子になるか。 <span class=\"blank\" style=\"min-width:14mm\"></span></li>\n<li>電気泳動で、DNAが＋極のほうへ移動する理由と、いちばん遠くまで移動するのはどんなDNAかを答えよ。<div class=\"wline\"></div></li>\n<li>5000塩基対の直鎖状のDNAを、1500番目と3500番目の位置で切った。できる断片の長さをすべて答えよ。 <span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li><b>説明の練習</b>　「同じ遺伝子をもつ細胞が、ちがう細胞に分化できる理由」を、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　解答例</b>　分裂のあいだに細胞が成長しないので、分裂するたびに細胞（割球）が小さくなる。</p>\n<p><b>2.　エ → イ → ウ → ア</b>　桑実胚 → 胞胚 → 原腸胚 → 神経胚。</p>\n<p><b>3.　(a) 外胚葉　(b) 中胚葉　(c) 内胚葉　(d) 外胚葉</b>　神経（脊髄）は外胚葉からできる。</p>\n<p><b>4.　解答例</b>　移植した場所に二次胚（もう1つの胚）ができる。原口背唇部のようにまわりの分化を導く部分を<b>形成体</b>（オーガナイザー）という。</p>\n<p><b>5.　解答例</b>　分化した細胞の核にも、体をつくるのに必要な遺伝子がすべて残っていること。</p>\n<p><b>6.　制限酵素：DNAの特定の塩基配列を見分けて切断する　DNAリガーゼ：DNAの切れ目をつなぐ</b></p>\n<p><b>7.　(1) 約95℃：DNAの2本鎖がほどける　約55℃：プライマーが結合する　約72℃：DNAポリメラーゼが鎖をのばす　(2) 32分子</b>（2⁵＝32）</p>\n<p><b>8.　解答例</b>　DNAはマイナスの電気を帯びているから。ゲルの網目を通りぬけやすい短いDNAほど、遠くまで移動する。</p>\n<p><b>9.　1500・2000・1500塩基対</b>　0〜1500、1500〜3500、3500〜5000。</p>\n<p><b>10.　解答例</b>　体のどの細胞も、受精卵と同じ遺伝子を全部もっています。しかし、場所や時期によって、まわりからの誘導や母性因子のちがいで、どの遺伝子を発現させるかが変わります。発現する遺伝子の組み合わせがちがうと、つくられるタンパク質がちがうので、ちがう形やはたらきの細胞になります。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第8回 動物の反応）に向けて</div>\n第8回では、外胚葉からできる<b>神経</b>と、中胚葉からできる<b>筋肉</b>が、どのように刺激を受けとって反応するかを学びます。第4回の<b>ATP</b>（筋肉が縮むエネルギー）も登場します。</div>\n</details>", "heads": ["0. これまでとのつながり", "1. 受精と初期発生", "2. 発生のしくみ", "3. バイオテクノロジー", "この回のまとめ", "確認問題"]}, "8": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第8回　動物の反応</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>受容器と適刺激、目と耳のつくりの要点を言える</li>\n<li>ニューロンで興奮が起こるしくみ（静止電位・活動電位）と、伝導・伝達のちがいを説明できる</li>\n<li>2点を刺激した実験から、興奮の伝導速度を計算できる</li>\n<li>反射のしくみと、筋肉が縮むしくみ（アクチン・ミオシン・ATP）を説明できる</li>\n</ul></div>\n\n<h2>0. 刺激から反応まで</h2>\n<p>動物は、まわりの変化（刺激）を受けとって、すばやく反応します。その流れは次のとおりです。この回は、この流れを左から順に見ていきます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">受容器</div><div class=\"fbs\">刺激を受けとる<br>（目・耳など）</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">感覚神経</div><div class=\"fbs\">伝える</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">中枢神経</div><div class=\"fbs\">判断する<br>（脳・脊髄）</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">運動神経</div><div class=\"fbs\">伝える</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">効果器</div><div class=\"fbs\">反応する<br>（筋肉など）</div></div></div>\n\n<h2>1. 刺激を受けとる：受容器</h2>\n<p>受容器は、それぞれ決まった種類の刺激だけを受けとります。受容器が受けとれる刺激を<b class=\"key\">適刺激</b>といいます。</p>\n<table class=\"t\">\n<tr><th style=\"width:24%\">受容器</th><th style=\"width:28%\">適刺激</th><th>受けとる細胞・場所</th></tr>\n<tr><td>目</td><td>光</td><td>網膜の視細胞</td></tr>\n<tr><td>耳（うずまき管）</td><td>音</td><td>聴細胞</td></tr>\n<tr><td>耳（前庭・半規管）</td><td>からだの傾き・回転</td><td>前庭は傾き、半規管は回転</td></tr>\n<tr><td>鼻・舌</td><td>化学物質</td><td>嗅細胞・味細胞</td></tr>\n<tr><td>皮膚</td><td>圧力・温度・痛み</td><td>皮膚の感覚点</td></tr>\n</table>\n<p><b>目</b>の網膜には2種類の視細胞があります。<b class=\"key\">錐体細胞</b>は網膜の中心（<b>黄斑</b>）に多く、明るい所ではたらき<b>色を見分けます</b>。<b class=\"key\">かん体細胞</b>は網膜の周辺に多く、<b>弱い光でもはたらきます</b>が色は見分けません。視神経が網膜から出ていく部分（<b>盲斑</b>）には視細胞がないので、光を感じません。暗い所に入ると、しだいに見えるようになるのは、かん体細胞の感度が上がるからです（<b>暗順応</b>）。</p>\n<p><b>耳</b>では、音が鼓膜をふるわせ、耳小骨を通って<b>うずまき管</b>に伝わり、聴細胞が興奮します。</p>\n\n<h2>2. 興奮が起こるしくみ：ニューロン</h2>\n<h3>2-1　ニューロンのつくり</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 170\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"n1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><path d=\"M90 80 L121 33\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M121 33 l7 -3 M121 33 l-1 -8\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L148 62\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M148 62 l8 2 M148 62 l5 -7\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L146 103\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M146 103 l4 7 M146 103 l8 -1\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L111 131\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M111 131 l-2 8 M111 131 l7 5\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L59 127\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M59 127 l-7 3 M59 127 l1 8\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L32 98\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M32 98 l-8 -2 M32 98 l-5 7\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L32 62\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M32 62 l-5 -7 M32 62 l-8 2\" stroke=\"#7e57c2\" stroke-width=\"2\"/><path d=\"M90 80 L59 33\" stroke=\"#7e57c2\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M59 33 l1 -8 M59 33 l-7 -3\" stroke=\"#7e57c2\" stroke-width=\"2\"/><circle cx=\"90\" cy=\"80\" r=\"26\" fill=\"#ede7f6\" stroke=\"#5e35b1\" stroke-width=\"2\"/><circle cx=\"90\" cy=\"80\" r=\"9\" fill=\"#9575cd\"/><line x1=\"116\" y1=\"80\" x2=\"560\" y2=\"80\" stroke=\"#7e57c2\" stroke-width=\"3\"/><rect x=\"150\" y=\"70\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#fff8e1\" stroke=\"#f9a825\" stroke-width=\"1.6\"/><rect x=\"232\" y=\"70\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#fff8e1\" stroke=\"#f9a825\" stroke-width=\"1.6\"/><rect x=\"314\" y=\"70\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#fff8e1\" stroke=\"#f9a825\" stroke-width=\"1.6\"/><rect x=\"396\" y=\"70\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#fff8e1\" stroke=\"#f9a825\" stroke-width=\"1.6\"/><rect x=\"478\" y=\"70\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#fff8e1\" stroke=\"#f9a825\" stroke-width=\"1.6\"/><path d=\"M560 80 L600 58\" stroke=\"#7e57c2\" stroke-width=\"2.4\"/><circle cx=\"604\" cy=\"58\" r=\"6\" fill=\"#ede7f6\" stroke=\"#5e35b1\"/><path d=\"M560 80 L600 80\" stroke=\"#7e57c2\" stroke-width=\"2.4\"/><circle cx=\"604\" cy=\"80\" r=\"6\" fill=\"#ede7f6\" stroke=\"#5e35b1\"/><path d=\"M560 80 L600 102\" stroke=\"#7e57c2\" stroke-width=\"2.4\"/><circle cx=\"604\" cy=\"102\" r=\"6\" fill=\"#ede7f6\" stroke=\"#5e35b1\"/><text x=\"90\" y=\"134\" text-anchor=\"middle\" font-weight=\"bold\">細胞体</text><text x=\"30\" y=\"20\" font-size=\"10.5\" fill=\"#5e35b1\">樹状突起</text><line x1=\"62\" y1=\"24\" x2=\"70\" y2=\"40\" stroke=\"#5e35b1\"/><text x=\"340\" y=\"50\" text-anchor=\"middle\" font-weight=\"bold\">軸索</text><text x=\"232\" y=\"124\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#b28704\">髄鞘</text><line x1=\"225\" y1=\"112\" x2=\"210\" y2=\"92\" stroke=\"#b28704\"/><text x=\"314\" y=\"124\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#555\">ランビエ絞輪</text><line x1=\"306\" y1=\"112\" x2=\"301\" y2=\"86\" stroke=\"#555\"/><text x=\"600\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\">神経終末</text><path d=\"M180 150 L520 150\" stroke=\"#c62828\" stroke-width=\"2\" marker-end=\"url(#n1)\"/><text x=\"350\" y=\"166\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c62828\">興奮が伝わる向き（髄鞘の切れ目をとびとびに：跳躍伝導）</text></svg></div>\n<div class=\"cap\">図1　ニューロン（神経細胞）のつくり</div>\n<p>神経系をつくる細胞を<b class=\"key\">ニューロン</b>といいます。核のある<b>細胞体</b>、ほかの細胞から信号を受けとる<b>樹状突起</b>、信号を遠くへ送る長い<b>軸索</b>からなります。軸索が<b>髄鞘</b>でおおわれた神経を<b>有髄神経</b>といい、興奮が髄鞘の切れ目（<b>ランビエ絞輪</b>）をとびとびに伝わる<b class=\"key\">跳躍伝導</b>によって、速く伝わります。</p>\n\n<h3>2-2　静止電位と活動電位</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>刺激を受けていないニューロンでは、細胞膜の内側が外側に対して<b>マイナス</b>（約−70mV）になっています。これを<b class=\"key\">静止電位</b>といいます。<b>ナトリウムポンプ</b>がATPを使って、Na⁺を細胞の外へ、K⁺を中へ運んでいることがもとになっています。</p>\n<p>刺激を受けると、Na⁺が一気に細胞の中に流れこみ、内側が一瞬<b>プラス</b>に逆転します。この電位の変化を<b class=\"key\">活動電位</b>といい、活動電位が生じることを<b class=\"key\">興奮</b>といいます。そのあとK⁺が外に出て、もとに戻ります。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 380 240\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"56\" y1=\"28.9\" x2=\"346\" y2=\"28.9\" stroke=\"#e3e3e3\"/><text x=\"50\" y=\"32.9\" text-anchor=\"end\">40</text><line x1=\"56\" y1=\"80.3\" x2=\"346\" y2=\"80.3\" stroke=\"#e3e3e3\"/><text x=\"50\" y=\"84.3\" text-anchor=\"end\">0</text><line x1=\"56\" y1=\"151.0\" x2=\"346\" y2=\"151.0\" stroke=\"#e3e3e3\"/><text x=\"50\" y=\"155.0\" text-anchor=\"end\">-55</text><line x1=\"56\" y1=\"170.3\" x2=\"346\" y2=\"170.3\" stroke=\"#e3e3e3\"/><text x=\"50\" y=\"174.3\" text-anchor=\"end\">-70</text><line x1=\"56\" y1=\"196.0\" x2=\"346\" y2=\"196.0\" stroke=\"#e3e3e3\"/><text x=\"50\" y=\"200.0\" text-anchor=\"end\">-90</text><line x1=\"56\" y1=\"16\" x2=\"56\" y2=\"196\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"56\" y1=\"80.28571428571429\" x2=\"346\" y2=\"80.28571428571429\" stroke=\"#999\"/><line x1=\"56\" y1=\"151.0\" x2=\"346\" y2=\"151.0\" stroke=\"#1565c0\" stroke-dasharray=\"5,3\"/><text x=\"342\" y=\"147.0\" text-anchor=\"end\" fill=\"#1565c0\" font-size=\"10\">閾値</text><polyline points=\"56.0,170.3 114.0,170.3 122.7,151.0 140.1,28.9 166.2,93.1 195.2,185.7 241.6,175.4 346.0,170.3\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"61.8\" y=\"164.28571428571428\" font-size=\"10.5\">静止電位</text><text x=\"148.8\" y=\"32.857142857142854\" font-size=\"10.5\" fill=\"#c62828\" font-weight=\"bold\">活動電位</text><text x=\"108.19999999999999\" y=\"123.0\" font-size=\"9.5\" fill=\"#555\" text-anchor=\"end\">刺激</text><path d=\"
