\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"217.7\" y=\"154.8\" font-weight=\"bold\" fill=\"#1565c0\">抗B抗体</text><defs><marker id=\"r1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><path d=\"M54.0 134 L48.0 176\" stroke=\"#333\" stroke-width=\"1.5\" marker-end=\"url(#r1)\"/><text x=\"52.0\" y=\"130\" font-size=\"10\">抗原A</text><path d=\"M144.0 120 L157.0 176\" stroke=\"#333\" stroke-width=\"1.5\" marker-end=\"url(#r1)\"/><text x=\"100.0\" y=\"116\" font-size=\"10\">抗原A＋抗原B</text></svg><div class=\"cap\">図6　一次応答と二次応答</div></div></div>\n<table class=\"t\">\n<tr><th style=\"width:18%\">利用</th><th>しくみ</th></tr>\n<tr><td><b class=\"key\">予防接種</b></td><td>毒性をなくした（弱めた）病原体や毒素（<b>ワクチン</b>）を注射して、<b>記憶細胞をつくらせておく</b>。本物が入ったとき二次応答で発症を防ぐ。効果は<b>長く続く</b>が、効くまでに時間がかかる</td></tr>\n<tr><td><b class=\"key\">血清療法</b></td><td>ウマなどの動物につくらせた<b>抗体を含む血清</b>を注射する（ヘビ毒など）。<b>すぐに効く</b>が、自分で抗体をつくるわけではないので効果は一時的</td></tr>\n</table>\n\n<h3>8-4　免疫と病気</h3>\n<ul>\n<li><b class=\"key\">アレルギー</b>：花粉など、ふつうは無害な物質（<b>アレルゲン</b>）に免疫が過敏に反応して起こる（花粉症など）。全身に急激に起こり、血圧低下などで命にかかわるものを<b>アナフィラキシーショック</b>という。</li>\n<li><b class=\"key\">自己免疫疾患</b>：免疫が自分のからだの成分を攻撃してしまう病気（Ⅰ型糖尿病、関節リウマチなど）。</li>\n<li><b class=\"key\">エイズ</b>（後天性免疫不全症候群）：<b>HIV</b>（ヒト免疫不全ウイルス）が<b>ヘルパーT細胞</b>に感染して破壊する。ヘルパーT細胞は体液性免疫と細胞性免疫の両方の司令塔なので、獲得免疫が全体的にはたらかなくなり、ふだんはかからない病気にかかりやすくなる（<b>日和見感染</b>）。</li>\n<li><b>拒絶反応</b>：他人の臓器を移植すると、<b>キラーT細胞</b>が移植された細胞を異物として攻撃する（細胞性免疫）。</li>\n</ul>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>体液＝血液・組織液・リンパ液。体内環境を一定に保つことを恒常性という</li>\n<li>赤血球（ヘモグロビンでO₂運搬）、白血球（免疫）、血小板（凝固）、血しょう（運搬）</li>\n<li>血液凝固：血小板・凝固因子 → フィブリン → 血ぺい。上澄みは血清</li>\n<li>CO₂が多いと酸素解離曲線は右へずれ、酸素を放しやすい。割合の計算は「何のうちか」に注意</li>\n<li>肝臓：グリコーゲン貯蔵、血しょうタンパク質の合成、解毒（アンモニア→尿素）、胆汁、発熱</li>\n<li>ネフロン：糸球体でろ過（血球・タンパク質は通らない）→ 細尿管で再吸収（グルコースは全部）→ 集合管で水を再吸収</li>\n<li>イヌリンはろ過されるが再吸収されない。原尿量＝尿量×イヌリンの濃縮率</li>\n<li>交感神経（活動：心拍↑・瞳孔拡大・消化↓）と副交感神経（休息）は拮抗的。中枢は視床下部</li>\n<li>ホルモン：内分泌腺 → 血液 → 標的細胞の受容体。負のフィードバックで量を一定に保つ</li>\n<li>血糖を下げるのはインスリン（B細胞）だけ。上げるのはグルカゴン・アドレナリン・糖質コルチコイド</li>\n<li>寒いとき：血管収縮・立毛筋収縮（放散↓）、代謝促進・ふるえ（発生↑）。バソプレシンは集合管で水の再吸収↑</li>\n<li>獲得免疫：樹状細胞が抗原提示 → ヘルパーT → B細胞→形質細胞→抗体（体液性）、キラーT（細胞性）</li>\n<li>記憶細胞による二次応答。予防接種は記憶をつくらせる、血清療法は抗体を入れる</li>\n<li>アレルギー、自己免疫疾患、エイズ（HIVがヘルパーT細胞を破壊）</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>体液を3つに分けて答えよ。また、体内環境を一定に保つ性質を何というか。<br><span class=\"blank\"></span>・<span class=\"blank\"></span>・<span class=\"blank\"></span>　性質 <span class=\"blank\"></span></li>\n<li>血液凝固で、血球をからめて血ぺいをつくる繊維状のタンパク質は何か。また、血液凝固にかかわる有形成分は何か。<br><span class=\"blank\"></span>・<span class=\"blank\"></span></li>\n<li>肺で酸素ヘモグロビンが96%、組織で40%であった。組織で酸素を放したのは、<b>酸素ヘモグロビンのうち</b>何%か。小数第1位を四捨五入せよ。 <span class=\"blank\" style=\"min-width:20mm\"></span></li>\n<li>イヌリンの濃度が血しょう中で0.1mg/mL、尿中で9mg/mLであった。1日の尿量を1.2Lとする。<br>(1) イヌリンの濃縮率 <span class=\"blank\" style=\"min-width:16mm\"></span>　(2) 1日の原尿量 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li>交感神経がはたらくと、次はどうなるか。<br>心臓の拍動 <span class=\"blank\" style=\"min-width:14mm\"></span>　瞳孔 <span class=\"blank\" style=\"min-width:14mm\"></span>　胃腸の運動 <span class=\"blank\" style=\"min-width:14mm\"></span>　気管支 <span class=\"blank\" style=\"min-width:14mm\"></span></li>\n<li>次のはたらきをもつホルモンを答えよ。<br>(a) 集合管での水の再吸収を促進 <span class=\"blank\"></span>　(b) 血糖濃度を下げる <span class=\"blank\"></span><br>(c) 全身の代謝を促進 <span class=\"blank\"></span>　(d) 腎臓でのNa⁺の再吸収を促進 <span class=\"blank\"></span></li>\n<li>チロキシンの分泌量が一定に保たれるしくみを、「負のフィードバック」という語を使って説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n<li>寒いときに体温を保つしくみを、「熱の放散」と「熱の発生」に分けて1つずつ答えよ。<div class=\"wline\"></div></li>\n<li>図6のように、抗原Aを注射し、30日後に抗原Aと抗原Bを同時に注射した。すばやく大量の抗体がつくられたのはどちらの抗原に対してか。また、その理由を答えよ。<div class=\"wline\"></div></li>\n<li><b>説明の練習</b>　予防接種と血清療法のちがいを、「何を注射するか」と「効き方」に注目して、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　血液・組織液・リンパ液　恒常性（ホメオスタシス）</b></p>\n<p><b>2.　フィブリン・血小板</b></p>\n<p><b>3.　58%</b>　(96 − 40) ÷ 96 × 100 ＝ 58.33… ≒ 58%。「全ヘモグロビンのうち」なら 96 − 40 ＝ 56%。</p>\n<p><b>4.　(1) 90　(2) 108L</b>　(1) 9 ÷ 0.1 ＝ 90。(2) イヌリンは再吸収されないので、原尿は尿の90倍。1.2 × 90 ＝ 108L。</p>\n<p><b>5.　心臓の拍動：促進　瞳孔：拡大　胃腸の運動：抑制　気管支：拡張</b></p>\n<p><b>6.　(a) バソプレシン　(b) インスリン　(c) チロキシン　(d) 鉱質コルチコイド</b></p>\n<p><b>7.　解答例</b>　チロキシンが増えすぎると、チロキシンが視床下部と脳下垂体前葉にはたらいて、放出ホルモンと甲状腺刺激ホルモンの分泌をおさえる。その結果チロキシンの分泌が減る。このように結果が原因をおさえる負のフィードバックで、量が一定に保たれる。</p>\n<p><b>8.　解答例</b>　熱の放散：皮膚の血管や立毛筋を収縮させる。熱の発生：アドレナリンやチロキシンで代謝を促進する（筋肉のふるえでもよい）。</p>\n<p><b>9.　抗原A</b>　1回目の注射で抗原Aに対する記憶細胞ができており、2回目は記憶細胞がすぐに増えて二次応答が起こるから。抗原Bは初めてなので一次応答になる。</p>\n<p><b>10.　解答例</b>　予防接種は、弱めた病原体などのワクチンを注射して、自分のからだに記憶細胞をつくらせる方法です。効くまで時間はかかりますが、効果は長く続くので、病気の予防に使います。血清療法は、ほかの動物がつくった抗体そのものを注射する方法です。すぐ効くので、ヘビにかまれたときなどの治療に使いますが、効果は一時的です。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第11回 生態と環境）に向けて</div>\n第11回は、個体から視野を広げて、<b>植生と遷移</b>、<b>バイオーム</b>、<b>生態系での物質とエネルギーの流れ</b>を学びます。第5回の<b>光合成と呼吸</b>（炭素の出入り）が土台になるので、見直しておくと読みやすくなります。</div>\n</details>", "heads": ["0. 体内環境とは", "1. 血液のはたらき", "2. 酸素の運搬：酸素解離曲線", "3. 肝臓のはたらき", "4. 腎臓と尿の生成", "5. 自律神経系", "6. ホルモンと内分泌系", "7. 血糖・体温・水分の調節", "8. 免疫", "この回のまとめ", "確認問題"]}, "11": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第11回　生態と環境</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>森林の階層構造、遷移のしくみ（陽樹から陰樹へ）を説明できる</li>\n<li>気温と降水量からバイオームを判断し、暖かさの指数を計算できる</li>\n<li>個体群（標識再捕法・成長曲線）と、種間の関係（競争・すみわけ・共生）を説明できる</li>\n<li>生態系の物質収支（総生産量・純生産量・同化量など）とエネルギー効率を計算できる</li>\n<li>炭素・窒素の循環と、生態系のバランス・保全の問題を説明できる</li>\n</ul></div>\n\n<h2>0. 生態学の見取り図</h2>\n<p>この回は、1つの体の中から外へ視野を広げます。生物の集まりは、次のように段階的にとらえます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">個体</div><div class=\"fbs\">1匹・1本</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">個体群</div><div class=\"fbs\">同じ種の<br>集まり</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">生物群集</div><div class=\"fbs\">いろいろな種の<br>個体群の集まり</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">生態系</div><div class=\"fbs\">生物群集＋<br>非生物的環境</div></div></div>\n<p><b>非生物的環境</b>は、光・温度・水・大気・土壌など。非生物的環境が生物に影響することを<b class=\"key\">作用</b>、生物が非生物的環境を変えることを<b class=\"key\">環境形成作用</b>といいます（例：森林ができると林の中が暗く湿る）。</p>\n\n<h2>1. 植生</h2>\n<p>ある場所に生えている植物の集まりを<b class=\"key\">植生</b>といいます。植生の外から見たようす（相観）は、もっとも多く占めている<b class=\"key\">優占種</b>で決まります。植生は大きく、<b>森林・草原・荒原</b>（砂漠やツンドラのように植物がまばら）に分けられます。</p>\n<div class=\"side\"><div class=\"txt\">\n<p>発達した森林には、高さによる<b class=\"key\">階層構造</b>があります。いちばん上の葉が茂った部分を<b>林冠</b>、地面に近い部分を<b>林床</b>といいます。</p>\n<p>林冠で光の多くが吸収されるので、下に行くほど暗くなり、林床に届く光は数%しかありません。そのため、上の層には<b>陽生植物</b>、林床には弱い光でも生育できる<b>陰生植物</b>が多くなります（第5回：陰生植物は光補償点・光飽和点が低い）。</p>\n<p>森林の土壌は、上から<b>落葉層</b>、落葉が分解されてできた<b>腐植層</b>、その下の岩石が風化した層からなります。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 330 230\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10.5\"><rect x=\"10\" y=\"10\" width=\"170\" height=\"60\" fill=\"#a5d6a7\" stroke=\"#fff\"/><text x=\"18\" y=\"44.0\" font-weight=\"bold\">高木層</text><rect x=\"10\" y=\"70\" width=\"170\" height=\"45\" fill=\"#c5e1a5\" stroke=\"#fff\"/><text x=\"18\" y=\"96.5\" font-weight=\"bold\">亜高木層</text><rect x=\"10\" y=\"115\" width=\"170\" height=\"40\" fill=\"#dcedc8\" stroke=\"#fff\"/><text x=\"18\" y=\"139.0\" font-weight=\"bold\">低木層</text><rect x=\"10\" y=\"155\" width=\"170\" height=\"30\" fill=\"#f1f8e9\" stroke=\"#fff\"/><text x=\"18\" y=\"174.0\" font-weight=\"bold\">草本層</text><rect x=\"10\" y=\"185\" width=\"170\" height=\"15\" fill=\"#d7ccc8\" stroke=\"#fff\"/><text x=\"18\" y=\"196.5\" font-weight=\"bold\">地表層</text><text x=\"92\" y=\"196\" font-size=\"9\" fill=\"#5d4037\">コケ・落葉</text><line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"200\" stroke=\"#333\"/><line x1=\"200\" y1=\"200\" x2=\"310.0\" y2=\"200\" stroke=\"#333\"/><polyline points=\"310.0,10 307.8,40 266.0,70 227.5,115 211.0,155 204.4,185 202.2,200\" fill=\"none\" stroke=\"#f9a825\" stroke-width=\"2.4\"/><text x=\"200.0\" y=\"214\" text-anchor=\"middle\" font-size=\"9.5\">0</text><text x=\"255.0\" y=\"214\" text-anchor=\"middle\" font-size=\"9.5\">50</text><text x=\"310.0\" y=\"214\" text-anchor=\"middle\" font-size=\"9.5\">100</text><text x=\"255.0\" y=\"227\" text-anchor=\"middle\" font-size=\"9.5\">相対照度（%）</text><text x=\"205\" y=\"24\" font-size=\"9.5\" fill=\"#b28704\">林冠</text></svg><div class=\"cap\">図1　森林の階層構造と相対照度<br>（林冠の上の明るさを100%とする）</div></div></div>\n\n<h2>2. 遷移</h2>\n<p>植生が時間とともに移り変わっていくことを<b class=\"key\">遷移</b>といいます。最終的に大きく変化しなくなった状態を<b class=\"key\">極相</b>（クライマックス）といいます。</p>\n<h3>2-1　一次遷移（乾性遷移）</h3>\n<p>溶岩が冷えた跡のように、<b>土壌も種子もない裸地</b>から始まる遷移を<b class=\"key\">一次遷移</b>といいます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">裸地</div><div class=\"fbs\">溶岩など</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">地衣類・コケ</div><div class=\"fbs\">先駆種</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">草原</div><div class=\"fbs\">多年生草本</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">低木林</div><div class=\"fbs\"></div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">陽樹林</div><div class=\"fbs\">アカマツ<br>など</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">混交林</div><div class=\"fbs\">陽樹＋陰樹</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">陰樹林</div><div class=\"fbs\">極相<br>スダジイ・ブナ</div></div></div>\n<div class=\"cap\">図2　一次遷移（乾性遷移）の流れ</div>\n<ol>\n<li>最初に入りこむのは、乾燥や貧栄養に強い<b>地衣類・コケ植物</b>など（<b class=\"key\">先駆種</b>（パイオニア種））。岩が風化し、遺体が分解されて、少しずつ<b>土壌</b>ができる。</li>\n<li>土壌ができると草本が生え、さらに低木が入る。</li>\n<li>日当たりのよい場所で速く成長する<b class=\"key\">陽樹</b>（アカマツなど）が<b>陽樹林</b>をつくる。</li>\n<li>陽樹林の林床は暗いので、<span class=\"em\">陽樹の芽ばえは育たないが、陰樹の芽ばえは暗い林床でも育つ</span>。やがて陰樹が陽樹と入れかわり（混交林）、<b class=\"key\">陰樹林</b>（スダジイ・ブナなど）になって極相に達する。</li>\n</ol>\n<p>湖や池から始まる遷移を<b>湿性遷移</b>といいます。土砂や遺体がたまって浅くなり、湿原 → 草原 → 森林と進みます。</p>\n<h3>2-2　二次遷移とギャップ</h3>\n<p>山火事や森林の伐採のあと、<b>土壌が残っている場所</b>から始まる遷移を<b class=\"key\">二次遷移</b>といいます。土壌の中に<b>種子や根、地下茎</b>が残っているので、<span class=\"em\">一次遷移より速く進みます</span>。</p>\n<p>極相林でも、台風などで大きな木が倒れると、林冠にすき間（<b class=\"key\">ギャップ</b>）ができます。大きなギャップでは林床まで光が届き、陽樹が育つこともあります。こうして森林の中で部分的に入れかわること（<b>ギャップ更新</b>）で、極相林にもいろいろな種が共存しています。</p>\n\n<h2>3. バイオーム</h2>\n<p>ある地域の植生と、そこにすむ動物などをまとめたものを<b class=\"key\">バイオーム</b>（生物群系）といいます。バイオームは主に<span class=\"em\">年平均気温と年降水量</span>で決まります。降水量が多いと森林、少ないと草原、極端に少ないと砂漠になります。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 600 300\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><polygon points=\"52.0,258.0 171.1,258.0 171.1,181.5 165.2,183.9 159.2,186.4 153.2,188.8 147.3,191.3 141.3,193.7 135.4,196.2 129.4,198.6 123.5,201.1 117.5,203.5 111.6,206.0 105.6,208.4 99.6,210.8 93.7,213.3 87.7,215.7 81.8,218.2 75.8,220.6 69.9,223.1 63.9,225.5 58.0,228.0 52.0,230.4\" fill=\"#e0f2f1\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"111.6\" y=\"248.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#1b3a2a\">ツンドラ</text><polygon points=\"171.1,258.0 588.0,258.0 588.0,244.2 567.2,244.2 546.3,244.2 525.5,244.2 504.6,244.2 483.8,244.2 462.9,244.2 442.1,244.2 421.2,244.2 400.4,244.2 379.6,244.2 358.7,244.2 337.9,244.2 317.0,244.2 296.2,244.2 275.3,244.2 254.5,244.2 233.6,244.2 212.8,244.2 192.0,244.2 171.1,244.2\" fill=\"#fff3e0\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"379.6\" y=\"257.0\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#1b3a2a\">砂漠</text><polygon points=\"171.1,244.2 266.4,244.2 266.4,142.3 261.6,144.2 256.9,146.2 252.1,148.1 247.3,150.1 242.6,152.1 237.8,154.0 233.0,156.0 228.3,157.9 223.5,159.9 218.8,161.9 214.0,163.8 209.2,165.8 204.5,167.7 199.7,169.7 194.9,171.7 190.2,173.6 185.4,175.6 180.6,177.5 175.9,179.5 171.1,181.5\" fill=\"#b2dfdb\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"218.8\" y=\"223.4\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#1b3a2a\">針葉樹林</text><polygon points=\"266.4,244.2 468.9,244.2 468.9,216.7 458.8,216.7 448.6,216.7 438.5,216.7 428.4,216.7 418.3,216.7 408.1,216.7 398.0,216.7 387.9,216.7 377.8,216.7 367.6,216.7 357.5,216.7 347.4,216.7 337.3,216.7 327.1,216.7 317.0,216.7 306.9,216.7 296.8,216.7 286.6,216.7 276.5,216.7 266. \" y=\"273\" text-anchor=\"middle\" font-size=\"10\">10</text><text x=\"468.9\" y=\"273\" text-anchor=\"middle\" font-size=\"10\">20</text><text x=\"588.0\" y=\"273\" text-anchor=\"middle\" font-size=\"10\">30</text><text x=\"47\" y=\"262.0\" text-anchor=\"end\" font-size=\"10\">0</text><text x=\"47\" y=\"206.9\" text-anchor=\"end\" font-size=\"10\">1000</text><text x=\"47\" y=\"151.8\" text-anchor=\"end\" font-size=\"10\">2000</text><text x=\"47\" y=\"96.7\" text-anchor=\"end\" font-size=\"10\">3000</text><text x=\"47\" y=\"41.6\" text-anchor=\"end\" font-size=\"10\">4000</text><text x=\"320.0\" y=\"292\" text-anchor=\"middle\">年平均気温（℃）</text><text transform=\"translate(12,134.0) rotate(-90)\" text-anchor=\"middle\">年降水量（mm）</text><text x=\"120\" y=\"40\" font-size=\"10\" fill=\"#555\">気温が低い地域は降水量も少ないので、</text><text x=\"120\" y=\"54\" font-size=\"10\" fill=\"#555\">左上には地域がない（模式図）</text></svg></div>\n<div class=\"cap\">図3　気温・降水量とバイオーム</div>\n<table class=\"t\" style=\"font-size:9.5pt\">\n<tr><th style=\"width:17%\">バイオーム</th><th>特徴・代表的な植物</th></tr>\n<tr><td>熱帯多雨林</td><td>高温多雨。高い木が多く、階層構造が発達。種類が非常に多い（フタバガキなど）</td></tr>\n<tr><td>亜熱帯多雨林</td><td>沖縄など。ガジュマル、ヘゴ。海岸にはマングローブ（ヒルギ類）</td></tr>\n<tr><td>雨緑樹林</td><td>雨季と乾季がある熱帯。<b>乾季に落葉</b>する（チーク）</td></tr>\n<tr><td>照葉樹林</td><td>暖温帯。<b>葉が厚く、表面に光沢</b>のある常緑広葉樹（スダジイ・タブノキ・クスノキ）</td></tr>\n<tr><td>硬葉樹林</td><td>夏に乾燥し冬に雨が多い地域（地中海沿岸）。小さくかたい葉の常緑樹（オリーブ・コルクガシ）</td></tr>\n<tr><td>夏緑樹林</td><td>冷温帯。<b>冬に落葉</b>する広葉樹（ブナ・ミズナラ）</td></tr>\n<tr><td>針葉樹林</td><td>亜寒帯。常緑の針葉樹（エゾマツ・トドマツ・シラビソ）</td></tr>\n<tr><td>サバンナ／ステップ</td><td>熱帯の草原（低木が点在）／温帯の草原（イネ科の草本が中心）</td></tr>\n<tr><td>砂漠／ツンドラ</td><td>降水量が極端に少ない（サボテン）／寒さがきびしい。地衣類・コケ植物</td></tr>\n</table>\n<h3>日本のバイオーム</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>日本は降水量が十分あるので、ほとんどの地域が<b>森林</b>になり、気温によってバイオームが変わります。</p>\n<p><b class=\"key\">水平分布</b>（緯度による変化）：南から、<b>亜熱帯多雨林</b>（沖縄・奄美）→ <b>照葉樹林</b>（九州〜関東の低地）→ <b>夏緑樹林</b>（東北〜北海道南西部）→ <b>針葉樹林</b>（北海道東北部）。</p>\n<p><b class=\"key\">垂直分布</b>（標高による変化）：標高が100m上がるごとに気温は約0.5〜0.6℃下がるので、山を登ると北へ行くのと同じように変化します（図4は中部地方）。高木の森林が見られなくなる境界を<b class=\"key\">森林限界</b>といいます。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 330 220\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10\"><defs><clipPath id=\"mt\"><path d=\"M10 200 L120 20 L230 200 Z\"/></clipPath></defs><rect x=\"0\" y=\"158.0\" width=\"240\" height=\"42.0\" fill=\"#a5d6a7\" clip-path=\"url(#mt)\"/><rect x=\"0\" y=\"98.0\" width=\"240\" height=\"60.0\" fill=\"#c8e6c9\" clip-path=\"url(#mt)\"/><rect x=\"0\" y=\"50.0\" width=\"240\" height=\"48.0\" fill=\"#b2dfdb\" clip-path=\"url(#mt)\"/><rect x=\"0\" y=\"20.0\" width=\"240\" height=\"30.0\" fill=\"#eceff1\" clip-path=\"url(#mt)\"/><path d=\"M10 200 L120 20 L230 200 Z\" fill=\"none\" stroke=\"#555\"/><line x1=\"0\" y1=\"158.0\" x2=\"240\" y2=\"158.0\" stroke=\"#777\" stroke-dasharray=\"3,2\"/><text x=\"244\" y=\"162.0\" font-size=\"9.5\">700m</text><line x1=\"0\" y1=\"98.0\" x2=\"240\" y2=\"98.0\" stroke=\"#777\" stroke-dasharray=\"3,2\"/><text x=\"244\" y=\"102.0\" font-size=\"9.5\">1700m</text><line x1=\"0\" y1=\"50.0\" x2=\"240\" y2=\"50.0\" stroke=\"#777\" stroke-dasharray=\"3,2\"/><text x=\"244\" y=\"54.0\" font-size=\"9.5\">2500m</text><text x=\"290\" y=\"44.0\" font-size=\"9\" fill=\"#c62828\" text-anchor=\"middle\">森林限界</text><text x=\"120\" y=\"183.0\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1b3a2a\">照葉樹林</text><text x=\"120\" y=\"132.0\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1b3a2a\">夏緑樹林</text><text x=\"120\" y=\"78.0\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1b3a2a\">針葉樹林</text><text x=\"120\" y=\"42.0\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1b3a2a\">高山草原</text></svg><div class=\"cap\">図4　垂直分布（中部地方）</div></div></div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：暖かさの指数</div>\n<b>暖かさの指数</b>＝ 月平均気温が5℃以上の月について、（月平均気温 − 5）を足し合わせた値。<br>\n例：月平均気温（1月〜12月）が 2, 3, 6, 12, 17, 21, 25, 26, 22, 16, 10, 5 ℃ → 5℃以上の月は <b>6, 12, 17, 21, 25, 26, 22, 16, 10, 5</b>（5℃の月は0を足すことになる）。<br>\n1＋7＋12＋16＋20＋21＋17＋11＋5＋0 ＝ <b>110</b> → <b>照葉樹林</b><br>\n<table class=\"t\" style=\"margin:1.5mm 0 0;font-size:9.2pt\"><tr><td class=\"c\">15〜45</td><td class=\"c\">45〜85</td><td class=\"c\">85〜180</td><td class=\"c\">180〜240</td><td class=\"c\">240以上</td></tr>\n<tr><td class=\"c\">針葉樹林</td><td class=\"c\">夏緑樹林</td><td class=\"c\">照葉樹林</td><td class=\"c\">亜熱帯多雨林</td><td class=\"c\">熱帯多雨林</td></tr></table></div>\n\n<h2>4. 個体群</h2>\n<h3>4-1　個体数の調べ方</h3>\n<p>一定の面積あたりの個体数を<b class=\"key\">個体群密度</b>といいます。植物のように動かない生物は、区画を決めて数える<b>区画法</b>で調べます。よく動く動物は<b class=\"key\">標識再捕法</b>で調べます。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：標識再捕法</div>\n池で50匹をつかまえて標識をつけて放した。数日後に60匹をつかまえたら、そのうち12匹に標識があった。<br>\n「2回目でつかまえた中の標識の割合」＝「池全体の中の標識の割合」と考えて、12/60 ＝ 50/N より、<b>N ＝ 50 × 60 ÷ 12 ＝ 250匹</b>。<br>\n<span style=\"font-size:9.5pt\">条件：標識が行動に影響しない、標識個体が全体に均一に混ざる、調査の間に出入りや出生・死亡がほとんどない。</span></div>\n<h3>4-2　個体群の成長と密度効果</h3>\n<div class=\"two\"><div><svg viewBox=\"0 0 290 200\" width=\"290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"160.0\" x2=\"220\" y2=\"160.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"130.4\" x2=\"220\" y2=\"130.4\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"100.8\" x2=\"220\" y2=\"100.8\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"71.2\" x2=\"220\" y2=\"71.2\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"41.6\" x2=\"220\" y2=\"41.6\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"220\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"175\" text-anchor=\"middle\">0</text><text x=\"104.0\" y=\"175\" text-anchor=\"middle\">20</text><text x=\"162.0\" y=\"175\" text-anchor=\"middle\">40</text><text x=\"220.0\" y=\"175\" text-anchor=\"middle\">60</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"160\" x2=\"220\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"133.0\" y=\"194\" text-anchor=\"middle\">時間</text><text transform=\"translate(12,86.0) rotate(-90)\" text-anchor=\"middle\">個体数</text><polyline points=\"46.0,156.4 51.8,155.5 57.6,154.4 63.4,152.9 69.2,151.2 75.0,149.0 80.8,146.3 86.6,143.1 92.4,139.4 98.2,135.0 104.0,129.9 109.8,124.2 115.6,117.9 121.4,111.2 127.2,104.2 133.0,97.1 138.8,90.1 144.6,83.4 150.4,77.2 156.2,71.5 162.0,66.5 167.8,62.1 173.6,58.3 179.4,55.2 185.2,52.5 191.0,50.4 196.8,48.6 202.6,47.2 208.4,46.0 214.2,45.1 220.0,44.4\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"179.4\" y=\"81.9\" font-weight=\"bold\" fill=\"#2e7d4f\">実際</text><polyline points=\"46.0,156.4 51.8,155.5 57.6,154.3 63.4,152.7 69.2,150.7 75.0,148.2 80.8,145.0 86.6,140.9 92.4,135.8 98.2,129.2 104.0,120.8 109.8,110.2 115.6,96.7 121.4,79.6 127.2,57.7 133.0,30.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"69.2\" y=\"21.5\" font-weight=\"bold\" fill=\"#c62828\">資源が無限なら</text><line x1=\"46\" y1=\"41.6\" x2=\"220\" y2=\"41.6\" stroke=\"#555\" stroke-dasharray=\"3,2\"/><text x=\"224\" y=\"39.6\" font-size=\"9.5\">環境</text><text x=\"224\" y=\"52.6\" font-size=\"9.5\">収容力</text></svg><div class=\"cap\">図5　個体群の成長曲線</div></div><div><svg viewBox=\"0 0 290 200\" width=\"290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"160.0\" x2=\"220\" y2=\"160.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"110.7\" x2=\"220\" y2=\"110.7\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"61.3\" x2=\"220\" y2=\"61.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"220\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"175\" text-anchor=\"middle\">0</text><text x=\"133.0\" y=\"175\" text-anchor=\"middle\">50</text><text x=\"220.0\" y=\"175\" text-anchor=\"middle\">100</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"160\" x2=\"220\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"133.0\" y=\"194\" text-anchor=\"middle\">相対年齢</text><text transform=\"translate(12,86.0) rotate(-90)\" text-anchor=\"middle\">生存数（対数）</text><polyline points=\"46.0,12.0 53.0,12.0 59.9,12.0 66.9,12.0 73.8,12.0 80.8,12.0 87.8,12.0 94.7,12.1 101.7,12.2 108.6,12.3 115.6,12.6 122.6,13.1 129.5,13.8 136.5,14.9 143.4,16.6 150.4,18.9 157.4,22.2 164.3,26.6 171.3,32.6 178.2,40.5 185.2,50.8 192.2,64.0 199.1,80.7 206.1,101.7 213.0,127.8 220.0,160.0\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"153.9\" y=\"24.3\" font-weight=\"bold\" fill=\"#2e7d4f\">晩死型</text><polyline points=\"46.0,12.0 53.0,17.9 59.9,23.8 66.9,29.8 73.8,35.7 80.8,41.6 87.8,47.5 94.7,53.4 101.7,59.4 108.6,65.3 115.6,71.2 122.6,77.1 129.5,83.0 136.5,89.0 143.4,94.9 150.4,100.8 157.4,106.7 164.3,112.6 171.3,118.6 178.2,124.5 185.2,130.4 192.2,136.3 199.1,142.2 206.1,148.2 213.0,154.1 220.0,160.0\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"136.5\" y=\"81.1\" font-weight=\"bold\" fill=\"#1565c0\">平均型</text><polyline points=\"46.0,12.0 53.0,39.3 59.9,62.5 66.9,81.9 73.8,98.1 80.8,111.5 87.8,122.5 94.7,131.4 101.7,138.5 108.6,144.1 115.6,148.5 122.6,151.8 129.5,154.4 136.5,156.2 143.4,157.6 150.4,158.5 157.4,159.1 164.3,159.5 171.3,159.7 178.2,159.9 185.2,160.0 192.2,160.0 199.1,160.0 206.1,160.0 213.0,160.0 220.0,160.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"2,2\" stroke-linejoin=\"round\"/><text x=\"87.8\" y=\"150.1\" font-weight=\"bold\" fill=\"#c62828\">早死型</text><text x=\"41\" y=\"164.0\" text-anchor=\"end\" font-size=\"10\">1</text><text x=\"41\" y=\"114.7\" text-anchor=\"end\" font-size=\"10\">10</text><text x=\"41\" y=\"65.3\" text-anchor=\"end\" font-size=\"10\">100</text><text x=\"41\" y=\"16.0\" text-anchor=\"end\" font-size=\"10\">1000</text></svg><div class=\"cap\">図6　生存曲線（出生数を1000とする）</div></div></div>\n<p>個体数は最初は急速に増えますが、増えるにつれて食物や生活空間が不足し、排出物も増えるので、増え方がにぶり、やがて一定になります（<b>S字状</b>の<b class=\"key\">成長曲線</b>）。その環境で維持できる最大の個体数を<b class=\"key\">環境収容力</b>といいます。個体群密度が、個体の成長や生殖などに影響することを<b class=\"key\">密度効果</b>といいます。</p>\n<p>トノサマバッタは、密度が低いと<b>孤独相</b>、高いと<b>群生相</b>（はねが長く、集団で長距離を移動する）になります。このように密度で形や行動が変わることを<b class=\"key\">相変異</b>といいます。</p>\n<p>生まれた個体が年齢とともにどれだけ生き残るかを表したものを<b class=\"key\">生存曲線</b>といいます（図6）。<b>晩死型</b>は親の保護が手厚く若いうちはあまり死なない（大型の哺乳類）、<b>早死型</b>は卵や子を大量に産むが若いうちに多くが死ぬ（多くの魚類や無脊椎動物）、<b>平均型</b>は死亡率がほぼ一定（鳥類など）です。</p>\n<h3>4-3　個体群の中の関係</h3>\n<ul>\n<li><b class=\"key\">群れ</b>：天敵を早く見つけ、防御しやすい。一方で、食物をめぐる争いが増える。</li>\n<li><b class=\"key\">縄張り</b>（テリトリー）：一定の空間を占有し、ほかの個体を追い払う（アユなど）。</li>\n<li><b>順位制</b>：群れの中で優劣の順位が決まり、争いが減る（ニワトリなど）。</li>\n<li><b>社会性昆虫</b>：ミツバチやアリでは、産卵する女王と、産卵せずに働くワーカーなどの分業（カースト）がある。</li>\n</ul>\n\n<h2>5. 異なる種の間の関係</h2>\n<div class=\"side\"><div class=\"txt\">\n<p><b class=\"key\">捕食と被食</b>：食べる側（捕食者）と食べられる側（被食者）の個体数は、周期的に変動します。<span class=\"em\">被食者が増えると少し遅れて捕食者が増え</span>、捕食者が増えると被食者が減る、をくり返します（図7）。</p>\n<p><b class=\"key\">種間競争</b>：食物やすみ場所など、<b>同じ資源</b>を必要とする種どうしは競争します。ゾウリムシとヒメゾウリムシを一緒に飼うと、やがてヒメゾウリムシだけが残ります（<b class=\"key\">競争的排除</b>）。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 300 190\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"150.0\" x2=\"230\" y2=\"150.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"115.5\" x2=\"230\" y2=\"115.5\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"81.0\" x2=\"230\" y2=\"81.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"46.5\" x2=\"230\" y2=\"46.5\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"230\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"165\" text-anchor=\"middle\">0</text><text x=\"107.3\" y=\"165\" text-anchor=\"middle\">10</text><text x=\"168.7\" y=\"165\" text-anchor=\"middle\">20</text><text x=\"230.0\" y=\"165\" text-anchor=\"middle\">30</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"150\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"150\" x2=\"230\" y2=\"150\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"138.0\" y=\"184\" text-anchor=\"middle\">時間（年）</text><text transform=\"translate(12,81.0) rotate(-90)\" text-anchor=\"middle\">個体数</text><polyline points=\"46.0,67.2 49.1,61.8 52.1,56.6 55.2,51.4 58.3,46.4 61.3,41.7 64.4,37.3 67.5,33.3 70.5,29.7 73.6,26.6 76.7,23.9 79.7,21.8 82.8,20.3 85.9,19.3 88.9,18.9 92.0,19.1 95.1,19.9 98.1,21.3 101.2,23.3 104.3,25.8 107.3,28.8 110.4,32.3 113.5,36.2 116.5,40.5 119.6,45.1 122.7,50.0 125.7,55.1 128.8,60.4 131.9,65.7 134.9,71.1 138.0,76.4 141.1,81.6 144.1,86.6 147.2,91.4 150.3,95.9 153.3,100.0 156.4,103.8 159.5,107.0 162.5,109.8 165.6,112.1 168.7,113.8 171.7,114.9 174.8,115.4 177.9,115.4 180.9,114.7 184.0,113.5 187.1,111.7 190.1,109.4 193.2,106.5 196.3,103.1 199.3,99.3 202.4,95.1 205.5,90.6 208.5,85.8 211.6,80.7 214.7,75.5 217.7,70.1 220.8,64.8 223.9,59.4 226.9,54.2 230.0,49.1\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"235.0\" y=\"53.1\" font-weight=\"bold\" fill=\"#2e7d4f\">被食者</text><polyline points=\"46.0,131.5 49.1,130.9 52.1,130.1 55.2,129.1 58.3,128.0 61.3,126.7 64.4,125.3 67.5,123.8 70.5,122.1 73.6,120.4 76.7,118.6 79.7,116.8 82.8,114.9 85.9,113.1 88.9,111.3 92.0,109.6 95.1,107.9 98.1,106.3 101.2,104.8 104.3,103.5 107.3,102.3 110.4,101.3 113.5,100.4 116.5,99.8 119.6,99.3 122.7,99.0 125.7,98.9 128.8,99.1 131.9,99.4 134.9,100.0 138.0,100.7 141.1,101.6 144.1,102.7 147.2,103.9 150.3,105.3 153.3,106.8 156.4,108.4 159.5,110.1 162.5,111.9 165.6,113.7 168.7,115.5 171.7,117.4 174.8,119.2 177.9,121.0 180.9,122.7 184.0,124.3 187.1,125.8 190.1,127.2 193.2,128.4 196.3,129.5 199.3,130.4 202.4,131.1 205.5,131.6 208.5,131.9 211.6,132.1 214.7,132.0 217.7,131.7 220.8,131.2 223.9,130.5 226.9,129.7 230.0,128.6\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"235.0\" y=\"132.6\" font-weight=\"bold\" fill=\"#c62828\">捕食者</text></svg><div class=\"cap\">図7　捕食者と被食者の個体数の変動</div></div></div>\n<p>生物群集の中で、ある種が占める位置（食物の種類、すみ場所、活動時間など）を<b class=\"key\">生態的地位</b>（ニッチ）といいます。ニッチが重なるほど競争が激しくなります。ニッチを少しずつずらすと共存できます。</p>\n<table class=\"t\">\n<tr><th style=\"width:18%\">関係</th><th>内容と例</th></tr>\n<tr><td><b>すみわけ</b></td><td>すみ場所を分けて共存する（川の上流にイワナ、下流にヤマメ）</td></tr>\n<tr><td><b>食いわけ</b></td><td>食物の種類を分けて共存する</td></tr>\n<tr><td><b>相利共生</b></td><td>両方が利益を得る（アリとアブラムシ、マメ科植物と根粒菌、クマノミとイソギンチャク）</td></tr>\n<tr><td><b>片利共生</b></td><td>一方だけが利益を得て、もう一方は利益も害もない（コバンザメとサメ）</td></tr>\n<tr><td><b>寄生</b></td><td>一方（寄生者）が利益を得て、もう一方（宿主）が害を受ける（カイチュウとヒト）</td></tr>\n</table>\n\n<h2>6. 生態系の構造</h2>\n<table class=\"t\">\n<tr><th style=\"width:18%\">役割</th><th>内容</th></tr>\n<tr><td><b class=\"key\">生産者</b></td><td>光合成で無機物から有機物をつくる（植物・藻類・シアノバクテリア）</td></tr>\n<tr><td><b class=\"key\">消費者</b></td><td>ほかの生物を食べて有機物を得る。植物を食べる<b>一次消費者</b>、一次消費者を食べる<b>二次消費者</b>…</td></tr>\n<tr><td><b class=\"key\">分解者</b></td><td>遺体や排出物の有機物を無機物に分解する（菌類・細菌）。消費者の一部とみなす</td></tr>\n</table>\n<p>「食べる・食べられる」のつながりを<b class=\"key\">食物連鎖</b>といい、実際には複雑な網の目になっているので<b class=\"key\">食物網</b>といいます。食物連鎖の段階を<b class=\"key\">栄養段階</b>といいます。栄養段階ごとの個体数や生物量（重さ）を積み重ねた図を<b class=\"key\">生態ピラミッド</b>といいます。上の段階ほど小さくなるのがふつうですが、個体数ピラミッドは逆転することがあります（1本の木に多数の昆虫）。</p>\n\n<h2>7. 物質生産とエネルギーの流れ</h2>\n<div class=\"fig\"><svg viewBox=\"0 0 640 250\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10.5\"><text x=\"10\" y=\"52\" font-weight=\"bold\" fill=\"#2e7d4f\">生産者</text><rect x=\"70\" y=\"40\" width=\"250\" height=\"34\" fill=\"#ffccbc\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"195.0\" y=\"61\" text-anchor=\"middle\" font-size=\"10.5\">呼吸量</text><rect x=\"320\" y=\"40\" width=\"120\" height=\"34\" fill=\"#c8e6c9\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"380.0\" y=\"61\" text-anchor=\"middle\" font-size=\"10.5\">成長量</text><rect x=\"440\" y=\"40\" width=\"80\" height=\"34\" fill=\"#fff59d\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"480.0\" y=\"61\" text-anchor=\"middle\" font-size=\"10.5\">被食量</text><rect x=\"520\" y=\"40\" width=\"90\" height=\"34\" fill=\"#d7ccc8\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"565.0\" y=\"61\" text-anchor=\"middle\" font-size=\"10.5\">枯死量</text><path d=\"M70 38 L70 32 L610 32 L610 38\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"340.0\" y=\"28\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#333\">総生産量（光合成でつくった有機物の総量）</text><path d=\"M320 76 L320 82 L610 82 L610 76\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"1.3\"/><text x=\"465.0\" y=\"95\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#2e7d4f\">純生産量</text><text x=\"10\" y=\"184\" font-weight=\"bold\" fill=\"#c62828\">一次</text><text x=\"10\" y=\"198\" font-weight=\"bold\" fill=\"#c62828\">消費者</text><rect x=\"130\" y=\"170\" width=\"110\" height=\"34\" fill=\"#eceff1\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"185.0\" y=\"191\" text-anchor=\"middle\" font-size=\"10\">不消化排出量</text><rect x=\"240\" y=\"170\" width=\"150\" height=\"34\" fill=\"#ffccbc\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"315.0\" y=\"191\" text-anchor=\"middle\" font-size=\"10\">呼吸量</text><rect x=\"390\" y=\"170\" width=\"70\" height=\"34\" fill=\"#c8e6c9\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"425.0\" y=\"191\" text-anchor=\"middle\" font-size=\"10\">成長量</text><rect x=\"460\" y=\"170\" width=\"54\" height=\"34\" fill=\"#fff59d\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"487.0\" y=\"191\" text-anchor=\"middle\" font-size=\"10\">被食量</text><rect x=\"514\" y=\"170\" width=\"46\" height=\"34\" fill=\"#d7ccc8\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"537.0\" y=\"191\" text-anchor=\"middle\" font-size=\"9.5\">死滅量</text><path d=\"M440 74 L130 170\" stroke=\"#999\" stroke-dasharray=\"4,3\" fill=\"none\"/><path d=\"M520 74 L560 170\" stroke=\"#999\" stroke-dasharray=\"4,3\" fill=\"none\"/><path d=\"M130 168 L130 162 L560 162 L560 168\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"345.0\" y=\"158\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#333\">摂食量（＝生産者の被食量）</text><path d=\"M240 206 L240 212 L560 212 L560 206\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"1.3\"/><text x=\"315.0\" y=\"225\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1565c0\">同化量</text><path d=\"M390 206 L390 228 L560 228 L560 206\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.3\"/><text x=\"475.0\" y=\"242\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#c62828\">生産量</text></svg></div>\n<div class=\"cap\">図8　生産者と消費者の物質収支（一定期間・一定面積あたり）</div>\n<table class=\"t\" style=\"font-size:9.6pt\">\n<tr><th style=\"width:50%\">生産者</th><th>消費者</th></tr>\n<tr><td><b>純生産量</b> ＝ 総生産量 − 呼吸量<br><b>成長量</b> ＝ 純生産量 −（被食量 ＋ 枯死量）</td>\n<td><b>同化量</b> ＝ 摂食量 − 不消化排出量<br><b>生産量</b> ＝ 同化量 − 呼吸量<br><b>成長量</b> ＝ 生産量 −（被食量 ＋ 死滅量）</td></tr>\n</table>\n<p>ある栄養段階が、前の段階のエネルギーのうちどれだけを利用したかを<b class=\"key\">エネルギー効率</b>といいます。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：物質収支とエネルギー効率</div>\n生産者：総生産量1000、呼吸量550、被食量100、枯死量150 → 純生産量 ＝ 1000−550 ＝ <b>450</b>、成長量 ＝ 450−100−150 ＝ <b>200</b><br>\n一次消費者：摂食量100（生産者の被食量）、不消化排出量30、呼吸量40 → 同化量 ＝ <b>70</b>、生産量 ＝ <b>30</b><br>\n<b>エネルギー効率</b>（%）＝ その栄養段階の<b>同化量</b> ÷ 1つ前の栄養段階の同化量 × 100<br>\n・一次消費者：70 ÷ 1000（生産者は総生産量を使う）× 100 ＝ <b>7%</b><br>\n・生産者：総生産量 ÷ 届いた光エネルギー × 100（光100,000なら 1000÷100,000×100 ＝ <b>1%</b>）</div>\n<p>エネルギーは、光エネルギー → 化学エネルギー（有機物）として生態系に入り、栄養段階を上がるごとに呼吸で使われて<b>熱</b>として出ていきます。<span class=\"em\">物質は循環するが、エネルギーは循環しない</span>（一方向に流れる）のがポイントです。</p>\n\n<h2>8. 物質の循環</h2>\n<h3>8-1　炭素の循環</h3>\n<p>大気中のCO₂は、生産者の<b>光合成</b>で有機物になり、食物連鎖で消費者に移ります。生物の<b>呼吸</b>や分解者による分解で、再びCO₂として大気に戻ります。地中に埋まった遺体は、長い年月で石油・石炭などの<b>化石燃料</b>になり、燃やすとCO₂が放出されます。</p>\n<h3>8-2　窒素の循環</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 240\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10.5\"><defs><marker id=\"g1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><rect x=\"240\" y=\"8\" width=\"160\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#1565c0\" stroke-width=\"2\"/><text x=\"320.0\" y=\"29.0\" text-anchor=\"middle\" font-weight=\"bold\">大気中の窒素（N₂）</text><rect x=\"20\" y=\"108\" width=\"150\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#6d4c41\" stroke-width=\"2\"/><text x=\"95.0\" y=\"126\" text-anchor=\"middle\" font-weight=\"bold\">NH₄⁺</text><text x=\"95.0\" y=\"142\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">アンモニウムイオン</text><rect x=\"250\" y=\"108\" width=\"150\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#6d4c41\" stroke-width=\"2\"/><text x=\"325.0\" y=\"126\" text-anchor=\"middle\" font-weight=\"bold\">NO₃⁻</text><text x=\"325.0\" y=\"142\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">硝酸イオン</text><rect x=\"470\" y=\"100\" width=\"160\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"550.0\" y=\"118\" text-anchor=\"middle\" font-weight=\"bold\">植物</text><text x=\"550.0\" y=\"134\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">窒素同化：アミノ酸・タンパク質</text><rect x=\"470\" y=\"190\" width=\"160\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"550.0\" y=\"211.0\" text-anchor=\"middle\" font-weight=\"bold\">動物（消費者）</text><rect x=\"20\" y=\"190\" width=\"170\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#6d4c41\" stroke-width=\"2\"/><text x=\"105.0\" y=\"211.0\" text-anchor=\"middle\" font-weight=\"bold\">分解者（菌類・細菌）</text><path d=\"M240 32 C 150 40, 110 60, 98 104\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/><text x=\"122\" y=\"74\" font-weight=\"bold\" fill=\"#1565c0\">窒素固定</text><text x=\"110\" y=\"89\" font-size=\"9\" fill=\"#1565c0\">根粒菌・アゾトバクター・ネンジュモ</text><path d=\"M172 129 L246 129\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/><text x=\"186\" y=\"122\" font-weight=\"bold\">硝化</text><text x=\"210\" y=\"166\" font-size=\"9\" text-anchor=\"middle\">亜硝酸菌・硝酸菌</text><path d=\"M330 106 L330 46\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/><text x=\"338\" y=\"72\" font-weight=\"bold\" fill=\"#c62828\">脱窒</text><text x=\"338\" y=\"86\" font-size=\"9\" fill=\"#c62828\">（脱窒素細菌）</text><path d=\"M402 126 L466 126\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/><text x=\"414\" y=\"119\" font-size=\"10\">吸収</text><path d=\"M550 154 L550 186\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/><text x=\"556\" y=\"174\" font-size=\"10\">食べる</text><path d=\"M466 207 L194 207\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/><text x=\"330\" y=\"201\" font-size=\"9.5\" text-anchor=\"middle\">動植物の遺体・排出物</text><path d=\"M95 188 L95 154\" stroke=\"#333\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#g1)\"/></svg></div>\n<div class=\"cap\">図9　窒素の循環</div>\n<ul>\n<li><b class=\"key\">窒素固定</b>：大気中のN₂を<b>NH₄⁺</b>に変えるはたらき。<b>根粒菌</b>（マメ科植物と共生）、アゾトバクター、ネンジュモ（シアノバクテリア）など、ごく一部の細菌だけができる。</li>\n<li><b class=\"key\">硝化</b>：NH₄⁺を<b>亜硝酸菌</b>がNO₂⁻に、<b>硝酸菌</b>がNO₃⁻に変える。</li>\n<li><b class=\"key\">窒素同化</b>：植物がNH₄⁺やNO₃⁻を吸収し、アミノ酸・タンパク質・核酸などの有機窒素化合物をつくる。動物は食べることで窒素を得る。</li>\n<li><b class=\"key\">脱窒</b>：脱窒素細菌がNO₃⁻をN₂に戻して大気へ放出する。</li>\n</ul>\n\n<h2>9. 生態系のバランスと保全</h2>\n<p>生態系は、台風や山火事などの<b class=\"key\">かく乱</b>を受けても、もとに戻ろうとする力（<b>復元力</b>）をもっています。中程度のかく乱がときどき起こる場所では、多くの種が共存しやすくなります（<b>中規模かく乱説</b>）。</p>\n<ul>\n<li><b class=\"key\">キーストーン種</b>：生態系のバランスに大きな影響をもつ種。<b>ラッコ</b>はウニを食べるので、ラッコが減るとウニが増え、ウニが海藻（ケルプ）を食べつくして、ケルプの森にすむ生物が減った。このように、ある種が直接食べない種にまで影響することを<b>間接効果</b>という。</li>\n<li><b class=\"key\">富栄養化</b>：生活排水などで窒素やリンが増えると、植物プランクトンが大発生し、海では<b>赤潮</b>、湖沼では<b>アオコ</b>（水の華）が起こる。死んだプランクトンの分解で酸素が不足し、魚が死ぬこともある。少量の汚れなら、希釈や分解者のはたらきで浄化される（<b class=\"key\">自然浄化</b>）。</li>\n<li><b class=\"key\">生物濃縮</b>：分解されにくく体外に出されにくい物質（DDT・PCB・有機水銀など）が、<span class=\"em\">食物連鎖を通じて上の栄養段階ほど高濃度にたまる</span>。</li>\n<li><b class=\"key\">外来生物</b>：人間によってほかの地域から持ちこまれ定着した生物（オオクチバス、マングース、アライグマなど）。在来種を食べたり競争に勝ったりして、生態系を変える。特に影響の大きいものは<b>特定外来生物</b>として飼育などが規制されている。</li>\n<li><b>地球温暖化</b>：化石燃料の燃焼などで、CO₂やメタンなどの<b>温室効果ガス</b>が増え、気温が上昇している。</li>\n<li><b class=\"key\">生物多様性</b>には、<b>遺伝的多様性</b>（同じ種の中の遺伝子のちがい）、<b>種多様性</b>、<b>生態系多様性</b>の3つの見方がある。絶滅のおそれのある生物は<b>レッドリスト</b>にまとめられている。人が適度に手入れをしてきた<b>里山</b>は、多様な生物のすみかになっている。</li>\n</ul>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>個体 → 個体群 → 生物群集 → 生態系。作用と環境形成作用</li>\n<li>森林の階層構造（高木層〜地表層）。林床は暗く、陰生植物が多い</li>\n<li>一次遷移：裸地 → 地衣類・コケ → 草原 → 低木林 → 陽樹林 → 混交林 → 陰樹林（極相）</li>\n<li>陽樹の芽ばえは暗い林床で育たず、陰樹の芽ばえは育つので、陰樹林になる</li>\n<li>二次遷移は土壌・種子・根が残るので速い。ギャップ更新</li>\n<li>バイオームは年平均気温と年降水量で決まる。照葉樹林・夏緑樹林・針葉樹林の特徴</li>\n<li>日本の水平分布と垂直分布（丘陵帯・山地帯・亜高山帯・高山帯、森林限界）。暖かさの指数</li>\n<li>標識再捕法：N ＝ 最初の標識数 × 2回目の捕獲数 ÷ 2回目の中の標識数</li>\n<li>S字状の成長曲線・環境収容力・密度効果・相変異。生存曲線の3つの型</li>\n<li>捕食・被食の周期変動、種間競争と競争的排除、ニッチ、すみわけ、相利共生・寄生</li>\n<li>生産者・消費者・分解者、食物連鎖・食物網・栄養段階・生態ピラミッド</li>\n<li>純生産量＝総生産量−呼吸量、同化量＝摂食量−不消化排出量、エネルギー効率</li>\n<li>物質は循環し、エネルギーは循環しない。窒素固定・硝化・窒素同化・脱窒</li>\n<li>キーストーン種、富栄養化、生物濃縮、外来生物、生物多様性</li>\n</ul>\n<h3 style=\"margin-top:5mm\">メモ：わからなかったこと・生徒に聞かれそうなこと</h3>\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>発達した森林の階層構造を、上から順に5つ答えよ。<br><span class=\"blank\"></span>→<span class=\"blank\"></span>→<span class=\"blank\"></span>→<span class=\"blank\"></span>→<span class=\"blank\"></span></li>\n<li>一次遷移（乾性遷移）で、陽樹林がやがて陰樹林になる理由を、林床の明るさと芽ばえに注目して説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n<li>二次遷移が一次遷移より速く進む理由を答えよ。<div class=\"wline\"></div></li>\n<li>月平均気温（1月〜12月）が −4, −3, 1, 7, 12, 16, 20, 22, 17, 11, 4, −1 ℃の地域の暖かさの指数を求め、成立するバイオームを答えよ。<br>暖かさの指数 <span class=\"blank\" style=\"min-width:16mm\"></span>　バイオーム <span class=\"blank\"></span></li>\n<li>ある林で30匹のネズミに標識をつけて放した。後日45匹をつかまえたところ、9匹に標識があった。この林のネズミは何匹と推定されるか。 <span class=\"blank\" style=\"min-width:20mm\"></span></li>\n<li>次の関係を何というか。<br>(a) ゾウリムシとヒメゾウリムシを一緒に飼うと、ヒメゾウリムシだけが残った <span class=\"blank\"></span><br>(b) 川の上流にイワナ、下流にヤマメがすむ <span class=\"blank\"></span>　(c) アリとアブラムシ <span class=\"blank\"></span></li>\n<li>ある生産者の総生産量が800、呼吸量が450、被食量が60、枯死量が90であった（相対値）。<br>(1) 純生産量 <span class=\"blank\" style=\"min-width:16mm\"></span>　(2) 成長量 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li>次のはたらきを何というか。また、(a)を行う生物を1つ答えよ。<br>(a) 大気中のN₂をNH₄⁺に変える <span class=\"blank\"></span>　生物 <span class=\"blank\"></span><br>(b) NH₄⁺をNO₃⁻に変える <span class=\"blank\"></span>　(c) NO₃⁻をN₂に戻す <span class=\"blank\"></span></li>\n<li>生物濃縮とは何か。どのような物質で起こるかもふくめて説明せよ。<div class=\"wline\"></div></li>\n<li><b>説明の練習</b>　「キーストーン種」とは何かを、ラッコ・ウニ・海藻の例を使って、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　高木層 → 亜高木層 → 低木層 → 草本層 → 地表層</b></p>\n<p><b>2.　解答例</b>　陽樹林の林床は暗いので、陽樹の芽ばえは育たないが、陰樹の芽ばえは弱い光でも育つ。そのため、陽樹が枯れると陰樹が入れかわり、陰樹林になる。</p>\n<p><b>3.　解答例</b>　土壌が残っていて、土壌の中に種子や根などが残っているから。</p>\n<p><b>4.　暖かさの指数 70　夏緑樹林</b>　5℃以上の月は 7, 12, 16, 20, 22, 17, 11。2＋7＋11＋15＋17＋12＋6 ＝ 70。45〜85なので夏緑樹林。</p>\n<p><b>5.　150匹</b>　30 × 45 ÷ 9 ＝ 150。</p>\n<p><b>6.　(a) 種間競争（競争的排除）　(b) すみわけ　(c) 相利共生</b></p>\n<p><b>7.　(1) 350　(2) 200</b>　(1) 800 − 450 ＝ 350。(2) 350 − 60 − 90 ＝ 200。</p>\n<p><b>8.　(a) 窒素固定　生物：根粒菌（アゾトバクター、ネンジュモでもよい）　(b) 硝化　(c) 脱窒</b></p>\n<p><b>9.　解答例</b>　分解されにくく体外に排出されにくい物質（DDT・PCB・有機水銀など）が、食物連鎖を通じて、上の栄養段階の生物ほど高い濃度で体内にたまること。</p>\n<p><b>10.　解答例</b>　キーストーン種とは、数は少なくても生態系のバランスに大きな影響を与える種のことです。ラッコはウニを食べます。ラッコがいなくなるとウニが増えすぎて海藻を食べつくし、海藻の森にすんでいた多くの生物がいなくなってしまいました。ラッコは海藻を直接食べないのに、海藻の森を守っていたのです。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第12回 進化と系統）に向けて</div>\n最終回は、生物がどのように誕生し、どのように多様になってきたかを学びます。第2回の<b>突然変異</b>、第6回の<b>遺伝</b>（遺伝子型と表現型）が、進化のしくみの土台になります。</div>\n</details>", "heads": ["0. 生態学の見取り図", "1. 植生", "2. 遷移", "3. バイオーム", "4. 個体群", "5. 異なる種の間の関係", "6. 生態系の構造", "7. 物質生産とエネルギーの流れ", "8. 物質の循環", "9. 生態系のバランスと保全", "この回のまとめ", "確認問題"]}, "12": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第12回　進化と系統</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>生命の誕生から現在までの流れ（化学進化・細胞内共生説・地質時代）を説明できる</li>\n<li>突然変異・自然選択・遺伝的浮動による進化のしくみと、種分化を説明できる</li>\n<li>ハーディー・ワインベルグの法則で遺伝子頻度・遺伝子型の頻度を計算できる</li>\n<li>進化の証拠（相同器官・分子時計など）と、生物の分類・系統（3ドメイン、植物・動物の系統）を説明できる</li>\n<li>人類の進化の特徴を説明できる</li>\n</ul></div>\n\n<h2>0. 進化とは</h2>\n<p><b class=\"key\">進化</b>とは、生物の集団がもつ遺伝的な性質が、世代を重ねるうちに変化していくことです。<span class=\"em\">1匹の個体が一生のうちに変わることは進化ではありません</span>。進化をもたらすのは、第2回で学んだ<b>DNAの変化（突然変異）</b>と、第6回で学んだ<b>遺伝</b>のしくみです。生物が共通の祖先から枝分かれしてきた道すじを<b class=\"key\">系統</b>といいます。</p>\n\n<h2>1. 生命の誕生</h2>\n<h3>1-1　化学進化</h3>\n<p>地球は約46億年前に誕生しました。生命が生まれる前に、無機物から有機物（アミノ酸・糖・塩基など）ができ、それらが組み合わさって生命のもとになったと考えられています。これを<b class=\"key\">化学進化</b>といいます。<b>ミラー</b>は、原始の大気を想定した気体（メタン・アンモニア・水素・水蒸気）に放電すると、<b>アミノ酸</b>ができることを実験で示しました。</p>\n<p>最初の生命では、遺伝情報も酵素のはたらきも<b>RNA</b>が担っていたという考え（<b class=\"key\">RNAワールド</b>）があります。のちに、遺伝情報はより安定なDNAに、酵素のはたらきはタンパク質に移ったと考えられています。最古の生物の化石は約35億年前の<b>原核生物</b>です。</p>\n<h3>1-2　光合成と酸素</h3>\n<p>約27億年前に、光合成をして酸素を出す<b class=\"key\">シアノバクテリア</b>が増えました（シアノバクテリアがつくった層状の岩石を<b>ストロマトライト</b>という）。酸素が増えると、酸素を使う<b>呼吸</b>（第5回）を行う生物が栄え、上空には<b>オゾン層</b>ができて有害な紫外線が弱まり、のちの<b>陸上進出</b>が可能になりました。</p>\n<h3>1-3　細胞内共生説</h3>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">原始的な真核細胞</div><div class=\"fbs\">核をもつ</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">好気性細菌を取りこむ</div><div class=\"fbs\">→ ミトコンドリア</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">シアノバクテリアを取りこむ</div><div class=\"fbs\">→ 葉緑体</div></div></div>\n<p>約20億年前に<b>真核生物</b>が現れました。ミトコンドリアと葉緑体は、もともと別の原核生物が細胞に取りこまれて共生したものだという考えを<b class=\"key\">細胞内共生説</b>（マーグリス）といいます。根拠は、<span class=\"em\">ミトコンドリアと葉緑体が独自のDNAをもち、二重の膜で包まれ、分裂して増える</span>ことです。</p>\n\n<h2>2. 地質時代と生物の変遷</h2>\n<div class=\"fig\"><svg viewBox=\"0 0 640 250\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10\"><rect x=\"20\" y=\"58\" width=\"600\" height=\"20\" fill=\"#e8f5e9\" stroke=\"#2e7d4f\"/><rect x=\"549.6\" y=\"58\" width=\"70.4\" height=\"20\" fill=\"#a5d6a7\" stroke=\"#2e7d4f\"/><text x=\"280.9\" y=\"72\" text-anchor=\"middle\" font-size=\"10.5\">先カンブリア時代</text><line x1=\"20.0\" y1=\"58\" x2=\"20.0\" y2=\"52\" stroke=\"#333\"/><text x=\"20.0\" y=\"46\" text-anchor=\"start\">地球の誕生</text><text x=\"20.0\" y=\"34\" text-anchor=\"start\" font-size=\"9\" fill=\"#777\">46億年前</text><line x1=\"98.3\" y1=\"78\" x2=\"98.3\" y2=\"84\" stroke=\"#333\"/><text x=\"98.3\" y=\"102\" text-anchor=\"middle\">生命の誕生</text><text x=\"98.3\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">40億年前</text><line x1=\"267.8\" y1=\"58\" x2=\"267.8\" y2=\"52\" stroke=\"#333\"/><text x=\"267.8\" y=\"34\" text-anchor=\"middle\">シアノバクテリアが</text><text x=\"267.8\" y=\"46\" text-anchor=\"middle\">酸素を出す</text><text x=\"267.8\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">27億年前</text><line x1=\"359.1\" y1=\"78\" x2=\"359.1\" y2=\"84\" stroke=\"#333\"/><text x=\"359.1\" y=\"102\" text-anchor=\"middle\">真核生物</text><text x=\"359.1\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">20億年前</text><line x1=\"489.6\" y1=\"58\" x2=\"489.6\" y2=\"52\" stroke=\"#333\"/><text x=\"489.6\" y=\"46\" text-anchor=\"middle\">多細胞生物</text><text x=\"489.6\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">10億年前</text><line x1=\"549.6\" y1=\"78\" x2=\"549.6\" y2=\"84\" stroke=\"#333\"/><text x=\"549.6\" y=\"102\" text-anchor=\"middle\">カンブリア紀</text><text x=\"549.6\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">5.4億年前</text><path d=\"M549.6 78 L20 170\" stroke=\"#999\" stroke-dasharray=\"3,3\"/><path d=\"M620 78 L620 170\" stroke=\"#999\" stroke-dasharray=\"3,3\"/><rect x=\"20.0\" y=\"170\" width=\"320.0\" height=\"22\" fill=\"#c8e6c9\" stroke=\"#555\"/><text x=\"180.0\" y=\"185\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"10.5\">古生代</text><rect x=\"340.0\" y=\"170\" width=\"206.7\" height=\"22\" fill=\"#fff59d\" stroke=\"#555\"/><text x=\"443.3\" y=\"185\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"10.5\">中生代</text><rect x=\"546.7\" y=\"170\" width=\"73.3\" height=\"22\" fill=\"#ffccbc\" stroke=\"#555\"/><text x=\"583.3\" y=\"185\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"10.5\">新生代</text><line x1=\"20.0\" y1=\"170\" x2=\"20.0\" y2=\"164\" stroke=\"#333\"/><text x=\"20.0\" y=\"161\" text-anchor=\"start\">動物の多様化</text><line x1=\"142.2\" y1=\"192\" x2=\"142.2\" y2=\"198\" stroke=\"#333\"/><text x=\"142.2\" y=\"209\" text-anchor=\"middle\">植物の上陸</text><line x1=\"208.9\" y1=\"170\" x2=\"208.9\" y2=\"164\" stroke=\"#333\"/><text x=\"208.9\" y=\"161\" text-anchor=\"middle\">両生類</text><line x1=\"275.6\" y1=\"192\" x2=\"275.6\" y2=\"198\" stroke=\"#333\"/><text x=\"275.6\" y=\"209\" text-anchor=\"middle\">爬虫類</text><line x1=\"340.0\" y1=\"170\" x2=\"340.0\" y2=\"164\" stroke=\"#333\"/><text x=\"340.0\" y=\"161\" text-anchor=\"middle\">大量絶滅</text><line x1=\"375.6\" y1=\"192\" x2=\"375.6\" y2=\"198\" stroke=\"#333\"/><text x=\"375.6\" y=\"209\" text-anchor=\"middle\">恐竜・哺乳類</text><line x1=\"453.3\" y1=\"170\" x2=\"453.3\" y2=\"164\" stroke=\"#333\"/><text x=\"453.3\" y=\"161\" text-anchor=\"middle\">鳥類</text><line x1=\"475.6\" y1=\"192\" x2=\"475.6\" y2=\"198\" stroke=\"#333\"/><text x=\"475.6\" y=\"209\" text-anchor=\"middle\">被子植物</text><line x1=\"546.7\" y1=\"170\" x2=\"546.7\" y2=\"164\" stroke=\"#333\"/><text x=\"546.7\" y=\"161\" text-anchor=\"middle\">恐竜の絶滅</text><line x1=\"612.2\" y1=\"192\" x2=\"612.2\" y2=\"198\" stroke=\"#333\"/><text x=\"612.2\" y=\"209\" text-anchor=\"middle\">人類</text><text x=\"20.0\" y=\"224\" text-anchor=\"start\" font-size=\"9\" fill=\"#777\">5.4億年前</text><text x=\"175.6\" y=\"224\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">4億年前</text><text x=\"286.7\" y=\"224\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">3億年前</text><text x=\"397.8\" y=\"224\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">2億年前</text><text x=\"508.9\" y=\"224\" text-anchor=\"middle\" font-size=\"9\" fill=\"#777\">1億年前</text><text x=\"620.0\" y=\"224\" text-anchor=\"end\" font-size=\"9\" fill=\"#777\">0（現在）</text></svg></div>\n<div class=\"cap\">図1　地球と生物の歴史（上：46億年全体、下：最近5.4億年を拡大。数字はおよその年代）</div>\n<p>化石が多く見つかるようになるカンブリア紀以降は、<b>古生代・中生代・新生代</b>に分けられます。境目では、多くの生物が一度に絶滅する<b class=\"key\">大量絶滅</b>が起こり、そのあと生き残ったグループが多様化しました。</p>\n<table class=\"t\" style=\"font-size:9.5pt\">\n<tr><th style=\"width:11%\">代</th><th style=\"width:14%\">紀</th><th>主なできごと</th></tr>\n<tr><td rowspan=\"6\"><b>古生代</b><br><span style=\"font-size:8.5pt\">5.4〜2.5億年前</span></td><td>カンブリア紀</td><td>多様な動物が一気に出現（<b>カンブリア紀の大爆発</b>、バージェス動物群・三葉虫）</td></tr>\n<tr><td>オルドビス紀</td><td>あごのない魚類（無顎類）の出現</td></tr>\n<tr><td>シルル紀</td><td><b>植物が陸上へ</b>進出（オゾン層で紫外線が弱まる）。節足動物も上陸</td></tr>\n<tr><td>デボン紀</td><td>魚類が繁栄、<b>両生類</b>の出現。シダ植物・裸子植物の出現</td></tr>\n<tr><td>石炭紀</td><td><b>シダ植物の大森林</b>（のちの石炭）、<b>爬虫類</b>の出現</td></tr>\n<tr><td>ペルム紀</td><td>裸子植物がふえる。末に史上最大の<b>大量絶滅</b></td></tr>\n<tr><td rowspan=\"3\"><b>中生代</b><br><span style=\"font-size:8.5pt\">2.5億〜6600万年前</span></td><td>三畳紀</td><td><b>恐竜・哺乳類</b>の出現。裸子植物が繁栄</td></tr>\n<tr><td>ジュラ紀</td><td>恐竜の繁栄、<b>鳥類</b>（始祖鳥）の出現</td></tr>\n<tr><td>白亜紀</td><td><b>被子植物</b>の出現。末に<b>恐竜などが絶滅</b>（巨大いん石の衝突）</td></tr>\n<tr><td><b>新生代</b></td><td>古第三紀〜第四紀</td><td><b>哺乳類・被子植物</b>の繁栄。<b>人類</b>の出現（約700万年前）</td></tr>\n</table>\n\n<h2>3. 進化のしくみ</h2>\n<h3>3-1　変異の源：突然変異</h3>\n<p>同じ種でも個体ごとに形質がちがうことを<b>変異</b>といいます。遺伝する変異のもとは<b class=\"key\">突然変異</b>（DNAの塩基配列の変化：置換・挿入・欠失、第2回）です。さらに、減数分裂での染色体の組み合わせや組換え（第6回）によって、多様な遺伝子の組み合わせが生まれます。<span class=\"em\">突然変異は目的に合わせて起こるのではなく、偶然に起こります</span>。</p>\n<h3>3-2　自然選択</h3>\n<p>同じ種の個体の間には変異があり、生まれる子の数は多いので、生き残って子を残せる個体は一部です。生存や繁殖に有利な形質をもつ個体の子孫がより多く残ることを<b class=\"key\">自然選択</b>といい、これがくり返されて、生物は環境に合った形質（<b class=\"key\">適応</b>）をもつようになります（ダーウィン）。</p>\n<div class=\"box exam\"><div class=\"bt\">自然選択の例：オオシモフリエダシャクの工業暗化</div>\nイギリスでは、もともと白っぽいガが多かった。工業化で煤煙が増え、樹皮が黒くなると、<b>黒っぽいガ</b>のほうが鳥に見つかりにくく食べられにくくなり、黒っぽいガの割合が増えた（<b>工業暗化</b>）。大気汚染が減ると、再び白っぽいガが増えた。</div>\n<div class=\"box column\"><div class=\"bt\">よくある誤解：キリンは首をのばそうとして首が長くなった？</div>\n「よく使う器官は発達し、その性質が子に遺伝する」という考え（ラマルクの<b>用不用説</b>）は、現在は否定されています。生きている間に獲得した性質（筋肉をきたえた、など）はDNAを変えないので遺伝しません。自然選択では、「もともと首の長さに個体差があり、たまたま首が長い個体が高い葉を食べられて多く子を残した。それがくり返された」と説明します。</div>\n<h3>3-3　遺伝的浮動と中立説</h3>\n<p>集団の中の遺伝子の割合が、<b>偶然</b>によって変化することを<b class=\"key\">遺伝的浮動</b>といいます。生き残る個体や、子に伝わる遺伝子は偶然に左右されるからです。<b>集団が小さいほど</b>影響が大きくなります。</p>\n<ul>\n<li><b class=\"key\">びん首効果</b>：災害などで個体数が激減すると、生き残った少数の遺伝子の割合が偶然に決まり、集団の遺伝的多様性が下がる。</li>\n<li><b class=\"key\">創始者効果</b>：少数の個体が新しい場所に移り住んで集団をつくると、その少数がもっていた遺伝子の割合がもとの集団と大きく変わる。</li>\n</ul>\n<p>DNAの変化の多くは、生存に有利でも不利でもない（<b>中立</b>な）変化で、それらが遺伝的浮動によって集団に広がる、という考えを<b class=\"key\">中立説</b>（木村資生）といいます。</p>\n<h3>3-4　性選択・共進化・擬態</h3>\n<ul>\n<li><b class=\"key\">性選択</b>：配偶相手をめぐる競争や選り好みで起こる選択。クジャクの雄の長い羽は、雌に選ばれやすいので進化した。</li>\n<li><b class=\"key\">共進化</b>：複数の種が影響し合いながら進化すること。花の距（蜜のある部分）の長さと、蜜を吸うガの口の長さなど。</li>\n<li><b class=\"key\">擬態</b>：ほかの生物や物に似ることで身を守る。毒のないハナアブが、ハチに似た色や模様をもつなど。</li>\n</ul>\n\n<h2>4. 集団の遺伝子頻度：ハーディー・ワインベルグの法則</h2>\n<div class=\"side\"><div class=\"txt\">\n<p>集団の中で、ある遺伝子が占める割合を<b class=\"key\">遺伝子頻度</b>といいます。対立遺伝子Aの頻度をp、aの頻度をqとすると、p＋q＝1です。</p>\n<p>次の条件がそろうとき、<span class=\"em\">遺伝子頻度は世代を重ねても変化しません</span>（<b class=\"key\">ハーディー・ワインベルグの法則</b>）。</p>\n<ol style=\"margin-top:0\">\n<li>集団が十分に大きい（遺伝的浮動が起こらない）</li>\n<li>突然変異が起こらない</li>\n<li>ほかの集団との移入・移出がない</li>\n<li>自然選択がはたらかない</li>\n<li>自由に交配する（任意交配）</li>\n</ol>\n<p>このとき遺伝子型の割合は、<b>AA：Aa：aa ＝ p²：2pq：q²</b> になります（図2）。逆に言えば、<b>進化とは、この条件がくずれて遺伝子頻度が変化すること</b>です。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 250 230\" width=\"230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10.5\"><rect x=\"50.0\" y=\"40.0\" width=\"119.0\" height=\"119.0\" fill=\"#a5d6a7\" stroke=\"#555\"/><text x=\"109.5\" y=\"98.5\" text-anchor=\"middle\" font-weight=\"bold\">AA</text><text x=\"109.5\" y=\"112.5\" text-anchor=\"middle\" font-size=\"10\">p²</text><rect x=\"169.0\" y=\"40.0\" width=\"51.0\" height=\"119.0\" fill=\"#fff59d\" stroke=\"#555\"/><text x=\"194.5\" y=\"98.5\" text-anchor=\"middle\" font-weight=\"bold\">Aa</text><text x=\"194.5\" y=\"112.5\" text-anchor=\"middle\" font-size=\"10\">pq</text><rect x=\"50.0\" y=\"159.0\" width=\"119.0\" height=\"51.0\" fill=\"#fff59d\" stroke=\"#555\"/><text x=\"109.5\" y=\"183.5\" text-anchor=\"middle\" font-weight=\"bold\">Aa</text><text x=\"109.5\" y=\"197.5\" text-anchor=\"middle\" font-size=\"10\">pq</text><rect x=\"169.0\" y=\"159.0\" width=\"51.0\" height=\"51.0\" fill=\"#ffccbc\" stroke=\"#555\"/><text x=\"194.5\" y=\"183.5\" text-anchor=\"middle\" font-weight=\"bold\">aa</text><text x=\"194.5\" y=\"197.5\" text-anchor=\"middle\" font-size=\"10\">q²</text><text x=\"109.5\" y=\"32\" text-anchor=\"middle\">A（p）</text><text x=\"194.5\" y=\"32\" text-anchor=\"middle\">a（q）</text><text x=\"44\" y=\"103.5\" text-anchor=\"end\">A（p）</text><text x=\"44\" y=\"188.5\" text-anchor=\"end\">a（q）</text><text x=\"135.0\" y=\"14\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">精子（花粉）の遺伝子</text><text transform=\"translate(10,125.0) rotate(-90)\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">卵の遺伝子</text></svg><div class=\"cap\">図2　遺伝子型の割合（p＝0.7の例）</div></div></div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：ハーディー・ワインベルグの計算</div>\n<b>例1</b>　ある集団で、劣性形質（aa）の個体が4%いた。<br>\nq² ＝ 0.04 → <b>q ＝ 0.2</b>、p ＝ 1 − 0.2 ＝ <b>0.8</b>。ヘテロ接合体Aa ＝ 2pq ＝ 2 × 0.8 × 0.2 ＝ <b>0.32（32%）</b><br>\n「優性形質の個体のうちAaの割合」なら、0.32 ÷（0.64 ＋ 0.32）＝ <b>1/3</b>（分母に注意）。<br>\n<b>例2</b>　AA 360個体、Aa 480個体、aa 160個体の集団では、遺伝子は全部で2×1000＝2000個。Aは 2×360＋480 ＝ 1200個なので、Aの遺伝子頻度 ＝ 1200 ÷ 2000 ＝ <b>0.6</b>。</div>\n\n<h2>5. 種分化</h2>\n<p>互いに交配して<b>子孫を残せる</b>集団を<b class=\"key\">種</b>といいます。1つの種から新しい種ができることを<b class=\"key\">種分化</b>といいます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">1つの集団</div><div class=\"fbs\"></div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">地理的隔離</div><div class=\"fbs\">海や山で<br>分断される</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">別々に進化</div><div class=\"fbs\">突然変異・自然選択<br>遺伝的浮動</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">生殖的隔離</div><div class=\"fbs\">出会っても<br>交配できない</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">別の種</div><div class=\"fbs\"></div></div></div>\n<p>山脈や海などで集団が分断されること（<b class=\"key\">地理的隔離</b>）が続くと、それぞれの集団で別々に変化が積み重なり、やがて再び出会っても交配できなくなります（<b class=\"key\">生殖的隔離</b>）。これを<b>異所的種分化</b>といいます。ガラパゴス諸島のフィンチ（ダーウィンフィンチ）は、島ごとに食物に合わせたくちばしをもつ種に分かれています。植物では、染色体数が倍になる<b>倍数化</b>によって、もとの種と交配できない種が同じ場所で一気にできることがあります（<b>同所的種分化</b>、パンコムギなど）。</p>\n\n<h2>6. 進化の証拠</h2>\n<ul>\n<li><b>化石</b>：<b class=\"key\">始祖鳥</b>は、羽毛や翼（鳥類の特徴）と、歯・翼のつめ・長い尾の骨（爬虫類の特徴）をあわせもち、鳥類が爬虫類から進化したことを示す。</li>\n<li><b class=\"key\">相同器官</b>：形やはたらきはちがうが、<b>もとは同じ器官</b>（基本的な骨の構造が同じ）。ヒトの腕、コウモリの翼、クジラの胸びれ → 共通の祖先から進化した証拠。</li>\n<li><b class=\"key\">相似器官</b>：はたらきは似ているが、<b>起源がちがう</b>器官。鳥の翼と昆虫のはね。</li>\n<li><b class=\"key\">痕跡器官</b>：はたらきを失って小さく残っている器官。ヒトの虫垂・尾骨。</li>\n</ul>\n<h3>分子進化と分子時計</h3>\n<p>DNAの塩基配列やタンパク質のアミノ酸配列は、時間とともにほぼ一定の速さで変化します（<b class=\"key\">分子時計</b>）。そのため、2種の配列のちがいが大きいほど、<b>共通祖先から分かれてから長い時間がたっている</b>と考えられます。配列のちがいをもとにつくった系統樹を<b>分子系統樹</b>といいます。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：分子時計で分岐年代を求める</div>\nあるタンパク質（ヘモグロビンα鎖）のアミノ酸のちがい：ヒトとウマ <b>18</b>か所、ヒトとサメ <b>79</b>か所（例）。<br>\nヒトとウマが約8000万年前に分かれたとすると、ちがいは時間に比例するので、<br>\nヒトとサメが分かれたのは　8000万年 × 79 ÷ 18 ≒ <b>約3億5000万年前</b></div>\n\n<h2>7. 分類と系統</h2>\n<p>生物は、<b>ドメイン ＞ 界 ＞ 門 ＞ 綱 ＞ 目 ＞ 科 ＞ 属 ＞ 種</b> の階層で分類されます。種の名前は、世界共通の<b class=\"key\">学名</b>で表し、<b>属名＋種小名</b>のラテン語で書きます（<b class=\"key\">二名法</b>、リンネ）。ヒトは <i>Homo sapiens</i>（ホモ・サピエンス）です。</p>\n<div class=\"side\"><div class=\"txt\">\n<p>rRNA（リボソームのRNA）の塩基配列の比較から、生物は<b>細菌</b>（バクテリア）・<b>アーキア</b>（古細菌）・<b>真核生物</b>の3つの大きなグループに分けられます（<b class=\"key\">3ドメイン説</b>、ウーズ）。アーキアは原核生物ですが、細菌よりも<b>真核生物に近い</b>ことがわかりました。</p>\n<p>それより前には、生物を<b>原核生物界・原生生物界・菌界・植物界・動物界</b>の5つに分ける<b class=\"key\">五界説</b>（ホイッタカー、マーグリス）が使われていました。原生生物はゾウリムシやアメーバ、藻類など、菌類はキノコやカビ、酵母などです。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 345 172\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10.5\"><path d=\"M20 130 L80 130 M80 40 L80 130 M80 40 L190 40 M80 130 L130 130 M130 100 L130 150 M130 100 L190 100 M130 150 L190 150\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" fill=\"none\"/><text x=\"196\" y=\"44\" font-weight=\"bold\">細菌</text><text x=\"196\" y=\"58\" font-size=\"9\" fill=\"#555\">（大腸菌・シアノバクテリア）</text><text x=\"196\" y=\"104\" font-weight=\"bold\">アーキア</text><text x=\"196\" y=\"118\" font-size=\"9\" fill=\"#555\">（メタン菌など）</text><text x=\"196\" y=\"154\" font-weight=\"bold\">真核生物</text><text x=\"196\" y=\"168\" font-size=\"9\" fill=\"#555\">（動物・植物・菌類など）</text><text x=\"10\" y=\"124\" font-size=\"9.5\" fill=\"#555\">共通祖先</text></svg><div class=\"cap\">図3　3ドメイン説</div></div></div>\n\n<h2>8. 植物の系統</h2>\n<p>植物は、水中の<b>緑藻類</b>から陸上に進出し、乾燥にたえるしくみ（維管束、種子など）を獲得しながら進化してきました。</p>\n<table class=\"t\" style=\"font-size:9.5pt\">\n<tr><th style=\"width:15%\">植物</th><th class=\"c\" style=\"width:9%\">維管束</th><th class=\"c\" style=\"width:9%\">種子</th><th>特徴</th><th style=\"width:22%\">例</th></tr>\n<tr><td>藻類（緑藻類）</td><td class=\"c\">×</td><td class=\"c\">×</td><td>水中で生活。陸上植物の祖先は緑藻類（シャジクモ類）</td><td>アオサ・シャジクモ</td></tr>\n<tr><td>コケ植物</td><td class=\"c\">×</td><td class=\"c\">×</td><td>根・茎・葉の区別がはっきりしない。胞子でふえる</td><td>ゼニゴケ・スギゴケ</td></tr>\n<tr><td>シダ植物</td><td class=\"c\">○</td><td class=\"c\">×</td><td>根・茎・葉があり、<b>維管束</b>（道管・師管）をもつ。胞子でふえる</td><td>ワラビ・スギナ</td></tr>\n<tr><td>裸子植物</td><td class=\"c\">○</td><td class=\"c\">○</td><td><b>種子</b>でふえる。胚珠が<b>むき出し</b>（子房がない）</td><td>マツ・イチョウ・ソテツ</td></tr>\n<tr><td>被子植物</td><td class=\"c\">○</td><td class=\"c\">○</td><td>胚珠が<b>子房に包まれている</b>。花と果実をつくる</td><td>サクラ・イネ・アブラナ</td></tr>\n</table>\n\n<h2>9. 動物の系統</h2>\n<p>動物は、<b>胚葉</b>（第7回）のでき方や、<b>原口</b>が口になるか肛門になるかで大きく分けられます。原口が口になるのが<b class=\"key\">旧口動物</b>、原口が肛門になり口が別にできるのが<b class=\"key\">新口動物</b>です。旧口動物は、からだを大きくするとき脱皮する<b>脱皮動物</b>と、脱皮しない<b>冠輪動物</b>に分かれます。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 245\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"10.5\"><line x1=\"200\" y1=\"68\" x2=\"200\" y2=\"118\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"68\" x2=\"250\" y2=\"68\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"93\" x2=\"250\" y2=\"93\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"118\" x2=\"250\" y2=\"118\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"143\" x2=\"200\" y2=\"168\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"143\" x2=\"250\" y2=\"143\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"168\" x2=\"250\" y2=\"168\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"193\" x2=\"200\" y2=\"218\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"193\" x2=\"250\" y2=\"193\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"200\" y1=\"218\" x2=\"250\" y2=\"218\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"160\" y1=\"93.0\" x2=\"160\" y2=\"155.5\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"160\" y1=\"93.0\" x2=\"200\" y2=\"93.0\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"160\" y1=\"155.5\" x2=\"200\" y2=\"155.5\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"120\" y1=\"124.25\" x2=\"120\" y2=\"205.5\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"120\" y1=\"124.25\" x2=\"160\" y2=\"124.25\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"120\" y1=\"205.5\" x2=\"200\" y2=\"205.5\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"80\" y1=\"43\" x2=\"80\" y2=\"164.875\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"80\" y1=\"43\" x2=\"250\" y2=\"43\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"80\" y1=\"164.875\" x2=\"120\" y2=\"164.875\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"40\" y1=\"18\" x2=\"40\" y2=\"103.9375\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"40\" y1=\"18\" x2=\"250\" y2=\"18\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"40\" y1=\"103.9375\" x2=\"80\" y2=\"103.9375\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><line x1=\"14\" y1=\"60.96875\" x2=\"40\" y2=\"60.96875\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"256\" y=\"22\" font-weight=\"bold\">海綿動物</text><text x=\"316\" y=\"22\" font-size=\"9.5\" fill=\"#555\">カイメン</text><text x=\"256\" y=\"47\" font-weight=\"bold\">刺胞動物</text><text x=\"316\" y=\"47\" font-size=\"9.5\" fill=\"#555\">クラゲ・イソギンチャク・サンゴ</text><text x=\"256\" y=\"72\" font-weight=\"bold\">扁形動物</text><text x=\"316\" y=\"72\" font-size=\"9.5\" fill=\"#555\">プラナリア</text><text x=\"256\" y=\"97\" font-weight=\"bold\">軟体動物</text><text x=\"316\" y=\"97\" font-size=\"9.5\" fill=\"#555\">イカ・アサリ・カタツムリ</text><text x=\"256\" y=\"122\" font-weight=\"bold\">環形動物</text><text x=\"316\" y=\"122\" font-size=\"9.5\" fill=\"#555\">ミミズ・ゴカイ</text><text x=\"256\" y=\"147\" font-weight=\"bold\">線形動物</text><text x=\"316\" y=\"147\" font-size=\"9.5\" fill=\"#555\">センチュウ</text><text x=\"256\" y=\"172\" font-weight=\"bold\">節足動物</text><text x=\"316\" y=\"172\" font-size=\"9.5\" fill=\"#555\">昆虫・エビ・クモ</text><text x=\"256\" y=\"197\" font-weight=\"bold\">棘皮動物</text><text x=\"316\" y=\"197\" font-size=\"9.5\" fill=\"#555\">ウニ・ヒトデ</text><text x=\"256\" y=\"222\" font-weight=\"bold\">脊索動物</text><text x=\"316\" y=\"222\" font-size=\"9.5\" fill=\"#555\">ホヤ・ナメクジウオ・脊椎動物</text><circle cx=\"80\" cy=\"103.9\" r=\"3.5\" fill=\"#c62828\"/><text x=\"76\" y=\"117.9\" text-anchor=\"end\" font-size=\"9\" fill=\"#c62828\">胚葉ができる</text><circle cx=\"120\" cy=\"164.9\" r=\"3.5\" fill=\"#c62828\"/><text x=\"116\" y=\"178.9\" text-anchor=\"end\" font-size=\"9\" fill=\"#c62828\">三胚葉</text><circle cx=\"200\" cy=\"93.0\" r=\"3.5\" fill=\"#c62828\"/><text x=\"196\" y=\"87.0\" text-anchor=\"end\" font-size=\"9\" fill=\"#c62828\">冠輪動物</text><circle cx=\"200\" cy=\"155.5\" r=\"3.5\" fill=\"#c62828\"/><text x=\"196\" y=\"169.5\" text-anchor=\"end\" font-size=\"9\" fill=\"#c62828\">脱皮動物</text><path d=\"M520 60 L526 60 L526 176 L520 176\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"1.6\"/><text x=\"532\" y=\"122.0\" font-weight=\"bold\" fill=\"#1565c0\">旧口動物</text><path d=\"M520 185 L526 185 L526 226 L520 226\" fill=\"none\" stroke=\"#6a1b9a\" stroke-width=\"1.6\"/><text x=\"532\" y=\"209.5\" font-weight=\"bold\" fill=\"#6a1b9a\">新口動物</text><text x=\"532\" y=\"136.0\" font-size=\"9\" fill=\"#1565c0\">原口が口に</text><text x=\"532\" y=\"223.5\" font-size=\"9\" fill=\"#6a1b9a\">原口が肛門に</text></svg></div>\n<div class=\"cap\">図4　動物の系統樹（主なものだけ）</div>\n<p><b>脊索動物</b>は、発生のときに<b>脊索</b>（第7回）をもつ動物で、ホヤ・ナメクジウオ（原索動物）と<b>脊椎動物</b>からなります。脊椎動物は、<b>魚類 → 両生類 → 爬虫類 → 鳥類・哺乳類</b>の順に出現しました。</p>\n\n<h2>10. 人類の進化</h2>\n<p>ヒトは<b>霊長類</b>の一員です。霊長類は、<b>親指がほかの指と向かい合う</b>（拇指対向性：物をにぎれる）、<b>両目が顔の前にある</b>（立体視ができる）などの、樹上生活に適した特徴をもちます。ヒトはさらに<b class=\"key\">直立二足歩行</b>に適したからだをもっています。</p>\n<ul>\n<li>頭骨の<b>大後頭孔</b>（脊髄が通る穴）が<b>真下</b>にあり、頭を下から支える。</li>\n<li><b>骨盤</b>が横に広く、内臓を下から支える。背骨はS字状に曲がっている。</li>\n<li>手が自由になり、道具を使うようになって、<b>脳が大きく</b>なった。</li>\n</ul>\n<table class=\"t\" style=\"font-size:9.5pt\">\n<tr><th style=\"width:15%\">段階</th><th style=\"width:16%\">時期</th><th>代表と特徴</th></tr>\n<tr><td>猿人</td><td>約700万年前〜</td><td>アウストラロピテクスなど。<b>直立二足歩行</b>を始めた。脳はまだ小さい</td></tr>\n<tr><td>原人</td><td>約200万年前〜</td><td>ホモ・エレクトスなど。脳が大きくなり、石器や火を使う。アフリカから各地へ広がる</td></tr>\n<tr><td>旧人</td><td>約40万年前〜</td><td>ネアンデルタール人など。大きな脳をもち、死者をほうむる</td></tr>\n<tr><td>新人</td><td>約20〜30万年前〜</td><td><b>ホモ・サピエンス</b>（現在のヒト）。<b>アフリカで誕生</b>し、世界中に広がった</td></tr>\n</table>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>進化は集団の遺伝的性質が世代を重ねて変化すること</li>\n<li>化学進化（ミラーの実験）、RNAワールド、最古の生物は原核生物</li>\n<li>シアノバクテリアの光合成で酸素 → 呼吸する生物・オゾン層 → 陸上進出</li>\n<li>細胞内共生説：ミトコンドリア＝好気性細菌、葉緑体＝シアノバクテリア（独自のDNA・二重膜・分裂）</li>\n<li>古生代（カンブリア紀の大爆発、植物の上陸、両生類、爬虫類）・中生代（恐竜、鳥類、被子植物）・新生代（哺乳類、人類）</li>\n<li>突然変異は偶然起こる。自然選択（工業暗化）で適応が進む。用不用説は否定</li>\n<li>遺伝的浮動（びん首効果・創始者効果）、中立説、性選択、共進化、擬態</li>\n<li>ハーディー・ワインベルグ：5つの条件で遺伝子頻度は不変。AA：Aa：aa＝p²：2pq：q²</li>\n<li>地理的隔離 → 生殖的隔離 → 種分化。倍数化による同所的種分化</li>\n<li>相同器官（腕・翼・胸びれ）、相似器官（鳥の翼と昆虫のはね）、痕跡器官、始祖鳥</li>\n<li>分子時計：配列のちがいは分岐してからの時間に比例</li>\n<li>二名法（属名＋種小名）、3ドメイン（細菌・アーキア・真核生物）、五界説</li>\n<li>植物：コケ（維管束なし）→ シダ（維管束）→ 裸子（種子・胚珠むき出し）→ 被子（子房）</li>\n<li>動物：旧口動物（節足・軟体・環形など）と新口動物（棘皮・脊索）</li>\n<li>直立二足歩行（大後頭孔が真下・骨盤が広い）、猿人 → 原人 → 旧人 → 新人（アフリカ起源）</li>\n</ul>\n<h3 style=\"margin-top:5mm\">メモ：わからなかったこと・生徒に聞かれそうなこと</h3>\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>ミラーの実験では、原始の大気を想定した気体に放電すると何ができたか。また、このように無機物から有機物ができ生命が生まれるまでの過程を何というか。<br><span class=\"blank\"></span>・<span class=\"blank\"></span></li>\n<li>ミトコンドリアと葉緑体は、それぞれどんな生物が細胞に取りこまれたものと考えられているか。また、その根拠を1つ答えよ。<br>ミトコンドリア <span class=\"blank\"></span>　葉緑体 <span class=\"blank\"></span><div class=\"wline\"></div></li>\n<li>次のできごとを古い順に並べよ。<br>ア　恐竜の繁栄　イ　植物の陸上進出　ウ　カンブリア紀の大爆発　エ　人類の出現　オ　被子植物の出現<br><span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li>オオシモフリエダシャクで、工業化によって黒っぽいガの割合が増えた理由を、自然選択の考え方で説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n<li>災害で個体数が激減したあと、集団の遺伝子の割合が偶然に大きく変わることを何というか。また、このような偶然による遺伝子頻度の変化を何というか。<br><span class=\"blank\"></span>・<span class=\"blank\"></span></li>\n<li>ハーディー・ワインベルグの法則が成り立つ集団で、劣性形質（aa）の個体が9%いた。<br>(1) aの遺伝子頻度 <span class=\"blank\" style=\"min-width:14mm\"></span>　(2) Aの遺伝子頻度 <span class=\"blank\" style=\"min-width:14mm\"></span>　(3) Aaの個体の割合 <span class=\"blank\" style=\"min-width:14mm\"></span>%</li>\n<li>次の組み合わせは、相同器官・相似器官・痕跡器官のどれか。<br>(a) ヒトの腕とクジラの胸びれ <span class=\"blank\"></span>　(b) 鳥の翼と昆虫のはね <span class=\"blank\"></span>　(c) ヒトの虫垂 <span class=\"blank\"></span></li>\n<li>あるタンパク質のアミノ酸配列のちがいが、種Xと種Yで12か所、種Xと種Zで30か所あった。XとYが6000万年前に分かれたとすると、XとZは何年前に分かれたと考えられるか。 <span class=\"blank\" style=\"min-width:30mm\"></span></li>\n<li>次の動物は、旧口動物と新口動物のどちらか。<br>(a) ウニ <span class=\"blank\" style=\"min-width:16mm\"></span>　(b) イカ <span class=\"blank\" style=\"min-width:16mm\"></span>　(c) バッタ <span class=\"blank\" style=\"min-width:16mm\"></span>　(d) ヒト <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li><b>説明の練習</b>　「キリンは高い木の葉を食べようと首をのばし続けたので、首が長くなった」という説明はどこがまちがっているか。正しい説明とあわせて、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　アミノ酸・化学進化</b></p>\n<p><b>2.　ミトコンドリア：好気性細菌　葉緑体：シアノバクテリア</b>　根拠：独自のDNAをもつ（二重の膜で包まれている、分裂して増える、でもよい）。</p>\n<p><b>3.　ウ → イ → ア → オ → エ</b>　カンブリア紀（古生代のはじめ）→ 植物の上陸（シルル紀）→ 恐竜の繁栄（ジュラ紀）→ 被子植物（白亜紀）→ 人類（新生代）。恐竜の出現は三畳紀なので、繁栄（ジュラ紀）は被子植物の出現より前。</p>\n<p><b>4.　解答例</b>　もともと白っぽいガと黒っぽいガがいた。煤煙で樹皮が黒くなると、黒っぽいガのほうが鳥に見つかりにくく、生き残って子を多く残せたので、世代を重ねるうちに黒っぽいガの割合が増えた。</p>\n<p><b>5.　びん首効果・遺伝的浮動</b></p>\n<p><b>6.　(1) 0.3　(2) 0.7　(3) 42%</b>　q²＝0.09 より q＝0.3、p＝0.7。2pq＝2×0.7×0.3＝0.42。</p>\n<p><b>7.　(a) 相同器官　(b) 相似器官　(c) 痕跡器官</b></p>\n<p><b>8.　1億5000万年前</b>　6000万年 × 30 ÷ 12 ＝ 1億5000万年。</p>\n<p><b>9.　(a) 新口動物　(b) 旧口動物　(c) 旧口動物　(d) 新口動物</b>　ウニは棘皮動物、ヒトは脊索動物で新口動物。イカは軟体動物、バッタは節足動物で旧口動物。</p>\n<p><b>10.　解答例</b>　首をのばそうと努力しても、そのことでDNAは変わらないので、のびた首は子に遺伝しません。正しくは、もともとキリンの祖先には首の長さに個体差があり、たまたま首の長い個体のほうが高い葉を食べられて生き残り、子を多く残せました。これが何世代もくり返されて、首の長いキリンばかりになったのです（自然選択）。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">講座を終えて</div>\nこれで高校生物の主な分野をひと通り学びました。全12回は、「<b>DNAの情報</b>（第1・2・3・6・7回）」と「<b>エネルギーとからだのはたらき</b>（第4・5・8・9・10回）」、そしてそれを広げた「<b>生態系と進化</b>（第11・12回）」の3つにまとめられます。共通テストでは、知識そのものより、<b>実験やグラフから考える力</b>が問われます。暗記帳の問題演習で用語を固めたら、各回の「共通テストではこう出る」を見直し、過去問に挑戦してみてください。</div>\n</details>", "heads": ["0. 進化とは", "1. 生命の誕生", "2. 地質時代と生物の変遷", "3. 進化のしくみ", "4. 集団の遺伝子頻度：ハーディー・ワインベルグの法則", "5. 種分化", "6. 進化の証拠", "7. 分類と系統", "8. 植物の系統", "9. 動物の系統", "10. 人類の進化", "この回のまとめ", "確認問題"]}};

const genYeast = () => G("計算", () => {
  const r = rint(1, 6), f = rint(1, 8), o2 = 6 * r, co2 = 6 * r + 2 * f;
  const askResp = Math.random() < 0.5;
  const q = `酵母が、酸素を${o2}、二酸化炭素を${co2}（分子数の相対値）出し入れした。${askResp ? "呼吸" : "発酵（アルコール発酵）"}で使ったグルコースはいくつか。数字で答えよ。`;
  const e = `O₂を吸収するのは呼吸だけ → 呼吸のグルコース ${o2}÷6＝${r}。呼吸のCO₂も${o2}なので、発酵のCO₂は ${co2}−${o2}＝${2 * f}。発酵のグルコース ${2 * f}÷2＝${f}。`;
  return { t: "in", q, a: [String(askResp ? r : f)], e };
});
const genMass = () => G("計算", () => {
  const x = 45 * rint(1, 8), askCO2 = Math.random() < 0.5;
  const co2g = x * 22 / 15, o2g = x * 16 / 15;
  const q = `グルコース${x}gがすべて呼吸で分解されたとき、${askCO2 ? "発生する二酸化炭素" : "使われる酸素"}は何gか。原子量は H＝1、C＝12、O＝16 とする。`;

  const v = askCO2 ? co2g : o2g;
  return { t: "in", q, a: [String(v), v + "g"], e };
});

const CROSS_DI = [
  ["AaBb × AaBb", "9:3:3:1", "(3：1)×(3：1)＝9：3：3：1。"],
  ["AaBb × aabb", "1:1:1:1", "検定交雑。AaBb の配偶子 AB：Ab：aB：ab＝1：1：1：1 がそのまま子の比。"],

const genDi = () => G("計算", () => {
  const [c, r, e] = pickOne(CROSS_DI);
  return { t: "in", q: `2組の遺伝子（A は a に、B は b に対して顕性）は別々の染色体にある。${c} の子の表現型の比［AB］：［Ab］：［aB］：［ab］を答えよ（例 1:1:1:1）。`, a: [r], e };
});
const genRecomb = () => G("計算", () => {
  const total = pickOne([100, 200, 400, 500, 1000]), rv = pickOne([4, 6, 8, 10, 12, 16, 20, 24, 30]);
  const rec = total * rv / 100, r1 = Math.floor(rec / 2) + (rec % 2 ? 0 : 0), r2 = rec - r1;
  const par = total - rec, p1 = Math.ceil(par / 2), p2 = par - p1;
  const d = 2 * rint(0, Math.min(3, Math.floor(r1 / 2)));   // 少しだけ数をばらつかせる
  const a1 = r1 - d / 2, a2 = r2 + d / 2;
  return { t: "in", q: `AaBb（A と B、a と b が連鎖）を aabb と検定交雑したところ、子が［AB］${p1}、［Ab］${a1}、［aB］${a2}、［ab］${p2} だった。組換え価は何%か。`,
    a: [String(rv), rv + "%"], e: `少ない［Ab］と［aB］が組換え。(${a1}＋${a2}) ÷ ${total} × 100 ＝ ${rv}%。` };
});
const genMap = () => G("図表", () => {
  const names = pickOne([["A", "B", "C"], ["X", "Y", "Z"], ["P", "Q", "R"], ["D", "E", "F"]]);
  const order = shuffle(names), d1 = rint(2, 15), d2 = rint(2, 15);
  const [l, m, r] = order;
  const pairs = shuffle([[`${l}–${m}`, d1], [`${m}–${r}`, d2], [`${l}–${r}`, d1 + d2]]);
  const correct = `${l}–${m}–${r}`;
  const wrong = [`${m}–${l}–${r}`, `${l}–${r}–${m}`];   // 逆向きは同じ並びなので、まちがいの並びは2通り
  return mcOf(`3つの遺伝子の組換え価が ${pairs.map(([p, v]) => `${p} 間 ${v}%`).join("、")} だった。遺伝子の並び順はどれか。`, correct, wrong,

});

const genPCR = () => G("計算", () => {
  const n = rint(3, 12), m = pickOne([1, 1, 2, 3, 5, 10]);
  return { t: "in", q: `${m}分子のDNAをPCR法で${n}サイクル増やした。理論上、DNAは何分子になるか。`, a: [String(m * 2 ** n)], e: `1サイクルで2倍なので ${m}×2^${n}＝${m * 2 ** n}。` };
});
const genCleavage = () => G("計算", () => {
  const n = rint(2, 7);
  return { t: "in", q: `受精卵が卵割を${n}回行い、すべての割球が同時に分裂したとすると、割球は何個になるか。`, a: [String(2 ** n), 2 ** n + "個"], e: `1回で2倍なので 2^${n}＝${2 ** n} 個。卵割では細胞が成長しないので、そのぶん割球は小さくなる。` };
});
const genFragments = () => G("図表", () => {
  while (true) {
    const L = 100 * rint(30, 80), c1 = 100 * rint(5, 20), c2 = c1 + 100 * rint(5, 25);
    if (c2 >= L - 400) continue;
    const fr = [c1, c2 - c1, L - c2];
    if (new Set(fr).size < 3) continue;
    const short = Math.min(...fr), long = Math.max(...fr), askShort = Math.random() < 0.5;
    const ans = askShort ? short : long;
    const others = fr.filter(x => x !== ans);
    return mcOf(`${L}塩基対の直鎖状のDNAを、制限酵素で${c1}番目と${c2}番目の位置で切って電気泳動した。${askShort ? "いちばん遠く（＋極側）まで移動する" : "いちばん移動しない（−極側に残る）"}断片は何塩基対か。`,
      `${ans}塩基対`, [...others.map(x => `${x}塩基対`), `${L}塩基対`, `${c2}塩基対`],
      `断片は ${fr.join("・")} 塩基対。短いほど遠くまで移動するので、${askShort ? `いちばん短い${short}` : `いちばん長い${long}`}塩基対。`);
  }
});
const genSite = () => G("計算", () => {
  const n = pickOne([4, 6, 8]);
  return mcOf(`${n}塩基の配列を見分けて切る制限酵素がある。塩基がでたらめに並んでいるとき、切断部位はおよそ何塩基に1回の割合で現れるか。`,
    `${4 ** n}塩基`, [`${4 * n}塩基`, `${2 ** n}塩基`, `${n ** 4}塩基`, `${4 ** (n - 1)}塩基`, `${4 ** (n + 1)}塩基`, `${n * n}塩基`],
    `1つの位置に特定の塩基がくる確率は 1/4。${n}塩基すべてが合う確率は (1/4)^${n}＝1/${4 ** n}。`);
});

// ---- 第8回：数字が変わる問題 ----
function condData() {
  const v = pickOne([10, 20, 25, 40, 50]);            // m/s ＝ mm/ミリ秒（割り切れる値だけ）
  const d1 = 10 * rint(1, 4), d2 = d1 + 10 * rint(2, 6);       // mm
  const rest = rint(10, 40) / 10;                              // 伝達など（ミリ秒）
  const t1 = +(rest + d1 / v).toFixed(2), t2 = +(rest + d2 / v).toFixed(2);
  return { v, d1, d2, rest, t1, t2 };
}
const fmt = x => String(+x.toFixed(2));
const genConduction = () => G("計算", () => {
  const { v, d1, d2, t1, t2 } = condData();
  return { t: "in", q: `神経筋標本で、筋肉から${d1 / 10}cmの点を刺激すると${fmt(t1)}ミリ秒後に、${d2 / 10}cmの点を刺激すると${fmt(t2)}ミリ秒後に筋肉が縮んだ。伝導速度は何m/秒か。`,
    a: [String(v), v + "m/秒", v + "m/s"], e: `距離の差 ${d2 - d1}mm ÷ 時間の差 ${fmt(t2 - t1)}ミリ秒 ＝ ${v}mm/ミリ秒 ＝ ${v}m/秒。` };
});
const genRest = () => G("計算", () => {
  const { v, d1, d2, rest, t1, t2 } = condData();
  return { t: "in", q: `神経筋標本で、筋肉から${d1 / 10}cmの点を刺激すると${fmt(t1)}ミリ秒後に、${d2 / 10}cmの点を刺激すると${fmt(t2)}ミリ秒後に筋肉が縮んだ。興奮が神経終末に着いてから筋肉が縮むまでに何ミリ秒かかったか。`,
    a: [fmt(rest), fmt(rest) + "ミリ秒"], e: `伝導速度は ${d2 - d1}÷${fmt(t2 - t1)}＝${v}mm/ミリ秒。${d1}mmを伝わる時間は ${d1}÷${v}＝${fmt(d1 / v)}ミリ秒。${fmt(t1)}−${fmt(d1 / v)}＝${fmt(rest)}ミリ秒。` };
});
const genSarco = () => G("計算", () => {
  const actin = 1.0, myo = 1.6, L = pickOne([2.2, 2.4, 2.6, 2.8, 3.0, 3.2]);
  const ask = pickOne(["H帯", "明帯", "暗帯"]);
  const val = ask === "H帯" ? L - 2 * actin : ask === "明帯" ? L - myo : myo;
  const v = fmt(val);
  return mcOf(`サルコメアで、アクチンフィラメントはZ膜から${actin.toFixed(1)}µm、ミオシンフィラメント（暗帯）は${myo}µmの長さである。サルコメアの長さが${L}µmのとき、${ask}${ask === "明帯" ? "（両側の合計）" : ""}の長さは何µmか。`,
    `${v}µm`, [`${fmt(L - 2 * actin)}µm`, `${fmt(L - myo)}µm`, `${myo}µm`, `${fmt(L - actin)}µm`, `${fmt(L)}µm`],
    ask === "H帯" ? `H帯はミオシンだけの部分。${L}−2×${actin.toFixed(1)}＝${v}µm。` : ask === "明帯" ? `明帯はアクチンだけの部分。${L}−${myo}＝${v}µm。` : `暗帯はミオシンのある部分で、長さはつねに${myo}µm。`);
});
const genTravel = () => G("計算", () => {
  const v = pickOne([20, 40, 50, 80, 100]), dcm = pickOne([20, 40, 60, 80, 100, 120]);
  const t = dcm * 10 / v;
  return { t: "in", q: `伝導速度が${v}m/秒の神経で、興奮が${dcm}cm伝わるのにかかる時間は何ミリ秒か。`, a: [fmt(t), fmt(t) + "ミリ秒"], e: `${v}m/秒＝${v}mm/ミリ秒。${dcm * 10}mm ÷ ${v} ＝ ${fmt(t)}ミリ秒。` };
});

const ANS9 = { "11": "短日植物：つくる・長日植物：つくる", "10": "短日植物：つくる・長日植物：つくらない",
  "01": "短日植物：つくらない・長日植物：つくる", "00": "短日植物：つくらない・長日植物：つくらない" };
function flower9(longestDark, crit) {
  const sd = longestDark > crit, ld = longestDark < crit;
  return { sd, ld, ans: ANS9[(sd ? "1" : "0") + (ld ? "1" : "0")] };
}
const genFlower = () => G("計算", () => {
  const crit = rint(8, 14);
  let dark;
  do { dark = rint(6, 18); } while (Math.abs(dark - crit) < 1);
  const r = flower9(dark, crit);
  return mcOf(`限界暗期が${crit}時間の短日植物と長日植物を、明期${24 - dark}時間・暗期${dark}時間の条件で育てた。それぞれ花芽をつくるか。`,
    r.ans, Object.values(ANS9),
    `連続した暗期${dark}時間は限界暗期${crit}時間より${dark > crit ? "長い" : "短い"}。短日植物は長いとき、長日植物は短いときに花芽をつくる。`);
});
const genBreak = () => G("計算", () => {
  const crit = rint(8, 12);
  const dark = rint(crit + 2, 16);
  const at = rint(2, dark - 2);
  const longest = Math.max(at, dark - at);
  if (longest === crit) return genBreak().make();
  const r = flower9(longest, crit);
  return mcOf(`限界暗期が${crit}時間の植物を、明期${24 - dark}時間・暗期${dark}時間の条件におき、暗期の始まりから${at}時間後に短時間だけ光を当てた（光中断）。短日植物と長日植物は花芽をつくるか。`,
    r.ans, Object.values(ANS9),
    `光中断で暗期は${at}時間と${dark - at}時間に分かれる。いちばん長い連続暗期${longest}時間は限界暗期${crit}時間より${longest > crit ? "長い" : "短い"}。`);
});
const genGerm = () => G("実験", () => {
  const n = rint(1, 6);
  const seq = Array.from({ length: n }, (_, i) => (i % 2 === 0 ? "赤色光" : "遠赤色光"));
  if (Math.random() < 0.3) seq[0] = "遠赤色光";
  const last = seq[seq.length - 1], ok = last === "赤色光";
  const claim = Math.random() < 0.5;
  return { t: "tf", q: `レタスの種子に、${seq.join(" → ")} の順に光を当てて暗所に置いた。この種子は${claim ? "発芽する" : "発芽しない"}。`,
    a: claim === ok, e: `最後に当てた光が${last}なので、${ok ? "発芽する" : "発芽しない"}。` };
});
