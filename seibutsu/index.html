M110.19999999999999 121.0 L114.0 166.28571428571428\" stroke=\"#555\"/><text transform=\"translate(14,106.0) rotate(-90)\" text-anchor=\"middle\">膜電位（mV）</text><text x=\"201.0\" y=\"232\" text-anchor=\"middle\">時間（ミリ秒）→</text></svg><div class=\"cap\">図2　活動電位</div></div></div>\n<ul>\n<li><b class=\"key\">閾値</b>：興奮が起こる最小の刺激の強さ。</li>\n<li><b class=\"key\">全か無かの法則</b>：1本のニューロンは、閾値より弱い刺激では興奮せず、閾値以上ならどんなに強い刺激でも<b>同じ大きさ</b>の活動電位が生じる。</li>\n<li>刺激の強さは、活動電位の<b>大きさではなく、発生する回数（頻度）</b>や、興奮するニューロンの数で伝えられる。</li>\n</ul>\n<h3>2-3　伝導と伝達</h3>\n<p>興奮が1本のニューロンの中を伝わることを<b class=\"key\">伝導</b>といいます。軸索の途中を刺激すると、興奮は<b>両方向</b>に伝わります。ニューロンから次の細胞に興奮が伝わることを<b class=\"key\">伝達</b>といい、<b class=\"key\">シナプス</b>という接続部で行われます。</p>\n<div class=\"side\"><div class=\"txt\">\n<p>興奮が神経終末まで来ると、<b>シナプス小胞</b>から<b class=\"key\">神経伝達物質</b>（アセチルコリン、ノルアドレナリンなど）がすき間に放出されます。神経伝達物質が次の細胞の<b>受容体</b>に結合すると、次の細胞で興奮が起こります。</p>\n<p>神経伝達物質は神経終末からしか出ないので、<span class=\"em\">伝達は一方向</span>にしか起こりません。また、物質が移動する分だけ、伝導より時間がかかります。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 400 220\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><defs><marker id=\"s1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><path d=\"M30 30 L130 30 Q200 30 200 100 Q200 170 130 170 L30 170\" fill=\"#ede7f6\" stroke=\"#5e35b1\" stroke-width=\"2\"/><circle cx=\"120\" cy=\"70\" r=\"9\" fill=\"#fff\" stroke=\"#7b1fa2\" stroke-width=\"1.4\"/><circle cx=\"117\" cy=\"68\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"123\" cy=\"71\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"120\" cy=\"73\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"150\" cy=\"92\" r=\"9\" fill=\"#fff\" stroke=\"#7b1fa2\" stroke-width=\"1.4\"/><circle cx=\"147\" cy=\"90\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"153\" cy=\"93\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"150\" cy=\"95\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"125\" cy=\"112\" r=\"9\" fill=\"#fff\" stroke=\"#7b1fa2\" stroke-width=\"1.4\"/><circle cx=\"122\" cy=\"110\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"128\" cy=\"113\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"125\" cy=\"115\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"160\" cy=\"128\" r=\"9\" fill=\"#fff\" stroke=\"#7b1fa2\" stroke-width=\"1.4\"/><circle cx=\"157\" cy=\"126\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"163\" cy=\"129\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"160\" cy=\"131\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"100\" cy=\"92\" r=\"9\" fill=\"#fff\" stroke=\"#7b1fa2\" stroke-width=\"1.4\"/><circle cx=\"97\" cy=\"90\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"103\" cy=\"93\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"100\" cy=\"95\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"140\" cy=\"145\" r=\"9\" fill=\"#fff\" stroke=\"#7b1fa2\" stroke-width=\"1.4\"/><circle cx=\"137\" cy=\"143\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"143\" cy=\"146\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"140\" cy=\"148\" r=\"1.6\" fill=\"#7b1fa2\"/><circle cx=\"210\" cy=\"80\" r=\"2\" fill=\"#7b1fa2\"/><circle cx=\"214\" cy=\"100\" r=\"2\" fill=\"#7b1fa2\"/><circle cx=\"209\" cy=\"118\" r=\"2\" fill=\"#7b1fa2\"/><path d=\"M226 20 Q260 20 260 40 L260 180 Q260 200 226 200\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><rect x=\"226\" y=\"20\" width=\"160\" height=\"180\" fill=\"#e8f5e9\"/><line x1=\"226\" y1=\"20\" x2=\"226\" y2=\"200\" stroke=\"#2e7d4f\" stroke-width=\"2.4\"/><path d=\"M226 71 l-8 0 l0 14 l8 0\" fill=\"#81c784\" stroke=\"#2e7d4f\"/><path d=\"M226 93 l-8 0 l0 14 l8 0\" fill=\"#81c784\" stroke=\"#2e7d4f\"/><path d=\"M226 115 l-8 0 l0 14 l8 0\" fill=\"#81c784\" stroke=\"#2e7d4f\"/><text x=\"80\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\">神経終末</text><text x=\"96\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7b1fa2\">シナプス小胞（神経伝達物質）</text><text x=\"212\" y=\"214\" text-anchor=\"middle\" font-size=\"10\">すき間</text><text x=\"306\" y=\"60\" text-anchor=\"middle\" font-weight=\"bold\">次の細胞</text><text x=\"300\" y=\"104\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1b5e37\">受容体に結合</text><text x=\"300\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1b5e37\">→ 興奮が起こる</text><path d=\"M40 100 L90 100\" stroke=\"#c62828\" stroke-width=\"2\" marker-end=\"url(#s1)\"/><text x=\"60\" y=\"92\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#c62828\">興奮</text></svg><div class=\"cap\">図3　シナプスでの伝達</div></div></div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：伝導速度の計算</div>\n<b>例題</b>　カエルのふくらはぎの筋肉と神経の標本で、筋肉から2cmの点を刺激すると3.0ミリ秒後に、6cmの点を刺激すると4.0ミリ秒後に筋肉が縮んだ。<br>\n<b>考え方</b>　2つの点の差（4cm）を伝わるのに、時間の差（1.0ミリ秒）かかった。<b>伝導速度＝4cm÷1.0ミリ秒＝40mm/ミリ秒＝40m/秒</b>。<br>\nさらに、2cmを伝わる時間は 20mm÷40mm/ミリ秒＝0.5ミリ秒なので、<b>興奮が神経終末に着いてから筋肉が縮むまでの時間は 3.0−0.5＝2.5ミリ秒</b>（伝達や筋肉の反応にかかる時間）。<br>\n<b>ポイント</b>　筋肉側の時間（伝達など）はどちらにも同じだけ含まれるので、<b>差をとれば消える</b>。</div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">3. 判断する：中枢神経と反射</h2>\n<table class=\"t\">\n<tr><th style=\"width:18%\">部位</th><th>主なはたらき</th></tr>\n<tr><td><b>大脳</b></td><td>感覚・随意運動（自分の意思で動かす）・記憶・思考の中枢</td></tr>\n<tr><td><b>小脳</b></td><td>からだの平衡を保つ、運動を調節する</td></tr>\n<tr><td><b>間脳</b></td><td>自律神経やホルモン分泌の中枢（視床下部）。体温・血糖などの調節</td></tr>\n<tr><td><b>中脳</b></td><td>姿勢を保つ、瞳孔の大きさを調節する（瞳孔反射）</td></tr>\n<tr><td><b>延髄</b></td><td>呼吸・心臓の拍動の中枢</td></tr>\n<tr><td><b>脊髄</b></td><td>脳とからだの間の信号の通り道。反射の中枢</td></tr>\n</table>\n<p>熱いものにさわって思わず手を引っこめるように、意思とは関係なく起こる反応を<b class=\"key\">反射</b>といいます。反射では興奮が大脳を通らずに、脊髄などで折り返すので、<span class=\"em\">すばやく反応できます</span>。反射で興奮が伝わる経路を<b class=\"key\">反射弓</b>といいます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">受容器</div><div class=\"fbs\"></div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">感覚神経</div><div class=\"fbs\"></div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">脊髄</div><div class=\"fbs\">反射の中枢</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">運動神経</div><div class=\"fbs\"></div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">効果器</div><div class=\"fbs\">筋肉</div></div></div>\n<div class=\"cap\">図4　反射弓（例：しつがい腱反射）</div>\n<p>ひざの下をたたくと足がはね上がる<b>しつがい腱反射</b>は、脊髄が中枢です。</p>\n\n<h2>4. 反応する：筋肉の収縮</h2>\n<p>骨についている骨格筋は、<b>筋繊維</b>という細長い細胞が集まってできています。筋繊維の中には<b>筋原繊維</b>があり、<b>Z膜</b>で区切られた<b class=\"key\">サルコメア</b>（筋節）がくり返し並んでいます。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 272\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><text x=\"20\" y=\"68\" font-weight=\"bold\">ゆるんだとき</text><rect x=\"234.0\" y=\"30\" width=\"192.0\" height=\"68\" fill=\"#fff3e0\"/><line x1=\"150.0\" y1=\"26\" x2=\"150.0\" y2=\"102\" stroke=\"#333\" stroke-width=\"3\"/><line x1=\"510.0\" y1=\"26\" x2=\"510.0\" y2=\"102\" stroke=\"#333\" stroke-width=\"3\"/><line x1=\"150.0\" y1=\"40\" x2=\"270.0\" y2=\"40\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"510.0\" y1=\"40\" x2=\"390.0\" y2=\"40\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"150.0\" y1=\"56\" x2=\"270.0\" y2=\"56\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"510.0\" y1=\"56\" x2=\"390.0\" y2=\"56\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"150.0\" y1=\"72\" x2=\"270.0\" y2=\"72\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"510.0\" y1=\"72\" x2=\"390.0\" y2=\"72\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"150.0\" y1=\"88\" x2=\"270.0\" y2=\"88\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"510.0\" y1=\"88\" x2=\"390.0\" y2=\"88\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"234.0\" y1=\"48\" x2=\"426.0\" y2=\"48\" stroke=\"#c62828\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"234.0\" y1=\"64\" x2=\"426.0\" y2=\"64\" stroke=\"#c62828\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"234.0\" y1=\"80\" x2=\"426.0\" y2=\"80\" stroke=\"#c62828\" stroke-width=\"6\" stroke-linecap=\"round\"/><text x=\"150.0\" y=\"20\" text-anchor=\"middle\" font-size=\"10\">Z膜</text><text x=\"510.0\" y=\"20\" text-anchor=\"middle\" font-size=\"10\">Z膜</text><text x=\"330\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" fill=\"#e65100\">暗帯（1.6µm、長さは変わらない）</text><text x=\"330\" y=\"24\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">H帯</text><text x=\"192.0\" y=\"116\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#1565c0\">明帯</text><text x=\"522.0\" y=\"68\" font-size=\"10.5\">サルコメア</text><text x=\"522.0\" y=\"82\" font-size=\"10.5\">3.0µm</text><text x=\"20\" y=\"190\" font-weight=\"bold\">縮んだとき</text><rect x=\"234.0\" y=\"152\" width=\"192.0\" height=\"68\" fill=\"#fff3e0\"/><line x1=\"198.0\" y1=\"148\" x2=\"198.0\" y2=\"224\" stroke=\"#333\" stroke-width=\"3\"/><line x1=\"462.0\" y1=\"148\" x2=\"462.0\" y2=\"224\" stroke=\"#333\" stroke-width=\"3\"/><line x1=\"198.0\" y1=\"162\" x2=\"318.0\" y2=\"162\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"462.0\" y1=\"162\" x2=\"342.0\" y2=\"162\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"198.0\" y1=\"178\" x2=\"318.0\" y2=\"178\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"462.0\" y1=\"178\" x2=\"342.0\" y2=\"178\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"198.0\" y1=\"194\" x2=\"318.0\" y2=\"194\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"462.0\" y1=\"194\" x2=\"342.0\" y2=\"194\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"198.0\" y1=\"210\" x2=\"318.0\" y2=\"210\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"462.0\" y1=\"210\" x2=\"342.0\" y2=\"210\" stroke=\"#1565c0\" stroke-width=\"2\"/><line x1=\"234.0\" y1=\"170\" x2=\"426.0\" y2=\"170\" stroke=\"#c62828\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"234.0\" y1=\"186\" x2=\"426.0\" y2=\"186\" stroke=\"#c62828\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"234.0\" y1=\"202\" x2=\"426.0\" y2=\"202\" stroke=\"#c62828\" stroke-width=\"6\" stroke-linecap=\"round\"/><text x=\"198.0\" y=\"142\" text-anchor=\"middle\" font-size=\"10\">Z膜</text><text x=\"462.0\" y=\"142\" text-anchor=\"middle\" font-size=\"10\">Z膜</text><text x=\"330\" y=\"238\" text-anchor=\"middle\" font-size=\"10\" fill=\"#e65100\">暗帯（1.6µm、長さは変わらない）</text><text x=\"330\" y=\"146\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">H帯</text><text x=\"216.0\" y=\"238\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#1565c0\">明帯</text><text x=\"474.0\" y=\"190\" font-size=\"10.5\">サルコメア</text><text x=\"474.0\" y=\"204\" font-size=\"10.5\">2.2µm</text><text x=\"40\" y=\"266\" font-size=\"10\" fill=\"#555\"><tspan fill=\"#1565c0\" font-weight=\"bold\">青</tspan>：アクチンフィラメント（Z膜から1.0µm）　<tspan fill=\"#c62828\" font-weight=\"bold\">赤</tspan>：ミオシンフィラメント</text></svg></div>\n<div class=\"cap\">図5　サルコメアの構造と収縮（滑り説）</div>\n<p>サルコメアには、細い<b class=\"key\">アクチンフィラメント</b>と、太い<b class=\"key\">ミオシンフィラメント</b>があります。筋肉が縮むとき、<span class=\"em\">ミオシンがATPを分解したエネルギーで、アクチンをサルコメアの中央へたぐりよせます</span>。フィラメント自体の長さは変わらず、重なりが大きくなることでサルコメアが短くなります（<b class=\"key\">滑り説</b>）。</p>\n<ul>\n<li>運動神経から興奮が来ると、筋繊維の中の<b>筋小胞体</b>から<b>Ca²⁺</b>が放出され、これがきっかけでミオシンとアクチンが結合できるようになる。</li>\n<li>縮むと、<b>明帯とH帯は短くなる</b>が、<b>暗帯（ミオシンのある部分）の長さは変わらない</b>。</li>\n<li>1回の刺激による1回の収縮を<b>単収縮</b>、刺激が続いて収縮が重なり、大きく縮み続ける状態を<b>強縮</b>という。</li>\n</ul>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：サルコメアの長さ</div>\n図5で、サルコメアが3.0µmから2.2µmに縮んだとき、暗帯は1.6µmのまま。H帯（ミオシンだけの部分）は 3.0−2×1.0＝1.0µm から 2.2−2×1.0＝0.2µm に、明帯は（両側合計で）3.0−1.6＝1.4µm から 2.2−1.6＝0.6µm になります。</div>\n\n<h2>5. 動物の行動</h2>\n<table class=\"t\">\n<tr><th style=\"width:22%\">行動</th><th>例</th></tr>\n<tr><td><b>生得的行動</b>（生まれつき）</td><td><b>走性</b>：光や化学物質に向かって（または離れて）動く。<b>かぎ刺激</b>：イトヨの雄は、腹の赤いものを見ると攻撃する。</td></tr>\n<tr><td><b>学習</b>（経験で変わる）</td><td><b>慣れ</b>：くり返しの刺激に反応しなくなる（アメフラシのえら引っこめ反射）。<b>古典的条件づけ</b>：ベルの音だけでだ液が出る（パブロフのイヌ）。<b>刷込み</b>：カモのひなが、生後すぐに見た動くものについて歩く。</td></tr>\n</table>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>受容器 → 感覚神経 → 中枢神経 → 運動神経 → 効果器</li>\n<li>適刺激：目は光、うずまき管は音、前庭は傾き、半規管は回転</li>\n<li>錐体細胞（黄斑・明るい所・色）、かん体細胞（周辺・弱い光）、盲斑には視細胞がない</li>\n<li>ニューロン：細胞体・樹状突起・軸索。有髄神経は跳躍伝導で速い</li>\n<li>静止電位（内側がマイナス）、活動電位（Na⁺が流入して内側がプラスに）</li>\n<li>全か無かの法則。刺激の強さは活動電位の頻度で伝わる</li>\n<li>伝導は両方向、伝達はシナプスで一方向（神経伝達物質）</li>\n<li>伝導速度＝2点の距離の差 ÷ 時間の差</li>\n<li>大脳・小脳・間脳・中脳・延髄・脊髄のはたらき。反射は大脳を通らない（しつがい腱反射は脊髄）</li>\n<li>サルコメア：ミオシンがATPを使ってアクチンをたぐりよせる（滑り説）。きっかけはCa²⁺</li>\n<li>縮むと明帯・H帯は短くなり、暗帯は変わらない</li>\n<li>生得的行動（走性・かぎ刺激）と学習（慣れ・古典的条件づけ・刷込み）</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>次の受容器の適刺激を答えよ。<br>(a) 目 <span class=\"blank\" style=\"min-width:16mm\"></span>　(b) うずまき管 <span class=\"blank\" style=\"min-width:16mm\"></span>　(c) 半規管 <span class=\"blank\" style=\"min-width:24mm\"></span></li>\n<li>網膜にある2種類の視細胞のうち、色を見分けるものと、弱い光でもはたらくものをそれぞれ答えよ。<br>色を見分ける <span class=\"blank\"></span>　弱い光ではたらく <span class=\"blank\"></span></li>\n<li>ニューロンが興奮したとき、膜電位が変化するしくみを、イオンの動きに注目して説明せよ。<div class=\"wline\"></div></li>\n<li>全か無かの法則とは何か。また、刺激の強さは何によって伝えられるか。<div class=\"wline\"></div></li>\n<li>興奮の伝達が一方向にしか起こらない理由を答えよ。<div class=\"wline\"></div></li>\n<li>神経筋標本で、筋肉から3cmの点を刺激すると2.5ミリ秒後に、8cmの点を刺激すると3.5ミリ秒後に筋肉が縮んだ。<br>(1) 伝導速度は何m/秒か。 <span class=\"blank\" style=\"min-width:14mm\"></span>m/秒<br>(2) 興奮が神経終末に着いてから筋肉が縮むまでに何ミリ秒かかったか。 <span class=\"blank\" style=\"min-width:14mm\"></span>ミリ秒</li>\n<li>次のはたらきの中枢を答えよ。<br>(a) 呼吸・心臓の拍動 <span class=\"blank\" style=\"min-width:16mm\"></span>　(b) からだの平衡 <span class=\"blank\" style=\"min-width:16mm\"></span>　(c) しつがい腱反射 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li>反射が、意識して行う反応よりすばやく起こる理由を答えよ。<div class=\"wline\"></div></li>\n<li>筋肉が縮むとき、長さが変わらないのは暗帯・明帯・H帯のどれか。また、収縮のエネルギー源となる物質は何か。<br><span class=\"blank\" style=\"min-width:20mm\"></span>・<span class=\"blank\" style=\"min-width:20mm\"></span></li>\n<li><b>説明の練習</b>　筋肉が縮むしくみを、「アクチン」「ミオシン」「ATP」を使って、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　(a) 光　(b) 音　(c) からだの回転</b>　前庭はからだの傾き。</p>\n<p><b>2.　色を見分ける：錐体細胞　弱い光ではたらく：かん体細胞</b></p>\n<p><b>3.　解答例</b>　ふだんは細胞の内側がマイナス（静止電位）だが、刺激を受けるとNa⁺が細胞の中に流れこんで内側がプラスに逆転し（活動電位）、そのあとK⁺が外に出てもとに戻る。</p>\n<p><b>4.　解答例</b>　1本のニューロンは、閾値未満の刺激では興奮せず、閾値以上ならどんな強さの刺激でも同じ大きさの活動電位が生じること。刺激の強さは、活動電位が発生する頻度（回数）や、興奮するニューロンの数で伝えられる。</p>\n<p><b>5.　解答例</b>　神経伝達物質は神経終末からしか放出されず、受容体は次の細胞にしかないから。</p>\n<p><b>6.　(1) 50m/秒　(2) 1.9ミリ秒</b>　(1) 距離の差 50mm ÷ 時間の差 1.0ミリ秒 ＝ 50mm/ミリ秒 ＝ 50m/秒。(2) 30mmを伝わる時間は 30÷50＝0.6ミリ秒。2.5−0.6＝1.9ミリ秒。</p>\n<p><b>7.　(a) 延髄　(b) 小脳　(c) 脊髄</b></p>\n<p><b>8.　解答例</b>　興奮が大脳を通らず、脊髄などで折り返して運動神経に伝わるので、経路が短いから。</p>\n<p><b>9.　暗帯・ATP</b>　暗帯はミオシンフィラメントのある部分で、フィラメントの長さは変わらない。</p>\n<p><b>10.　解答例</b>　筋肉の中には、細いアクチンと太いミオシンという2種類の糸が交互に重なっています。縮むときは、ミオシンがATPを分解したエネルギーで、アクチンを中央へたぐりよせます。糸の長さは変わらず、重なりが増えることで全体が短くなります。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第9回 植物の環境応答）に向けて</div>\n第9回は植物編です。動物は神経と筋肉ですばやく反応しましたが、植物は<b>植物ホルモン</b>で、光や重力などに応答します。この回の「受容 → 情報の伝達 → 反応」の流れとくらべながら読むと理解しやすくなります。</div>\n</details>", "heads": ["0. 刺激から反応まで", "1. 刺激を受けとる：受容器", "2. 興奮が起こるしくみ：ニューロン", "3. 判断する：中枢神経と反射", "4. 反応する：筋肉の収縮", "5. 動物の行動", "この回のまとめ", "確認問題"]}, "9": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第9回　植物の環境応答</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>植物の光受容体（フィトクロム・フォトトロピン）と、それぞれがかかわる反応を言える</li>\n<li>オーキシンによる光屈性・重力屈性のしくみと、主な植物ホルモンのはたらきを説明できる</li>\n<li>種子の発芽（ジベレリン・アミラーゼ、光発芽種子）のしくみを説明できる</li>\n<li>光周性（長日植物・短日植物・限界暗期・光中断）を使って、花芽ができるかを判断できる</li>\n</ul></div>\n\n<h2>0. 動物との比較</h2>\n<p>前回、動物は受容器と神経・筋肉ですばやく反応することを学びました。植物には神経も筋肉もありませんが、光・重力・温度・日の長さなどの変化を<b>受容体</b>で受けとり、<b class=\"key\">植物ホルモン</b>という物質を使って、成長の向きや発芽・開花の時期を調節しています。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">刺激</div><div class=\"fbs\">光・重力・<br>日の長さ</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">受容体</div><div class=\"fbs\">フィトクロム<br>など</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">植物ホルモン</div><div class=\"fbs\">オーキシン<br>など</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">反応</div><div class=\"fbs\">成長・発芽<br>開花</div></div></div>\n\n<h2>1. 光を受けとるしくみ</h2>\n<table class=\"t\">\n<tr><th style=\"width:22%\">光受容体</th><th style=\"width:22%\">受けとる光</th><th>かかわる反応</th></tr>\n<tr><td><b>フィトクロム</b></td><td>赤色光・遠赤色光</td><td>光発芽種子の発芽、花芽形成（日の長さの感知）</td></tr>\n<tr><td><b>フォトトロピン</b></td><td>青色光</td><td>光屈性、気孔を開く</td></tr>\n<tr><td><b>クリプトクロム</b></td><td>青色光</td><td>茎ののびすぎをおさえる</td></tr>\n</table>\n\n<h2>2. 屈性とオーキシン</h2>\n<h3>2-1　屈性と傾性</h3>\n<p>刺激の<b>方向</b>に対して曲がる反応を<b class=\"key\">屈性</b>といい、刺激の方へ曲がるのを<b>正（＋）</b>、反対へ曲がるのを<b>負（−）</b>といいます。茎は光の方へ曲がり（<b>光屈性：正</b>）、重力と反対の上へのびます（<b>重力屈性：負</b>）。根は下へのびます（<b>重力屈性：正</b>）。一方、刺激の方向に関係なく起こる反応を<b class=\"key\">傾性</b>といいます（例：チューリップの花が温度で開閉する、オジギソウが触れると葉を閉じる）。</p>\n\n<h3>2-2　光屈性のしくみ</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 230\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"p1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#f9a825\"/></marker></defs><defs><marker id=\"p2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#2e7d4f\"/></marker></defs><path d=\"M20 70 L52 70\" stroke=\"#f9a825\" stroke-width=\"2.4\" marker-end=\"url(#p1)\"/><path d=\"M20 110 L52 110\" stroke=\"#f9a825\" stroke-width=\"2.4\" marker-end=\"url(#p1)\"/><path d=\"M20 150 L52 150\" stroke=\"#f9a825\" stroke-width=\"2.4\" marker-end=\"url(#p1)\"/><text x=\"20\" y=\"54\" font-size=\"10.5\" fill=\"#b28704\" font-weight=\"bold\">光</text><rect x=\"101\" y=\"60\" width=\"18\" height=\"140\" fill=\"#c5e1a5\" stroke=\"#558b2f\" stroke-width=\"1.6\"/><path d=\"M101 60 Q110 38 119 60\" fill=\"#aed581\" stroke=\"#558b2f\" stroke-width=\"1.6\"/><text x=\"110\" y=\"222\" text-anchor=\"middle\" font-size=\"11\">① 先端でオーキシン</text><circle cx=\"110\" cy=\"56\" r=\"4\" fill=\"#c62828\"/><path d=\"M116 66 Q128 80 118 100\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.8\" stroke-dasharray=\"3,2\" marker-end=\"url(#p2)\"/><text x=\"150\" y=\"84\" font-size=\"10\" fill=\"#c62828\">光の当たらない</text><text x=\"150\" y=\"98\" font-size=\"10\" fill=\"#c62828\">側へ移動</text><rect x=\"291\" y=\"60\" width=\"18\" height=\"140\" fill=\"#c5e1a5\" stroke=\"#558b2f\" stroke-width=\"1.6\"/><path d=\"M291 60 Q300 38 309 60\" fill=\"#aed581\" stroke=\"#558b2f\" stroke-width=\"1.6\"/><text x=\"300\" y=\"222\" text-anchor=\"middle\" font-size=\"11\">② 下へ運ばれる</text><circle cx=\"305\" cy=\"90\" r=\"3.2\" fill=\"#c62828\"/><circle cx=\"305\" cy=\"120\" r=\"3.2\" fill=\"#c62828\"/><circle cx=\"305\" cy=\"150\" r=\"3.2\" fill=\"#c62828\"/><circle cx=\"305\" cy=\"180\" r=\"3.2\" fill=\"#c62828\"/><path d=\"M330 80 L330 170\" stroke=\"#c62828\" stroke-width=\"1.8\" marker-end=\"url(#p2)\"/><text x=\"338\" y=\"130\" font-size=\"10\" fill=\"#c62828\">陰側に多い</text><path d=\"M491 200 Q491 120 457 60 L475 60 Q509 120 509 200 Z\" fill=\"#c5e1a5\" stroke=\"#558b2f\" stroke-width=\"1.6\"/><path d=\"M457 60 Q466 38 475 60\" fill=\"#aed581\" stroke=\"#558b2f\" stroke-width=\"1.6\"/><text x=\"500\" y=\"222\" text-anchor=\"middle\" font-size=\"11\">③ 陰側がよくのびて光の方へ曲がる</text><text x=\"560\" y=\"140\" font-size=\"10\" fill=\"#2e7d4f\">よくのびる</text><text x=\"432\" y=\"160\" font-size=\"10\" fill=\"#555\">のびにくい</text><circle cx=\"190\" cy=\"198\" r=\"4\" fill=\"#c62828\"/><text x=\"198\" y=\"202\" font-size=\"10\">オーキシン</text></svg></div>\n<div class=\"cap\">図1　光屈性のしくみ（マカラスムギなどの幼葉鞘）</div>\n<p><b class=\"key\">オーキシン</b>は、茎の<b>先端</b>でつくられ、<b>先端から根の方へ（基部の方へ）一方向にだけ運ばれます</b>（極性移動）。横から光が当たると、オーキシンは<b>光の当たらない側</b>に移動してから下へ運ばれます。オーキシンは細胞の伸長を促進するので、<span class=\"em\">光の当たらない側がよくのびて、茎は光の方へ曲がります</span>。</p>\n<div class=\"box column\"><div class=\"bt\">光屈性を調べた実験</div>\nダーウィンは、幼葉鞘の<b>先端を切りとったり、おおったりすると光の方へ曲がらない</b>ことから、先端で光を感じていると考えました。ボイセン・イェンセンは、先端と下の部分の間に<b>ゼラチン</b>（物質を通す）をはさむと曲がり、<b>雲母片</b>（物質を通さない）を陰側にさしこむと曲がらないことから、<b>先端から下へ物質（オーキシン）が移動している</b>ことを示しました。</div>\n\n<h3>2-3　オーキシンの濃度と成長：重力屈性</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>オーキシンは、濃度によって成長を促進したり抑制したりします。<b>根は茎より低い濃度で最もよくのび</b>、茎がよくのびる濃度では、根の成長はかえって<b>抑制</b>されます。</p>\n<p>植物を横にすると、オーキシンは重力で<b>下側に多く</b>集まります。<b>茎</b>では下側がよくのびるので<b>上へ曲がり</b>、<b>根</b>では下側の濃度が高すぎて成長が抑制されるので<b>下へ曲がります</b>。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 340 220\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"180.0\" x2=\"270\" y2=\"180.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"150.0\" x2=\"270\" y2=\"150.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"120.0\" x2=\"270\" y2=\"120.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"90.0\" x2=\"270\" y2=\"90.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"60.0\" x2=\"270\" y2=\"60.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"30.0\" x2=\"270\" y2=\"30.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"270\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"195\" text-anchor=\"middle\">10⁻¹²</text><text x=\"83.3\" y=\"195\" text-anchor=\"middle\">10⁻¹⁰</text><text x=\"120.7\" y=\"195\" text-anchor=\"middle\">10⁻⁸</text><text x=\"158.0\" y=\"195\" text-anchor=\"middle\">10⁻⁶</text><text x=\"195.3\" y=\"195\" text-anchor=\"middle\">10⁻⁴</text><text x=\"232.7\" y=\"195\" text-anchor=\"middle\">10⁻²</text><text x=\"270.0\" y=\"195\" text-anchor=\"middle\">1</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"180\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"158.0\" y=\"214\" text-anchor=\"middle\">オーキシン濃度（mol/L）</text><text transform=\"translate(12,96.0) rotate(-90)\" text-anchor=\"middle\">成長</text><polyline points=\"46.0,99.9 50.7,91.0 55.3,80.1 60.0,67.9 64.7,55.1 69.3,43.0 74.0,33.0 78.7,26.5 83.3,24.3 88.0,26.9 92.7,34.2 97.3,45.5 102.0,60.1 106.7,77.2 111.3,95.5 116.0,113.0 120.7,127.5 125.3,138.2 130.0,145.4 134.7,149.9 139.3,152.6 144.0,154.2 148.7,155.1 153.3,155.5 158.0,155.8 162.7,155.9 167.3,156.0 172.0,156.0 176.7,156.0 181.3,156.0 186.0,156.0 190.7,156.0 195.3,156.0 200.0,156.0 204.7,156.0 209.3,156.0 214.0,156.0 218.7,156.0 223.3,156.0 228.0,156.0 232.7,156.0 237.3,156.0 242.0,156.0 246.7,156.0 251.3,156.0 256.0,156.0 260.7,156.0 265.3,156.0 270.0,156.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"75.9\" y=\"19.2\" font-weight=\"bold\" fill=\"#c62828\">根</text><polyline points=\"46.0,119.8 50.7,119.6 55.3,119.2 60.0,118.4 64.7,117.1 69.3,115.0 74.0,111.6 78.7,106.7 83.3,99.9 88.0,91.0 92.7,80.1 97.3,67.9 102.0,55.1 106.7,43.0 111.3,33.0 116.0,26.5 120.7,24.3 125.3,26.9 130.0,34.2 134.7,45.5 139.3,60.1 144.0,77.2 148.7,95.5 153.3,113.0 158.0,127.5 162.7,138.2 167.3,145.4 172.0,149.9 176.7,152.6 181.3,154.2 186.0,155.1 190.7,155.5 195.3,155.8 200.0,155.9 204.7,156.0 209.3,156.0 214.0,156.0 218.7,156.0 223.3,156.0 228.0,156.0 232.7,156.0 237.3,156.0 242.0,156.0 246.7,156.0 251.3,156.0 256.0,156.0 260.7,156.0 265.3,156.0 270.0,156.0\" fill=\"none\" stroke=\"#e65100\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"113.2\" y=\"19.2\" font-weight=\"bold\" fill=\"#e65100\">芽</text><polyline points=\"46.0,120.0 50.7,120.0 55.3,120.0 60.0,120.0 64.7,120.0 69.3,120.0 74.0,120.0 78.7,120.0 83.3,120.0 88.0,120.0 92.7,120.0 97.3,119.9 102.0,119.8 106.7,119.6 111.3,119.2 116.0,118.4 120.7,117.1 125.3,115.0 130.0,111.6 134.7,106.7 139.3,99.9 144.0,91.0 148.7,80.1 153.3,67.9 158.0,55.1 162.7,43.0 167.3,33.0 172.0,26.5 176.7,24.3 181.3,26.9 186.0,34.2 190.7,45.5 195.3,60.1 200.0,77.2 204.7,95.5 209.3,113.0 214.0,127.5 218.7,138.2 223.3,145.4 228.0,149.9 232.7,152.6 237.3,154.2 242.0,155.1 246.7,155.5 251.3,155.8 256.0,155.9 260.7,156.0 265.3,156.0 270.0,156.0\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"169.2\" y=\"19.2\" font-weight=\"bold\" fill=\"#2e7d4f\">茎</text><line x1=\"46\" y1=\"120.0\" x2=\"270\" y2=\"120.0\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"276\" y=\"112.0\" font-size=\"10\" fill=\"#2e7d4f\">↑促進</text><text x=\"276\" y=\"136.0\" font-size=\"10\" fill=\"#c62828\">↓抑制</text></svg><div class=\"cap\">図2　オーキシン濃度と成長（0より上が促進、下が抑制）</div></div></div>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「オーキシンは<b>根にとっては濃すぎるとブレーキ</b>になる」がポイントです。同じように下側にオーキシンが集まっても、茎（アクセル）は下側がのびて上へ、根（ブレーキ）は下側がのびなくなって下へ曲がる、と対比させると、図2のグラフの意味がつかめます。</div>\n<h3>2-4　頂芽優勢</h3>\n<p>茎の先端の芽（<b>頂芽</b>）があると、その下の<b>側芽</b>の成長がおさえられます。これを<b class=\"key\">頂芽優勢</b>といいます。頂芽でつくられた<b>オーキシン</b>が側芽の成長をおさえているためで、頂芽を切りとると側芽がのび始めます。<b>サイトカイニン</b>は側芽の成長を促進します。</p>\n\n<h2>3. 植物ホルモンのまとめ</h2>\n<table class=\"t\">\n<tr><th style=\"width:20%\">植物ホルモン</th><th>主なはたらき</th></tr>\n<tr><td><b>オーキシン</b></td><td>茎の成長（細胞の伸長）を促進、光屈性・重力屈性、頂芽優勢、発根の促進</td></tr>\n<tr><td><b>ジベレリン</b></td><td>茎の伸長を促進、<b>種子の発芽を促進</b>（休眠を打ち破る）、種なしブドウ（単為結実）づくりに利用</td></tr>\n<tr><td><b>アブシシン酸</b></td><td><b>種子の休眠を保つ</b>、乾燥したとき<b>気孔を閉じる</b></td></tr>\n<tr><td><b>エチレン</b>（気体）</td><td><b>果実の成熟</b>を促進、落葉・落果を促進</td></tr>\n<tr><td><b>サイトカイニン</b></td><td>細胞分裂を促進、<b>側芽の成長</b>を促進、葉の老化をおさえる</td></tr>\n<tr><td><b>ジャスモン酸</b></td><td>昆虫に食べられたとき、防御物質をつくらせる</td></tr>\n</table>\n\n<h2>4. 種子の休眠と発芽</h2>\n<p>種子は、<b>アブシシン酸</b>のはたらきで<b class=\"key\">休眠</b>し、条件がそろうまで発芽しません。発芽の条件がそろうと、次の流れで発芽します（イネやオオムギの例）。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">胚</div><div class=\"fbs\">水を吸う</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">ジベレリン</div><div class=\"fbs\">胚がつくる</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">糊粉層</div><div class=\"fbs\">アミラーゼを<br>つくる</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">胚乳のデンプン</div><div class=\"fbs\">→ 糖に分解</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">発芽</div><div class=\"fbs\">糖をエネルギーに</div></div></div>\n<div class=\"cap\">図3　ジベレリンによる発芽のしくみ</div>\n<p>胚がつくった<b class=\"key\">ジベレリン</b>が<b>糊粉層</b>にはたらきかけ、<b>アミラーゼ</b>（第4回）を合成させます。アミラーゼが胚乳のデンプンを糖に分解し、胚はその糖を呼吸に使って成長します。</p>\n<p>レタスなどの種子は、光が当たらないと発芽しません（<b class=\"key\">光発芽種子</b>）。光発芽種子は<b>フィトクロム</b>で光を受けとり、<span class=\"em\">赤色光を当てると発芽し、遠赤色光を当てると発芽しない</span>。赤色光と遠赤色光を交互に当てると、<b>最後に当てた光</b>で発芽するかどうかが決まります。</p>\n<div class=\"box column\"><div class=\"bt\">なぜ光で発芽を決めるのか</div>\nほかの植物の葉の下では、赤色光は葉に吸収されて少なく、遠赤色光が多くなります。光発芽種子は、遠赤色光が多い（＝日かげの）場所では発芽せず、光合成ができる明るい場所で発芽するしくみになっています。</div>\n\n<h2>5. 花芽をつくる時期：光周性</h2>\n<p>日の長さ（昼と夜の長さ）に反応する性質を<b class=\"key\">光周性</b>といいます。花芽をつくる時期は、植物によって次のように決まっています。</p>\n<table class=\"t\">\n<tr><th style=\"width:18%\">植物</th><th>花芽をつくる条件</th><th style=\"width:28%\">例</th></tr>\n<tr><td><b>短日植物</b></td><td>連続した暗期が<b>限界暗期より長く</b>なると花芽をつくる（秋にさく）</td><td>キク、アサガオ、オナモミ、イネ</td></tr>\n<tr><td><b>長日植物</b></td><td>連続した暗期が<b>限界暗期より短く</b>なると花芽をつくる（春〜初夏にさく）</td><td>アブラナ、ホウレンソウ、コムギ</td></tr>\n<tr><td><b>中性植物</b></td><td>日の長さに関係なく花芽をつくる</td><td>トマト、トウモロコシ</td></tr>\n</table>\n<p>花芽ができるかどうかを決める暗期の長さの境目を<b class=\"key\">限界暗期</b>といいます。植物が測っているのは昼の長さではなく、<span class=\"em\">連続した暗期（夜）の長さ</span>です。暗期の途中に短時間光を当てる（<b class=\"key\">光中断</b>）と、暗期が2つに分かれて短くなったのと同じになります。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 210\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><text x=\"500\" y=\"22\" text-anchor=\"middle\" font-weight=\"bold\">短日植物</text><text x=\"580\" y=\"22\" text-anchor=\"middle\" font-weight=\"bold\">長日植物</text><text x=\"10\" y=\"58\" font-size=\"11\">A　明期10・暗期14</text><rect x=\"150\" y=\"40\" width=\"140\" height=\"26\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"0.8\"/><rect x=\"290\" y=\"40\" width=\"196\" height=\"26\" fill=\"#455a64\" stroke=\"#555\" stroke-width=\"0.8\"/><text x=\"500\" y=\"59\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#2e7d4f\">○</text><text x=\"580\" y=\"59\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#c62828\">×</text><text x=\"10\" y=\"108\" font-size=\"11\">B　明期16・暗期8</text><rect x=\"150\" y=\"90\" width=\"224\" height=\"26\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"0.8\"/><rect x=\"374\" y=\"90\" width=\"112\" height=\"26\" fill=\"#455a64\" stroke=\"#555\" stroke-width=\"0.8\"/><text x=\"500\" y=\"109\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#c62828\">×</text><text x=\"580\" y=\"109\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#2e7d4f\">○</text><text x=\"10\" y=\"158\" font-size=\"11\">C　Aの暗期の途中に光</text><rect x=\"150\" y=\"140\" width=\"140\" height=\"26\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"0.8\"/><rect x=\"290\" y=\"140\" width=\"98\" height=\"26\" fill=\"#455a64\" stroke=\"#555\" stroke-width=\"0.8\"/><rect x=\"388\" y=\"140\" width=\"8.400000000000034\" height=\"26\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"0.8\"/><rect x=\"396.40000000000003\" y=\"140\" width=\"89.59999999999997\" height=\"26\" fill=\"#455a64\" stroke=\"#555\" stroke-width=\"0.8\"/><text x=\"500\" y=\"159\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#c62828\">×</text><text x=\"580\" y=\"159\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#2e7d4f\">○</text><text x=\"150\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">0時</text><text x=\"234\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">6時</text><text x=\"318\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">12時</text><text x=\"402\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">18時</text><text x=\"486\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">24時</text><text x=\"150\" y=\"208\" font-size=\"10\" fill=\"#555\">限界暗期を10時間とする。○：花芽をつくる　×：つくらない。黄色：明期　灰色：暗期</text></svg></div>\n<div class=\"cap\">図4　光の条件と花芽形成（限界暗期10時間の例）</div>\n<p>日の長さは<b>葉</b>で感じとります。条件がそろうと、葉で<b class=\"key\">フロリゲン</b>（花成ホルモン）というタンパク質がつくられ、<b>師管</b>を通って茎の先端に運ばれ、花芽をつくらせます。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：光中断の判断</div>\n<b>手順</b>　① 図の暗期のうち、<b>いちばん長い連続した暗期</b>をさがす（光中断があれば、そこで切れる）。② 限界暗期とくらべる。③ 短日植物は「長ければ○」、長日植物は「短ければ○」。<br>\n図4のCは暗期が7時間と6.4時間に分かれ、どちらも10時間より短いので、短日植物は×、長日植物は○。</div>\n\n<h2>6. 気孔の開閉とそのほかの応答</h2>\n<ul>\n<li><b>気孔</b>は2つの<b>孔辺細胞</b>にはさまれたすき間。<b>青色光</b>をフォトトロピンで受けとると<b>開き</b>、CO₂を取りこめるようになる。乾燥すると<b>アブシシン酸</b>のはたらきで<b>閉じ</b>、水分が出ていくのを防ぐ。</li>\n<li>果実の成熟には<b>エチレン</b>がかかわる。リンゴといっしょに置いたバナナが早く熟すのは、リンゴから出るエチレンのため。</li>\n<li>昆虫に葉を食べられると、<b>ジャスモン酸</b>のはたらきで、消化をさまたげる物質などをつくって身を守る。</li>\n</ul>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>フィトクロム（赤色光・遠赤色光：発芽・花芽形成）、フォトトロピン（青色光：光屈性・気孔を開く）</li>\n<li>屈性は刺激の方向に曲がる（茎：光屈性＋・重力屈性−、根：重力屈性＋）。傾性は方向と無関係</li>\n<li>オーキシンは先端でつくられ、先端から基部へ一方向に移動（極性移動）</li>\n<li>光屈性：オーキシンが光の当たらない側へ → 陰側がのびて光の方へ曲がる</li>\n<li>根は茎より低濃度で最適。横にすると下側にオーキシン → 茎は上へ、根は下へ</li>\n<li>頂芽優勢：頂芽のオーキシンが側芽をおさえる。サイトカイニンは側芽の成長を促進</li>\n<li>ジベレリン（発芽・伸長）、アブシシン酸（休眠・気孔を閉じる）、エチレン（果実の成熟）</li>\n<li>発芽：胚 → ジベレリン → 糊粉層でアミラーゼ → デンプンを糖に</li>\n<li>光発芽種子：赤色光で発芽、遠赤色光で発芽しない。最後に当てた光で決まる</li>\n<li>短日植物は連続暗期が限界暗期より長いと、長日植物は短いと花芽をつくる。光中断で暗期は分かれる</li>\n<li>日の長さは葉で感じとり、フロリゲンが師管を通って茎の先端へ</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>赤色光と遠赤色光を受けとる光受容体と、青色光を受けとって光屈性にかかわる光受容体を答えよ。<br><span class=\"blank\"></span>・<span class=\"blank\"></span></li>\n<li>茎の光屈性と重力屈性は、それぞれ正・負のどちらか。また、根の重力屈性はどちらか。<br>茎の光屈性 <span class=\"blank\" style=\"min-width:12mm\"></span>　茎の重力屈性 <span class=\"blank\" style=\"min-width:12mm\"></span>　根の重力屈性 <span class=\"blank\" style=\"min-width:12mm\"></span></li>\n<li>横から光を当てた幼葉鞘が光の方へ曲がるしくみを、オーキシンの動きに注目して説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n<li>植物を横にすると、根は下へ曲がる。その理由を、オーキシンの濃度と根の感受性から説明せよ。<div class=\"wline\"></div></li>\n<li>次のはたらきをもつ植物ホルモンを答えよ。<br>(a) 種子の休眠を保ち、気孔を閉じる <span class=\"blank\"></span>　(b) 果実の成熟を促進する <span class=\"blank\"></span><br>(c) 種子の発芽を促進する <span class=\"blank\"></span>　(d) 側芽の成長を促進する <span class=\"blank\"></span></li>\n<li>頂芽優勢とは何か。また、頂芽を切りとるとどうなるか。<div class=\"wline\"></div></li>\n<li>オオムギの種子が発芽するとき、ジベレリンはどこにはたらきかけて、何をつくらせるか。<div class=\"wline\"></div></li>\n<li>レタスの種子に、赤色光 → 遠赤色光 → 赤色光 → 遠赤色光 の順に光を当てた。この種子は発芽するか。 <span class=\"blank\" style=\"min-width:24mm\"></span></li>\n<li>限界暗期が12時間の植物について答えよ。<br>(1) 明期9時間・暗期15時間で、短日植物と長日植物はそれぞれ花芽をつくるか。<br>　短日植物 <span class=\"blank\" style=\"min-width:16mm\"></span>　長日植物 <span class=\"blank\" style=\"min-width:16mm\"></span><br>(2) (1)の暗期の真ん中に短時間光を当てると、短日植物は花芽をつくるか。 <span class=\"blank\" style=\"min-width:16mm\"></span></li>\n<li><b>説明の練習</b>　「植物が測っているのは昼の長さではなく夜の長さ」であることが、光中断の実験からどうわかるかを、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　フィトクロム・フォトトロピン</b></p>\n<p><b>2.　茎の光屈性：正　茎の重力屈性：負　根の重力屈性：正</b></p>\n<p><b>3.　解答例</b>　オーキシンは先端でつくられ、光の当たらない側に移動してから下へ運ばれる。オーキシンは細胞の伸長を促進するので、光の当たらない側がよくのび、光の方へ曲がる。</p>\n<p><b>4.　解答例</b>　横にするとオーキシンは下側に多く集まる。根は低い濃度でよくのび、高い濃度では成長が抑制されるので、下側ののびが小さくなり、根は下へ曲がる。</p>\n<p><b>5.　(a) アブシシン酸　(b) エチレン　(c) ジベレリン　(d) サイトカイニン</b></p>\n<p><b>6.　解答例</b>　頂芽があると、頂芽でつくられたオーキシンのはたらきで側芽の成長がおさえられること。頂芽を切りとると、側芽がのび始める。</p>\n<p><b>7.　解答例</b>　糊粉層にはたらきかけて、アミラーゼをつくらせる。アミラーゼは胚乳のデンプンを糖に分解する。</p>\n<p><b>8.　発芽しない</b>　最後に当てたのが遠赤色光なので、発芽しない。</p>\n<p><b>9.　(1) 短日植物：つくる　長日植物：つくらない　(2) つくらない</b>　(1) 連続暗期15時間は限界暗期12時間より長い。(2) 光中断で暗期が7.5時間ずつに分かれ、12時間より短くなる。</p>\n<p><b>10.　解答例</b>　短日植物に、長い夜の途中で短い時間だけ光を当てると、昼の長さはほとんど変わらないのに、花芽をつくらなくなります。夜が2つに分かれて、どちらも短くなったからです。逆に昼の途中に暗くしても結果は変わりません。だから植物は、連続した夜の長さを測っているとわかります。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第10回 体内環境）に向けて</div>\n第10回は動物（ヒト）の体に戻り、<b>ホルモン</b>と<b>自律神経</b>で体の中の状態を一定に保つしくみと、<b>免疫</b>を学びます。植物ホルモンと動物のホルモンをくらべながら読むと整理しやすくなります。第8回の<b>間脳（視床下部）</b>が中心になります。</div>\n</details>", "heads": ["0. 動物との比較", "1. 光を受けとるしくみ", "2. 屈性とオーキシン", "3. 植物ホルモンのまとめ", "4. 種子の休眠と発芽", "5. 花芽をつくる時期：光周性", "6. 気孔の開閉とそのほかの応答", "この回のまとめ", "確認問題"]}, "10": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第10回　体内環境</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>体液と恒常性、血液の成分と血液凝固のしくみを説明できる</li>\n<li>酸素解離曲線を読み、組織で放出される酸素の割合を計算できる</li>\n<li>腎臓のろ過・再吸収と、イヌリンを使った原尿量・再吸収量の計算ができる</li>\n<li>自律神経とホルモンによる調節（血糖・体温・水分、フィードバック）を説明できる</li>\n<li>自然免疫と獲得免疫（体液性・細胞性）、二次応答とワクチンを説明できる</li>\n</ul></div>\n\n<h2>0. 体内環境とは</h2>\n<p>からだの細胞は、<b class=\"key\">体液</b>にひたされて生きています。体液は細胞にとっての「環境」なので<b>体内環境</b>といいます。体液は次の3つに分けられます。</p>\n<ul>\n<li><b>血液</b>：血管の中を流れる。</li>\n<li><b>組織液</b>：血しょうが毛細血管からしみ出たもの。細胞のまわりを満たし、酸素や栄養分を細胞にわたす。</li>\n<li><b>リンパ液</b>：組織液の一部がリンパ管に入ったもの。リンパ球を含み、最後は静脈に合流する。</li>\n</ul>\n<p>外の気温や食事が変わっても、体液の温度・血糖濃度・塩分濃度などはほぼ一定に保たれます。これを<b class=\"key\">恒常性</b>（ホメオスタシス）といい、<b>腎臓・肝臓</b>、<b>自律神経</b>と<b>ホルモン</b>、<b>免疫</b>がこれを支えています。</p>\n\n<h2>1. 血液のはたらき</h2>\n<table class=\"t\">\n<tr><th style=\"width:18%\">成分</th><th>主なはたらき・特徴</th></tr>\n<tr><td><b>赤血球</b></td><td><b>ヘモグロビン</b>で<b>酸素を運ぶ</b>。核がない。骨髄でつくられる</td></tr>\n<tr><td><b>白血球</b></td><td><b>免疫</b>にはたらく（好中球・マクロファージ・リンパ球など）。核がある</td></tr>\n<tr><td><b>血小板</b></td><td><b>血液凝固</b>にはたらく</td></tr>\n<tr><td><b>血しょう</b>（液体）</td><td>約90%が水。タンパク質・グルコース・無機塩類を含み、<b>栄養分・CO₂・ホルモン・老廃物を運ぶ</b></td></tr>\n</table>\n<h3>血液凝固</h3>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">血管が傷つく</div><div class=\"fbs\"></div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">血小板が集まる</div><div class=\"fbs\">凝固因子が<br>はたらく</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">フィブリン</div><div class=\"fbs\">繊維状の<br>タンパク質</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">血ぺい</div><div class=\"fbs\">血球をからめて<br>傷口をふさぐ</div></div></div>\n<p>血液を試験管に入れて置いておくと、下に固まった<b class=\"key\">血ぺい</b>、上に黄色い液体の<b class=\"key\">血清</b>（血しょうから凝固にかかわるタンパク質がぬけたもの）に分かれます。傷が治ると、フィブリンを分解して血ぺいを溶かすしくみ（<b>線溶</b>）がはたらきます。</p>\n\n<h2>2. 酸素の運搬：酸素解離曲線</h2>\n<div class=\"side\"><div class=\"txt\">\n<p>赤血球の<b class=\"key\">ヘモグロビン</b>（Hb）は、酸素が多いところで酸素と結合して<b>酸素ヘモグロビン</b>になり、酸素が少ないところで酸素を放します。酸素の量（酸素分圧）と、酸素ヘモグロビンの割合の関係を表したグラフが<b class=\"key\">酸素解離曲線</b>です（図1）。</p>\n<p>CO₂が多いと曲線は<b>右にずれ</b>、同じ酸素分圧でも酸素を<b>放しやすく</b>なります。肺（酸素が多くCO₂が少ない）で酸素と結合し、組織（酸素が少なくCO₂が多い）で効率よく酸素を放すしくみです。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 330 230\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"190.0\" x2=\"260\" y2=\"190.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"194.0\" text-anchor=\"end\">0</text><line x1=\"46\" y1=\"154.4\" x2=\"260\" y2=\"154.4\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"158.4\" text-anchor=\"end\">20</text><line x1=\"46\" y1=\"118.8\" x2=\"260\" y2=\"118.8\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"122.8\" text-anchor=\"end\">40</text><line x1=\"46\" y1=\"83.2\" x2=\"260\" y2=\"83.2\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"87.2\" text-anchor=\"end\">60</text><line x1=\"46\" y1=\"47.6\" x2=\"260\" y2=\"47.6\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"51.6\" text-anchor=\"end\">80</text><line x1=\"46\" y1=\"12.0\" x2=\"260\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"16.0\" text-anchor=\"end\">100</text><text x=\"46.0\" y=\"205\" text-anchor=\"middle\">0</text><text x=\"88.8\" y=\"205\" text-anchor=\"middle\">20</text><text x=\"131.6\" y=\"205\" text-anchor=\"middle\">40</text><text x=\"174.4\" y=\"205\" text-anchor=\"middle\">60</text><text x=\"217.2\" y=\"205\" text-anchor=\"middle\">80</text><text x=\"260.0\" y=\"205\" text-anchor=\"middle\">100</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"190\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"190\" x2=\"260\" y2=\"190\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"153.0\" y=\"224\" text-anchor=\"middle\">酸素分圧（mmHg）</text><text transform=\"translate(12,101.0) rotate(-90)\" text-anchor=\"middle\">酸素ヘモグロビンの割合（%）</text><polyline points=\"46.0,190.0 50.3,189.8 54.6,189.0 58.8,187.0 63.1,183.6 67.4,178.6 71.7,172.1 76.0,164.2 80.2,155.1 84.5,145.4 88.8,135.2 93.1,125.0 97.4,115.0 101.6,105.5 105.9,96.6 110.2,88.4 114.5,80.9 118.8,74.2 123.0,68.1 127.3,62.6 131.6,57.8 135.9,53.4 140.2,49.6 144.4,46.1 148.7,43.1 153.0,40.3 157.3,37.9 161.6,35.7 165.8,33.8 170.1,32.0 174.4,30.5 178.7,29.1 183.0,27.8 187.2,26.6 191.5,25.6 195.8,24.6 200.1,23.8 204.4,23.0 208.6,22.3 212.9,21.6 217.2,21.0 221.5,20.4 225.8,19.9 230.0,19.5 234.3,19.0 238.6,18.6 242.9,18.3 247.2,17.9 251.4,17.6 255.7,17.3 260.0,17.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"58.8\" y=\"40.5\" font-weight=\"bold\" fill=\"#c62828\">CO₂分圧40</text><polyline points=\"46.0,190.0 50.3,189.9 54.6,189.6 58.8,188.9 63.1,187.6 67.4,185.6 71.7,182.9 76.0,179.5 80.2,175.3 84.5,170.4 88.8,164.8 93.1,158.7 97.4,152.2 101.6,145.4 105.9,138.4 110.2,131.3 114.5,124.2 118.8,117.3 123.0,110.6 127.3,104.1 131.6,98.0 135.9,92.1 140.2,86.6 144.4,81.5 148.7,76.7 153.0,72.2 157.3,68.1 161.6,64.2 165.8,60.7 170.1,57.4 174.4,54.4 178.7,51.6 183.0,49.0 187.2,46.6 191.5,44.4 195.8,42.4 200.1,40.5 204.4,38.8 208.6,37.2 212.9,35.7 217.2,34.4 221.5,33.1 225.8,31.9 230.0,30.8 234.3,29.8 238.6,28.9 242.9,28.0 247.2,27.1 251.4,26.4 255.7,25.7 260.0,25.0\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"157.3\" y=\"104.6\" font-weight=\"bold\" fill=\"#1565c0\">CO₂分圧70</text><line x1=\"260.0\" y1=\"17.3\" x2=\"260.0\" y2=\"190.0\" stroke=\"#c62828\" stroke-dasharray=\"2,2\"/><line x1=\"46.0\" y1=\"17.3\" x2=\"260.0\" y2=\"17.3\" stroke=\"#c62828\" stroke-dasharray=\"2,2\"/><circle cx=\"260.0\" cy=\"17.3\" r=\"3.5\" fill=\"#c62828\"/><line x1=\"110.2\" y1=\"131.3\" x2=\"110.2\" y2=\"190.0\" stroke=\"#1565c0\" stroke-dasharray=\"2,2\"/><line x1=\"46.0\" y1=\"131.3\" x2=\"110.2\" y2=\"131.3\" stroke=\"#1565c0\" stroke-dasharray=\"2,2\"/><circle cx=\"110.2\" cy=\"131.3\" r=\"3.5\" fill=\"#1565c0\"/><text x=\"266.0\" y=\"21.3\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#c62828\">肺 97%</text><text x=\"116.2\" y=\"145.3\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#1565c0\">組織 33%</text></svg><div class=\"cap\">図1　酸素解離曲線（肺：酸素分圧100・CO₂分圧40、<br>組織：酸素分圧30・CO₂分圧70 mmHg）</div></div></div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：組織で放した酸素の割合</div>\n図1で、肺では酸素ヘモグロビンが<b>97%</b>、組織では<b>33%</b>。<br>\n・全ヘモグロビンのうち組織で酸素を放したもの：97 − 33 ＝ <b>64%</b><br>\n・<b>酸素ヘモグロビンのうち</b>組織で酸素を放したもの：(97 − 33) ÷ 97 × 100 ≒ <b>66%</b><br>\n「何のうちの割合か」で分母が変わるのがひっかけポイントです。</div>\n\n<h2>3. 肝臓のはたらき</h2>\n<p>肝臓には、肝動脈のほかに、消化管で吸収した栄養分を多く含む血液が<b class=\"key\">肝門脈</b>を通って流れこみます。肝臓は「からだの化学工場」です。</p>\n<ul>\n<li><b>血糖濃度の調節</b>：グルコースを<b>グリコーゲン</b>にして貯え、必要なときに分解して血液に出す。</li>\n<li><b>タンパク質の合成</b>：血しょうのタンパク質（アルブミンや血液凝固にかかわるタンパク質）をつくる。</li>\n<li><b>解毒</b>：アルコールなどの有害な物質を分解する。タンパク質の分解でできる有害な<b>アンモニア</b>を、毒性の低い<b class=\"key\">尿素</b>に変える。</li>\n<li><b>胆汁</b>をつくる：脂肪の消化を助ける。古い赤血球を壊してできた色素（ビリルビン）も胆汁に捨てる。</li>\n<li><b>熱の発生</b>：さかんに化学反応が起こるので、多くの熱を出して体温を保つ。</li>\n</ul>\n\n<h2>4. 腎臓と尿の生成</h2>\n<p>腎臓は、血液から老廃物（尿素など）を取り除き、水分や塩分の量を調節する器官です。腎臓の中には、尿をつくる単位である<b class=\"key\">ネフロン</b>（腎単位）が1つの腎臓に約100万個あります。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 270\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><defs><marker id=\"n1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#c62828\"/></marker></defs><defs><marker id=\"n2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#1565c0\"/></marker></defs><defs><marker id=\"n3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#555\"/></marker></defs><path d=\"M10 66 L96 74\" stroke=\"#c62828\" stroke-width=\"5\" fill=\"none\"/><path d=\"M10 100 L96 88\" stroke=\"#c62828\" stroke-width=\"4\" fill=\"none\"/><text x=\"10\" y=\"58\" font-size=\"10\" fill=\"#c62828\">血液が入る</text><text x=\"10\" y=\"116\" font-size=\"10\" fill=\"#c62828\">血液が出る</text><path d=\"M100 47 A35 35 0 1 1 100 113\" fill=\"#fff8e1\" stroke=\"#e65100\" stroke-width=\"3\"/><circle cx=\"112\" cy=\"70\" r=\"7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"124\" cy=\"66\" r=\"7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"130\" cy=\"80\" r=\"7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"120\" cy=\"90\" r=\"7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"108\" cy=\"84\" r=\"7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"122\" cy=\"78\" r=\"7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M146 98 C 185 110, 190 50, 230 58 C 270 66, 262 118, 300 110 L 300 214 Q 315 244 330 214 L 330 128 C 360 104, 380 142, 420 124 C 455 108, 470 84, 516 84\" stroke=\"#e65100\" stroke-width=\"12\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M146 98 C 185 110, 190 50, 230 58 C 270 66, 262 118, 300 110 L 300 214 Q 315 244 330 214 L 330 128 C 360 104, 380 142, 420 124 C 455 108, 470 84, 516 84\" stroke=\"#ffe0b2\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M524 24 L524 236\" stroke=\"#6d4c41\" stroke-width=\"16\" fill=\"none\"/><path d=\"M524 24 L524 236\" stroke=\"#d7ccc8\" stroke-width=\"10\" fill=\"none\"/><path d=\"M524 238 L524 262\" stroke=\"#6d4c41\" stroke-width=\"2\" marker-end=\"url(#n3)\"/><text x=\"534\" y=\"258\" font-size=\"10.5\">尿へ（ぼうこう）</text><text x=\"508\" y=\"18\" font-size=\"11\" font-weight=\"bold\" fill=\"#6d4c41\">集合管</text><path d=\"M128 96 L142 104\" stroke=\"#c62828\" stroke-width=\"1.6\" marker-end=\"url(#n1)\"/><text x=\"168\" y=\"134\" font-size=\"10.5\" fill=\"#c62828\" font-weight=\"bold\">ろ過 <tspan font-size=\"9.5\" font-weight=\"normal\">→ 原尿</tspan></text><path d=\"M294 172 L262 172\" stroke=\"#1565c0\" stroke-width=\"2\" marker-end=\"url(#n2)\"/><text x=\"252\" y=\"166\" text-anchor=\"end\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#1565c0\">再吸収</text><text x=\"252\" y=\"182\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#1565c0\">グルコース：全部</text><text x=\"252\" y=\"195\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#1565c0\">水・無機塩類：多く</text><path d=\"M534 160 L568 160\" stroke=\"#1565c0\" stroke-width=\"2\" marker-end=\"url(#n2)\"/><text x=\"538\" y=\"146\" font-size=\"10\" fill=\"#1565c0\">水の再吸収</text><text x=\"538\" y=\"180\" font-size=\"9.5\" fill=\"#1565c0\">バソプレシンが</text><text x=\"538\" y=\"192\" font-size=\"9.5\" fill=\"#1565c0\">促進</text><text x=\"132\" y=\"34\" font-size=\"10.5\">ボーマンのう</text><path d=\"M140 37 L130 48\" stroke=\"#555\"/><text x=\"40\" y=\"34\" font-size=\"10.5\" fill=\"#c62828\">糸球体</text><path d=\"M66 38 L106 64\" stroke=\"#555\"/><text x=\"360\" y=\"96\" font-size=\"11\" font-weight=\"bold\" fill=\"#e65100\">細尿管（腎細管）</text><path d=\"M80 124 L152 124\" stroke=\"#555\"/><path d=\"M80 119 L80 129 M152 119 L152 129\" stroke=\"#555\"/><text x=\"20\" y=\"142\" font-size=\"10\">腎小体（糸球体＋ボーマンのう）</text><text x=\"340\" y=\"250\" font-size=\"10\" fill=\"#555\">ネフロン（腎単位）＝ 腎小体 ＋ 細尿管</text></svg></div>\n<div class=\"cap\">図2　ネフロンと尿の生成</div>\n<ol>\n<li><b class=\"key\">ろ過</b>：<b>糸球体</b>の血液から、血しょうの成分が<b>ボーマンのう</b>へこし出され、<b>原尿</b>になる。<span class=\"em\">血球とタンパク質は大きいのでろ過されない</span>。</li>\n<li><b class=\"key\">再吸収</b>：原尿が<b>細尿管</b>を通る間に、必要な物質が毛細血管へ戻される。<span class=\"em\">グルコースは（健康なら）すべて再吸収</span>、水や無機塩類も多くが再吸収される。<b>集合管</b>ではさらに水が再吸収される。</li>\n<li>残ったものが<b>尿</b>になる。尿素などの老廃物は、再吸収されにくいので尿の中で濃くなる。</li>\n</ol>\n<table class=\"t\" style=\"font-size:9.6pt\">\n<tr><th>成分（mg/mL）</th><th class=\"c\">血しょう</th><th class=\"c\">原尿</th><th class=\"c\">尿</th><th class=\"c\">濃縮率（尿÷血しょう）</th></tr>\n<tr><td>タンパク質</td><td class=\"c\">72</td><td class=\"c\">0</td><td class=\"c\">0</td><td class=\"c\">—（ろ過されない）</td></tr>\n<tr><td>グルコース</td><td class=\"c\">1.0</td><td class=\"c\">1.0</td><td class=\"c\">0</td><td class=\"c\">0（すべて再吸収）</td></tr>\n<tr><td>尿素</td><td class=\"c\">0.3</td><td class=\"c\">0.3</td><td class=\"c\">20</td><td class=\"c\">約67</td></tr>\n<tr><td>Na⁺</td><td class=\"c\">3.2</td><td class=\"c\">3.2</td><td class=\"c\">3.5</td><td class=\"c\">約1.1</td></tr>\n<tr><td><b>イヌリン</b></td><td class=\"c\">0.1</td><td class=\"c\">0.1</td><td class=\"c\">12</td><td class=\"c\"><b>120</b></td></tr>\n</table>\n<p><b class=\"key\">イヌリン</b>は、植物がつくる物質で、<span class=\"em\">ろ過はされるが再吸収も分泌もされない</span>ので、原尿の量を調べる目印に使います。原尿中のイヌリンは全部尿に出るので、<b>濃縮率の分だけ水が再吸収されて尿が濃くなった</b>と考えます。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：原尿量と再吸収量</div>\n1日の尿量を1.5Lとする（上の表）。<br>\n① 原尿量 ＝ 尿量 × イヌリンの濃縮率 ＝ 1.5 × 120 ＝ <b>180 L</b><br>\n② 水の再吸収量 ＝ 180 − 1.5 ＝ <b>178.5 L</b>（原尿の約99%）<br>\n③ 尿素の再吸収量 ＝ 原尿中の量 − 尿中の量 ＝ 180L × 0.3g/L − 1.5L × 20g/L ＝ 54 − 30 ＝ <b>24 g</b><br>\n<span style=\"font-size:9.5pt\">※ mg/mL と g/L は同じ大きさの単位（1 mg/mL ＝ 1 g/L）。</span></div>\n\n<h2>5. 自律神経系</h2>\n<p><b class=\"key\">自律神経系</b>は、意思と関係なく内臓などのはたらきを調節する神経で、中枢は<b>間脳の視床下部</b>です（第8回）。<b>交感神経</b>と<b>副交感神経</b>があり、1つの器官に両方が分布して、<span class=\"em\">反対の（拮抗的な）はたらき</span>をします。</p>\n<table class=\"t\">\n<tr><th style=\"width:24%\">はたらく器官</th><th class=\"c\">交感神経<br><span style=\"font-weight:normal;font-size:9pt\">（活動・緊張のとき）</span></th><th class=\"c\">副交感神経<br><span style=\"font-weight:normal;font-size:9pt\">（休息・リラックスのとき）</span></th></tr>\n<tr><td>心臓の拍動</td><td class=\"c\"><b>促進</b></td><td class=\"c\">抑制</td></tr>\n<tr><td>血圧</td><td class=\"c\"><b>上昇</b></td><td class=\"c\">低下</td></tr>\n<tr><td>瞳孔</td><td class=\"c\"><b>拡大</b></td><td class=\"c\">縮小</td></tr>\n<tr><td>気管支</td><td class=\"c\"><b>拡張</b></td><td class=\"c\">収縮</td></tr>\n<tr><td>胃・腸の運動（消化）</td><td class=\"c\"><b>抑制</b></td><td class=\"c\">促進</td></tr>\n<tr><td>排尿（ぼうこう）</td><td class=\"c\"><b>抑制</b></td><td class=\"c\">促進</td></tr>\n<tr><td>立毛筋・汗腺</td><td class=\"c\">立毛筋を収縮・発汗を促進</td><td class=\"c\">（分布していない）</td></tr>\n<tr><td>神経の出るところ</td><td class=\"c\">脊髄（胸髄・腰髄）</td><td class=\"c\">中脳・延髄・脊髄（仙髄）</td></tr>\n<tr><td>末端から出る伝達物質</td><td class=\"c\">ノルアドレナリン</td><td class=\"c\">アセチルコリン</td></tr>\n</table>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n交感神経は「<b>戦うか逃げるか</b>」のモード。猛獣に会ったら、心臓をドキドキさせ、瞳孔を開き、気管支を広げて酸素を多く取りこみ、消化はあとまわし。副交感神経はその逆の「<b>食べて休む</b>」モード、と覚えると表を丸暗記しなくてすみます。</div>\n\n<h2>6. ホルモンと内分泌系</h2>\n<p><b class=\"key\">ホルモン</b>は、<b>内分泌腺</b>から<b>血液中に</b>分泌され、全身に運ばれます。ホルモンは、そのホルモンの<b>受容体</b>をもつ細胞（<b>標的細胞</b>）にだけはたらきます。神経より効果があらわれるのは遅いですが、<b>少量で長く</b>効きます。なお、汗腺や消化腺のように排出管から体外（消化管）に出すものは<b>外分泌腺</b>といいます。</p>\n<table class=\"t\" style=\"font-size:9.6pt\">\n<tr><th style=\"width:21%\">内分泌腺</th><th style=\"width:23%\">ホルモン</th><th>主なはたらき</th></tr>\n<tr><td>視床下部</td><td>放出ホルモン・放出抑制ホルモン</td><td>脳下垂体前葉のホルモン分泌を調節する</td></tr>\n<tr><td rowspan=\"3\">脳下垂体<b>前葉</b></td><td>成長ホルモン</td><td>からだの成長を促進、血糖濃度を上げる</td></tr>\n<tr><td>甲状腺刺激ホルモン</td><td>甲状腺からのチロキシン分泌を促進</td></tr>\n<tr><td>副腎皮質刺激ホルモン</td><td>副腎皮質からの糖質コルチコイド分泌を促進</td></tr>\n<tr><td>脳下垂体<b>後葉</b></td><td><b>バソプレシン</b></td><td>集合管での<b>水の再吸収を促進</b>（尿を減らす）、血圧を上げる</td></tr>\n<tr><td>甲状腺</td><td><b>チロキシン</b></td><td>全身の<b>代謝（化学反応）を促進</b>、体温を上げる</td></tr>\n<tr><td>副甲状腺</td><td>パラトルモン</td><td>血液中のCa²⁺濃度を上げる</td></tr>\n<tr><td>副腎<b>髄質</b></td><td><b>アドレナリン</b></td><td>グリコーゲンを分解させ<b>血糖濃度を上げる</b>、心臓の拍動を促進</td></tr>\n<tr><td rowspan=\"2\">副腎<b>皮質</b></td><td><b>糖質コルチコイド</b></td><td>タンパク質から糖をつくらせ<b>血糖濃度を上げる</b></td></tr>\n<tr><td><b>鉱質コルチコイド</b></td><td>腎臓での<b>Na⁺の再吸収を促進</b></td></tr>\n<tr><td rowspan=\"2\">すい臓の<br>ランゲルハンス島</td><td><b>A細胞</b>：グルカゴン</td><td>グリコーゲンを分解させ<b>血糖濃度を上げる</b></td></tr>\n<tr><td><b>B細胞</b>：インスリン</td><td>細胞にグルコースを取りこませ、グリコーゲン合成を促進して<b>血糖濃度を下げる</b>（下げるのはインスリンだけ）</td></tr>\n</table>\n<p>間脳の視床下部には、ホルモンを分泌するニューロン（<b>神経分泌細胞</b>）があります。<b>バソプレシン</b>は視床下部の神経分泌細胞でつくられ、<b>脳下垂体後葉</b>から血液中に出されます。</p>\n<h3>フィードバック</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>チロキシンが増えすぎると、チロキシン自身が<b>視床下部と脳下垂体前葉</b>にはたらいて、放出ホルモンや甲状腺刺激ホルモンの分泌をおさえます。すると甲状腺からのチロキシンが減り、量が一定に保たれます。このように、結果が原因の側にもどってはたらくしくみを<b class=\"key\">フィードバック</b>といい、結果をおさえる方向にはたらくものを<b>負のフィードバック</b>といいます。</p>\n<p>逆に、チロキシンが少なすぎると抑制が弱まり、甲状腺刺激ホルモンが増えて、チロキシンの分泌が増えます。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 330 250\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><defs><marker id=\"f1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#2e7d4f\"/></marker></defs><defs><marker id=\"f2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#c62828\"/></marker></defs><rect x=\"20\" y=\"8\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"80\" y=\"30\" text-anchor=\"middle\" font-weight=\"bold\">視床下部</text><rect x=\"20\" y=\"92\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"80\" y=\"114\" text-anchor=\"middle\" font-weight=\"bold\">脳下垂体前葉</text><rect x=\"20\" y=\"176\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"80\" y=\"198\" text-anchor=\"middle\" font-weight=\"bold\">甲状腺</text><path d=\"M80 42 L80 90\" stroke=\"#2e7d4f\" stroke-width=\"2\" marker-end=\"url(#f1)\"/><text x=\"88\" y=\"64\" font-size=\"9.5\">放出ホルモン</text><path d=\"M80 126 L80 174\" stroke=\"#2e7d4f\" stroke-width=\"2\" marker-end=\"url(#f1)\"/><text x=\"88\" y=\"148\" font-size=\"9.5\">甲状腺刺激</text><text x=\"88\" y=\"160\" font-size=\"9.5\">ホルモン</text><path d=\"M140 193 L200 193\" stroke=\"#2e7d4f\" stroke-width=\"2\" marker-end=\"url(#f1)\"/><text x=\"204\" y=\"190\" font-weight=\"bold\">チロキシン</text><text x=\"204\" y=\"206\" font-size=\"9.5\">全身の代謝を促進</text><path d=\"M250 178 C 300 140, 300 40, 144 25\" stroke=\"#c62828\" stroke-width=\"1.8\" fill=\"none\" stroke-dasharray=\"5,3\" marker-end=\"url(#f2)\"/><path d=\"M262 178 C 270 140, 230 112, 144 109\" stroke=\"#c62828\" stroke-width=\"1.8\" fill=\"none\" stroke-dasharray=\"5,3\" marker-end=\"url(#f2)\"/><text x=\"226\" y=\"70\" font-size=\"10\" fill=\"#c62828\" font-weight=\"bold\">多すぎると</text><text x=\"226\" y=\"84\" font-size=\"10\" fill=\"#c62828\" font-weight=\"bold\">分泌を抑制</text></svg><div class=\"cap\">図3　チロキシンの負のフィードバック</div></div></div>\n\n<h2>7. 血糖・体温・水分の調節</h2>\n<h3>7-1　血糖濃度の調節</h3>\n<p>血液中のグルコース（血糖）の濃度は、健康な人で約<b>0.1%</b>（100mL中に約100mg）に保たれています。血糖濃度の変化は<b>視床下部</b>やすい臓で感じとられます。</p>\n<table class=\"t\">\n<tr><th style=\"width:18%\">状態</th><th>しくみ</th></tr>\n<tr><td><b>高血糖</b><br>（食後など）</td><td>視床下部 → <b>副交感神経</b> → すい臓の<b>B細胞</b>（B細胞は血糖濃度を直接も感じとる）→ <b class=\"key\">インスリン</b> → 細胞へのグルコースの取りこみ、肝臓や筋肉での<b>グリコーゲン合成</b>を促進 → <b>血糖濃度が下がる</b></td></tr>\n<tr><td><b>低血糖</b><br>（空腹・運動）</td><td>① 視床下部 → <b>交感神経</b> → <b>副腎髄質</b>から<b>アドレナリン</b>、すい臓の<b>A細胞</b>から<b>グルカゴン</b> → グリコーゲンを分解<br>② 視床下部 → 脳下垂体前葉（副腎皮質刺激ホルモン）→ <b>副腎皮質</b>から<b>糖質コルチコイド</b> → タンパク質から糖をつくる<br>→ <b>血糖濃度が上がる</b></td></tr>\n</table>\n<p>インスリンのはたらきが不十分で、血糖濃度が高い状態が続く病気を<b class=\"key\">糖尿病</b>といいます。原尿中のグルコースが多すぎて再吸収しきれず、尿にグルコースが出ることがあります。<b>Ⅰ型</b>は、免疫がまちがってB細胞を壊してしまい<b>インスリンがほとんど分泌されない</b>もの、<b>Ⅱ型</b>は、インスリンの分泌が減ったり、<b>標的細胞がインスリンに反応しにくくなったり</b>するもの（生活習慣がかかわる）です。</p>\n<div class=\"two\"><div><svg viewBox=\"0 0 290 200\" width=\"290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"160.0\" x2=\"220\" y2=\"160.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"164.0\" text-anchor=\"end\">0</text><line x1=\"46\" y1=\"110.7\" x2=\"220\" y2=\"110.7\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"114.7\" text-anchor=\"end\">100</text><line x1=\"46\" y1=\"61.3\" x2=\"220\" y2=\"61.3\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"65.3\" text-anchor=\"end\">200</text><line x1=\"46\" y1=\"12.0\" x2=\"220\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"16.0\" text-anchor=\"end\">300</text><text x=\"46.0\" y=\"175\" text-anchor=\"middle\">0</text><text x=\"104.0\" y=\"175\" text-anchor=\"middle\">60</text><text x=\"162.0\" y=\"175\" text-anchor=\"middle\">120</text><text x=\"220.0\" y=\"175\" text-anchor=\"middle\">180</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"160\" x2=\"220\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"133.0\" y=\"194\" text-anchor=\"middle\">食事後の時間（分）</text><text transform=\"translate(12,86.0) rotate(-90)\" text-anchor=\"middle\">血糖濃度（mg/100mL）</text><polyline points=\"46.0,109.5 50.8,107.5 55.7,105.0 60.5,102.4 65.3,99.6 70.2,96.9 75.0,94.5 79.8,92.6 84.7,91.4 89.5,90.9 94.3,91.4 99.2,92.6 104.0,94.5 108.8,96.9 113.7,99.6 118.5,102.4 123.3,105.0 128.2,107.5 133.0,109.5 137.8,111.2 142.7,112.6 147.5,113.6 152.3,114.3 157.2,114.8 162.0,115.1 166.8,115.3 171.7,115.4 176.5,115.5 181.3,115.6 186.2,115.6 191.0,115.6 195.8,115.6 200.7,115.6 205.5,115.6 210.3,115.6 215.2,115.6 220.0,115.6\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"225.0\" y=\"119.6\" font-weight=\"bold\" fill=\"#2e7d4f\">健康</text><polyline points=\"46.0,95.9 50.8,89.1 55.7,83.1 60.5,77.7 65.3,72.9 70.2,68.5 75.0,64.7 79.8,61.2 84.7,58.1 89.5,55.3 94.3,52.8 99.2,50.6 104.0,48.6 108.8,46.9 113.7,45.3 118.5,43.8 123.3,42.6 128.2,41.4 133.0,40.4 137.8,40.1 142.7,39.9 147.5,39.8 152.3,39.8 157.2,39.8 162.0,39.9 166.8,40.0 171.7,40.2 176.5,40.5 181.3,40.8 186.2,41.1 191.0,41.4 195.8,41.8 200.7,42.2 205.5,42.6 210.3,43.1 215.2,43.5 220.0,44.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"225.0\" y=\"48.0\" font-weight=\"bold\" fill=\"#c62828\">A</text><polyline points=\"46.0,100.8 50.8,95.0 55.7,89.9 60.5,85.4 65.3,81.4 70.2,77.9 75.0,74.8 79.8,72.0 84.7,69.6 89.5,67.5 94.3,65.6 99.2,63.9 104.0,62.5 108.8,61.2 113.7,60.0 118.5,59.0 123.3,58.1 128.2,58.2 133.0,58.4 137.8,58.6 142.7,59.0 147.5,59.4 152.3,59.8 157.2,60.3 162.0,60.8 166.8,61.4 171.7,62.0 176.5,62.7 181.3,63.3 186.2,64.0 191.0,64.7 195.8,65.4 200.7,66.2 205.5,66.9 210.3,67.7 215.2,68.5 220.0,69.3\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"2,2\" stroke-linejoin=\"round\"/><text x=\"225.0\" y=\"73.3\" font-weight=\"bold\" fill=\"#1565c0\">B</text></svg></div><div><svg viewBox=\"0 0 290 200\" width=\"290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"160.0\" x2=\"220\" y2=\"160.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"164.0\" text-anchor=\"end\">0</text><line x1=\"46\" y1=\"123.0\" x2=\"220\" y2=\"123.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"127.0\" text-anchor=\"end\">20</text><line x1=\"46\" y1=\"86.0\" x2=\"220\" y2=\"86.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"90.0\" text-anchor=\"end\">40</text><line x1=\"46\" y1=\"49.0\" x2=\"220\" y2=\"49.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"53.0\" text-anchor=\"end\">60</text><line x1=\"46\" y1=\"12.0\" x2=\"220\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"16.0\" text-anchor=\"end\">80</text><text x=\"46.0\" y=\"175\" text-anchor=\"middle\">0</text><text x=\"104.0\" y=\"175\" text-anchor=\"middle\">60</text><text x=\"162.0\" y=\"175\" text-anchor=\"middle\">120</text><text x=\"220.0\" y=\"175\" text-anchor=\"middle\">180</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"160\" x2=\"220\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"133.0\" y=\"194\" text-anchor=\"middle\">食事後の時間（分）</text><text transform=\"translate(12,86.0) rotate(-90)\" text-anchor=\"middle\">インスリン濃度（相対値）</text><polyline points=\"46.0,132.4 50.8,125.8 55.7,117.2 60.5,106.8 65.3,95.0 70.2,82.6 75.0,70.9 79.8,61.3 84.7,54.9 89.5,52.7 94.3,54.9 99.2,61.3 104.0,70.9 108.8,82.6 113.7,95.0 118.5,106.8 123.3,117.2 128.2,125.8 133.0,132.4 137.8,137.1 142.7,140.4 147.5,142.5 152.3,143.7 157.2,144.4 162.0,144.8 166.8,145.0 171.7,145.1 176.5,145.2 181.3,145.2 186.2,145.2 191.0,145.2 195.8,145.2 200.7,145.2 205.5,145.2 210.3,145.2 215.2,145.2 220.0,145.2\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"67.3\" y=\"45.3\" font-weight=\"bold\" fill=\"#2e7d4f\">健康</text><polyline points=\"46.0,151.8 50.8,151.6 55.7,151.2 60.5,150.9 65.3,150.5 70.2,150.1 75.0,149.7 79.8,149.4 84.7,149.1 89.5,149.0 94.3,148.9 99.2,149.0 104.0,149.1 108.8,149.4 113.7,149.7 118.5,150.1 123.3,150.5 128.2,150.9 133.0,151.2 137.8,151.6 142.7,151.8 147.5,152.0 152.3,152.2 157.2,152.3 162.0,152.4 166.8,152.5 171.7,152.5 176.5,152.6 181.3,152.6 186.2,152.6 191.0,152.6 195.8,152.6 200.7,152.6 205.5,152.6 210.3,152.6 215.2,152.6 220.0,152.6\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"181.3\" y=\"137.8\" font-weight=\"bold\" fill=\"#c62828\">A</text><polyline points=\"46.0,129.8 50.8,127.9 55.7,125.5 60.5,122.4 65.3,118.5 70.2,113.6 75.0,107.8 79.8,101.0 84.7,93.3 89.5,84.7 94.3,75.6 99.2,66.1 104.0,56.7 108.8,47.7 113.7,39.5 118.5,32.7 123.3,27.5 128.2,24.2 133.0,23.1 137.8,24.2 142.7,27.5 147.5,32.7 152.3,39.5 157.2,47.7 162.0,56.7 166.8,66.1 171.7,75.6 176.5,84.7 181.3,93.3 186.2,101.0 191.0,107.8 195.8,113.6 200.7,118.5 205.5,122.4 210.3,125.5 215.2,127.9 220.0,129.8\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"2,2\" stroke-linejoin=\"round\"/><text x=\"142.7\" y=\"17.6\" font-weight=\"bold\" fill=\"#1565c0\">B</text></svg></div></div>\n<div class=\"cap\">図4　食事後の血糖濃度とインスリン濃度（健康な人と、糖尿病の患者A・B）</div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：グラフから糖尿病のタイプを考える</div>\nAは<b>インスリンがほとんど分泌されていない</b> → B細胞が壊れている（Ⅰ型の特徴）。Bは<b>インスリンは健康な人より多く出ているのに血糖濃度が下がらない</b> → 標的細胞がインスリンに反応しにくい（Ⅱ型の特徴）。2つのグラフを<b>同時に</b>見るのがコツです。</div>\n\n<h3>7-2　体温の調節</h3>\n<p>体温の調節の中枢も<b>視床下部</b>です。<b>寒いとき</b>は、<b>熱の放散を減らし</b>、<b>熱の発生を増やし</b>ます。</p>\n<ul>\n<li>熱の放散を減らす：<b>交感神経</b>によって<b>皮膚の血管が収縮</b>し、<b>立毛筋が収縮</b>する（鳥肌）。</li>\n<li>熱の発生を増やす：<b>アドレナリン・チロキシン・糖質コルチコイド</b>で肝臓や筋肉の代謝が促進される。骨格筋がふるえて熱を出す。</li>\n<li><b>暑いとき</b>は、皮膚の血管が拡張して熱を逃がし、<b>発汗</b>がさかんになる（汗が蒸発するときに熱をうばう）。</li>\n</ul>\n<h3>7-3　体液の濃度（水分）の調節</h3>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">汗をかく・塩分をとる</div><div class=\"fbs\">体液が濃くなる</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">視床下部</div><div class=\"fbs\">濃さを感じとる</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">脳下垂体後葉</div><div class=\"fbs\">バソプレシン</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">集合管</div><div class=\"fbs\">水の再吸収↑</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">尿が少なく濃い</div><div class=\"fbs\">体液がうすまる</div></div></div>\n<p>水を多く飲んで体液がうすくなると、バソプレシンの分泌が減り、うすい尿がたくさん出ます。また、副腎皮質の<b>鉱質コルチコイド</b>は腎臓でのNa⁺の再吸収を促進します。</p>\n\n<h2>8. 免疫</h2>\n<h3>8-1　からだを守る3つのしくみ</h3>\n<table class=\"t\">\n<tr><th style=\"width:22%\">しくみ</th><th>内容</th></tr>\n<tr><td><b>物理的・化学的防御</b></td><td>皮膚の<b>角質層</b>や、気管の粘液・繊毛が異物の侵入を防ぐ。涙やだ液の<b>リゾチーム</b>（細菌の細胞壁を分解する酵素）、皮膚の<b>ディフェンシン</b>などの物質が細菌を殺す。胃酸も細菌を殺す</td></tr>\n<tr><td><b class=\"key\">自然免疫</b>（生まれつき）</td><td>侵入した異物を、<b>好中球・マクロファージ・樹状細胞</b>が取りこんで分解する（<b class=\"key\">食作用</b>）。<b>NK細胞</b>（ナチュラルキラー細胞）は、感染した細胞やがん細胞を見つけて破壊する。感染部位が赤くはれて熱をもつ<b>炎症</b>は、食細胞を集めるはたらき</td></tr>\n<tr><td><b class=\"key\">獲得免疫</b>（適応免疫）</td><td>リンパ球（<b>T細胞・B細胞</b>）が、<b>特定の抗原だけ</b>を認識して攻撃する。はたらき始めるまで時間がかかるが、強力で、<b>記憶</b>が残る</td></tr>\n</table>\n<p>免疫で異物として認識される物質を<b class=\"key\">抗原</b>といいます。T細胞は<b>胸腺</b>で、B細胞は<b>骨髄</b>で成熟します。成熟する途中で、<span class=\"em\">自分のからだの成分に反応するリンパ球は取り除かれる</span>ので、ふつう自分自身は攻撃されません（<b class=\"key\">免疫寛容</b>）。</p>\n\n<h3>8-2　獲得免疫のしくみ</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 240\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><defs><marker id=\"i1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><defs><marker id=\"i2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#6a1b9a\"/></marker></defs><rect x=\"8\" y=\"30\" width=\"112\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"64.0\" y=\"49\" text-anchor=\"middle\" font-weight=\"bold\">病原体（抗原）</text><text x=\"64.0\" y=\"66\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">体内に侵入</text><rect x=\"150\" y=\"30\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"213.0\" y=\"49\" text-anchor=\"middle\" font-weight=\"bold\">樹状細胞</text><text x=\"213.0\" y=\"66\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">取りこんで抗原提示</text><rect x=\"306\" y=\"30\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d4f\" stroke-width=\"2\"/><text x=\"369.0\" y=\"49\" text-anchor=\"middle\" font-weight=\"bold\">ヘルパーT細胞</text><text x=\"369.0\" y=\"66\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">活性化・増殖</text><rect x=\"466\" y=\"30\" width=\"166\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#6a1b9a\" stroke-width=\"2\"/><text x=\"549.0\" y=\"49\" text-anchor=\"middle\" font-weight=\"bold\">キラーT細胞</text><text x=\"549.0\" y=\"66\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">感染細胞を直接破壊</text><rect x=\"150\" y=\"128\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#1565c0\" stroke-width=\"2\"/><text x=\"213.0\" y=\"147\" text-anchor=\"middle\" font-weight=\"bold\">B細胞</text><text x=\"213.0\" y=\"164\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">同じ抗原を認識</text><rect x=\"306\" y=\"128\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#1565c0\" stroke-width=\"2\"/><text x=\"369.0\" y=\"147\" text-anchor=\"middle\" font-weight=\"bold\">形質細胞</text><text x=\"369.0\" y=\"164\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">抗体をつくる</text><rect x=\"466\" y=\"128\" width=\"166\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#1565c0\" stroke-width=\"2\"/><text x=\"549.0\" y=\"147\" text-anchor=\"middle\" font-weight=\"bold\">抗体</text><text x=\"549.0\" y=\"164\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">抗原と結合 → 食作用で除去</text><path d=\"M120 53 L148 53\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#i1)\"/><path d=\"M276 53 L304 53\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#i1)\"/><path d=\"M432 53 L464 53\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#i1)\"/><path d=\"M276 151 L304 151\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#i1)\"/><path d=\"M432 151 L464 151\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#i1)\"/><path d=\"M350 76 L240 126\" stroke=\"#333\" stroke-width=\"1.8\" marker-end=\"url(#i1)\"/><text x=\"306\" y=\"108\" font-size=\"9.5\">活性化</text><path d=\"M64 76 L148 140\" stroke=\"#333\" stroke-width=\"1.4\" stroke-dasharray=\"4,3\" marker-end=\"url(#i1)\"/><text x=\"466\" y=\"22\" font-size=\"11\" font-weight=\"bold\" fill=\"#6a1b9a\">細胞性免疫</text><text x=\"466\" y=\"192\" font-size=\"11\" font-weight=\"bold\" fill=\"#1565c0\">体液性免疫</text><text x=\"150\" y=\"212\" font-size=\"10.5\" fill=\"#333\">増えたT細胞・B細胞の一部は<tspan font-weight=\"bold\">記憶細胞</tspan>として残る</text><text x=\"150\" y=\"228\" font-size=\"10.5\" fill=\"#333\">→ 同じ抗原が再び入ると、すばやく強く反応（二次応答）</text></svg></div>\n<div class=\"cap\">図5　獲得免疫のしくみ</div>\n<ol>\n<li><b>樹状細胞</b>が抗原を食作用で取りこみ、<b>リンパ節</b>へ移動して、抗原の断片を細胞の表面に示す（<b class=\"key\">抗原提示</b>）。</li>\n<li>その抗原に合う<b>ヘルパーT細胞</b>が活性化して増殖する。</li>\n<li><b class=\"key\">体液性免疫</b>：同じ抗原を認識した<b>B細胞</b>が、ヘルパーT細胞に活性化されて増殖し、<b>形質細胞</b>（抗体産生細胞）になって<b class=\"key\">抗体</b>をつくる。抗体は<b>免疫グロブリン</b>というタンパク質で、抗原と特異的に結合する（<b>抗原抗体反応</b>）。結合した抗原は無毒化され、マクロファージの食作用で除去される。</li>\n<li><b class=\"key\">細胞性免疫</b>：活性化した<b>キラーT細胞</b>が、ウイルスなどに感染した細胞を<b>直接攻撃して破壊</b>する。ヘルパーT細胞はマクロファージの食作用も活性化する。</li>\n</ol>\n\n<h3>8-3　免疫記憶と二次応答</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>獲得免疫ではたらいたT細胞やB細胞の一部は、<b class=\"key\">記憶細胞</b>として長く残ります。同じ抗原が2回目に入ると、記憶細胞がすぐに増えて、<span class=\"em\">1回目よりすばやく、大量の抗体がつくられます</span>。これを<b class=\"key\">二次応答</b>といいます（1回目は一次応答）。</p>\n<p>図6で、30日目に抗原Aと抗原Bを同時に注射すると、<b>抗原Aには二次応答</b>（すばやく大量）、<b>初めての抗原Bには一次応答</b>（遅く少量）が起こります。記憶は抗原ごとに別々です。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 340 220\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"180.0\" x2=\"270\" y2=\"180.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"184.0\" text-anchor=\"end\">0</text><line x1=\"46\" y1=\"152.0\" x2=\"270\" y2=\"152.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"156.0\" text-anchor=\"end\">20</text><line x1=\"46\" y1=\"124.0\" x2=\"270\" y2=\"124.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"128.0\" text-anchor=\"end\">40</text><line x1=\"46\" y1=\"96.0\" x2=\"270\" y2=\"96.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"100.0\" text-anchor=\"end\">60</text><line x1=\"46\" y1=\"68.0\" x2=\"270\" y2=\"68.0\" stroke=\"#e3e3e3\"/><text x=\"41\" y=\"72.0\" text-anchor=\"end\">80</text><line x1=\"46\" y1=\"40.0\" x2=\"270\" y2=\"40.0\"
