function judge(v) {
  const F = state.fill, L = DATA[store.lesson];
  const idx = F.queue[0], item = L.fill[idx];
  const ok = v !== null && normAns(v) !== "" && item.a.some(a => normAns(a) === normAns(v));
  if (ok) {
    if (!F.tried.has(idx) && !F.hint) F.firstOK.add(idx); else F.missed.add(idx);
    F.fb = `<div class="fb ok"><b>正解</b>　${esc(item.a[0])}${item.a.length > 1 ? `<span class="count">（${esc(item.a.slice(1).join("・"))} も正解）</span>` : ""}</div>`;
  } else {
    F.missed.add(idx); F.tried.add(idx);
    F.fb = `<div class="fb ng"><b>答え：${esc(item.a[0])}</b>　${v ? `あなたの答え「${esc(v)}」` : ""}<br><span class="count">この問題は最後にもう一度出ます。</span></div>`;
  }
  F.lastOK = ok; F.phase = "show"; renderFill();
}
function nextFill() {
  const F = state.fill;
  const idx = F.queue.shift();
  if (!F.lastOK) F.queue.push(idx);
  F.phase = F.queue.length ? "ask" : "end"; F.fb = ""; F.hint = 0;
  if (F.phase === "end") {
    (store.fill[store.lesson] = store.fill[store.lesson] || []).push({ d: today(), first: F.firstOK.size, total: F.order.length });
    save();
  }
  renderFill();
}

// ---------- 3. 説明を打つ ----------
function renderExplain() {
  const L = DATA[store.lesson];
  const P = L.explain[state.prompt];
  const ekey = `${store.lesson}-${state.prompt}`;
  const rateLabel = { 2: "説明できた", 1: "だいたい", 0: "まだ" };
  const list = L.explain.map((p, i) => {
    const r = (store.explain[`${store.lesson}-${i}`] || []).slice(-1)[0];
    const chip = r ? `<span class="chip-score ${["low", "mid", "good"][r.rate]}">${rateLabel[r.rate]}</span>` : `<span class="chip-score">未</span>`;
    return `<button type="button" data-p="${i}" aria-pressed="${i === state.prompt}"><span>${esc(p.q)}</span>${chip}</button>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="plist" role="group" aria-label="お題">${list}</div>
    <h2 class="ttl">${esc(P.q)}</h2>
    <p class="lead">生徒に話しかけるつもりで、2〜3文で打ちます。書き終えてから解答例を見ましょう。</p>
    <label for="explain-text" class="sub-h">説明</label>
    <textarea id="explain-text" style="min-height:150px">${esc(store.drafts["e" + ekey] || "")}</textarea>
    <div class="row" style="justify-content:flex-end; margin-top:10px"><button type="button" class="btn primary" id="explain-check">解答例と比べる</button></div>
    <div id="explain-result"></div>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { state.prompt = +b.dataset.p; renderExplain(); });
  const ta = $("#explain-text");
  ta.oninput = () => { store.drafts["e" + ekey] = ta.value; save(); };
  $("#explain-check").onclick = () => {
    const { found, missing } = checkKeys(ta.value, P.keys);
    $("#explain-result").innerHTML = `
      <div class="result">
        <div class="meter"><div class="big">${found.length}<small> / ${P.keys.length}</small></div><span class="count">入れたいポイント</span></div>
        <div class="chips">${found.map(f => `<span>${esc(f.k)}</span>`).join("")}${missing.map(m => `<span style="background:var(--miss-soft);color:var(--miss)">${esc(m.k)}</span>`).join("")}</div>
        <div><div class="sub-h">解答例</div><div class="model">${esc(P.model)}</div></div>
        <div><div class="sub-h">自分の説明はどうでしたか</div>
          <div class="rate">${[2, 1, 0].map(r => `<button type="button" class="btn" data-rate="${r}">${rateLabel[r]}</button>`).join("")}</div></div>
      </div>`;
    document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
      (store.explain[ekey] = store.explain[ekey] || []).push({ d: today(), rate: +b.dataset.rate }); save();
      const nxt = L.explain.findIndex((_, i) => i > state.prompt && !(store.explain[`${store.lesson}-${i}`] || []).length);
      state.prompt = nxt >= 0 ? nxt : state.prompt; renderExplain();
    });
  };
}

function renderHowto() {
  const t = {
    note: "<b>使い方</b>　上の目次を押すと、その章に飛びます。確認問題の解答は、いちばん下の「確認問題の解答と解説を表示する」を押すと開きます。印刷するときは、別にお渡ししているPDF（とじ側の余白つき）を使ってください。",
    quiz: "<b>使い方</b>　「数字が毎回変わる」がついた計算問題は、出るたびに数字や塩基配列が変わります。選択肢をクリック（数字キー <kbd>1</kbd>〜<kbd>5</kbd> でも選べます）。スマホでは「答え方」を「タップで答える」にすると、入力・穴埋めの問題も4択になり、タップだけで解けます（正解の記録は打って答えるときと共通）。○×は <kbd>1</kbd>＝○、<kbd>2</kbd>＝×。入力・穴埋めの問題は打って <kbd>Enter</kbd>（カタカナはひらがなで打っても正解。「ヒント」で最初の文字が出ますが、その問題は「正解ずみ」に数えません）。答えたら <kbd>Enter</kbd> で次へ。まちがえた問題は最後にもう一度出ます。「出題」で「まだ正解していない問題」を選ぶと、覚えていない問題だけを集中して解けます。",
    recall: "<b>使い方</b>　1つの章を読む → ノートを閉じる → 覚えていることを全部打つ → 答え合わせ。抜けた語句をノートで確かめてから、日を変えて同じ章をもう一度。章の横の数字は前回の結果です。",
    explain: "<b>使い方</b>　お題を選んで説明を打ち、解答例と比べて「説明できた・だいたい・まだ」を記録します。「まだ」のお題は、講義ノートの「生徒に説明するときは」を読み直してから再挑戦しましょう。",
  }[store.mode];
  $("#howto").innerHTML = t + "<br><span style='font-size:12px'>記録と書きかけの文章は、この端末のブラウザにだけ保存されます。</span>";
}

$("#lessons").innerHTML = Object.keys(DATA).map(n => `<button type="button" id="lesson-${n}" data-lesson="${n}" title="${esc(DATA[n].title)}"><span class="no">第${n}回</span>${esc(DATA[n].short)}</button>`).join("");
document.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => setLesson(+b.dataset.lesson));
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
if (!DATA[store.lesson]) store.lesson = 1;
if (!["note", "quiz", "recall", "explain"].includes(store.mode)) store.mode = "quiz";
mergeFillIntoQuiz();
for (const n of Object.keys(EXTRA)) { QUIZ[n] = QUIZ[n] || []; QUIZ[n].push(...EXTRA[n]); }
render();
</script>
