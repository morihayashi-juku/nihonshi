e x1=\"199\" y1=\"61\" x2=\"199\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"233\" y1=\"61\" x2=\"233\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"275\" y1=\"61\" x2=\"275\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"309\" y1=\"61\" x2=\"309\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"343\" y1=\"61\" x2=\"343\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"385\" y1=\"61\" x2=\"385\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"419\" y1=\"61\" x2=\"419\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><line x1=\"453\" y1=\"61\" x2=\"453\" y2=\"79\" stroke=\"#333\" stroke-width=\"1.3\" stroke-dasharray=\"2,1.5\"/><text x=\"140\" y=\"94\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#1b5e37\">DNA</text><text x=\"140\" y=\"110\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#1b5e37\">（鋳型鎖）</text><rect x=\"150\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#90caf9\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">T</text><rect x=\"184\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"199.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"218\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ffcc80\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"233.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">C</text><rect x=\"260\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ffcc80\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"275.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">C</text><rect x=\"294\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"309.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><rect x=\"328\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"343.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"370\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#90caf9\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"385.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">T</text><rect x=\"404\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#90caf9\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"419.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">T</text><rect x=\"438\" y=\"80\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#90caf9\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"453.0\" y=\"101.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">T</text><rect x=\"146\" y=\"76\" width=\"326\" height=\"38\" rx=\"5\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\"/><line x1=\"165\" y1=\"111\" x2=\"165\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"199\" y1=\"111\" x2=\"199\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"233\" y1=\"111\" x2=\"233\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"275\" y1=\"111\" x2=\"275\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"309\" y1=\"111\" x2=\"309\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"343\" y1=\"111\" x2=\"343\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"385\" y1=\"111\" x2=\"385\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"419\" y1=\"111\" x2=\"419\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><line x1=\"453\" y1=\"111\" x2=\"453\" y2=\"149\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><text x=\"140\" y=\"165\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#7b1fa2\">mRNA</text><text x=\"140\" y=\"181\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7b1fa2\">（できる鎖）</text><rect x=\"150\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"184\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ce93d8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"199.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">U</text><rect x=\"218\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"233.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><rect x=\"260\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"275.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><rect x=\"294\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ffcc80\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"309.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">C</text><rect x=\"328\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ce93d8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"343.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">U</text><rect x=\"370\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"385.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"404\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"419.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"438\" y=\"150\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"453.0\" y=\"171.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><ellipse cx=\"532\" cy=\"128\" rx=\"52\" ry=\"34\" fill=\"#fff3cd\" stroke=\"#b08900\" stroke-width=\"2\"/><text x=\"532\" y=\"124\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">RNA</text><text x=\"532\" y=\"140\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11.5\">ポリメラーゼ</text><path d=\"M482 205 L542 205\" stroke=\"#b08900\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><text x=\"512\" y=\"224\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a6d00\">進む向き</text><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#b08900\"/></marker></defs><text x=\"150\" y=\"218\" font-size=\"11\">鋳型鎖の塩基 → mRNAの塩基：　A→U　T→A　G→C　C→G</text></svg></div>\n<div class=\"cap\">図1　転写のしくみ（鋳型鎖を型にしてmRNAがつくられる）</div>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：mRNAの配列を求める</div>\n図1を見ると、できたmRNA（AUG GCU AAA）は、<b>鋳型鎖でない方のDNAの鎖（ATG GCT AAA）のTをUに変えたもの</b>と同じになっています。問題で「鋳型鎖でない方」の配列が示されたときは、相補の変換をせずに、<b>TをUに書きかえるだけ</b>でmRNAの配列がわかります。どちらの鎖が示されているかを最初に必ず確認しましょう。</div>\n\n<h2>3. スプライシング：いらない部分を切り取る</h2>\n<p>真核生物の遺伝子には、タンパク質の情報として使われる部分（<b class=\"key\">エキソン</b>）と、使われない部分（<b class=\"key\">イントロン</b>）が交互に並んでいます。転写されたばかりのRNA（<b>mRNA前駆体</b>）にはイントロンも含まれているので、核の中でイントロンが取り除かれ、エキソンだけがつなぎ合わされます。これを<b class=\"key\">スプライシング</b>といいます。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 245\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"ah2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><text x=\"140\" y=\"31\" text-anchor=\"end\" font-weight=\"bold\">mRNA前駆体</text><rect x=\"150\" y=\"10\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"195.0\" y=\"31\" text-anchor=\"middle\" font-size=\"11\">エキソン1</text><rect x=\"240\" y=\"10\" width=\"80\" height=\"32\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"280.0\" y=\"31\" text-anchor=\"middle\" font-size=\"11\">イントロン</text><rect x=\"320\" y=\"10\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"365.0\" y=\"31\" text-anchor=\"middle\" font-size=\"11\">エキソン2</text><rect x=\"410\" y=\"10\" width=\"80\" height=\"32\" fill=\"#e0e0e0\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"31\" text-anchor=\"middle\" font-size=\"11\">イントロン</text><rect x=\"490\" y=\"10\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"535.0\" y=\"31\" text-anchor=\"middle\" font-size=\"11\">エキソン3</text><path d=\"M330 50 L330 88\" stroke=\"#333\" stroke-width=\"1.6\" marker-end=\"url(#ah2)\"/><text x=\"342\" y=\"74\" font-size=\"11\">スプライシング（核の中）：イントロンを取り除く</text><text x=\"140\" y=\"117\" text-anchor=\"end\" font-weight=\"bold\">mRNA</text><rect x=\"150\" y=\"96\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"195.0\" y=\"117\" text-anchor=\"middle\" font-size=\"11\">エキソン1</text><rect x=\"240\" y=\"96\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"285.0\" y=\"117\" text-anchor=\"middle\" font-size=\"11\">エキソン2</text><rect x=\"330\" y=\"96\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"375.0\" y=\"117\" text-anchor=\"middle\" font-size=\"11\">エキソン3</text><text x=\"150\" y=\"160\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#1b5e37\">選択的スプライシング</text><text x=\"150\" y=\"177\" font-size=\"10.8\">どのエキソンを残すかを変えると、1つの遺伝子から別のmRNAができる</text><text x=\"140\" y=\"211\" text-anchor=\"end\" font-weight=\"bold\">別のmRNA</text><rect x=\"150\" y=\"190\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"195.0\" y=\"211\" text-anchor=\"middle\" font-size=\"11\">エキソン1</text><rect x=\"240\" y=\"190\" width=\"90\" height=\"32\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"285.0\" y=\"211\" text-anchor=\"middle\" font-size=\"11\">エキソン3</text></svg></div>\n<div class=\"cap\">図2　スプライシングと選択的スプライシング</div>\n<p>どのエキソンを残すかは、細胞によって変わることがあります。これを<b class=\"key\">選択的スプライシング</b>といい、<span class=\"em\">1つの遺伝子から何種類ものタンパク質</span>をつくることができます。ヒトの遺伝子は約2万個しかありませんが、それよりはるかに多い種類のタンパク質がつくられているのは、このしくみのおかげです。</p>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n映画の撮影フィルムにたとえると伝わりやすいです。撮ったフィルム（mRNA前駆体）から、いらないシーン（イントロン）をカットして、使うシーン（エキソン）だけをつなぐのがスプライシングです。どのシーンを使うかを変えれば、同じフィルムから別の編集版（別のタンパク質）が作れる、これが選択的スプライシングです。</div>\n\n<h2>4. 翻訳：mRNAの暗号をアミノ酸に置きかえる</h2>\n<h3>4-1　3つの塩基で1つのアミノ酸</h3>\n<p>mRNAの塩基配列は、<span class=\"em\">3つずつ区切って読まれ、3つの塩基の並び1組が1つのアミノ酸を指定</span>します。この3つの塩基の並びを<b class=\"key\">コドン</b>といいます。</p>\n<div class=\"box column\"><div class=\"bt\">なぜ「3つ」なのか</div>\nアミノ酸は20種類あります。塩基は4種類なので、2つずつだと組み合わせは 4×4＝16通りで、20種類を表すには足りません。3つずつなら 4×4×4＝<b>64通り</b>になり、20種類を表せます。64通りのうち3つは「ここで終わり」を表す<b>終止コドン</b>なので、残りの61通りで20種類のアミノ酸を指定しています。そのため、1つのアミノ酸に複数のコドンが対応していることが多くあります。</div>\n\n<h3>4-2　翻訳のしくみ</h3>\n<p>核から出たmRNAに<b class=\"key\">リボソーム</b>が結合し、端からコドンを読んでいきます。それぞれのコドンには、決まったアミノ酸を運んでくる<b class=\"key\">tRNA</b>が結合します。tRNAには、コドンと相補的な3つの塩基（<b class=\"key\">アンチコドン</b>）があり、これでコドンとぴったり合うtRNAだけが結合できるようになっています。運ばれてきたアミノ酸は順番につながっていき、タンパク質ができあがります。</p>\n<div class=\"fig\"><svg viewBox=\"0 60 640 240\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><rect x=\"200\" y=\"150\" width=\"230\" height=\"125\" rx=\"55\" fill=\"#fff3cd\" stroke=\"#b08900\" stroke-width=\"2\" opacity=\"0.9\"/><text x=\"415\" y=\"292\" text-anchor=\"end\" font-size=\"11\" fill=\"#8a6d00\" font-weight=\"bold\">リボソーム</text><rect x=\"90\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"103.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"119\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ce93d8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"132.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">U</text><rect x=\"148\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"161.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><rect x=\"185\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"198.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><rect x=\"214\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ffcc80\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"227.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">C</text><rect x=\"243\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ce93d8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"256.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">U</text><rect x=\"280\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"293.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"309\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"322.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"338\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"351.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">A</text><rect x=\"375\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#ce93d8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"388.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">U</text><rect x=\"404\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"417.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><rect x=\"433\" y=\"235\" width=\"26\" height=\"26\" rx=\"3\" fill=\"#a5d6a7\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"446.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">G</text><text x=\"82\" y=\"253\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#7b1fa2\">mRNA</text><line x1=\"90\" y1=\"267\" x2=\"174\" y2=\"267\" stroke=\"#7b1fa2\" stroke-width=\"2\"/><line x1=\"185\" y1=\"267\" x2=\"269\" y2=\"267\" stroke=\"#7b1fa2\" stroke-width=\"2\"/><line x1=\"280\" y1=\"267\" x2=\"364\" y2=\"267\" stroke=\"#7b1fa2\" stroke-width=\"2\"/><line x1=\"375\" y1=\"267\" x2=\"459\" y2=\"267\" stroke=\"#7b1fa2\" stroke-width=\"2\"/><text x=\"132.0\" y=\"283\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7b1fa2\">コドン</text><rect x=\"185\" y=\"203\" width=\"84\" height=\"26\" rx=\"3\" fill=\"#fff\" stroke=\"#3a6ea5\" stroke-width=\"1.6\"/><text x=\"198\" y=\"221\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#3a6ea5\">C</text><text x=\"227\" y=\"221\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#3a6ea5\">G</text><text x=\"256\" y=\"221\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#3a6ea5\">A</text><path d=\"M193 203 L193 160 Q227.0 135 261 160 L261 203\" fill=\"#e3f0fb\" stroke=\"#3a6ea5\" stroke-width=\"1.6\"/><text x=\"227.0\" y=\"185\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#2c5885\">tRNA</text><line x1=\"227.0\" y1=\"142\" x2=\"227.0\" y2=\"127\" stroke=\"#555\" stroke-width=\"1.5\"/><circle cx=\"227.0\" cy=\"113\" r=\"15\" fill=\"#ffccbc\" stroke=\"#d84315\" stroke-width=\"1.6\"/><text x=\"227.0\" y=\"117\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">Ala</text><rect x=\"280\" y=\"203\" width=\"84\" height=\"26\" rx=\"3\" fill=\"#fff\" stroke=\"#3a6ea5\" stroke-width=\"1.6\"/><text x=\"293\" y=\"221\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#3a6ea5\">U</text><text x=\"322\" y=\"221\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#3a6ea5\">U</text><text x=\"351\" y=\"221\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#3a6ea5\">U</text><path d=\"M288 203 L288 160 Q322.0 135 356 160 L356 203\" fill=\"#e3f0fb\" stroke=\"#3a6ea5\" stroke-width=\"1.6\"/><text x=\"322.0\" y=\"185\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#2c5885\">tRNA</text><line x1=\"322.0\" y1=\"142\" x2=\"322.0\" y2=\"127\" stroke=\"#555\" stroke-width=\"1.5\"/><circle cx=\"322.0\" cy=\"113\" r=\"15\" fill=\"#ffccbc\" stroke=\"#d84315\" stroke-width=\"1.6\"/><text x=\"322.0\" y=\"117\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">Lys</text><circle cx=\"187.0\" cy=\"85\" r=\"15\" fill=\"#ffccbc\" stroke=\"#d84315\" stroke-width=\"1.6\"/><text x=\"187.0\" y=\"89\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">Met</text><line x1=\"199.0\" y1=\"93\" x2=\"215.0\" y2=\"104\" stroke=\"#d84315\" stroke-width=\"2.2\"/><line x1=\"242.0\" y1=\"113\" x2=\"307.0\" y2=\"113\" stroke=\"#d84315\" stroke-width=\"2.2\" stroke-dasharray=\"4,3\"/><text x=\"274.5\" y=\"107\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#d84315\">つなぐ</text><text x=\"470\" y=\"117\" font-size=\"11\"><tspan font-weight=\"bold\" fill=\"#d84315\">アミノ酸</tspan></text><text x=\"470\" y=\"133\" font-size=\"10.5\">tRNAが運んでくる</text><text x=\"470\" y=\"185\" font-size=\"11\" font-weight=\"bold\" fill=\"#2c5885\">tRNA（運搬RNA）</text><text x=\"470\" y=\"201\" font-size=\"10.5\">下の3つの塩基が</text><text x=\"470\" y=\"216\" font-size=\"10.5\"><tspan font-weight=\"bold\">アンチコドン</tspan></text><text x=\"20\" y=\"292\" font-size=\"10.5\" fill=\"#555\">Met＝メチオニン　Ala＝アラニン　Lys＝リシン</text></svg></div>\n<div class=\"cap\">図3　翻訳のしくみ（コドンにtRNAが結合し、アミノ酸がつながっていく）</div>\n<ul>\n<li>翻訳は、<b class=\"key\">開始コドン AUG</b> から始まります。AUGはメチオニンを指定するので、タンパク質の最初のアミノ酸はふつうメチオニンです。</li>\n<li><b class=\"key\">終止コドン（UAA・UAG・UGA）</b>には対応するtRNAがないので、ここで翻訳が終わります。</li>\n</ul>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「転写は<b>同じ文字（塩基）のまま書き写す</b>こと、翻訳は<b>塩基の言葉をアミノ酸の言葉に置きかえる</b>こと」と、言葉の意味から説明すると混ざりにくくなります。翻訳の作業は「mRNAを3文字ずつ区切って、暗号表という辞書でアミノ酸を引く」と言いかえられます。</div>\n\n<h3>4-3　遺伝暗号表の読み方</h3>\n<p>どのコドンがどのアミノ酸を指定するかをまとめたものが<b class=\"key\">遺伝暗号表</b>（コドン表）です。<b>1番目の塩基で行</b>、<b>2番目の塩基で列</b>を選び、そのマスの中で<b>3番目の塩基</b>の段を見ます。たとえば GCU なら、1番目G の行 → 2番目C の列 → 3番目U の段で「アラニン」です。</p>\n<table class='ct'><tr><th rowspan='2' class='c1'>1番目</th><th colspan='4'>2番目の塩基</th><th rowspan='2' class='c1'>3番目</th></tr><tr><th>U</th><th>C</th><th>A</th><th>G</th></tr><tr><th class='c1 big'>U</th><td><div><span class='cd'>UUU</span> フェニルアラニン</div><div><span class='cd'>UUC</span> フェニルアラニン</div><div><span class='cd'>UUA</span> ロイシン</div><div><span class='cd'>UUG</span> ロイシン</div></td><td><div><span class='cd'>UCU</span> セリン</div><div><span class='cd'>UCC</span> セリン</div><div><span class='cd'>UCA</span> セリン</div><div><span class='cd'>UCG</span> セリン</div></td><td><div><span class='cd'>UAU</span> チロシン</div><div><span class='cd'>UAC</span> チロシン</div><div class='stop'><span class='cd'>UAA</span> 終止</div><div class='stop'><span class='cd'>UAG</span> 終止</div></td><td><div><span class='cd'>UGU</span> システイン</div><div><span class='cd'>UGC</span> システイン</div><div class='stop'><span class='cd'>UGA</span> 終止</div><div><span class='cd'>UGG</span> トリプトファン</div></td><td class='c1 third'><div>U</div><div>C</div><div>A</div><div>G</div></td></tr><tr><th class='c1 big'>C</th><td><div><span class='cd'>CUU</span> ロイシン</div><div><span class='cd'>CUC</span> ロイシン</div><div><span class='cd'>CUA</span> ロイシン</div><div><span class='cd'>CUG</span> ロイシン</div></td><td><div><span class='cd'>CCU</span> プロリン</div><div><span class='cd'>CCC</span> プロリン</div><div><span class='cd'>CCA</span> プロリン</div><div><span class='cd'>CCG</span> プロリン</div></td><td><div><span class='cd'>CAU</span> ヒスチジン</div><div><span class='cd'>CAC</span> ヒスチジン</div><div><span class='cd'>CAA</span> グルタミン</div><div><span class='cd'>CAG</span> グルタミン</div></td><td><div><span class='cd'>CGU</span> アルギニン</div><div><span class='cd'>CGC</span> アルギニン</div><div><span class='cd'>CGA</span> アルギニン</div><div><span class='cd'>CGG</span> アルギニン</div></td><td class='c1 third'><div>U</div><div>C</div><div>A</div><div>G</div></td></tr><tr><th class='c1 big'>A</th><td><div><span class='cd'>AUU</span> イソロイシン</div><div><span class='cd'>AUC</span> イソロイシン</div><div><span class='cd'>AUA</span> イソロイシン</div><div><span class='cd'>AUG</span> メチオニン<b>（開始）</b></div></td><td><div><span class='cd'>ACU</span> トレオニン</div><div><span class='cd'>ACC</span> トレオニン</div><div><span class='cd'>ACA</span> トレオニン</div><div><span class='cd'>ACG</span> トレオニン</div></td><td><div><span class='cd'>AAU</span> アスパラギン</div><div><span class='cd'>AAC</span> アスパラギン</div><div><span class='cd'>AAA</span> リシン</div><div><span class='cd'>AAG</span> リシン</div></td><td><div><span class='cd'>AGU</span> セリン</div><div><span class='cd'>AGC</span> セリン</div><div><span class='cd'>AGA</span> アルギニン</div><div><span class='cd'>AGG</span> アルギニン</div></td><td class='c1 third'><div>U</div><div>C</div><div>A</div><div>G</div></td></tr><tr><th class='c1 big'>G</th><td><div><span class='cd'>GUU</span> バリン</div><div><span class='cd'>GUC</span> バリン</div><div><span class='cd'>GUA</span> バリン</div><div><span class='cd'>GUG</span> バリン</div></td><td><div><span class='cd'>GCU</span> アラニン</div><div><span class='cd'>GCC</span> アラニン</div><div><span class='cd'>GCA</span> アラニン</div><div><span class='cd'>GCG</span> アラニン</div></td><td><div><span class='cd'>GAU</span> アスパラギン酸</div><div><span class='cd'>GAC</span> アスパラギン酸</div><div><span class='cd'>GAA</span> グルタミン酸</div><div><span class='cd'>GAG</span> グルタミン酸</div></td><td><div><span class='cd'>GGU</span> グリシン</div><div><span class='cd'>GGC</span> グリシン</div><div><span class='cd'>GGA</span> グリシン</div><div><span class='cd'>GGG</span> グリシン</div></td><td class='c1 third'><div>U</div><div>C</div><div>A</div><div>G</div></td></tr></table>\n<div class=\"cap\">表1　遺伝暗号表（赤字は終止コドン）</div>\n<p class=\"small\">共通テストでは、この表の一部が問題文の中に示されます。表を暗記する必要はありませんが、<b>AUG（開始）と終止コドン3つ</b>は覚えておくと速く解けます。</p>\n\n<h3>4-4　例題：アミノ酸の並びを求める</h3>\n<p>mRNA が <span class='seq'><span class='cdn'>AUG</span> <span class='cdn'>GCU</span> <span class='cdn'>AAA</span> <span class='cdn'>UGG</span> <span class='cdn'>GAA</span> <span class='cdn'>UAA</span></span> のとき、できるアミノ酸の並びを求めます。</p>\n<ol>\n<li>開始コドン AUG を見つけ、そこから3つずつ区切る（上の下線）。</li>\n<li>1つずつ暗号表で引く：AUG メチオニン → GCU アラニン → AAA リシン → UGG トリプトファン → GAA グルタミン酸 → UAA 終止。</li>\n<li>終止コドンの手前までが答え：<b>メチオニン―アラニン―リシン―トリプトファン―グルタミン酸</b></li>\n</ol>\n<div class=\"box exam\"><div class=\"bt\">考察問題とのつながり</div>\nこの例題のmRNAは、生徒さんに渡した「分野別考察問題」第1問と同じ配列です。この回を読み終えたら、第1問を解いてみましょう。問3は、次の5章の内容そのものです。</div>\n\n<h2>5. 突然変異：塩基が変わるとどうなるか</h2>\n<p>DNAの塩基配列が変化することを<b class=\"key\">突然変異</b>といいます。主なものは、1つの塩基が別の塩基に置き換わる<b class=\"key\">置換</b>、塩基が抜ける<b class=\"key\">欠失</b>、塩基が入りこむ<b class=\"key\">挿入</b>の3つです。4-4のmRNAで、何が起こるかを見てみます。</p>\n<h3>5-1　置換：影響は3パターン</h3>\n<table class=\"t\">\n<tr><th style=\"width:24%\">変化した位置</th><th style=\"width:30%\">変化後のmRNA</th><th>結果</th></tr>\n<tr><td>6番目 U→C</td><td><span class='seq'><span class='cdn'>AUG</span> <span class='cdn'>GC<span class='hl'>C</span></span> <span class='cdn'>AAA</span></span>…</td><td>GCC もアラニン。<b>アミノ酸は変わらない</b>。</td></tr>\n<tr><td>7番目 A→G</td><td><span class='seq'><span class='cdn'>AUG</span> <span class='cdn'>GCU</span> <span class='cdn'><span class='hl'>G</span>AA</span></span>…</td><td>GAA でグルタミン酸に。<b>アミノ酸が1つだけ変わる</b>。</td></tr>\n<tr><td>7番目 A→U</td><td><span class='seq'><span class='cdn'>AUG</span> <span class='cdn'>GCU</span> <span class='cdn'><span class='hl'>U</span>AA</span></span>…</td><td>UAA は終止コドン。<b>そこで翻訳が止まり、短いタンパク質になる</b>。</td></tr>\n</table>\n<p>アミノ酸が1つ変わるだけでも、タンパク質の形やはたらきが大きく変わることがあります。有名な例が<b>鎌状赤血球症</b>で、ヘモグロビンの遺伝子のたった1つの塩基の置換によって、グルタミン酸（GAG）がバリン（GUG）に変わり、赤血球の形が鎌のように変わってしまいます。</p>\n\n<h3>5-2　欠失・挿入：読み枠がずれる</h3>\n<p>4番目のGが欠失すると、そこから後ろの区切りがすべて1つずつずれます。</p>\n<p style=\"text-align:center\"><span class='seq'><span class='cdn'>AUG</span> <span class='cdn'>CUA</span> <span class='cdn'>AAU</span> <span class='cdn'>GGG</span> <span class='cdn'>AAU</span></span> …<br><span class=\"small\">メチオニン―ロイシン―アスパラギン―グリシン―アスパラギン…（2番目以降がすべて変わる）</span></p>\n<p>このように、3つずつの区切り（読み枠）がずれることを<b class=\"key\">フレームシフト</b>といいます。置換は1か所の変化ですみますが、欠失や挿入は<span class=\"em\">それより後ろのアミノ酸がすべて変わってしまう</span>ので、影響が大きくなりやすいです。</p>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n英語の3文字の単語の文で見せるとわかりやすいです。<br>\n<span class=\"seq\">THE FAT CAT ATE THE RAT</span>　から F を1文字消すと<br>\n<span class=\"seq\">THE ATC ATA TET HER AT</span>　となり、消した場所から後ろが全部意味をなさなくなります。これがフレームシフトです。</div>\n\n<h2>6. 原核生物と真核生物のちがい</h2>\n<div class=\"frow\"><div class=\"lab\">真核生物では</div><div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">転写</div><div class=\"fbs\">核の中</div></div><div class=\"farr\">→</div><div class=\"fb\"><div class=\"fbt\">スプライシング</div><div class=\"fbs\">核の中</div></div><div class=\"farr\">核から出て→</div><div class=\"fb\"><div class=\"fbt\">翻訳</div><div class=\"fbs\">細胞質の<br>リボソーム</div></div></div></div>\n<p>一方、<b>原核生物</b>には核膜がないので、DNAとリボソームが同じ場所にあります。そのため、<b>転写が終わる前から、できかけのmRNAにリボソームが結合して翻訳が始まります</b>。また、原核生物の遺伝子にはふつうイントロンがないので、スプライシングは起こりません。</p>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>RNAは、糖がリボース・塩基はTのかわりにU・ふつう1本鎖</li>\n<li>mRNAは情報を運び、tRNAはアミノ酸を運び、rRNAはリボソームをつくる</li>\n<li>転写：RNAポリメラーゼが、DNAの鋳型鎖を型にmRNAをつくる（鋳型鎖のA→U）</li>\n<li>mRNAの配列は、鋳型鎖でない方のDNAのTをUにしたものと同じ</li>\n<li>スプライシング：イントロンを取り除き、エキソンをつなぐ（真核生物の核の中）</li>\n<li>選択的スプライシングで、1つの遺伝子から複数のタンパク質ができる</li>\n<li>翻訳：mRNAのコドン（3塩基）に、アンチコドンをもつtRNAが結合し、アミノ酸がつながる</li>\n<li>開始コドンは AUG（メチオニン）、終止コドンは UAA・UAG・UGA</li>\n<li>置換は「変わらない・1つ変わる・途中で止まる」の3パターン。欠失・挿入はフレームシフト</li>\n<li>原核生物は核膜がないので、転写と翻訳が同時に進む</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<p class=\"small\">必要なときは、表1の遺伝暗号表を使ってかまいません。</p>\n<ol class=\"qlist\">\n<li>RNAがDNAとちがう点を3つ答えよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n<li>DNAの鋳型鎖の塩基配列が <span class=\"seq\">TACGGATTC</span> のとき、転写されてできるmRNAの塩基配列を答えよ。<br><span class=\"blank\" style=\"min-width:50mm\"></span></li>\n<li>2.のmRNAから翻訳されてできるアミノ酸の並びを答えよ。<br><span class=\"blank\" style=\"min-width:90mm\"></span></li>\n<li>終止コドンをすべて答えよ。<br><span class=\"blank\" style=\"min-width:60mm\"></span></li>\n<li>コドンが「2つの塩基」ではなく「3つの塩基」でできている理由を、数を使って説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n<li>真核生物で、mRNA前駆体から取り除かれる部分と、残ってつなぎ合わされる部分をそれぞれ何というか。<br>取り除かれる部分 <span class=\"blank\"></span>　残る部分 <span class=\"blank\"></span></li>\n<li>mRNA <span class=\"seq\">AUG AAA UGG UAA</span> について答えよ。<br>\n(1) このmRNAから翻訳されてできるアミノ酸の並びを答えよ。 <span class=\"blank\" style=\"min-width:60mm\"></span><br>\n(2) 4番目の塩基 A が U に置換すると、アミノ酸はいくつになるか。 <span class=\"blank\" style=\"min-width:16mm\"></span><br>\n(3) 5番目の塩基 A が欠失すると、2番目のアミノ酸は何になるか。 <span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li>翻訳で、tRNAのはたらきとして正しいものを1つ選べ。<br>\n　ア　DNAの情報を写し取る　　イ　アミノ酸をリボソームまで運ぶ<br>\n　ウ　イントロンを取り除く　　エ　DNAの2本鎖をほどく</li>\n<li>原核生物では、転写と翻訳が同時に進む。その理由を答えよ。<div class=\"wline\"></div></li>\n<li><b>説明の練習</b>　「転写」と「翻訳」のちがいを、生徒にわかるように2〜3文で説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　① 糖がリボース（DNAはデオキシリボース）　② 塩基にTがなく、かわりにU（ウラシル）がある　③ ふつう1本鎖（DNAは2本鎖）</b></p>\n<p><b>2.　AUGCCUAAG</b>　鋳型鎖の塩基を A→U、T→A、G→C、C→G と1つずつ置きかえる。TをAにする、AをUにする、の2つに特に注意。</p>\n<p><b>3.　メチオニン―プロリン―リシン</b>　AUG／CCU／AAG と区切って表1で引く。CCU は1番目C・2番目C の列でプロリン、AAG は1番目A・2番目A のマスの3番目G でリシン。</p>\n<p><b>4.　UAA・UAG・UGA</b></p>\n<p><b>5.　解答例</b>　アミノ酸は20種類ある。塩基は4種類なので、2つの組み合わせでは 4×4＝16通りしかなく、20種類を表せない。3つなら 4×4×4＝64通りとなり、20種類を表すことができるから。</p>\n<p><b>6.　取り除かれる部分：イントロン　残る部分：エキソン</b>　エキソンは expressed（発現する）、イントロンは intervening（間に入る）に由来する名前です。</p>\n<p><b>7.　(1) メチオニン―リシン―トリプトファン　(2) 1つ　(3) アスパラギン</b><br>\n(2) AUG <b>U</b>AA … となり、2番目のコドンが終止コドン UAA になる。メチオニンだけで翻訳が止まる。<br>\n(3) 5番目のAが抜けると AUG <b>AAU</b> GGU AA… と区切りがずれる。AAU はアスパラギン。3番目以降もすべて変わる（フレームシフト）。</p>\n<p><b>8.　イ</b>　アはmRNA（転写）、ウはスプライシング、エは転写や複製のときに起こること。</p>\n<p><b>9.　解答例</b>　原核生物には核膜がなく、DNAとリボソームが同じ細胞質にあるため、できかけのmRNAにすぐリボソームが結合できるから。</p>\n<p><b>10.　解答例</b>　転写は、DNAの情報をmRNAという別の鎖に、同じ塩基の言葉のまま写し取ることです。翻訳は、そのmRNAの塩基を3つずつ区切って読み、アミノ酸の言葉に置きかえてタンパク質をつくることです。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第3回 遺伝子の発現調節）に向けて</div>\n第3回では、「どの遺伝子を、いつ転写するか」を決めるしくみを学びます。この回の<b>RNAポリメラーゼ</b>と<b>プロモーター</b>が主役になるので、2章をもう一度読んでおいてください。考察問題の第2問（ラクトースと酵素）は、第3回の内容です。</div>\n</details>", "heads": ["0. 前回のふり返り", "1. RNAとは", "2. 転写：DNAの情報をmRNAに写す", "3. スプライシング：いらない部分を切り取る", "4. 翻訳：mRNAの暗号をアミノ酸に置きかえる", "5. 突然変異：塩基が変わるとどうなるか", "6. 原核生物と真核生物のちがい", "この回のまとめ", "確認問題"]}, "3": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第3回　遺伝子の発現調節</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>同じDNAをもつ細胞が、ちがう形やはたらきをもつ理由を説明できる</li>\n<li>ラクトースオペロンのしくみ（リプレッサー・オペレーター）を図で説明できる</li>\n<li>突然変異株の実験結果から、どこがはたらかなくなったかを推理できる</li>\n<li>真核生物の転写調節（ヒストン・基本転写因子・調節タンパク質）の要点を言える</li>\n</ul></div>\n\n<h2>0. 前回のふり返り</h2>\n<p>転写では、<b>RNAポリメラーゼ</b>が遺伝子の手前の<b>プロモーター</b>に結合し、DNAの鋳型鎖を型にしてmRNAをつくりました。この回は、「RNAポリメラーゼがプロモーターに結合して転写を始められるかどうか」を、細胞がどうやって切りかえているかを学びます。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">DNA</div><div class=\"fbs\">遺伝子</div></div><div class=\"farr\">転写 →<br><b style='color:#c62828'>ここで調節</b></div><div class=\"fb\"><div class=\"fbt\">mRNA</div><div class=\"fbs\"></div></div><div class=\"farr\">翻訳<br>→</div><div class=\"fb\"><div class=\"fbt\">タンパク質</div><div class=\"fbs\"></div></div></div>\n\n<h2>1. なぜ調節が必要なのか</h2>\n<p>ヒトの体の細胞は、もとをたどるとすべて1個の受精卵が分裂してできたものです。そのため、<span class=\"em\">筋肉の細胞も肝臓の細胞も、基本的に同じゲノム（同じDNA）をもっています</span>。それなのに形やはたらきがちがうのは、<b>どの遺伝子を使うか（発現させるか）が細胞によってちがう</b>からです。</p>\n<ul>\n<li>どの細胞でも使う遺伝子：呼吸の酵素、リボソームをつくるRNAなど。生きるのに欠かせない遺伝子は、ほとんどの細胞で発現している。</li>\n<li>特定の細胞だけで使う遺伝子：すい臓のインスリン、赤血球のもとになる細胞のヘモグロビン、目の水晶体のクリスタリンなど。</li>\n</ul>\n<p>また、同じ細胞でも、まわりの環境に合わせて「今必要な遺伝子」を切りかえています。必要なときに必要なタンパク質だけをつくれば、材料やエネルギーのむだがありません。遺伝子の発現は、主に<b>転写を始めるかどうか</b>の段階で調節されています。</p>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「全員が同じ分厚いレシピ本（ゲノム）を持っているけれど、パン屋さんはパンのページ、ケーキ屋さんはケーキのページだけを開いている」とたとえると伝わります。持っている本は同じでも、<b>開くページ（発現する遺伝子）</b>がちがうから、仕事がちがうのです。</div>\n\n<h2>2. 原核生物の調節：オペロン</h2>\n<h3>2-1　オペロンとは</h3>\n<p>大腸菌などの原核生物では、はたらきが関連する複数の遺伝子が並んでいて、<b>1つのプロモーターからまとめて転写</b>されます。このまとまりを<b class=\"key\">オペロン</b>といいます。プロモーターのすぐ後ろには<b class=\"key\">オペレーター</b>という領域があり、ここに<b class=\"key\">リプレッサー</b>（転写をおさえるタンパク質）が結合すると、RNAポリメラーゼが進めなくなり、転写が止まります。リプレッサーは、オペロンとは別の場所にある<b class=\"key\">調節遺伝子</b>からいつもつくられています。</p>\n\n<h3>2-2　ラクトースオペロン：「材料があるときだけ」つくる</h3>\n<p>大腸菌は、ラクトース（乳糖）を分解する酵素の遺伝子をもっています。ラクトースがないのにこの酵素をつくってもむだなので、<span class=\"em\">ラクトースがあるときだけ転写する</span>しくみになっています。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 400\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"a3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><defs><marker id=\"g3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#2e7d4f\"/></marker></defs><rect x=\"2\" y=\"2\" width=\"636\" height=\"186\" rx=\"8\" fill=\"#fafafa\" stroke=\"#ccc\"/><text x=\"14\" y=\"24\" font-weight=\"bold\" font-size=\"13\">ラクトースがないとき</text><line x1=\"10\" y1=\"141\" x2=\"630\" y2=\"141\" stroke=\"#555\" stroke-width=\"2\"/><rect x=\"20\" y=\"130\" width=\"90\" height=\"22\" fill=\"#d7ccc8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"65.0\" y=\"145.5\" text-anchor=\"middle\" font-size=\"11\">調節遺伝子</text><rect x=\"160\" y=\"130\" width=\"85\" height=\"22\" fill=\"#fff3cd\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"202.5\" y=\"145.5\" text-anchor=\"middle\" font-size=\"11\">プロモーター</text><rect x=\"245\" y=\"130\" width=\"75\" height=\"22\" fill=\"#ffe0b2\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"282.5\" y=\"145.5\" text-anchor=\"middle\" font-size=\"11\">オペレーター</text><rect x=\"320\" y=\"130\" width=\"300\" height=\"22\" fill=\"#c8e6c9\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"470.0\" y=\"145.5\" text-anchor=\"middle\" font-size=\"11\">酵素の遺伝子（ラクトースを分解する）</text><text x=\"8\" y=\"124\" font-size=\"10.5\" fill=\"#555\">DNA</text><path d=\"M242 130 L242 100 Q282 84 322 100 L322 130 L296 130 L296 120 L268 120 L268 130 Z\" fill=\"#ef9a9a\" stroke=\"#b71c1c\" stroke-width=\"1.6\"/><text x=\"282\" y=\"113\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">リプレッサー</text><ellipse cx=\"196\" cy=\"104\" rx=\"36\" ry=\"20\" fill=\"#fff59d\" stroke=\"#b08900\" stroke-width=\"1.6\"/><text x=\"196\" y=\"102\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">RNA</text><text x=\"196\" y=\"114\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">ポリメラーゼ</text><path d=\"M240 72 L290 72\" stroke=\"#c62828\" stroke-width=\"2.4\" marker-end=\"url(#a3)\"/><text x=\"300\" y=\"60\" font-size=\"20\" font-weight=\"bold\" fill=\"#c62828\">×</text><text x=\"330\" y=\"70\" font-size=\"11.5\" fill=\"#c62828\" font-weight=\"bold\">リプレッサーがじゃまをして、転写できない</text><path d=\"M65 126 L65 80\" stroke=\"#555\" stroke-width=\"1.4\" stroke-dasharray=\"3,2\" marker-end=\"url(#a3)\"/><text x=\"75\" y=\"90\" font-size=\"10.5\">いつもつくられる</text><path d=\"M75 75 Q160 20 250 84\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\" marker-end=\"url(#a3)\"/><text x=\"460\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#555\">→ 酵素はつくられない</text><rect x=\"2\" y=\"200\" width=\"636\" height=\"196\" rx=\"8\" fill=\"#f3faf5\" stroke=\"#9fc5a8\"/><text x=\"14\" y=\"222\" font-weight=\"bold\" font-size=\"13\" fill=\"#1b5e37\">ラクトースがあるとき</text><line x1=\"10\" y1=\"331\" x2=\"630\" y2=\"331\" stroke=\"#555\" stroke-width=\"2\"/><rect x=\"20\" y=\"320\" width=\"90\" height=\"22\" fill=\"#d7ccc8\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"65.0\" y=\"335.5\" text-anchor=\"middle\" font-size=\"11\">調節遺伝子</text><rect x=\"160\" y=\"320\" width=\"85\" height=\"22\" fill=\"#fff3cd\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"202.5\" y=\"335.5\" text-anchor=\"middle\" font-size=\"11\">プロモーター</text><rect x=\"245\" y=\"320\" width=\"75\" height=\"22\" fill=\"#ffe0b2\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"282.5\" y=\"335.5\" text-anchor=\"middle\" font-size=\"11\">オペレーター</text><rect x=\"320\" y=\"320\" width=\"300\" height=\"22\" fill=\"#c8e6c9\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"470.0\" y=\"335.5\" text-anchor=\"middle\" font-size=\"11\">酵素の遺伝子（ラクトースを分解する）</text><text x=\"8\" y=\"314\" font-size=\"10.5\" fill=\"#555\">DNA</text><path d=\"M70 282 L70 252 Q110 236 150 252 L150 282 L124 282 L124 272 L96 272 L96 282 Z\" fill=\"#ef9a9a\" stroke=\"#b71c1c\" stroke-width=\"1.6\"/><text x=\"110\" y=\"265\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">リプレッサー</text><polygon points=\"136,282 150,282 143,270\" fill=\"#5c6bc0\" stroke=\"#283593\"/><polygon points=\"70,250 84,250 77,238\" fill=\"#5c6bc0\" stroke=\"#283593\"/><text x=\"160\" y=\"246\" font-size=\"10.5\" fill=\"#283593\">▲ ラクトースからできた物質が結合</text><text x=\"160\" y=\"260\" font-size=\"10.5\" fill=\"#283593\">→ 形が変わり、オペレーターから離れる</text><ellipse cx=\"420\" cy=\"294\" rx=\"36\" ry=\"20\" fill=\"#fff59d\" stroke=\"#b08900\" stroke-width=\"1.6\"/><text x=\"420\" y=\"292\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">RNA</text><text x=\"420\" y=\"304\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">ポリメラーゼ</text><path d=\"M460 294 L505 294\" stroke=\"#2e7d4f\" stroke-width=\"2.4\" marker-end=\"url(#g3)\"/><text x=\"512\" y=\"298\" font-size=\"11.5\" fill=\"#1b5e37\" font-weight=\"bold\">転写が進む</text><path d=\"M330 356 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0\" fill=\"none\" stroke=\"#7b1fa2\" stroke-width=\"2.4\"/><text x=\"330\" y=\"376\" font-size=\"11\" fill=\"#7b1fa2\" font-weight=\"bold\">mRNA</text><text x=\"380\" y=\"376\" font-size=\"11\">→ 翻訳されて、ラクトースを分解する酵素ができる</text></svg></div>\n<div class=\"cap\">図1　ラクトースオペロンのしくみ</div>\n<ol>\n<li><b>ラクトースがないとき</b>：リプレッサーがオペレーターに結合している。RNAポリメラーゼはプロモーターから先に進めず、転写されない。</li>\n<li><b>ラクトースがあるとき</b>：ラクトースからできた物質がリプレッサーに結合する。するとリプレッサーの形が変わってオペレーターから離れ、転写が始まる。できた酵素がラクトースを分解する。</li>\n</ol>\n<p class=\"small\">ラクトースを分解しつくすと、リプレッサーはまたオペレーターに結合し、転写が止まります。なお、グルコースがあるときは、大腸菌はまずグルコースを使うので、ラクトースがあってもこの転写はあまり起こりません。</p>\n\n<h3>2-3　トリプトファンオペロン：「足りているときは止める」</h3>\n<p>トリプトファン（アミノ酸の1つ）を<b>つくる</b>酵素の遺伝子も、オペロンになっています。こちらは逆に、<span class=\"em\">トリプトファンが十分にあるときは転写を止める</span>しくみです。トリプトファンが多いと、トリプトファンがリプレッサーに結合し、リプレッサーがオペレーターに<b>結合できるようになって</b>転写が止まります。</p>\n<table class=\"t\">\n<tr><th style=\"width:24%\"></th><th>ラクトースオペロン</th><th>トリプトファンオペロン</th></tr>\n<tr><td>つくる酵素</td><td>ラクトースを<b>分解</b>する酵素</td><td>トリプトファンを<b>合成</b>する酵素</td></tr>\n<tr><td>物質が多いとき</td><td>リプレッサーが<b>離れる</b> → 転写<b>する</b></td><td>リプレッサーが<b>結合する</b> → 転写<b>しない</b></td></tr>\n<tr><td>考え方</td><td>分解する材料があるから、酵素をつくる</td><td>もう十分あるから、つくるのをやめる</td></tr>\n</table>\n\n<h3>2-4　突然変異株から考える</h3>\n<p>共通テストでは、「ある部分がはたらかなくなった突然変異株」の実験結果から、どこが変化したのかを推理させる問題がよく出ます。ラクトースオペロンで整理しておきます。</p>\n<table class=\"t\">\n<tr><th style=\"width:36%\">変化した部分</th><th class=\"c\" style=\"width:15%\">ラクトースなし</th><th class=\"c\" style=\"width:15%\">ラクトースあり</th><th>理由</th></tr>\n<tr><td>正常（野生型）</td><td class=\"c\">×</td><td class=\"c\">○</td><td>上の図1のとおり</td></tr>\n<tr><td>リプレッサーがつくられない</td><td class=\"c\">○</td><td class=\"c\">○</td><td>転写を止める役がいない</td></tr>\n<tr><td>オペレーターが変化し、リプレッサーが結合できない</td><td class=\"c\">○</td><td class=\"c\">○</td><td>止める場所がない</td></tr>\n<tr><td>リプレッサーが、ラクトースからできた物質と結合できない</td><td class=\"c\">×</td><td class=\"c\">×</td><td>リプレッサーが離れられない</td></tr>\n<tr><td>プロモーターが変化し、RNAポリメラーゼが結合できない</td><td class=\"c\">×</td><td class=\"c\">×</td><td>転写を始められない</td></tr>\n</table>\n<p class=\"small\">○：酵素がつくられる　×：つくられない</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：考察問題第2問とのつながり</div>\n生徒さんに渡した考察問題の第2問は、まさにこの表の2行目です。突然変異株Xは<b>ラクトースがなくても酵素が多い</b>ので、「止める役（リプレッサー）がはたらいていない」と考えます。<b>ラクトースなしの結果</b>に注目するのがコツです。</div>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\nリプレッサーを<b>「踏切の遮断機」</b>、RNAポリメラーゼを<b>「電車」</b>にたとえます。ふだんは遮断機（リプレッサー）が線路（オペレーター）をふさいでいて、電車は通れない。ラクトースが来ると遮断機が上がって電車が通れる（転写される）。遮断機がこわれている突然変異株では、いつでも電車が通ってしまう、と説明すると表の内容がすっと入ります。</div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">3. 真核生物の調節</h2>\n<p>真核生物の転写調節は、原核生物よりも複雑です。ポイントは次の3つです。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 260\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"a4\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><circle cx=\"40\" cy=\"70\" r=\"13\" fill=\"#d1c4e9\" stroke=\"#5e35b1\" stroke-width=\"1.4\"/><path d=\"M23 62 Q40 50 57 62 Q40 92 23 78\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\"/><circle cx=\"74\" cy=\"70\" r=\"13\" fill=\"#d1c4e9\" stroke=\"#5e35b1\" stroke-width=\"1.4\"/><path d=\"M57 62 Q74 50 91 62 Q74 92 57 78\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\"/><circle cx=\"108\" cy=\"70\" r=\"13\" fill=\"#d1c4e9\" stroke=\"#5e35b1\" stroke-width=\"1.4\"/><path d=\"M91 62 Q108 50 125 62 Q108 92 91 78\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\"/><circle cx=\"142\" cy=\"70\" r=\"13\" fill=\"#d1c4e9\" stroke=\"#5e35b1\" stroke-width=\"1.4\"/><path d=\"M125 62 Q142 50 159 62 Q142 92 125 78\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\"/><circle cx=\"176\" cy=\"70\" r=\"13\" fill=\"#d1c4e9\" stroke=\"#5e35b1\" stroke-width=\"1.4\"/><path d=\"M159 62 Q176 50 193 62 Q176 92 159 78\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\"/><text x=\"108\" y=\"108\" text-anchor=\"middle\" font-size=\"10.5\">ヒストンにかたく巻きついた部分</text><text x=\"108\" y=\"123\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c62828\" font-weight=\"bold\">→ 転写されにくい</text><text x=\"40\" y=\"38\" font-size=\"10.5\" fill=\"#5e35b1\" font-weight=\"bold\">ヒストン</text><path d=\"M205 66 C250 60 260 200 300 200 L620 200\" fill=\"none\" stroke=\"#555\" stroke-width=\"2.4\"/><path d=\"M196 66 L205 66\" stroke=\"#555\" stroke-width=\"2.4\"/><rect x=\"236\" y=\"104\" width=\"40\" height=\"18\" fill=\"#ffe0b2\" stroke=\"#e65100\" stroke-width=\"1.2\" transform=\"rotate(72 256 113)\"/><text x=\"196\" y=\"160\" font-size=\"10.5\" text-anchor=\"middle\">転写調節領域</text><ellipse cx=\"300\" cy=\"112\" rx=\"42\" ry=\"15\" fill=\"#80cbc4\" stroke=\"#00695c\" stroke-width=\"1.5\"/><text x=\"300\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">調節タンパク質</text><path d=\"M330 124 Q360 140 380 164\" fill=\"none\" stroke=\"#00695c\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\" marker-end=\"url(#a4)\"/><text x=\"362\" y=\"134\" font-size=\"10\" fill=\"#00695c\">はたらきかける</text><rect x=\"350\" y=\"190\" width=\"70\" height=\"20\" fill=\"#fff3cd\" stroke=\"#555\"/><text x=\"385\" y=\"228\" text-anchor=\"middle\" font-size=\"10.5\">プロモーター</text><rect x=\"420\" y=\"190\" width=\"200\" height=\"20\" fill=\"#c8e6c9\" stroke=\"#555\"/><text x=\"520\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\">遺伝子</text><rect x=\"340\" y=\"168\" width=\"72\" height=\"20\" rx=\"4\" fill=\"#b3e5fc\" stroke=\"#0277bd\" stroke-width=\"1.3\"/><text x=\"376\" y=\"182\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\">基本転写因子</text><ellipse cx=\"450\" cy=\"172\" rx=\"36\" ry=\"17\" fill=\"#fff59d\" stroke=\"#b08900\" stroke-width=\"1.5\"/><text x=\"450\" y=\"169\" text-anchor=\"middle\" font-size=\"9\">RNA</text><text x=\"450\" y=\"180\" text-anchor=\"middle\" font-size=\"9\">ポリメラーゼ</text><path d=\"M490 172 L540 172\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" marker-end=\"url(#a4)\"/><text x=\"546\" y=\"176\" font-size=\"10.5\" fill=\"#1b5e37\" font-weight=\"bold\">転写</text><text x=\"400\" y=\"250\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#555\">DNAが折れ曲がるので、離れた場所からもはたらきかけられる</text></svg></div>\n<div class=\"cap\">図2　真核生物の転写調節のしくみ</div>\n<h3>3-1　DNAの巻きつき方</h3>\n<p>真核生物のDNAは、<b class=\"key\">ヒストン</b>というタンパク質に巻きついています。ヒストンにDNAが巻きついた粒を<b>ヌクレオソーム</b>といい、これが連なったものを<b class=\"key\">クロマチン</b>といいます。<span class=\"em\">かたく巻きついている部分は転写されにくく、ゆるんだ部分は転写されやすい</span>ので、巻きつき方を変えることでも発現が調節されます。</p>\n<h3>3-2　基本転写因子</h3>\n<p>真核生物のRNAポリメラーゼは、単独ではプロモーターに結合できません。<b class=\"key\">基本転写因子</b>というタンパク質と一緒になって、はじめてプロモーターに結合し、転写を始めます。</p>\n<h3>3-3　調節タンパク質と転写調節領域</h3>\n<p>DNAには、転写の量を調節する<b class=\"key\">転写調節領域</b>があり、ここに<b class=\"key\">調節タンパク質</b>（転写調節因子）が結合して、転写を促進したり抑制したりします。転写調節領域は遺伝子から離れた場所にあることも多く、DNAが折れ曲がることで、離れた場所からはたらきかけます。1つの遺伝子に複数の調節タンパク質がかかわり、<b>その組み合わせによって、細胞ごとにちがう遺伝子が発現</b>します。</p>\n<div class=\"box column\"><div class=\"bt\">コラム：転写のあとにも調節がある</div>\n真核生物では、転写のあとにも調節があります。前回学んだ<b>選択的スプライシング</b>もその1つで、どのエキソンを残すかで、つくるタンパク質を変えています。</div>\n\n<h2>4. 細胞の分化と遺伝子の発現</h2>\n<p>受精卵が分裂してできた細胞が、それぞれ特定の形やはたらきをもつようになることを<b class=\"key\">分化</b>といいます。分化は、細胞ごとに<b>発現する遺伝子の組み合わせが変わる</b>ことで起こります。分化した細胞でも、使わない遺伝子がDNAから失われるわけではありません。</p>\n<p>ある遺伝子からできた調節タンパク質が、別の遺伝子の発現を引き起こし、その遺伝子からできた調節タンパク質がさらに別の遺伝子を…というように、発現が次々と連鎖することで、体のつくりが順番にできあがっていきます（第7回「発生」でくわしく学びます）。</p>\n<h3>だ腺染色体のパフ</h3>\n<p>ショウジョウバエやユスリカの幼虫のだ腺（だ液をつくる器官）の細胞には、ふつうの100倍以上も太い<b class=\"key\">だ腺染色体</b>があり、光学顕微鏡でよく見えます。だ腺染色体には、ところどころふくらんだ部分（<b class=\"key\">パフ</b>）が見られます。パフでは、DNAがほどけて<span class=\"em\">盛んに転写が行われ、mRNAが合成されています</span>。幼虫の成長の時期によってパフの位置が変わることから、<b>時期によって発現する遺伝子が変わる</b>ことがわかります。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：パフ</div>\n「パフの部分に、RNAの材料（ウラシルを含むヌクレオチド）に目印をつけて取りこませると、目印が集まる」→ パフでRNAが合成されている証拠。<b>ウラシル（U）はRNAにだけ含まれる</b>ので、RNA合成の目印に使われる、という点も第2回とつながります。</div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>体の細胞は基本的に同じゲノムをもつ。ちがいは「どの遺伝子を発現させるか」</li>\n<li>遺伝子の発現は、主に転写を始めるかどうかで調節される</li>\n<li>オペロン：関連する遺伝子がまとまって1つのプロモーターから転写される（原核生物）</li>\n<li>リプレッサーがオペレーターに結合すると転写が止まる。リプレッサーは調節遺伝子からつくられる</li>\n<li>ラクトースオペロン：ラクトースがあるとリプレッサーが離れて転写される</li>\n<li>トリプトファンオペロン：トリプトファンが多いとリプレッサーが結合して転写が止まる</li>\n<li>突然変異株は「ラクトースなしでも酵素ができるか」に注目して推理する</li>\n<li>真核生物：DNAはヒストンに巻きつく（ヌクレオソーム・クロマチン）。かたく巻くと転写されにくい</li>\n<li>真核生物のRNAポリメラーゼは、基本転写因子と一緒にプロモーターに結合する</li>\n<li>調節タンパク質が転写調節領域に結合し、転写を促進・抑制する</li>\n<li>分化は、発現する遺伝子の組み合わせが変わることで起こる。パフは盛んに転写している部分</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>ヒトの筋肉の細胞と肝臓の細胞は、同じゲノムをもつのに形やはたらきがちがう。その理由を説明せよ。<div class=\"wline\"></div></li>\n<li>原核生物で、はたらきが関連する複数の遺伝子が、1つのプロモーターからまとめて転写されるまとまりを何というか。 <span class=\"blank\"></span></li>\n<li>リプレッサーが結合するDNAの領域と、リプレッサーをつくる遺伝子を、それぞれ何というか。<br>結合する領域 <span class=\"blank\"></span>　つくる遺伝子 <span class=\"blank\"></span></li>\n<li>ラクトースオペロンについて、正しいものを1つ選べ。<br>\n　ア　ラクトースがないとき、リプレッサーはオペレーターから離れている。<br>\n　イ　ラクトースがあると、ラクトースからできた物質がリプレッサーに結合し、転写が始まる。<br>\n　ウ　ラクトースがあると、リプレッサーがRNAポリメラーゼを分解する。<br>\n　エ　ラクトースがあると、オペレーターがDNAから取り除かれる。</li>\n<li>トリプトファンオペロンでは、トリプトファンが多いとき、トリプトファンを合成する酵素の遺伝子の転写はどうなるか。理由とともに答えよ。<div class=\"wline\"></div></li>\n<li>大腸菌の突然変異株Yは、ラクトースがあってもなくても、ラクトースを分解する酵素をつくらなかった。考えられる原因として適当なものを、次から<b>2つ</b>選べ。<br>\n　ア　リプレッサーがつくられない<br>\n　イ　オペレーターが変化し、リプレッサーが結合できない<br>\n　ウ　リプレッサーが、ラクトースからできた物質と結合できない<br>\n　エ　プロモーターが変化し、RNAポリメラーゼが結合できない</li>\n<li>真核生物について答えよ。<br>(1) DNAが巻きついているタンパク質を何というか。 <span class=\"blank\"></span><br>(2) RNAポリメラーゼと一緒にプロモーターに結合するタンパク質を何というか。 <span class=\"blank\"></span></li>\n<li>次の文が正しければ○、誤っていれば×をつけよ。<br>\n　(a) 真核生物のRNAポリメラーゼは、単独でプロモーターに結合できる。　（　　）<br>\n　(b) 転写調節領域は、遺伝子から離れた場所にあることもある。　（　　）<br>\n　(c) 分化した細胞では、使わない遺伝子はDNAから失われている。　（　　）<br>\n　(d) DNAがヒストンにかたく巻きついている部分は、転写されにくい。　（　　）</li>\n<li>だ腺染色体のパフについて答えよ。<br>(1) パフの部分では何が盛んに行われているか。 <span class=\"blank\" style=\"min-width:50mm\"></span><br>(2) 幼虫の時期によってパフの位置が変わることから、何がわかるか。<div class=\"wline\"></div></li>\n<li><b>説明の練習</b>　ラクトースオペロンのしくみを、「リプレッサー」「オペレーター」という語を使って、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　解答例</b>　細胞によって、発現させる（転写する）遺伝子の組み合わせがちがうから。持っている遺伝子は同じでも、使う遺伝子がちがうので、つくられるタンパク質がちがう。</p>\n<p><b>2.　オペロン</b></p>\n<p><b>3.　結合する領域：オペレーター　つくる遺伝子：調節遺伝子</b>　「オペロン」「オペレーター」は名前が似ているので注意。オペロンは遺伝子のまとまり、オペレーターはリプレッサーが結合する場所。</p>\n<p><b>4.　イ</b>　ア：ラクトースがないときは結合している。ウ・エ：そのようなことは起こらない。</p>\n<p><b>5.　解答例</b>　転写されなくなる。トリプトファンがリプレッサーに結合し、リプレッサーがオペレーターに結合できるようになるから。（トリプトファンが十分にあるので、合成する必要がない。）</p>\n<p><b>6.　ウ・エ</b>　「いつまでも転写されない」のは、リプレッサーが離れられない（ウ）か、転写を始められない（エ）とき。ア・イでは逆に、ラクトースがなくても酵素がつくられる。</p>\n<p><b>7.　(1) ヒストン　(2) 基本転写因子</b></p>\n<p><b>8.　(a) ×　(b) ○　(c) ×　(d) ○</b>　(a) 基本転写因子が必要。(c) 遺伝子はすべて残っていて、発現するかどうかが変わるだけ。</p>\n<p><b>9.　(1) 転写（mRNAの合成）　(2) 解答例</b>　成長の時期によって、発現する遺伝子が変わること。</p>\n<p><b>10.　解答例</b>　ふだんはリプレッサーというタンパク質がオペレーターに結合していて、RNAポリメラーゼが進めないので、ラクトースを分解する酵素の遺伝子は転写されません。ラクトースがあると、ラクトースからできた物質がリプレッサーに結合し、リプレッサーがオペレーターから離れるので、転写が始まって酵素がつくられます。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第4回 酵素とATP）に向けて</div>\n第4回からは「エネルギーの話」に入ります。この回のラクトースを分解する酵素のように、<b>酵素はタンパク質</b>で、遺伝子からつくられます。「遺伝子 → タンパク質（酵素）→ 化学反応」というつながりを意識して読み進めてください。</div>\n</details>", "heads": ["0. 前回のふり返り", "1. なぜ調節が必要なのか", "2. 原核生物の調節：オペロン", "3. 真核生物の調節", "4. 細胞の分化と遺伝子の発現", "この回のまとめ", "確認問題"]}, "4": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-content: center; gap: 2mm; margin: 2mm 0 1mm; break-inside: avoid; flex-wrap: wrap; }\n.fb { border: 2px solid #2e7d4f; border-radius: 2.5mm; padding: 1.2mm 2.5mm; text-align: center; background: #fff; flex: 0 0 auto; }\n.fbt { font-weight: bold; font-size: 10.5pt; }\n.fbs { font-size: 8.8pt; color: #555; line-height: 1.4; }\n.farr { font-size: 8.6pt; color: #2e7d4f; font-weight: bold; text-align: center; line-height: 1.3; white-space: nowrap; flex: 0 0 auto; }\n.ans p { margin: 0.5mm 0 2mm; }\nul.check li { margin-bottom: 1.2mm; }\ntable.t td.c, table.t th.c { text-align: center; }\n.two { display: flex; gap: 4mm; justify-content: center; align-items: flex-start; break-inside: avoid; }\n.two > div { flex: 1; min-width: 0; text-align: center; }\n.seq { font-family: \"Noto Sans Mono CJK JP\", monospace; }\n.side { display: flex; gap: 5mm; align-items: flex-start; margin: 1mm 0 2mm; }\n.side .txt { flex: 1; min-width: 0; }\n.side .txt p:first-child { margin-top: 0; }\n.side .g { flex: 0 0 auto; text-align: center; break-inside: avoid; }\n</style>\n\n<div class=\"cover\"><div class=\"series\">高校生物 ゼロから講座</div><h1>第4回　酵素とATP</h1></div>\n\n<div class=\"goal\"><b>この回のゴール</b>\n<ul>\n<li>代謝・同化・異化の意味と、それぞれの例を言える</li>\n<li>ATPのつくりと、「エネルギーの通貨」とよばれる理由を説明できる</li>\n<li>酵素の性質（活性化エネルギー・基質特異性・最適温度・最適pH）を説明できる</li>\n<li>基質濃度・酵素量・阻害物質と反応速度のグラフを読める</li>\n</ul></div>\n\n<h2>0. ここから「エネルギーの話」</h2>\n<p>第1回で、高校生物は「情報（DNA）」と「エネルギー（ATP）」の2本の柱でできていると説明しました。第2・3回は情報の話でした。この回から、もう1本の柱であるエネルギーの話に入ります。ただし2本の柱は別々ではありません。<b>体の中の化学反応を進める酵素はタンパク質で、遺伝子の情報からつくられる</b>からです。</p>\n<div class=\"flow\"><div class=\"fb\"><div class=\"fbt\">遺伝子</div><div class=\"fbs\">DNAの情報</div></div><div class=\"farr\">転写・翻訳<br>→</div><div class=\"fb\"><div class=\"fbt\">酵素</div><div class=\"fbs\">タンパク質</div></div><div class=\"farr\">進める<br>→</div><div class=\"fb\"><div class=\"fbt\">化学反応</div><div class=\"fbs\">代謝</div></div></div>\n\n<h2>1. 代謝：体の中の化学反応</h2>\n<p>生物の体の中で起こる化学反応をまとめて<b class=\"key\">代謝</b>といいます。代謝は、向きによって2つに分けられます。</p>\n<table class=\"t\">\n<tr><th style=\"width:15%\"></th><th>同化</th><th>異化</th></tr>\n<tr><td><b>物質の変化</b></td><td>簡単な物質 → <b>複雑な物質</b>をつくる</td><td>複雑な物質 → <b>簡単な物質</b>に分解する</td></tr>\n<tr><td><b>エネルギー</b></td><td>エネルギーを<b>取りこむ</b>（吸収）</td><td>エネルギーを<b>取り出す</b>（放出）</td></tr>\n<tr><td><b>代表例</b></td><td><b>光合成</b>：二酸化炭素と水から、光のエネルギーを使って有機物（糖）をつくる</td><td><b>呼吸</b>：有機物（糖）を二酸化炭素と水に分解して、エネルギーを取り出す</td></tr>\n</table>\n<p>同化でも異化でも、エネルギーのやりとりは<b>ATP</b>を通して行われます。</p>\n\n<h2>2. ATP：エネルギーの通貨</h2>\n<h3>2-1　ATPのつくり</h3>\n<p><b class=\"key\">ATP</b>（アデノシン三リン酸）は、<b>アデニン</b>（塩基）と<b>リボース</b>（糖）が結合した<b>アデノシン</b>に、<b>リン酸が3つ</b>つながった物質です。リン酸どうしの結合は<b class=\"key\">高エネルギーリン酸結合</b>とよばれ、たくさんのエネルギーをたくわえています。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 200\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"a5\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><rect x=\"30\" y=\"40\" width=\"96\" height=\"46\" rx=\"6\" fill=\"#ef9a9a\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"78\" y=\"68\" text-anchor=\"middle\" font-weight=\"bold\">アデニン</text><line x1=\"126\" y1=\"63\" x2=\"150\" y2=\"80\" stroke=\"#555\" stroke-width=\"2\"/><polygon points=\"190,62 222,84 210,120 170,120 158,84\" fill=\"#d7ccc8\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"190\" y=\"100\" text-anchor=\"middle\" font-weight=\"bold\">リボース</text><line x1=\"222\" y1=\"92\" x2=\"262\" y2=\"92\" stroke=\"#555\" stroke-width=\"2\"/><circle cx=\"290\" cy=\"92\" r=\"24\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"290\" y=\"97\" text-anchor=\"middle\" font-weight=\"bold\">リン酸</text><circle cx=\"380\" cy=\"92\" r=\"24\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"380\" y=\"97\" text-anchor=\"middle\" font-weight=\"bold\">リン酸</text><circle cx=\"470\" cy=\"92\" r=\"24\" fill=\"#fff59d\" stroke=\"#555\" stroke-width=\"1.4\"/><text x=\"470\" y=\"97\" text-anchor=\"middle\" font-weight=\"bold\">リン酸</text><path d=\"M314 92 q8 -9 16 0 t16 0 t10 0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.4\"/><path d=\"M404 92 q8 -9 16 0 t16 0 t10 0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.4\"/><text x=\"380\" y=\"40\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">高エネルギーリン酸結合（〜）</text><line x1=\"335\" y1=\"46\" x2=\"330\" y2=\"80\" stroke=\"#c62828\" stroke-width=\"1\"/><line x1=\"425\" y1=\"46\" x2=\"420\" y2=\"80\" stroke=\"#c62828\" stroke-width=\"1\"/><path d=\"M30 140 L30 148 L222 148 L222 140\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"1.6\"/><text x=\"126\" y=\"166\" text-anchor=\"middle\" fill=\"#1b5e37\" font-weight=\"bold\">アデノシン</text><path d=\"M30 168 L30 176 L494 176 L494 168\" fill=\"none\" stroke=\"#7b1fa2\" stroke-width=\"1.6\"/><text x=\"262\" y=\"194\" text-anchor=\"middle\" fill=\"#7b1fa2\" font-weight=\"bold\">ATP（アデノシン三リン酸）</text><path d=\"M500 72 Q560 40 600 70\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.6\" marker-end=\"url(#a5)\"/><text x=\"560\" y=\"100\" text-anchor=\"middle\" font-size=\"11\">リン酸が1つ外れると</text><text x=\"560\" y=\"116\" text-anchor=\"middle\" font-size=\"11\"><tspan font-weight=\"bold\">ADP</tspan>（二リン酸）になり</text><text x=\"560\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c62828\" font-weight=\"bold\">エネルギーが出る</text></svg></div>\n<div class=\"cap\">図1　ATPのつくり</div>\n<p>ATPの末端のリン酸が1つ外れて<b class=\"key\">ADP</b>（アデノシン二リン酸）になるとき、エネルギーが放出されます。生物はこのエネルギーを使って、さまざまな生命活動を行います。</p>\n<div class=\"box column\"><div class=\"bt\">気づいたでしょうか</div>\nアデニンとリボースは、第2回で学んだRNAの部品と同じです。ATPはRNAのヌクレオチドにリン酸が2つ多くついた形をしています。</div>\n\n<h3>2-2　ATPとADPの循環</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 640 210\" width=\"560\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"12\"><defs><marker id=\"a6\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#2e7d4f\"/></marker></defs><defs><marker id=\"a7\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#c62828\"/></marker></defs><rect x=\"250\" y=\"20\" width=\"140\" height=\"44\" rx=\"8\" fill=\"#ede7f6\" stroke=\"#7b1fa2\" stroke-width=\"2\"/><text x=\"320\" y=\"48\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"15\">ATP</text><rect x=\"230\" y=\"146\" width=\"180\" height=\"44\" rx=\"8\" fill=\"#f5f5f5\" stroke=\"#555\" stroke-width=\"2\"/><text x=\"320\" y=\"174\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"14\">ADP ＋ リン酸</text><path d=\"M250 160 Q170 105 250 52\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"3\" marker-end=\"url(#a6)\"/><path d=\"M390 52 Q470 105 390 160\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"3\" marker-end=\"url(#a7)\"/><text x=\"150\" y=\"92\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#1b5e37\">合成</text><text x=\"150\" y=\"110\" text-anchor=\"end\" font-size=\"11\">呼吸・光合成で</text><text x=\"150\" y=\"126\" text-anchor=\"end\" font-size=\"11\">取り出したエネルギーを使う</text><text x=\"490\" y=\"92\" font-weight=\"bold\" fill=\"#c62828\">分解</text><text x=\"490\" y=\"110\" font-size=\"11\">出てきたエネルギーを</text><text x=\"490\" y=\"126\" font-size=\"11\">生命活動に使う</text><text x=\"490\" y=\"146\" font-size=\"10.5\" fill=\"#555\">筋肉の収縮・物質の合成</text><text x=\"490\" y=\"161\" font-size=\"10.5\" fill=\"#555\">物質の輸送・発光・発熱</text></svg></div>\n<div class=\"cap\">図2　ATPとADPの循環</div>\n<p>ATPは使いっぱなしではありません。分解してできたADPとリン酸は、呼吸や光合成で取り出したエネルギーを使って、<b>再びATPに合成</b>されます。ATPは、エネルギーをいったん受け取って、必要な場所で渡す役割をしています。</p>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n「ATPは<b>エネルギーの通貨（お金）</b>」というたとえが定番です。呼吸でかせいだエネルギーをATPというお金に替えておき、筋肉を動かすときや物質をつくるときにATPで支払う。支払ったあとのADPは、また呼吸でかせいでATPに戻す。どの生物も同じ通貨（ATP）を使っている、と説明できます。</div>\n<p class=\"small\">ATPは細胞の中にためておける量が少ないため、ヒトは1日に、体重と同じくらいの量のATPを合成しては分解しているといわれています。</p>\n\n<h2>3. 酵素：反応を進める生体触媒</h2>\n<h3>3-1　触媒としての酵素</h3>\n<p>化学反応を速く進め、自分自身は反応の前後で変化しない物質を<b class=\"key\">触媒</b>といいます。生物の体の中で触媒としてはたらく物質が<b class=\"key\">酵素</b>で、<b>生体触媒</b>ともよばれます。酵素の主成分は<b>タンパク質</b>です。酵素は反応のあとも変化しないので、<span class=\"em\">くり返し何度でも使えます</span>。</p>\n\n<h3>3-2　活性化エネルギーを下げる</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>化学反応が起こるには、はじめに「山を越える」ためのエネルギーが必要です。これを<b class=\"key\">活性化エネルギー</b>といいます。</p>\n<p>酵素は<span class=\"em\">活性化エネルギーを小さくする</span>ことで、体温くらいのおだやかな温度でも、反応を速く進められるようにしています。</p>\n<p>山の高さが低くなるだけで、反応する物質とできた物質のエネルギーの差は変わりません。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 420 286\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"a8\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"215\" stroke=\"#333\" stroke-width=\"1.3\"/><line x1=\"50\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"#333\" stroke-width=\"1.3\"/><text transform=\"translate(22,118) rotate(-90)\" text-anchor=\"middle\">エネルギー</text><text x=\"225\" y=\"238\" text-anchor=\"middle\">反応の進み方</text><path d=\"M60 150 L110 150 C150 150 160 40 210 40 C260 40 270 190 310 190 L390 190\" fill=\"none\" stroke=\"#9e9e9e\" stroke-width=\"2.4\" stroke-dasharray=\"6,4\"/><path d=\"M60 150 L110 150 C150 150 165 105 210 105 C255 105 270 190 310 190 L390 190\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.8\"/><text x=\"210\" y=\"32\" text-anchor=\"middle\" fill=\"#757575\" font-weight=\"bold\">酵素なし</text><text x=\"262\" y=\"112\" fill=\"#1b5e37\" font-weight=\"bold\">酵素あり</text><line x1=\"60\" y1=\"150\" x2=\"236\" y2=\"150\" stroke=\"#bbb\" stroke-width=\"1\" stroke-dasharray=\"2,2\"/><line x1=\"200\" y1=\"150\" x2=\"200\" y2=\"46\" stroke=\"#757575\" stroke-width=\"1.4\" marker-end=\"url(#a8)\"/><line x1=\"222\" y1=\"150\" x2=\"222\" y2=\"110\" stroke=\"#2e7d4f\" stroke-width=\"1.8\" marker-end=\"url(#a8)\"/><text x=\"194\" y=\"82\" text-anchor=\"end\" font-size=\"12\" font-weight=\"bold\" fill=\"#757575\">A</text><text x=\"229\" y=\"140\" font-size=\"12\" font-weight=\"bold\" fill=\"#1b5e37\">B</text><text x=\"60\" y=\"262\" font-size=\"10.5\" fill=\"#555\">A：酵素がないときの活性化エネルギー</text><text x=\"60\" y=\"278\" font-size=\"10.5\" fill=\"#1b5e37\">B：酵素があるときの活性化エネルギー（小さい）</text><text x=\"62\" y=\"166\" font-size=\"10.5\">反応する物質</text><text x=\"318\" y=\"182\" font-size=\"10.5\">できた物質</text></svg><div class=\"cap\">図3　酵素と活性化エネルギー</div></div></div>\n\n<h3>3-3　基質特異性</h3>\n<p>酵素がはたらきかける物質を<b class=\"key\">基質</b>といいます。酵素には基質と結合する部分（<b class=\"key\">活性部位</b>）があり、<b>活性部位にぴったり合う形の基質としか結合しません</b>。そのため、1種類の酵素は決まった基質にしかはたらきません。この性質を<b class=\"key\">基質特異性</b>といいます。酵素と基質が結合したものを<b>酵素–基質複合体</b>といいます。</p>\n<div class=\"fig\"><svg viewBox=\"0 0 640 170\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11.5\"><defs><marker id=\"a9\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#333\"/></marker></defs><path d=\"M40 140 L40 100 Q40 90 50 90 L68 90 L68 108 L112 108 L112 90 L130 90 Q140 90 140 100 L140 140 Z\" fill=\"#a5d6a7\" stroke=\"#2e7d4f\" stroke-width=\"1.6\"/><text x=\"90\" y=\"130\" text-anchor=\"middle\" font-weight=\"bold\">酵素</text><text x=\"90\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\">くぼみ＝活性部位</text><rect x=\"70\" y=\"42\" width=\"40\" height=\"28\" rx=\"2\" fill=\"#90caf9\" stroke=\"#1565c0\" stroke-width=\"1.5\"/><text x=\"90\" y=\"34\" text-anchor=\"middle\" font-size=\"10.5\">基質</text><path d=\"M90 72 L90 84\" stroke=\"#555\" stroke-width=\"1.4\" marker-end=\"url(#a9)\"/><circle cx=\"150\" cy=\"56\" r=\"14\" fill=\"#ffcc80\" stroke=\"#e65100\" stroke-width=\"1.5\"/><text x=\"172\" y=\"50\" font-size=\"10.5\">形が合わない物質は</text><text x=\"172\" y=\"64\" font-size=\"10.5\">結合できない</text><path d=\"M270 105 L320 105\" stroke=\"#555\" stroke-width=\"2\" marker-end=\"url(#a9)\"/><path d=\"M340 140 L340 100 Q340 90 350 90 L368 90 L368 108 L412 108 L412 90 L430 90 Q440 90 440 100 L440 140 Z\" fill=\"#a5d6a7\" stroke=\"#2e7d4f\" stroke-width=\"1.6\"/><rect x=\"370\" y=\"82\" width=\"40\" height=\"26\" rx=\"2\" fill=\"#90caf9\" stroke=\"#1565c0\" stroke-width=\"1.5\"/><text x=\"390\" y=\"160\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"11\">酵素–基質複合体</text><path d=\"M450 105 L500 105\" stroke=\"#555\" stroke-width=\"2\" marker-end=\"url(#a9)\"/><path d=\"M520 140 L520 100 Q520 90 530 90 L548 90 L548 108 L592 108 L592 90 L610 90 Q620 90 620 100 L620 140 Z\" fill=\"#a5d6a7\" stroke=\"#2e7d4f\" stroke-width=\"1.6\"/><rect x=\"528\" y=\"40\" width=\"20\" height=\"26\" rx=\"2\" fill=\"#90caf9\" stroke=\"#1565c0\" stroke-width=\"1.5\" transform=\"rotate(-15 538 53)\"/><rect x=\"592\" y=\"40\" width=\"20\" height=\"26\" rx=\"2\" fill=\"#90caf9\" stroke=\"#1565c0\" stroke-width=\"1.5\" transform=\"rotate(15 602 53)\"/><text x=\"570\" y=\"30\" text-anchor=\"middle\" font-size=\"10.5\">生成物</text><text x=\"570\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\">酵素はそのまま→また使える</text></svg></div>\n<div class=\"cap\">図4　基質特異性（鍵と鍵穴の関係）</div>\n<table class=\"t\">\n<tr><th style=\"width:18%\">酵素</th><th style=\"width:34%\">基質 → 生成物</th><th style=\"width:26%\">はたらく場所</th><th>最適pH</th></tr>\n<tr><td>アミラーゼ</td><td>デンプン → マルトース</td><td>だ液・すい液</td><td>約7（中性）</td></tr>\n<tr><td>ペプシン</td><td>タンパク質 → ペプチド</td><td>胃液</td><td>約2（強い酸性）</td></tr>\n<tr><td>トリプシン</td><td>タンパク質 → ペプチド</td><td>すい液（小腸）</td><td>約8（弱アルカリ性）</td></tr>\n<tr><td>リパーゼ</td><td>脂肪 → 脂肪酸とモノグリセリド</td><td>すい液</td><td>約8</td></tr>\n<tr><td>カタラーゼ</td><td>過酸化水素 → 水と酸素</td><td>肝臓など多くの細胞</td><td>約7</td></tr>\n</table>\n<p class=\"small\">DNAを複製するDNAポリメラーゼ、転写を行うRNAポリメラーゼ（第2回）も酵素です。酵素の名前は「〜アーゼ」で終わるものが多いです。</p>\n\n<h3>3-4　温度とpHの影響</h3>\n<div class=\"two\">\n<div><svg viewBox=\"0 0 320 210\" width=\"320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"170.0\" x2=\"250\" y2=\"170.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"143.7\" x2=\"250\" y2=\"143.7\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"117.3\" x2=\"250\" y2=\"117.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"91.0\" x2=\"250\" y2=\"91.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"64.7\" x2=\"250\" y2=\"64.7\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"38.3\" x2=\"250\" y2=\"38.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"250\" y2=\"12.0\" stroke=\"#e3e3e3\"/><te iv>\n<div><svg viewBox=\"0 0 320 210\" width=\"320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"170.0\" x2=\"250\" y2=\"170.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"104.2\" x2=\"250\" y2=\"104.2\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"38.3\" x2=\"250\" y2=\"38.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"250\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"185\" text-anchor=\"middle\">0</text><text x=\"80.0\" y=\"185\" text-anchor=\"middle\">2</text><text x=\"114.0\" y=\"185\" text-anchor=\"middle\">4</text><text x=\"148.0\" y=\"185\" text-anchor=\"middle\">6</text><text x=\"182.0\" y=\"185\" text-anchor=\"middle\">8</text><text x=\"216.0\" y=\"185\" text-anchor=\"middle\">10</text><text x=\"250.0\" y=\"185\" text-anchor=\"middle\">12</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"170\" x2=\"250\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"148.0\" y=\"204\" text-anchor=\"middle\">pH</text><text transform=\"translate(12,91.0) rotate(-90)\" text-anchor=\"middle\">反応速度</text><polyline points=\"46.0,157.7 50.2,148.5 54.5,135.2 58.8,117.8 63.0,97.1 67.2,75.6 71.5,56.4 75.8,43.1 80.0,38.3 84.2,43.1 88.5,56.4 92.8,75.6 97.0,97.1 101.2,117.8 105.5,135.2 109.8,148.5 114.0,157.7 118.2,163.4 122.5,166.7 126.8,168.5 131.0,169.4 135.2,169.7 139.5,169.9 143.8,170.0 148.0,170.0 152.2,170.0 156.5,170.0 160.8,170.0 165.0,170.0 169.2,170.0 173.5,170.0 177.8,170.0 182.0,170.0 186.2,170.0 190.5,170.0 194.8,170.0 199.0,170.0 203.2,170.0 207.5,170.0 211.8,170.0 216.0,170.0 220.2,170.0 224.5,170.0 228.8,170.0 233.0,170.0 237.2,170.0 241.5,170.0 245.8,170.0 250.0,170.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"49.4\" y=\"25.2\" font-weight=\"bold\" fill=\"#c62828\">ペプシン</text><polyline points=\"46.0,170.0 50.2,170.0 54.5,170.0 58.8,170.0 63.0,170.0 67.2,170.0 71.5,170.0 75.8,170.0 80.0,170.0 84.2,170.0 88.5,170.0 92.8,170.0 97.0,170.0 101.2,170.0 105.5,169.9 109.8,169.7 114.0,169.4 118.2,168.5 122.5,166.7 126.8,163.4 131.0,157.7 135.2,148.5 139.5,135.2 143.8,117.8 148.0,97.1 152.2,75.6 156.5,56.4 160.8,43.1 165.0,38.3 169.2,43.1 173.5,56.4 177.8,75.6 182.0,97.1 186.2,117.8 190.5,135.2 194.8,148.5 199.0,157.7 203.2,163.4 207.5,166.7 211.8,168.5 216.0,169.4 220.2,169.7 224.5,169.9 228.8,170.0 233.0,170.0 237.2,170.0 241.5,170.0 245.8,170.0 250.0,170.0\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"114.0\" y=\"22.5\" font-weight=\"bold\" fill=\"#1565c0\">アミラーゼ</text><polyline points=\"46.0,170.0 50.2,170.0 54.5,170.0 58.8,170.0 63.0,170.0 67.2,170.0 71.5,170.0 75.8,170.0 80.0,170.0 84.2,170.0 88.5,170.0 92.8,170.0 97.0,170.0 101.2,170.0 105.5,170.0 109.8,170.0 114.0,170.0 118.2,170.0 122.5,170.0 126.8,169.9 131.0,169.7 135.2,169.2 139.5,168.2 143.8,166.2 148.0,162.5 152.2,156.1 156.5,146.2 160.8,132.1 165.0,113.8 169.2,92.8 173.5,71.5 177.8,53.2 182.0,41.4 186.2,38.5 190.5,45.2 194.8,59.9 199.0,79.8 203.2,101.4 207.5,121.6 211.8,138.2 216.0,150.6 220.2,159.0 224.5,164.2 228.8,167.2 233.0,168.7 237.2,169.5 241.5,169.8 245.8,169.9 250.0,170.0\" fill=\"none\" stroke=\"#e65100\" stroke-width=\"2.2\" stroke-dasharray=\"2,3\" stroke-linejoin=\"round\"/><text x=\"202.4\" y=\"35.7\" font-weight=\"bold\" fill=\"#e65100\">トリプシン</text></svg><div class=\"cap\">図6　pHと反応速度</div></div>\n</div>\n<p>酵素がもっともよくはたらく温度を<b class=\"key\">最適温度</b>といい、ヒトの酵素では35〜40℃くらいのものが多いです。温度が上がると反応は速くなりますが、高温になると酵素の主成分であるタンパク質の<b>立体構造が変化</b>してしまい（<b class=\"key\">変性</b>）、はたらきを失います（<b class=\"key\">失活</b>）。<span class=\"em\">変性した酵素は、温度を下げてももとに戻りません</span>。一方、無機触媒（酸化マンガン(Ⅳ)など）はタンパク質ではないので、温度が高いほど反応が速くなります。</p>\n<p>同じように、酵素がもっともよくはたらくpHを<b class=\"key\">最適pH</b>といいます。胃ではたらくペプシンは強い酸性、小腸ではたらくトリプシンは弱アルカリ性でよくはたらくように、<b>はたらく場所の環境に合った</b>最適pHをもっています。</p>\n<div class=\"box exam\"><div class=\"bt\">共通テストではこう出る：考察問題第3問とのつながり</div>\n生徒さんに渡した考察問題の第3問（カタラーゼと温度）がこの内容です。ポイントは、<b>高温に保った酵素は30℃に戻してもはたらかない（変性はもとに戻らない）</b>が、<b>低温に保った酵素は温度を戻すとはたらく</b>こと。低温では反応がおそくなるだけで、酵素はこわれていません。</div>\n\n<h3>3-5　基質濃度と反応速度</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>酵素の量を一定にして基質の濃度を上げていくと、はじめは反応速度が上がりますが、やがて<b>それ以上上がらなくなります</b>。これは、<span class=\"em\">すべての酵素が基質と結合してはたらいている状態（飽和）</span>になり、基質がいくら多くても、酵素が空くのを待つしかないからです。このとき<b>酵素の量を2倍にすると、最大の反応速度も2倍</b>になります。</p>\n</div><div class=\"g\"><svg viewBox=\"0 0 320 210\" width=\"320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"170.0\" x2=\"250\" y2=\"170.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"134.1\" x2=\"250\" y2=\"134.1\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"98.2\" x2=\"250\" y2=\"98.2\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"62.3\" x2=\"250\" y2=\"62.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"26.4\" x2=\"250\" y2=\"26.4\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"250\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"185\" text-anchor=\"middle\">0</text><text x=\"97.0\" y=\"185\" text-anchor=\"middle\">5</text><text x=\"148.0\" y=\"185\" text-anchor=\"middle\">10</text><text x=\"199.0\" y=\"185\" text-anchor=\"middle\">15</text><text x=\"250.0\" y=\"185\" text-anchor=\"middle\">20</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"170\" x2=\"250\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"148.0\" y=\"204\" text-anchor=\"middle\">基質の濃度</text><text transform=\"translate(12,91.0) rotate(-90)\" text-anchor=\"middle\">反応速度</text><polyline points=\"46.0,170.0 51.1,146.1 56.2,129.0 61.3,116.1 66.4,106.2 71.5,98.2 76.6,91.7 81.7,86.2 86.8,81.6 91.9,77.7 97.0,74.2 102.1,71.2 107.2,68.6 112.3,66.3 117.4,64.2 122.5,62.3 127.6,60.6 132.7,59.0 137.8,57.6 142.9,56.3 148.0,55.1 153.1,54.0 158.2,53.0 163.3,52.0 168.4,51.1 173.5,50.3 178.6,49.5 183.7,48.8 188.8,48.1 193.9,47.5 199.0,46.9 204.1,46.3 209.2,45.8 214.3,45.3 219.4,44.8 224.5,44.3 229.6,43.9 234.7,43.5 239.8,43.1 244.9,42.7 250.0,42.3\" fill=\"none\" stroke=\"#1565c0\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"127.6\" y=\"32.1\" font-weight=\"bold\" fill=\"#1565c0\">酵素の量 2倍</text><polyline points=\"46.0,170.0 51.1,158.0 56.2,149.5 61.3,143.1 66.4,138.1 71.5,134.1 76.6,130.8 81.7,128.1 86.8,125.8 91.9,123.8 97.0,122.1 102.1,120.6 107.2,119.3 112.3,118.1 117.4,117.1 122.5,116.1 127.6,115.3 132.7,114.5 137.8,113.8 142.9,113.1 148.0,112.5 153.1,112.0 158.2,111.5 163.3,111.0 168.4,110.6 173.5,110.2 178.6,109.8 183.7,109.4 188.8,109.1 193.9,108.7 199.0,108.4 204.1,108.2 209.2,107.9 214.3,107.6 219.4,107.4 224.5,107.2 229.6,106.9 234.7,106.7 239.8,106.5 244.9,106.3 250.0,106.2\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"127.6\" y=\"125.5\" font-weight=\"bold\" fill=\"#2e7d4f\">もとの酵素の量</text></svg><div class=\"cap\">図7　基質濃度と反応速度</div></div></div>\n<div class=\"box teach\"><div class=\"bt\">生徒に説明するときは</div>\n酵素を<b>スーパーのレジ</b>、基質を<b>お客さん</b>にたとえます。お客さんが少ないうちは、来れば来るほど会計の数（反応速度）が増える。でも全部のレジがふさがると、お客さんがいくら増えても会計の速さは変わらない。速くしたければレジ（酵素）を増やすしかない、と説明するとグラフの形が納得できます。</div>\n\n<h3>3-6　補酵素</h3>\n<p>酵素の中には、タンパク質の部分だけでははたらけず、<b class=\"key\">補酵素</b>という低分子の物質が結合してはじめてはたらくものがあります。補酵素はタンパク質ではないので<b>熱に強く</b>、ビタミンからつくられるものも多いです。次回の呼吸で出てくる<b>NAD⁺</b>も補酵素の1つです。</p>\n<p>補酵素を確かめる実験として、<b>透析</b>があります。酵母のしぼり汁をセロハンの袋に入れて水に浸すと、小さな補酵素だけがセロハンを通りぬけて外に出ます。</p>\n<table class=\"t\">\n<tr><th style=\"width:56%\">実験に使った液</th><th class=\"c\">反応</th><th>理由</th></tr>\n<tr><td>袋の中の液（酵素のタンパク質部分）だけ</td><td class=\"c\">×</td><td>補酵素がない</td></tr>\n<tr><td>袋の外の液（補酵素）だけ</td><td class=\"c\">×</td><td>酵素がない</td></tr>\n<tr><td>中の液 ＋ 外の液</td><td class=\"c\">○</td><td>両方そろった</td></tr>\n<tr><td>煮沸した中の液 ＋ 外の液</td><td class=\"c\">×</td><td>酵素が変性した</td></tr>\n<tr><td>中の液 ＋ 煮沸した外の液</td><td class=\"c\">○</td><td>補酵素は熱に強い</td></tr>\n</table>\n\n<h3>3-7　酵素のはたらきの調節</h3>\n<div class=\"side\"><div class=\"txt\">\n<p>酵素のはたらきは、ほかの物質によっておさえられることがあります。</p>\n<ul>\n<li><b class=\"key\">競争的阻害</b>：基質によく似た物質が<b>活性部位</b>を取り合う。基質の濃度を高くすると基質が勝つので、阻害の影響は<b>小さくなる</b>。</li>\n<li><b class=\"key\">非競争的阻害</b>：阻害物質が<b>活性部位以外の場所</b>に結合して、酵素のはたらきをおさえる。基質の濃度を高くしても、最大の反応速度は<b>低いまま</b>。</li>\n</ul>\n</div><div class=\"g\"><svg viewBox=\"0 0 320 210\" width=\"320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK JP\" font-size=\"11\"><line x1=\"46\" y1=\"170.0\" x2=\"250\" y2=\"170.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"143.7\" x2=\"250\" y2=\"143.7\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"117.3\" x2=\"250\" y2=\"117.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"91.0\" x2=\"250\" y2=\"91.0\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"64.7\" x2=\"250\" y2=\"64.7\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"38.3\" x2=\"250\" y2=\"38.3\" stroke=\"#e3e3e3\"/><line x1=\"46\" y1=\"12.0\" x2=\"250\" y2=\"12.0\" stroke=\"#e3e3e3\"/><text x=\"46.0\" y=\"185\" text-anchor=\"middle\">0</text><text x=\"97.0\" y=\"185\" text-anchor=\"middle\">5</text><text x=\"148.0\" y=\"185\" text-anchor=\"middle\">10</text><text x=\"199.0\" y=\"185\" text-anchor=\"middle\">15</text><text x=\"250.0\" y=\"185\" text-anchor=\"middle\">20</text><line x1=\"46\" y1=\"12\" x2=\"46\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"46\" y1=\"170\" x2=\"250\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"148.0\" y=\"204\" text-anchor=\"middle\">基質の濃度</text><text transform=\"translate(12,91.0) rotate(-90)\" text-anchor=\"middle\">反応速度</text><polyline points=\"46.0,170.0 51.1,148.1 56.2,132.4 61.3,120.6 66.4,111.5 71.5,104.2 76.6,98.2 81.7,93.2 86.8,89.0 91.9,85.4 97.0,82.2 102.1,79.5 107.2,77.1 112.3,74.9 117.4,73.0 122.5,71.2 127.6,69.7 132.7,68.3 137.8,67.0 142.9,65.8 148.0,64.7 153.1,63.7 158.2,62.7 163.3,61.8 168.4,61.0 173.5,60.3 178.6,59.6 183.7,58.9 188.8,58.3 193.9,57.7 199.0,57.1 204.1,56.6 209.2,56.1 214.3,55.7 219.4,55.2 224.5,54.8 229.6,54.4 234.7,54.0 239.8,53.6 244.9,53.3 250.0,53.0\" fill=\"none\" stroke=\"#2e7d4f\" stroke-width=\"2.2\" stroke-dasharray=\"\" stroke-linejoin=\"round\"/><text x=\"80.7\" y=\"30.4\" font-weight=\"bold\" fill=\"#2e7d4f\">阻害物質なし</text><polyline points=\"46.0,170.0 51.1,161.8 56.2,154.5 61.3,148.1 66.4,142.3 71.5,137.1 76.6,132.4 81.7,128.1 86.8,124.2 91.9,120.6 97.0,117.3 102.1,114.3 107.2,111.5 112.3,108.9 117.4,106.4 122.5,104.2 127.6,102.0 132.7,100.1 137.8,98.2 142.9,96.4 148.0,94.8 153.1,93.2 158.2,91.7 163.3,90.3 168.4,89.0 173.5,87.7 178.6,86.5 183.7,85.4 188.8,84.3 193.9,83.2 199.0,82.2 204.1,81.3 209.2,80.4 214.3,79.5 219.4,78.6 224.5,77.8 229.6,77.1 234.7,76.3 239.8,75.6 244.9,74.9 250.0,74.2\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.2\" stroke-dasharray=\"6,3\" stroke-linejoin=\"round\"/><text x=\"173.5\" y=\"96.3\" font-weight=\"bold\" fill=\"#c62828\">競争的阻害</text><polyline points=\"46.0,170.0 51.1,159.0 56.2,151.2 61.3,145.3 66.4,140.7 71.5,137.1 76.6,134.1 81.7,131.6 86.8,129.5 91.9,127.7 97.0,126.1 102.1,124.7 107.2,123.5 112.3,122.5 117.4,121.5 122.5,120.6 127.6,119.8 132.7,119.1 137.8,118.5 142.9,117.9 148.0,117.3 153.1,116.8 158.2,116.4 163.3,115.9 168.4,115.5 173.5,115.1 178.6,114.8 183.7,114.5 188.8,114.1 193.9,113.8 199.0,113.6 204.1,113.3 209.2,113.1 214.3,112.8 219.4,112.6 224.5,112.4 229.6,112.2 234.7,112.0 239.8,111.8 244.9,111.6 250.0,111.5\" fill=\"none\" stroke=\"#6a1b9a\" stroke-width=\"2.2\" stroke-dasharray=\"2,3\" stroke-linejoin=\"round\"/><text x=\"173.5\" y=\"127.9\" font-weight=\"bold\" fill=\"#6a1b9a\">非競争的阻害</text></svg><div class=\"cap\">図8　阻害物質と反応速度</div></div></div>\n<ul>\n<li><b class=\"key\">フィードバック調節</b>：何段階もの反応の<b>最終産物</b>が、はじめのほうの酵素のはたらきをおさえる。最終産物が十分にあると、それ以上つくらないように自動で調節される。活性部位以外の場所に物質が結合してはたらきが変わる酵素を<b>アロステリック酵素</b>といい、フィードバック調節によく見られる。</li>\n</ul>\n<p class=\"small\">前回のトリプトファンオペロンは「遺伝子の転写」で、フィードバック調節は「できた酵素のはたらき」で、どちらも「十分にあるときはつくるのをやめる」というしくみです。</p>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">この回のまとめ</h2>\n<p>読み終わったら、それぞれ何も見ずに説明できるか確かめて、できたら□にチェックを入れましょう。</p>\n<ul class=\"check\">\n<li>代謝＝体の中の化学反応。同化（合成・エネルギー吸収、例：光合成）と異化（分解・エネルギー放出、例：呼吸）</li>\n<li>ATP＝アデニン＋リボース（＝アデノシン）＋リン酸3つ。リン酸どうしは高エネルギーリン酸結合</li>\n<li>ATP → ADP ＋ リン酸 でエネルギーを放出。ADPは呼吸などで再びATPになる（エネルギーの通貨）</li>\n<li>酵素＝生体触媒。主成分はタンパク質。反応の前後で変化せず、くり返し使える</li>\n<li>酵素は活性化エネルギーを小さくする</li>\n<li>基質特異性：活性部位に合う基質としか結合しない（酵素–基質複合体）</li>\n<li>最適温度・最適pHがある。高温で変性・失活すると、冷やしてももとに戻らない</li>\n<li>基質濃度を上げると反応速度は頭打ち（酵素が飽和）。酵素量2倍で最大速度も2倍</li>\n<li>補酵素は低分子で熱に強い。透析で酵素本体と分けられる</li>\n<li>競争的阻害は基質濃度を上げると影響が小さくなる。非競争的阻害は最大速度が下がる</li>\n<li>フィードバック調節：最終産物がはじめの酵素をおさえる</li>\n</ul>\n\n<div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div><div class='wline'></div>\n\n<div class=\"pb\"></div>\n<h2 style=\"margin-top:0\">確認問題</h2>\n<style>.qtight > li { margin-bottom: 1.8mm; } .qtight .wline { height: 7mm; }</style>\n<ol class=\"qlist qtight\" style=\"line-height:1.55\">\n<li>次の(a)〜(c)は、同化と異化のどちらか。<br>(a) 光合成 <span class=\"blank\" style=\"min-width:18mm\"></span>　(b) 呼吸 <span class=\"blank\" style=\"min-width:18mm\"></span>　(c) アミノ酸からタンパク質をつくる <span class=\"blank\" style=\"min-width:18mm\"></span></li>\n<li>ATPについて答えよ。<br>(1) ATPを構成する塩基・糖の名前と、リン酸の数を答えよ。<br>　塩基 <span class=\"blank\" style=\"min-width:26mm\"></span>　糖 <span class=\"blank\" style=\"min-width:26mm\"></span>　リン酸 <span class=\"blank\" style=\"min-width:12mm\"></span>個<br>(2) ATPからリン酸が1つ外れてできる物質を何というか。 <span class=\"blank\" style=\"min-width:20mm\"></span></li>\n<li>ATPのエネルギーが使われる生命活動の例を2つ答えよ。<br><span class=\"blank\" style=\"min-width:40mm\"></span>・<span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li>次の文が正しければ○、誤っていれば×をつけよ。<br>\n　(a) 酵素は、反応の前後で変化しない。　（　　）<br>\n　(b) 1種類の酵素は、どんな物質にもはたらく。　（　　）<br>\n　(c) 酵素の反応速度は、温度が高いほど大きくなり続ける。　（　　）<br>\n　(d) 酵素の主成分はタンパク質である。　（　　）</li>\n<li>酵素は、化学反応が起こるのに必要な何を小さくすることで、反応を速く進めるか。 <span class=\"blank\" style=\"min-width:40mm\"></span></li>\n<li>次の酵素の最適pHに最も近いものを、ア〜ウから選べ。<br>(1) ペプシン（　）　(2) だ液のアミラーゼ（　）　(3) トリプシン（　）<br>　ア　約2　　イ　約7　　ウ　約8</li>\n<li>酵素の量を一定にして基質の濃度を上げていくと、反応速度はやがて一定になる。その理由を説明せよ。<div class=\"wline\"></div></li>\n<li>7.の実験で、酵素の量を2倍にすると、反応速度が一定になったときの値はもとの何倍になるか。 <span class=\"blank\" style=\"min-width:16mm\"></span>倍</li>\n<li>酵母のしぼり汁を透析して、袋の中の液Aと袋の外の液Bに分けた。次の組み合わせで反応が起こるものには○、起こらないものには×をつけよ。<br>\n　(a) A だけ（　）　(b) A＋B（　）　(c) 煮沸したA＋B（　）　(d) A＋煮沸したB（　）</li>\n<li><b>説明の練習</b>　60℃に保ってはたらかなくなった酵素を、30℃に戻してもはたらかない理由を、生徒にわかるように説明せよ。<div class=\"wline\"></div><div class=\"wline\"></div></li>\n</ol>\n\n<div class=\"pb\"></div>\n<details class=\"answers\"><summary>確認問題の解答と解説を表示する</summary>\n<div class=\"ans\">\n<p><b>1.　(a) 同化　(b) 異化　(c) 同化</b>　簡単な物質から複雑な物質をつくるのが同化。(c) もアミノ酸（簡単）からタンパク質（複雑）をつくるので同化。</p>\n<p><b>2.　(1) 塩基：アデニン　糖：リボース　リン酸：3個　(2) ADP（アデノシン二リン酸）</b>　糖はデオキシリボースではなくリボース。</p>\n<p><b>3.　解答例</b>　筋肉の収縮・物質の合成・物質の輸送・発光（ホタル）・発熱 などから2つ。</p>\n<p><b>4.　(a) ○　(b) ×　(c) ×　(d) ○</b>　(b) 基質特異性があり、決まった基質にしかはたらかない。(c) 高温では変性して失活するので、最適温度をこえると速度は下がる。</p>\n<p><b>5.　活性化エネルギー</b></p>\n<p><b>6.　(1) ア　(2) イ　(3) ウ</b>　胃の中は強い酸性、小腸は弱アルカリ性。はたらく場所に合っている。</p>\n<p><b>7.　解答例</b>　すべての酵素が基質と結合してはたらいている状態（飽和）になり、基質をそれ以上増やしても、反応する速さは増えないから。</p>\n<p><b>8.　2倍</b>　最大の反応速度は、はたらく酵素の数で決まる。</p>\n<p><b>9.　(a) ×　(b) ○　(c) ×　(d) ○</b>　Aは酵素のタンパク質部分で熱に弱い。Bは補酵素で熱に強い。両方がそろうと反応する。</p>\n<p><b>10.　解答例</b>　酵素の主成分はタンパク質で、決まった立体構造（形）をしているからこそ基質と結合できます。60℃のような高温では、その立体構造がこわれてしまい（変性）、温度を下げても形はもとに戻らないので、はたらかないままです。</p>\n</div>\n<div class=\"box teach\"><div class=\"bt\">次回（第5回 呼吸と光合成）に向けて</div>\n第5回では、ATPをつくる2大イベントである<b>呼吸</b>と<b>光合成</b>を学びます。どちらも、たくさんの酵素が順番にはたらく反応です。この回の<b>ATPとADPの循環（図2）</b>と<b>補酵素</b>が土台になります。考察問題の第4問（光の強さと光合成）は第5回の内容です。</div>\n</details>", "heads": ["0. ここから「エネルギーの話」", "1. 代謝：体の中の化学反応", "2. ATP：エネルギーの通貨", "3. 酵素：反応を進める生体触媒", "この回のまとめ", "確認問題"]}, "5": {"html": "\n<style>\n.flow { display: flex; align-items: center; justify-c
