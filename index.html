<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a2e2e">
<title>日本史 文化史 暗記帳｜共通テスト対策</title>
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2622; --sub:#7a6f66; --line:#e4dccf;
  --accent:#7a2e2e; --accent2:#b0761a; --ok:#2e7d4f; --ng:#c0392b; --chip:#efe7da;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 120px}
header.top{background:var(--accent);color:#fff;padding:14px 16px calc(14px);}
header.top .in{max-width:680px;margin:0 auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;letter-spacing:.04em}
header.top span{font-size:12px;opacity:.85}
h2.sec{font-size:14px;color:var(--sub);margin:20px 0 8px;letter-spacing:.05em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.mode b{display:block;font-size:15px}
.mode small{color:var(--sub);font-size:12px;line-height:1.4;display:block}
.mode.on{border-color:var(--accent);background:#fbf1ef}
.mode.on b{color:var(--accent)}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ghead b{font-size:14px}
.ghead button{font-size:12px;color:var(--accent);padding:4px 8px;border-radius:8px;background:#f6ebe8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:6px 11px;font-size:13.5px;line-height:1.3}
.chip .n{font-size:11px;color:var(--sub);margin-left:3px}
.chip.on{background:var(--accent);color:#fff}
.chip.on .n{color:#f3d9d4}
.allrow{display:flex;gap:8px;margin-bottom:8px}
.allrow button{font-size:13px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.opts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.opt:last-child{border-bottom:none}
.opt label{font-size:14px}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:bold;color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(247,243,236,.96);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(6px);z-index:5}
.bar .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .info{font-size:12px;color:var(--sub);flex:1;line-height:1.35}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 20px;font-weight:bold;font-size:16px}
.btn:disabled{opacity:.4}
.btn.sub{background:var(--card);color:var(--accent);border:2px solid var(--accent)}
.btn.wide{width:100%}
.missinfo{font-size:12px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.missinfo button{color:var(--ng);font-size:12px;text-decoration:underline}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtop .quit{font-size:13px;color:var(--sub);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent2);transition:width .2s}
.cnt{font-size:13px;color:var(--sub);min-width:58px;text-align:right}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:0 2px 6px rgba(80,50,20,.06)}
.badge{display:inline-block;font-size:12px;background:var(--chip);color:var(--accent);border-radius:6px;padding:2px 8px;margin-bottom:8px;font-weight:bold}
.qtext{font-size:18px;font-weight:bold;line-height:1.6;margin:0 0 4px}
.reveal{margin-top:14px}
.ansbox{background:#fff7e3;border:2px dashed var(--accent2);border-radius:12px;padding:12px;text-align:center;font-size:20px;font-weight:bold;color:var(--accent)}
.ansbox small{display:block;font-size:12px;color:var(--sub);font-weight:normal}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:16px;line-height:1.4}
.choice.ok{border-color:var(--ok);background:#e9f6ee;color:var(--ok);font-weight:bold}
.choice.ng{border-color:var(--ng);background:#fdecea;color:var(--ng)}
.choice:disabled{cursor:default}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.judge button{padding:14px;border-radius:12px;font-weight:bold;font-size:16px}
.judge .o{background:#e9f6ee;color:var(--ok);border:2px solid var(--ok)}
.judge .x{background:#fdecea;color:var(--ng);border:2px solid var(--ng)}
.inrow{display:flex;gap:8px;margin-top:14px}
.inrow input{flex:1;min-width:0;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:inherit}
.inrow input:focus{outline:none;border-color:var(--accent2)}
.verdict{font-size:22px;font-weight:bold;text-align:center;margin:12px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.yours{font-size:13px;color:var(--sub);text-align:center}
.next{margin-top:14px}
.small-link{display:block;margin:10px auto 0;font-size:13px;color:var(--sub);text-decoration:underline}
/* result */
.score{text-align:center;padding:20px 0 10px}
.score .big{font-size:44px;font-weight:bold;color:var(--accent)}
.score .pct{color:var(--sub)}
.wrong{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wrong .q{font-size:14px}
.wrong .a{font-size:15px;font-weight:bold;color:var(--accent);margin-top:2px}
.wrong .e{font-size:11px;color:var(--sub)}
.rbtns{display:grid;gap:8px;margin:14px 0}
/* list */
.lhead{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;display:flex;gap:8px;align-items:center}
.lera{margin:18px 0 6px;font-size:16px;color:#fff;background:var(--accent);border-radius:10px;padding:6px 12px}
.lera small{font-size:11px;opacity:.85;margin-left:6px}
.litem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;width:100%;text-align:left;display:block}
.litem .q{font-size:14px}
.litem .a{margin-top:4px;font-weight:bold;color:var(--accent);font-size:15px;visibility:hidden}
.litem .a::before{content:"→ "}
.litem.open .a{visibility:visible}
.litem .tap{font-size:11px;color:var(--sub);float:right}
.litem.open .tap{display:none}
.litem.miss{border-left:4px solid var(--ng)}
footer{font-size:11px;color:var(--sub);text-align:center;margin-top:30px}
.linkcard{display:block;text-decoration:none;color:inherit}
.linkcard b::after{content:" →";color:var(--accent)}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>日本史 文化史 暗記帳</h1><span>共通テスト対策 ／ 原始〜戦後</span></div></header>

<!-- ホーム -->
<main id="home" class="wrap">
  <h2 class="sec">やり方をえらぶ</h2>
  <div class="modes" id="modes"></div>

  <h2 class="sec">範囲をえらぶ</h2>
  <div class="allrow"><button id="allOn">すべて選ぶ</button><button id="allOff">すべて外す</button></div>
  <div id="groups"></div>

  <div id="optWrap">
    <h2 class="sec">設定</h2>
    <div class="opts">
      <div class="opt"><label>問題数</label><div class="seg" id="segCount"></div></div>
      <div class="opt"><label>出す順番</label><div class="seg" id="segOrder"></div></div>
      <div class="opt"><label>出す問題</label><div class="seg" id="segMiss"></div></div>
    </div>
    <div class="missinfo"><span id="missCount"></span><button id="resetMiss">苦手の記録を消す</button></div>
  </div>
  <h2 class="sec">ほかの暗記帳</h2>
  <a class="mode linkcard" href="seibutsu/"><b>高校生物 暗記帳</b><small>高校生物ゼロから講座（全12回）の講義ノート・問題演習（タップ／入力）</small></a>

  <footer>答えは教科書で一般的な説明に従っています。<br>苦手の記録はこの端末のブラウザにだけ保存されます。</footer>
</main>

<div class="bar" id="homeBar"><div class="in"><div class="info" id="selInfo"></div><button class="btn" id="startBtn">はじめる</button></div></div>

<!-- 問題 -->
<main id="quiz" class="wrap hidden">
  <div class="qtop"><button class="quit" id="quitBtn">やめる</button><div class="prog"><i id="progBar"></i></div><div class="cnt" id="cnt"></div></div>
  <div class="qcard" id="qcard"></div>
</main>

<!-- 結果 -->
<main id="result" class="wrap hidden"></main>

<!-- 一覧 -->
<main id="list" class="wrap hidden"></main>

<script src="data.js"></script>
<script>
// ---------- データ準備 ----------
const ERA_IDX = {}; ERAS.forEach((e,i)=>ERA_IDX[e.id]=i);
const QS = [];
{ const cnt={};
  RAW.trim().split("\n").forEach(line=>{
    const p=line.split("|"); if(p.length<4) return;
    const [era,tag,q,a]=p; cnt[era]=(cnt[era]||0)+1;
    QS.push({id:era+"-"+cnt[era], era, tag, q, alts:a.split("／"), ans:a});
  });
}
// 時代判別用（人物・作品・建築美術）——複数の文化にまたがる語は除く
const ERAQ = (()=>{
  const by={};
  QS.forEach(x=>{ if(!"pwb".includes(x.tag)) return; const k=x.alts[0]; (by[k]=by[k]||new Set()).add(x.era); });
  const out=[], seen=new Set();
  QS.forEach(x=>{ if(!"pwb".includes(x.tag)) return; const k=x.alts[0];
    if(by[k].size!==1||seen.has(k)) return; seen.add(k);
    const kind = x.tag==="p"?"人物":(x.tag==="w"?"作品・書物":"建築・美術・施設");
    out.push({id:"E:"+k, era:x.era, tag:"era", q:`「${k}」は、どの文化に入る？`, kind, alts:[ERAS[ERA_IDX[x.era]].name], ans:ERAS[ERA_IDX[x.era]].name});
  });
  return out;
})();

// ---------- 保存 ----------
const KEY="nihonshi-bunkashi-v1";
let store={miss:{}, sel:null, mode:"flash", count:20, order:"rand", onlyMiss:false};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) store=Object.assign(store,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

// ---------- ホーム ----------
const MODES=[
  {id:"flash", t:"一問一答", d:"タップで答えを見て、○×を自分でつける"},
  {id:"choice", t:"4択", d:"4つの中から選ぶ"},
  {id:"input", t:"入力", d:"答えを打ちこんで覚える"},
  {id:"era", t:"時代判別", d:"人物・作品が、どの文化か選ぶ（共テ型）"},
  {id:"list", t:"一覧で見る", d:"問題と答えを一覧で。タップで答え"},
];
let sel = new Set(store.sel || ERAS.map(e=>e.id));
const $=id=>document.getElementById(id);

function poolFor(mode){ return mode==="era" ? ERAQ : QS; }
function renderModes(){
  $("modes").innerHTML = MODES.map(m=>`<button class="mode ${store.mode===m.id?"on":""}" data-m="${m.id}"><b>${m.t}</b><small>${m.d}</small></button>`).join("");
  $("modes").querySelectorAll(".mode").forEach(b=>b.onclick=()=>{store.mode=b.dataset.m; save(); renderHome();});
}
function renderGroups(){
  const pool=poolFor(store.mode==="list"?"flash":store.mode);
  const groups=[...new Set(ERAS.map(e=>e.group))];
  $("groups").innerHTML = groups.map(g=>{
    const es=ERAS.filter(e=>e.group===g);
    return `<div class="group"><div class="ghead"><b>${g}</b><button data-g="${g}">まとめて切りかえ</button></div><div class="chips">`+
      es.map(e=>{const n=pool.filter(x=>x.era===e.id).length;
        return `<button class="chip ${sel.has(e.id)?"on":""}" data-e="${e.id}">${e.name}<span class="n">${n}</span></button>`}).join("")+`</div></div>`;
  }).join("");
  $("groups").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const id=c.dataset.e; sel.has(id)?sel.delete(id):sel.add(id); store.sel=[...sel]; save(); renderHome();});
  $("groups").querySelectorAll(".ghead button").forEach(b=>b.onclick=()=>{
    const ids=ERAS.filter(e=>e.group===b.dataset.g).map(e=>e.id);
    const allOn=ids.every(i=>sel.has(i)); ids.forEach(i=>allOn?sel.delete(i):sel.add(i)); store.sel=[...sel]; save(); renderHome();});
}
function seg(elId, items, key){
  $(elId).innerHTML = items.map(([v,t])=>`<button class="${store[key]===v?"on":""}" data-v="${v}">${t}</button>`).join("");
  $(elId).querySelectorAll("button").forEach(b=>b.onclick=()=>{
    let v=b.dataset.v; if(key==="count") v=+v; if(key==="onlyMiss") v=(v==="true");
    store[key]=v; save(); renderHome();});
}
function currentPool(){
  const base=poolFor(store.mode==="list"?"flash":store.mode).filter(x=>sel.has(x.era));
  return (store.onlyMiss && store.mode!=="list") ? base.filter(x=>store.miss[x.id]) : base;
}
function renderHome(){
  renderModes(); renderGroups();
  $("optWrap").classList.toggle("hidden", store.mode==="list");
  seg("segCount", [[10,"10"],[20,"20"],[50,"50"],[0,"全部"]], "count");
  seg("segOrder", [["rand","ランダム"],["seq","時代順"]], "order");
  seg("segMiss", [[false,"すべて"],[true,"苦手だけ"]], "onlyMiss");
  const nm=Object.keys(store.miss).length;
  $("missCount").textContent = `苦手（まちがえた問題）：${nm}問`;
  const n=currentPool().length;
  const m=MODES.find(x=>x.id===store.mode).t;
  if(store.mode==="list") $("selInfo").innerHTML=`${m}<br>${sel.size}文化・${n}問`;
  else { const k=store.count?Math.min(store.count,n):n; $("selInfo").innerHTML=`${m}<br>${sel.size}文化・${n}問から ${k}問`; }
  $("startBtn").disabled = n===0;
  $("startBtn").textContent = store.mode==="list"?"ひらく":"はじめる";
}
$("allOn").onclick=()=>{sel=new Set(ERAS.map(e=>e.id)); store.sel=[...sel]; save(); renderHome();};
$("allOff").onclick=()=>{sel=new Set(); store.sel=[]; save(); renderHome();};
$("resetMiss").onclick=()=>{ if(confirm("苦手の記録をすべて消しますか？")){store.miss={}; save(); renderHome();} };
$("startBtn").onclick=()=>{ if(store.mode==="list") openList(); else startQuiz(currentPool()); };

// ---------- 共通 ----------
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function show(id){ ["home","quiz","result","list"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); $("homeBar").classList.toggle("hidden",id!=="home"); window.scrollTo(0,0); }
const eraName=id=>ERAS[ERA_IDX[id]].name;
function norm(s){
  return s.normalize("NFKC").toLowerCase()
    .replace(/[\s『』「」〔〕（）()・･、。,.〜~]/g,"")
    .replace(/ヶ/g,"ケ").replace(/鴎/g,"鷗").replace(/屏/g,"屛").replace(/倶/g,"俱")
    .replace(/遥/g,"遙").replace(/竜/g,"龍").replace(/渓/g,"溪").replace(/澤/g,"沢").replace(/峯/g,"峰")
    .replace(/すゝ/g,"すす").replace(/年$/,"");
}

// ---------- クイズ ----------
let Q=[], qi=0, results=[], mode="flash";
function startQuiz(pool){
  mode=store.mode;
  let list = store.order==="seq" ? pool.slice().sort((a,b)=>ERA_IDX[a.era]-ERA_IDX[b.era]) : shuffle(pool);
  if(store.count && store.order==="rand") list=list.slice(0,store.count);
  if(store.count && store.order==="seq"){ // 時代順でも範囲全体から均等に
    const pick=new Set(shuffle(list.map((_,i)=>i)).slice(0,store.count)); list=list.filter((_,i)=>pick.has(i)); }
  Q=list; qi=0; results=[]; show("quiz"); renderQ();
}
function record(x, ok){
  results.push({x,ok});
  if(ok) delete store.miss[x.id]; else store.miss[x.id]=1;
  save();
}
function head(x){
  const label = mode==="era" ? x.kind : eraName(x.era);
  return `<span class="badge">${label}</span><p class="qtext">${esc(x.q)}</p>`;
}
function nextBtn(){ return `<button class="btn wide next" id="nextBtn">${qi+1<Q.length?"次へ":"結果を見る"}</button>`; }
function bindNext(){ const b=$("nextBtn"); b.onclick=()=>{qi++; qi<Q.length?renderQ():showResult();}; b.focus({preventScroll:true}); }
function renderQ(){
  const x=Q[qi];
  $("cnt").textContent=`${qi+1} / ${Q.length}`;
  $("progBar").style.width=(qi/Q.length*100)+"%";
  const c=$("qcard");
  if(mode==="flash"){
    c.innerHTML = head(x)+`<div class="reveal"><button class="btn wide sub" id="showA">答えを見る</button></div>`;
    $("showA").onclick=()=>{
      c.querySelector(".reveal").innerHTML=`<div class="ansbox">${esc(x.ans)}</div><div class="judge"><button class="o" id="jo">○ 覚えてた</button><button class="x" id="jx">× まだ</button></div>`;
      const go=ok=>{record(x,ok); qi++; qi<Q.length?renderQ():showResult();};
      $("jo").onclick=()=>go(true); $("jx").onclick=()=>go(false);
    };
  } else if(mode==="choice" || mode==="era"){
    const opts = mode==="era" ? eraChoices(x) : choicesFor(x);
    c.innerHTML = head(x)+`<div class="choices">`+opts.map(o=>`<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join("")+`</div><div id="after"></div>`;
    c.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      const ok = b.dataset.v===(mode==="era"?x.ans:x.alts[0]);
      c.querySelectorAll(".choice").forEach(bb=>{bb.disabled=true; if(bb.dataset.v===(mode==="era"?x.ans:x.alts[0])) bb.classList.add("ok");});
      if(!ok) b.classList.add("ng");
      record(x,ok);
      let extra = (mode==="choice" && x.alts.length>1) ? `<div class="yours">別解：${esc(x.alts.slice(1).join("、"))}</div>` : "";
      if(mode==="era"){ const e=ERAS[ERA_IDX[x.era]]; extra=`<div class="yours">${esc(e.name)}（${esc(e.period)}）</div>`; }
      $("after").innerHTML = `<div class="verdict ${ok?"ok":"ng"}">${ok?"○ 正解":"× ざんねん"}</div>`+extra+nextBtn();
      bindNext();
    });
  } else if(mode==="input"){
    c.innerHTML = head(x)+`<form class="inrow" id="inForm" autocomplete="off"><input id="inBox" placeholder="答えを入力" enterkeyhint="done"><button class="btn" type="submit">答え合わせ</button></form><button class="small-link" id="giveUp">わからない（答えを見る）</button><div id="after"></div>`;
    const box=$("inBox"); setTimeout(()=>box.focus(),50);
    const finish=(val,given)=>{
      const ok = !given && x.alts.some(a=>norm(a)===norm(val));
      $("inForm").querySelectorAll("input,button").forEach(e=>e.disabled=true); $("giveUp").classList.add("hidden");
      record(x,ok);
      $("after").innerHTML = `<div class="verdict ${ok?"ok":"ng"}">${ok?"○ 正解":"× ざんねん"}</div>`+
        `<div class="ansbox"><small>答え</small>${esc(x.ans)}</div>`+
        (!ok && val ? `<div class="yours">あなたの答え：${esc(val)}</div><button class="small-link" id="fix">漢字ミスなど、正解にしてよい → ○にする</button>`:"")+nextBtn();
      if($("fix")) $("fix").onclick=()=>{ results[results.length-1].ok=true; delete store.miss[x.id]; save();
        $("after").querySelector(".verdict").className="verdict ok"; $("after").querySelector(".verdict").textContent="○ 正解（自分で判定）"; $("fix").remove(); };
      bindNext();
    };
    $("inForm").onsubmit=e=>{e.preventDefault(); if(box.value.trim()==="") return; finish(box.value,false);};
    $("giveUp").onclick=()=>finish("",true);
  }
}
function choicesFor(x){
  const correct=x.alts[0], nc=norm(correct), myI=ERA_IDX[x.era];
  const cand=QS.filter(y=>y.tag===x.tag && norm(y.alts[0])!==nc && !x.alts.some(a=>norm(a)===norm(y.alts[0])));
  const near=shuffle(cand.filter(y=>Math.abs(ERA_IDX[y.era]-myI)<=3));
  const far=shuffle(cand.filter(y=>Math.abs(ERA_IDX[y.era]-myI)>3));
  const picked=[]; const seen=new Set([nc]);
  for(const y of near.concat(far)){ const k=norm(y.alts[0]); if(seen.has(k)) continue; seen.add(k); picked.push(y.alts[0]); if(picked.length===3) break; }
  return shuffle([correct,...picked]);
}
function eraChoices(x){
  const i=ERA_IDX[x.era];
  const near=shuffle(ERAS.map((e,j)=>j).filter(j=>j!==i && Math.abs(j-i)<=4));
  const picks=near.slice(0,3);
  return shuffle([i,...picks]).sort((a,b)=>a-b).map(j=>ERAS[j].name);
}
$("quitBtn").onclick=()=>{ if(results.length===0 || confirm("ここでやめて結果を見ますか？")) results.length? showResult() : (show("home"),renderHome()); };

function showResult(){
  const n=results.length, ok=results.filter(r=>r.ok).length;
  const wrong=results.filter(r=>!r.ok);
  const r=$("result");
  r.innerHTML = `<div class="score"><div class="big">${ok} / ${n}</div><div class="pct">正答率 ${n?Math.round(ok/n*100):0}%</div></div>
    <div class="rbtns">${wrong.length?`<button class="btn wide" id="again">まちがえた ${wrong.length}問だけ もう一度</button>`:""}
    <button class="btn wide sub" id="same">同じ範囲で もう一度</button>
    <button class="btn wide sub" id="toHome">トップへもどる</button></div>`+
    (wrong.length?`<h2 class="sec">まちがえた問題</h2>`+wrong.map(({x})=>`<div class="wrong"><div class="e">${esc(mode==="era"?x.kind:eraName(x.era))}</div><div class="q">${esc(x.q)}</div><div class="a">${esc(x.ans)}</div></div>`).join(""):`<p style="text-align:center">全問正解！</p>`);
  show("result");
  if($("again")) $("again").onclick=()=>{ const keepCount=store.count; store.count=0; startQuiz(wrong.map(w=>w.x)); store.count=keepCount; };
  $("same").onclick=()=>startQuiz(currentPool());
  $("toHome").onclick=()=>{show("home"); renderHome();};
}

// ---------- 一覧 ----------
function openList(){
  const pool=currentPool();
  const l=$("list");
  let html=`<div class="lhead"><button class="btn sub" id="lBack">もどる</button><button class="btn sub" id="lAll">答えを全部表示</button></div>`;
  ERAS.forEach(e=>{
    const items=pool.filter(x=>x.era===e.id); if(!items.length) return;
    html+=`<h3 class="lera">${e.name}<small>${e.period}</small></h3>`+items.map(x=>`<button class="litem ${store.miss[x.id]?"miss":""}"><span class="tap">タップ</span><div class="q">${esc(x.q)}</div><div class="a">${esc(x.ans)}</div></button>`).join("");
  });
  l.innerHTML=html; show("list");
  l.querySelectorAll(".litem").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
  let allOpen=false;
  $("lAll").onclick=()=>{allOpen=!allOpen; l.querySelectorAll(".litem").forEach(b=>b.classList.toggle("open",allOpen)); $("lAll").textContent=allOpen?"答えをかくす":"答えを全部表示";};
  $("lBack").onclick=()=>{show("home"); renderHome();};
}

renderHome();
